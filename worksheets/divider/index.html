<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단원 속지</title>
<link rel="stylesheet" href="../_ws.css">
<style>
/* 단원 속지 (대단원·중단원 시작 쪽)
   - 주소 끝 ?d=8 (대단원 Ⅷ), ?d=8-1, ?d=8-2 (중단원). 아무것도 없으면 Ⅷ의 속지 세 쪽을 이어서 보여 줌
   - 학습지와 같은 틀(_ws.css): 여백·서체·검정과 회색 두 단계. 속지에는 쪽 번호·머리말을 넣지 않는다 */
@page{@bottom-center{content:none}@top-left{content:none}@top-right{content:none}}

.dv{height:265mm;display:flex;flex-direction:column;break-after:page;overflow:hidden}
.dv:last-child{break-after:auto}
@media screen{.dv{margin-bottom:32mm}}

.dv-top{display:flex;justify-content:space-between;align-items:end;
  font:600 8.5pt/1 var(--sans);color:var(--sub);letter-spacing:.02em;
  padding-bottom:2.5mm;border-bottom:.5pt solid var(--rule)}
.dv-top b{color:var(--ink);font-weight:700}

/* 대단원 머리 */
.u-hero{display:grid;grid-template-columns:auto 1fr;gap:7mm;align-items:end;
  padding:9mm 0 5mm;border-bottom:1.5pt solid var(--rule)}
.u-num{font:800 92pt/.78 var(--sans);letter-spacing:-.04em}
.u-name .k{font:700 9pt/1 var(--sans);letter-spacing:.3em;color:var(--sub)}
.u-name h1{margin:3mm 0 0;font:800 34pt/1.05 var(--sans);letter-spacing:-.04em}
.u-q{display:grid;grid-template-columns:22mm 1fr;gap:4mm;align-items:baseline;margin:5.5mm 0 0}
.u-q .k{font:700 8.5pt/1.4 var(--sans);color:var(--sub);letter-spacing:.05em}
.u-q p{margin:0;font:700 16pt/1.4 var(--serif);letter-spacing:-.02em}
.u-q .lead{grid-column:2;font:400 10pt/1.75 var(--serif);margin-top:2mm;max-width:132mm;letter-spacing:-.01em}

/* 중단원 머리 */
.p-hero{display:grid;grid-template-columns:auto 1fr;gap:6mm;align-items:center;padding:8mm 0 5mm;border-bottom:1.5pt solid var(--rule)}
.p-num{width:25mm;height:25mm;background:#111;color:#fff;display:grid;place-items:center;font:800 46pt/1 var(--sans)}
.p-name .k{font:600 9pt/1 var(--sans);color:var(--sub);letter-spacing:.02em}
.p-name h1{margin:2.5mm 0 0;font:800 32pt/1.05 var(--sans);letter-spacing:-.04em}
.p-lead{font:400 10pt/1.75 var(--serif);margin:4.5mm 0 0;max-width:150mm}

/* 그림 */
.dv-fig{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;margin:4mm 0}
.dv-fig svg{display:block;width:100%;height:auto;max-height:100%}
.dv-fig figcaption{text-align:right}

/* 대단원 차례 */
.toc{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm;border-top:1.5pt solid var(--rule);padding-top:3.5mm}
.toc h2{display:flex;align-items:center;gap:2.5mm;margin:0 0 1.5mm;font:700 12pt/1.3 var(--sans);letter-spacing:-.02em}
.toc h2 .n{display:inline-grid;place-items:center;width:6.5mm;height:6.5mm;background:#111;color:#fff;font:700 10pt/1 var(--sans)}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{display:grid;grid-template-columns:9mm 1fr;align-items:baseline;padding:1.8mm 0;border-bottom:.4pt solid #888;font:500 9.5pt/1.45 var(--sans)}
.toc li:last-child{border-bottom:0}
.toc li b{font:800 10.5pt/1 var(--sans)}

/* 핵심 낱말 */
.words{display:grid;grid-template-columns:22mm 1fr;align-items:center;border:.75pt solid var(--rule);margin:0 0 4mm}
.words .k{background:var(--g10);border-right:.5pt solid var(--rule);font:700 9pt/1.3 var(--sans);text-align:center;padding:2.2mm 1mm;align-self:stretch;display:grid;place-items:center}
.words ul{list-style:none;margin:0;padding:2mm 3.5mm;display:flex;flex-wrap:wrap;gap:1mm 0;font:500 9.5pt/1.5 var(--sans)}
.words li+li::before{content:"·";margin:0 2.2mm;color:var(--sub)}

/* 중단원 차시 표 */
table.plan{border-collapse:collapse;width:100%;font:400 9.5pt/1.5 var(--sans)}
table.plan th{background:var(--g10);font:700 8.5pt/1.3 var(--sans);border:.5pt solid #111;padding:1.4mm 1.5mm;text-align:center}
table.plan td{border:.5pt solid #111;padding:2.6mm 3mm;vertical-align:middle}
table.plan td.no{width:13mm;text-align:center;font:800 15pt/1 var(--sans)}
table.plan td.q b{display:block;font:700 10.5pt/1.4 var(--sans);letter-spacing:-.02em;margin-bottom:1mm}
table.plan td.q ul{margin:0;padding:0;list-style:none;font:400 9pt/1.55 var(--serif)}
table.plan td.q li::before{content:"·";margin-right:1.5mm}
table.plan td.day{width:27mm;text-align:center;font:500 9pt/1 var(--sans);color:var(--sub);white-space:nowrap}
table.plan td.chk{width:30mm;text-align:center;font:500 11pt/1 var(--sans);letter-spacing:3.2mm;padding-left:4.5mm}
.plan-note{font:500 8pt/1.45 var(--sans);color:var(--sub);margin-top:1.5mm}
/* 앞표지·뒷표지 (?d=front, ?d=back) — 두 대단원을 한 권으로 묶을 때 */
.cv-title{padding:8mm 0 5mm;border-bottom:1.5pt solid var(--rule)}
.cv-title .k{font:700 10pt/1 var(--sans);letter-spacing:.3em;color:var(--sub)}
.cv-title h1{margin:4mm 0 0;font:800 46pt/1.02 var(--sans);letter-spacing:-.045em}
.cv-units{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm;padding:4.5mm 0 2mm}
.cv-fig{margin:6mm 0}
.cv-units div{display:grid;grid-template-columns:auto 1fr;gap:0 4mm;align-items:center}
.cv-units .no{font:800 30pt/1 var(--sans);letter-spacing:-.04em;grid-row:span 2}
.cv-units b{font:700 15pt/1.2 var(--sans);letter-spacing:-.03em}
.cv-units span{font:500 9pt/1.4 var(--sans);color:var(--sub)}
.cv-foot{display:flex;justify-content:space-between;align-items:end;border-top:1.5pt solid var(--rule);padding-top:5mm}
.cv-name{display:flex;align-items:end;gap:2mm;font:600 11pt/1 var(--sans)}
.cv-name i{display:inline-block;border-bottom:.6pt solid #111;height:7mm}
.cv-school{display:flex;align-items:center;gap:3mm;font:800 15pt/1 var(--sans);letter-spacing:-.02em}
.cv-school img{width:13mm;height:13mm;display:block}
.bk{justify-content:flex-end;align-items:center}
.bk .cv-school{font:700 10pt/1 var(--sans);color:var(--sub);gap:2.5mm}
.bk .cv-school img{width:9mm;height:9mm}
</style>
</head>

<div id="out"></div>

      {no:'06', ws:'light-color', q:'다양한 색은 어떻게 만들어질까?', goals:['영상 장치에서 빛의 합성을 이용하여 다양한 색이 표현되는 원리를 설명할 수 있다.']}
    ] },
  '3-2': { kind:'part', unit:'3', n:2, title:'파동',
    lead:'한곳에서 생긴 진동은 주위로 퍼져 나가며 에너지와 정보를 전한다. 수면에 생긴 물결로 파동이 발생하고 전달되는 과정을 관찰하고, 파동을 나타내는 말을 익힌 뒤, 소리의 세기와 높낮이, 음색을 파형으로 비교한다.',
    fig:'ripplelab', cap:'물을 채운 수조에 탁구공을 띄우고 막대로 수면을 두드리는 활동. 물결은 퍼져 나가지만 탁구공은 제자리에서 위아래로 움직인다',
    words:['파동','진동','매질','마루','골','파장','진폭','주기','진동수','소리의 세기','소리의 높낮이','음색','파형'],
    lessons:[
      {no:'01', ws:'wave', q:'파동은 어떻게 발생하고 전달될까?', goals:['파동의 발생과 전달 과정을 설명할 수 있다.','파동으로 에너지나 정보를 전달하는 사례를 조사할 수 있다.']},
      {no:'02', ws:'sound', q:'소리는 어떤 특성이 있을까?', goals:['소리의 특성을 진폭, 진동수, 파형으로 설명할 수 있다.']}

<!-- ===== 그림 (흰 바탕 선 그림, 점묘) ===== -->
<script>
var FIG = {};
try{
  /* 같은 그림이 늘 같게 나오도록 씨앗 있는 난수 */
  function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function gauss(r){ var u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function f(n){ return Math.round(n*100)/100; }
  /* 반짝이는 별: 둥근 점 + 가는 십자 빛줄기 */
  function star(x,y,r,ray){
    var s='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(r)+'" fill="#111"/>';
    if(ray){ s+='<path d="M'+f(x-ray)+' '+f(y)+'H'+f(x+ray)+'M'+f(x)+' '+f(y-ray)+'V'+f(y+ray)+'" stroke="#111" stroke-width=".18"/>'; }
    return s;
  }

  /* 대단원: 밤하늘 (은하수 띠 + 북두칠성 + 지평선의 천문대) */
  FIG.sky = function(){
    var W=175,H=112,r=rng(8), s='';
    s+='<svg viewBox="0 0 '+W+' '+H+'" aria-label="밤하늘 그림">';
    // 은하수: 왼쪽 아래 → 오른쪽 위로 가로지르는 점묘 띠
    var ax=-8,ay=104,bx=186,by=6, dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L;
    var dots='';
    for(var i=0;i<4200;i++){
      var t=r(), w=gauss(r)*(7+5*Math.sin(t*Math.PI*1.3+0.4));
      // 가운데 어두운 띠(티끌)를 살짝: 중심선 바로 위쪽은 점을 덜 찍음
      if(w>0.5 && w<3.2 && r()<0.6) continue;
      var x=ax+dx*t+nx*w, y=ay+dy*t+ny*w; if(y>86) continue;
      var rr=0.1+Math.pow(r(),3)*0.28;
      dots+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(rr)+'"/>';
    }
    s+='<g fill="#111" opacity=".75">'+dots+'</g>';
    // 흩어진 별
    var bg='';
    for(var k=0;k<170;k++){
      var x=r()*W, y=r()*84, m=Math.pow(r(),4);
      bg+= m>0.55 ? star(x,y,0.45+m*0.35,1.6+m*1.6) : '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(0.16+m*0.5)+'" fill="#111"/>';
    }
    s+=bg;
    // 북두칠성 (손잡이 왼쪽, 국자 오른쪽)
    var B=[[24,40],[36,32.5],[48,31],[60,34],[62.5,46],[77.5,47],[79,34]]; // 알카이드…두베
    var R=[1.25,1.35,1.4,0.95,1.3,1.3,1.45];
    var ln='M'+B[0]+'L'+B[1]+'L'+B[2]+'L'+B[3]+'L'+B[4]+'L'+B[5]+'L'+B[6]+'L'+B[3];
    s+='<path d="'+ln+'" fill="none" stroke="#111" stroke-width=".3" stroke-dasharray="1.1 .9"/>';
    // 별 둘레를 흰 테로 띄워 선과 떨어져 보이게
    B.forEach(function(p,i){ s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(R[i]+0.9)+'" fill="#fff"/>'+star(p[0],p[1],R[i],R[i]*2.8); });
    s+='<text x="51" y="56" font-size="3.3" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="1.6">북두칠성</text>';
    s+='<text x="152" y="50" font-size="3.3" font-weight="700" text-anchor="middle" transform="rotate(-27 152 50)" paint-order="stroke" stroke="#fff" stroke-width="1.6">은하수</text>';
    // 지평선: 낮은 산 두 겹 + 천문대
    s+='<path d="M0 90 C20 84 34 83 52 87 S86 92 104 86 S140 79 175 85 V'+H+' H0Z" fill="#cfcfcf" stroke="#111" stroke-width=".35"/>';
    s+='<path d="M0 101.5 C26 97 50 99 78 100.5 S128 97 175 99.5 V'+H+' H0Z" fill="#111"/>';
    // 천문대(둥근 지붕 + 열린 틈 + 몸체)
    s+='<g transform="translate(128 84.4)"><rect x="-6" y="0" width="12" height="9" fill="#111"/>'+
       '<path d="M-7 0.4 A7 7 0 0 1 7 0.4Z" fill="#111"/><path d="M-1 -6.6 L1.1 -6.6 L1.1 0.4 L-1 0.4Z" fill="#cfcfcf"/>'+
       '<line x1="0" y1="-2" x2="4.5" y2="-10" stroke="#111" stroke-width="1.1"/></g>';
    s+='</svg>';
    return s;
  };


  /* 앞표지: 기하학 칸 격자 (검정·회색 20%·흰색, 칸마다 단순한 도형 하나) */
  FIG.tiles = function(){
    var S=40, C={w:'#fff',g:'#cfcfcf',k:'#111'};
    // [바탕, 도형, 도형 색, 방향(0~3: 왼위·오른위·오른아래·왼아래 / 위·오른·아래·왼)]
    var L=[
      [['k','qc','w',2],['w','ring','k'],['g','hc','k',2],['w','dots','k'],['k','circle','w']],
      [['w','arcs','k',0],['k','dot','w'],['w','tri','g',1],['g','circle','k'],['w','qc','k',0]],
      [['g','lines','k'],['w','hc','k',0],['k','arcs','w',2],['w','big','g'],['k','dots','w']],
      [['w','big','k'],['g','qc','w',3],['w','lines','g'],['k','hc','g',3],['w','ring','k']],
      [['w','dots','k'],['k','qc','g',1],['w','hc','k',1],['g','ring','k'],['k','tri','w',3]]];
    var s='<svg viewBox="0 0 '+(S*5)+' '+(S*L.length)+'" aria-label="기하학 무늬" style="overflow:hidden">';
    function corner(d){ return [[0,0],[S,0],[S,S],[0,S]][d]; }
    L.forEach(function(row,j){ row.forEach(function(c,i){
      var x=i*S,y=j*S,bg=C[c[0]],fg=C[c[2]],d=c[3]||0,g='';
      g+='<rect x="-.4" y="-.4" width="'+(S+.8)+'" height="'+(S+.8)+'" fill="'+bg+'"/>';
      if(c[1]==='qc'){ var o=corner(d); g+='<path d="M'+o+'L'+(o[0]?o[0]-S:S)+' '+o[1]+'A'+S+' '+S+' 0 0 '+(d%2?0:1)+' '+o[0]+' '+(o[1]?o[1]-S:S)+'Z" fill="'+fg+'"/>'; }
      if(c[1]==='hc'){ var h=S/2, P=[[h,0,0,1],[S,h,1,0],[h,S,0,-1],[0,h,-1,0]][d];
        g+='<circle cx="'+P[0]+'" cy="'+P[1]+'" r="'+h+'" fill="'+fg+'"/>'; }
      if(c[1]==='ring'){ [17,12,7].forEach(function(r){ g+='<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+fg+'" stroke-width="1.6"/>'; }); g+='<circle cx="20" cy="20" r="2.4" fill="'+fg+'"/>'; }
      if(c[1]==='arcs'){ var o=corner(d); [12,22,32].forEach(function(r){ var sx=o[0]?S-r:r, ey=o[1]?S-r:r;
        g+='<path d="M'+sx+' '+o[1]+'A'+r+' '+r+' 0 0 '+(d===0||d===2?1:0)+' '+o[0]+' '+ey+'" fill="none" stroke="'+fg+'" stroke-width="1.8"/>'; }); g+='<circle cx="'+o[0]+'" cy="'+o[1]+'" r="5" fill="'+fg+'"/>'; }
      if(c[1]==='dot') g+='<circle cx="20" cy="20" r="5" fill="'+fg+'"/>';
      if(c[1]==='circle') g+='<circle cx="20" cy="20" r="13" fill="'+fg+'"/>';
      if(c[1]==='big') g+='<circle cx="20" cy="20" r="20" fill="'+fg+'"/>';
      if(c[1]==='dots'){ for(var a=0;a<3;a++) for(var b=0;b<3;b++) g+='<circle cx="'+(10+a*10)+'" cy="'+(10+b*10)+'" r="'+((a+b)%2?1.6:2.6)+'" fill="'+fg+'"/>'; }
      if(c[1]==='lines'){ for(var k=1;k<8;k++) g+='<line x1="'+(k*5)+'" y1="0" x2="'+(k*5)+'" y2="'+S+'" stroke="'+fg+'" stroke-width="1.7"/>'; }
      if(c[1]==='tri'){ var o=corner(d), q=corner((d+1)%4), r2=corner((d+3)%4); g+='<path d="M'+o+'L'+q+'L'+r2+'Z" fill="'+fg+'"/>'; }
      s+='<g transform="translate('+x+' '+y+')"><clipPath id="t'+i+j+'"><rect x="-.3" y="-.3" width="'+(S+.6)+'" height="'+(S+.6)+'"/></clipPath><g clip-path="url(#t'+i+j+')">'+g+'</g></g>';
    }); });
    s+='<rect x=".3" y=".3" width="'+(S*5-.6)+'" height="'+(S*L.length-.6)+'" fill="none" stroke="#111" stroke-width=".6"/>';
    return s+'</svg>';
  };
  /* 중단원 1: 별자리 입체 모형 (판 위에 거리만큼 자른 빨대, 끝에 별) */
  FIG.model = function(){
    var W=175,H=124,s='';
    // 비스듬히 본 판: x 오른쪽, z 안쪽(오른쪽 위로), y 위. 판 = 별자리를 그린 종이, 빨대 길이 = 별까지의 거리
    function P(x,y,z){ return [f(4+x+z*0.5), f(118-y-z*0.38)]; }
    var LY=0.6; // 1 광년 = 0.5 단위
    var S=[ // 이름, x, z, 거리(광년), 이름표 쪽(1 오른쪽, -1 왼쪽)
      ['알카이드',8,40,101,1],['미자르',32,44,78,1],['알리오스',54,40,81,1],['메그레즈',76,34,58,1],
      ['페크다',80,10,84,-1],['메라크',122,6,79,1],['두베',126,36,124,1]];
    s+='<svg viewBox="0 0 '+W+' '+H+'" aria-label="북두칠성 입체 모형 그림">';
    var BX=142,BZ=54,a=P(0,0,0),b=P(BX,0,0),c=P(BX,0,BZ),d=P(0,0,BZ),a2=P(0,-3,0),b2=P(BX,-3,0),c2=P(BX,-3,BZ);
    s+='<path d="M'+a+'L'+b+'L'+b2+'L'+a2+'Z" fill="#cfcfcf" stroke="#111" stroke-width=".4"/>';
    s+='<path d="M'+b+'L'+c+'L'+c2+'L'+b2+'Z" fill="#9a9a9a" stroke="#111" stroke-width=".4"/>';
    s+='<path d="M'+a+'L'+b+'L'+c+'L'+d+'Z" fill="#ececec" stroke="#111" stroke-width=".45"/>';
    var base=S.map(function(o){return P(o[1],0,o[2]);});
    s+='<path d="M'+[0,1,2,3,4,5,6,3].map(function(i){return base[i];}).join('L')+'" fill="none" stroke="#111" stroke-width=".3" stroke-dasharray="1 .8"/>';
    s+='<text x="'+f(+P(4,0,5)[0])+'" y="'+f(+P(4,0,5)[1])+'" font-size="2.7" fill="#4a4a4a">별자리를 그린 종이</text>';
    var idx=S.map(function(o,i){return i;}).sort(function(i,j){return S[j][2]-S[i][2];});
    idx.forEach(function(i){
      var o=S[i], p0=base[i], top=P(o[1],o[3]*LY,o[2]);
      s+='<ellipse cx="'+p0[0]+'" cy="'+p0[1]+'" rx="1.4" ry=".6" fill="#111"/>';
      s+='<line x1="'+p0[0]+'" y1="'+p0[1]+'" x2="'+top[0]+'" y2="'+top[1]+'" stroke="#111" stroke-width="1.6"/>';
      s+='<line x1="'+p0[0]+'" y1="'+(p0[1]-0.3)+'" x2="'+top[0]+'" y2="'+top[1]+'" stroke="#fff" stroke-width=".9"/>';
      s+='<circle cx="'+top[0]+'" cy="'+top[1]+'" r="3" fill="#fff"/>'+star(+top[0],+top[1],1.8,4.8);
    });
    idx.forEach(function(i){
      var o=S[i], top=P(o[1],o[3]*LY,o[2]), x=+top[0]+o[4]*3.8, an=o[4]>0?'start':'end';
      s+='<text x="'+f(x)+'" y="'+f(+top[1]-1.3)+'" font-size="3" font-weight="700" text-anchor="'+an+'" paint-order="stroke" stroke="#fff" stroke-width="1.2">'+o[0]+'</text>'+
         '<text x="'+f(x)+'" y="'+f(+top[1]+2.5)+'" font-size="2.7" fill="#4a4a4a" text-anchor="'+an+'" paint-order="stroke" stroke="#fff" stroke-width="1.2">'+o[3]+' 광년</text>';
    });
    s+='</svg>';
    return s;
  };

  /* 중단원 2: 우리은하 위·옆 모습 (점묘) */
  FIG.galaxy = function(){
    var W=175,H=100,r=rng(42),s='',dots='';
    s+='<svg viewBox="0 0 '+W+' '+H+'" aria-label="우리은하 그림">';
    var cx=52,cy=50,Rg=44;
    function put(x,y,rr){ dots+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(rr)+'"/>'; }
    // 원반 바탕(듬성)
    for(var i=0;i<1300;i++){ var a=r()*Math.PI*2, d=Math.sqrt(r())*Rg; put(cx+Math.cos(a)*d,cy+Math.sin(a)*d*0.98,0.1+r()*0.12); }
    // 막대 모양 중심부
    for(var i=0;i<1500;i++){ put(cx+gauss(r)*7.5,cy+gauss(r)*2.6,0.12+r()*0.16); }
    for(var i=0;i<700;i++){ var a=r()*Math.PI*2,d=Math.abs(gauss(r))*4.2; put(cx+Math.cos(a)*d,cy+Math.sin(a)*d,0.14+r()*0.18); }
    // 나선팔 두 개 (막대 끝에서 감겨 나감)
    for(var arm=0;arm<2;arm++){
      for(var i=0;i<2600;i++){
        var t=Math.pow(r(),0.8)*3.7, rad=11*Math.exp(0.36*t);
        if(rad>Rg) continue;
        var th=t+arm*Math.PI, w=gauss(r)*(1.9+rad*0.11);
        var x=cx+Math.cos(th)*rad, y=cy+Math.sin(th)*rad;
        x+=Math.cos(th+Math.PI/2)*w; y+=Math.sin(th+Math.PI/2)*w;
        put(x,y,0.1+Math.pow(r(),2)*0.24);
      }
    }
    s+='<g fill="#111">'+dots+'</g>';
    // 태양계 위치(중심에서 약 8500 pc ≈ 반지름의 0.57)
    var sx=cx+Math.cos(-2.2)*25.2, sy=cy+Math.sin(-2.2)*25.2;
    s+='<circle cx="'+f(sx)+'" cy="'+f(sy)+'" r="2.2" fill="#fff" stroke="#111" stroke-width=".5"/><circle cx="'+f(sx)+'" cy="'+f(sy)+'" r=".7" fill="#111"/>';
    s+='<line x1="'+f(sx-2)+'" y1="'+f(sy-1.6)+'" x2="'+f(sx-9)+'" y2="'+f(sy-9.5)+'" stroke="#111" stroke-width=".3"/>';
    s+='<rect x="'+f(sx-22)+'" y="'+f(sy-14)+'" width="14" height="4.6" fill="#fff"/><text x="'+f(sx-15)+'" y="'+f(sy-10.4)+'" font-size="3.1" font-weight="700" text-anchor="middle">태양계</text>';
    s+='<text x="'+cx+'" y="98.5" font-size="3.1" font-weight="700" text-anchor="middle">위에서 본 모습</text>';

    // 옆에서 본 모습
    var ox=136,oy=40,half=36,side='';
    var r2=rng(7);
    for(var i=0;i<2400;i++){ var x=gauss(r2)*14; if(Math.abs(x)>half) { x=(r2()*2-1)*half; } var y=gauss(r2)*(0.9+0.9*Math.exp(-x*x/300)); side+='<circle cx="'+f(ox+x)+'" cy="'+f(oy+y)+'" r="'+f(0.1+r2()*0.15)+'"/>'; }
    for(var i=0;i<900;i++){ var a=r2()*Math.PI*2,d=Math.abs(gauss(r2))*4; side+='<circle cx="'+f(ox+Math.cos(a)*d*1.3)+'" cy="'+f(oy+Math.sin(a)*d)+'" r="'+f(0.13+r2()*0.18)+'"/>'; }
    s+='<g fill="#111">'+side+'</g>';
    // 태양계(옆): 원반 안, 중심에서 0.57 거리
    var tx=ox-half*0.57;
    s+='<circle cx="'+f(tx)+'" cy="'+oy+'" r="1.6" fill="#fff" stroke="#111" stroke-width=".45"/><circle cx="'+f(tx)+'" cy="'+oy+'" r=".55" fill="#111"/>';
    s+='<line x1="'+f(tx)+'" y1="'+(oy-1.8)+'" x2="'+f(tx)+'" y2="'+(oy-9)+'" stroke="#111" stroke-width=".3"/><text x="'+f(tx)+'" y="'+(oy-10.2)+'" font-size="3.1" font-weight="700" text-anchor="middle">태양계</text>';
    s+='<line x1="'+ox+'" y1="'+(oy+6)+'" x2="'+ox+'" y2="'+(oy+11)+'" stroke="#111" stroke-width=".3"/><text x="'+ox+'" y="'+(oy+14.6)+'" font-size="3" text-anchor="middle">은하 중심</text>';
    // 크기 치수선
    var yy=oy+22;
    s+='<g stroke="#111" stroke-width=".3"><line x1="'+(ox-half)+'" y1="'+yy+'" x2="'+(ox+half)+'" y2="'+yy+'"/><line x1="'+(ox-half)+'" y1="'+(yy-1.6)+'" x2="'+(ox-half)+'" y2="'+(yy+1.6)+'"/><line x1="'+(ox+half)+'" y1="'+(yy-1.6)+'" x2="'+(ox+half)+'" y2="'+(yy+1.6)+'"/></g>';
    s+='<rect x="'+(ox-15)+'" y="'+(yy-2.4)+'" width="30" height="4.8" fill="#fff"/><text x="'+ox+'" y="'+(yy+1.1)+'" font-size="3" text-anchor="middle">지름 약 30000 pc</text>';
    s+='<text x="'+ox+'" y="'+(yy+11)+'" font-size="3.1" font-weight="700" text-anchor="middle">옆에서 본 모습</text>';
    s+='</svg>';
    return s;
  };
  /* ── Ⅶ 전기와 자기 ── */
  /* 비스듬히 본 입체(실험대 그림용): x 오른쪽, y 위, z 안쪽 */
  function OB(ox,oy,kx,ky){ return function(x,y,z){ return [f(ox+x+z*kx), f(oy-y-z*ky)]; }; }

           poly([P(x+w,y,z),P(x+w,y,z+d),P(x+w,y+h,z+d),P(x+w,y+h,z)],c.side||'#9a9a9a'); }

  /* 계기 눈금판(앞면에 붙은 반원 눈금 + 바늘 + 글자) */

  /* 대단원: 밤하늘의 드론 쇼(전구 모양) + 불 켜진 도시 */

    s+='<path d="M-6 -1.6 H6 L7.5 1.6 H-7.5Z" fill="#111"/><circle cx="0" cy="3" r="1" fill="#111"/>';

  /* 전선: 3D 점 여럿을 부드럽게 잇는다(흰 테 + 검은 선) */

    s+='<circle cx="'+f(+o[0]+w-11)+'" cy="'+f(+o[1]-4)+'" r="1.4" fill="#111"/><circle cx="'+f(+o[0]+w-5)+'" cy="'+f(+o[1]-4)+'" r="1.4" fill="#fff" stroke="#111" stroke-width=".5"/>';

    s+='<defs><clipPath id="lk-w"><rect x="0" y="'+H0+'" width="'+W+'" height="'+(H-H0)+'"/></clipPath></defs>';
    s+='<g clip-path="url(#lk-w)"><g transform="translate(0 '+(2*H0)+') scale(1 -1)" opacity=".5">'+sky+land+'</g>';
    for(var y=H0+1.6;y<H;y+=1.7+r()*1.4){ var x0=r()*W*0.9; s+='<line x1="'+f(x0)+'" y1="'+f(y)+'" x2="'+f(x0+10+r()*40)+'" y2="'+f(y)+'" stroke="#fff" stroke-width="'+f(0.35+r()*0.4)+'"/>'; }
    s+='</g><line x1="0" y1="'+H0+'" x2="'+W+'" y2="'+H0+'" stroke="#111" stroke-width=".45"/>';
    // 등대 빛
    [-8,-2,4].forEach(function(dy){ s+='<line x1="'+(lx+3)+'" y1="'+(lt-2.8)+'" x2="'+(lx+42)+'" y2="'+(lt-2.8+dy*2.4)+'" stroke="#111" stroke-width=".3" stroke-dasharray="1.6 1.1"/>'; });
    // 퍼져 나가는 물결
    var cx=118,cy=88;
    [3,7,11.5,16.5,22,28].forEach(function(rx,i){ s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+f(rx*0.3)+'" fill="none" stroke="#fff" stroke-width="1.6"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+f(rx*0.3)+'" fill="none" stroke="#111" stroke-width="'+f(0.6-i*0.06)+'"/>'; });
    s+='<circle cx="'+cx+'" cy="'+(cy-11)+'" r="1.4" fill="#111"/><line x1="'+cx+'" y1="'+(cy-18)+'" x2="'+cx+'" y2="'+(cy-13.5)+'" stroke="#111" stroke-width=".3" stroke-dasharray="1 .8"/>';
    s+=lab(cx,cy+13,'퍼져 나가는 물결')+lab(40,H0+20,'물에 비친 모습')+lab(lx+2,lt-9.5,'등대')+lab(158,14,'해','start');
    return s+'</svg>';
  };

  /* 중단원 1: 반원 각도기와 평면거울, 슬릿 레이저 (교과서 활동 '빛의 반사') */
  FIG.reflectlab = function(){
    var P=OB(4,96,0.55,0.5), s='<svg data-fit viewBox="0 0 175 110" aria-label="빛의 반사 실험 그림">';
    var C=[78,0,44], R=34;
    s+=poly([P(14,0,-16),P(132,0,-16),P(132,0,62),P(14,0,62)],'#fff',.45)+poly([P(14,0,-16),P(132,0,-16),P(132,-3,-16),P(14,-3,-16)],'#cfcfcf',.4);
    // 반원 각도기(거울 앞쪽 반원)
    var arc=[]; for(var i=0;i<=36;i++){ var t=Math.PI*i/36; arc.push(P(C[0]+Math.cos(t)*R,0,C[2]-Math.sin(t)*R)); }
    s+=poly(arc,'#ececec',.4);
    for(var d=0;d<=180;d+=10){ var t=d*Math.PI/180, l=d%30?2.2:4, a=P(C[0]+Math.cos(t)*R,0,C[2]-Math.sin(t)*R), b=P(C[0]+Math.cos(t)*(R-l),0,C[2]-Math.sin(t)*(R-l));
      s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#111" stroke-width=".25"/>'; }
    // 반사면과 수직인 선(점선)
    var n0=P(C[0],0,C[2]), n1=P(C[0],0,C[2]-R);
    s+='<line x1="'+n0[0]+'" y1="'+n0[1]+'" x2="'+n1[0]+'" y2="'+n1[1]+'" stroke="#111" stroke-width=".4" stroke-dasharray="1.6 1"/>';
    // 빛: 45° 방향에서 들어와 45°로 반사
    var k=Math.SQRT1_2, inA=P(C[0]-R*k*1.55,0,C[2]-R*k*1.55), rfB=P(C[0]+R*k*1.2,0,C[2]-R*k*1.2);
    s+='<line x1="'+inA[0]+'" y1="'+inA[1]+'" x2="'+n0[0]+'" y2="'+n0[1]+'" stroke="#111" stroke-width=".8"/>';
    var mid=P(C[0]-R*k*0.6,0,C[2]-R*k*0.6); s+=arrowHead(+inA[0],+inA[1],+mid[0],+mid[1],2.2);
    s+='<line x1="'+n0[0]+'" y1="'+n0[1]+'" x2="'+rfB[0]+'" y2="'+rfB[1]+'" stroke="#111" stroke-width=".8"/>'+arrowHead(+n0[0],+n0[1],+rfB[0],+rfB[1],2.2);
    // 각을 나타내는 호
    function angArc(sgn){ var p=[]; for(var i=0;i<=10;i++){ var t=Math.PI/2+sgn*Math.PI/4*i/10; p.push(P(C[0]+Math.cos(t)*11,0,C[2]-Math.sin(t)*11)); } return '<path d="M'+p.join('L')+'" fill="none" stroke="#111" stroke-width=".35"/>'; }
    s+=angArc(1)+angArc(-1);
    // 평면거울(지름 위에 세움)
    s+=box(P,C[0]-30,0,C[2],60,20,2.4,{front:'#fff',top:'#cfcfcf',side:'#9a9a9a'});
    var g0=P(C[0]-30,3,C[2]); s+='<line x1="'+g0[0]+'" y1="'+g0[1]+'" x2="'+f(+g0[0]+60)+'" y2="'+g0[1]+'" stroke="#9a9a9a" stroke-width=".3"/>';
    // 집게 2개
    [C[0]-24,C[0]+20].forEach(function(x){ s+=box(P,x,0,C[2]-3,4,6,8,{front:'#111',top:'#4a4a4a',side:'#111'}); });
    // 슬릿 레이저(빛이 나가는 쪽을 향해 놓인 막대)
    var L0=P(C[0]-R*k*2.25,4,C[2]-R*k*2.25), L1=P(C[0]-R*k*1.6,4,C[2]-R*k*1.6);
    s+='<line x1="'+L0[0]+'" y1="'+L0[1]+'" x2="'+L1[0]+'" y2="'+L1[1]+'" stroke="#111" stroke-width="5.2" stroke-linecap="round"/><line x1="'+L0[0]+'" y1="'+L0[1]+'" x2="'+L1[0]+'" y2="'+L1[1]+'" stroke="#4a4a4a" stroke-width="2.6" stroke-linecap="round"/>';
    var t;
    t=P(C[0]-7,0,C[2]-15); s+='<text x="'+t[0]+'" y="'+t[1]+'" font-size="2.7" text-anchor="end" paint-order="stroke" stroke="#ececec" stroke-width="1">입사각</text>';
    t=P(C[0]+7,0,C[2]-15); s+='<text x="'+t[0]+'" y="'+t[1]+'" font-size="2.7" paint-order="stroke" stroke="#ececec" stroke-width="1">반사각</text>';
    t=P(C[0],20,C[2]+2); s+=lab(+t[0]+2,+t[1]-2.5,'평면거울');
    t=P(C[0]+R,0,C[2]-10); s+=lab(+t[0]+3,+t[1]+2,'반원 각도기','start');
    t=L0; s+=lab(+t[0]-1,+t[1]+6,'슬릿 레이저');
    t=P(C[0],0,C[2]-R); s+=lab(+t[0],+t[1]+5,'반사면과 수직인 선');
    return s+'</svg>';
  };

  /* 중단원 2: 물결파 수조 (교과서 활동 '파동의 발생과 전달') */
  FIG.ripplelab = function(){
    var P=OB(4,100,0.62,0.46), X=120,Y=30,Z=62,Wl=22, s='<svg data-fit viewBox="0 0 175 110" aria-label="물결파 수조 그림">';
    function ln(a,b,c,w){ return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+(c||'#111')+'" stroke-width="'+(w||.4)+'"/>'; }
    // 책상
    s+=poly([P(-12,0,-8),P(X+14,0,-8),P(X+14,0,Z+10),P(-12,0,Z+10)],'#fff',.4);
    // 수조 뒤쪽 모서리
    s+=ln(P(0,0,Z),P(X,0,Z),'#9a9a9a',.35)+ln(P(0,0,Z),P(0,Y,Z),'#9a9a9a',.35)+ln(P(X,0,Z),P(X,Y,Z),'#9a9a9a',.35)+ln(P(0,Y,Z),P(X,Y,Z),'#9a9a9a',.35);
    // 물: 앞면과 옆면, 수면
    s+=poly([P(0,0,0),P(X,0,0),P(X,Wl,0),P(0,Wl,0)],'#ececec',.25)+poly([P(X,0,0),P(X,0,Z),P(X,Wl,Z),P(X,Wl,0)],'#cfcfcf',.25);
    s+=poly([P(0,Wl,0),P(X,Wl,0),P(X,Wl,Z),P(0,Wl,Z)],'#f6f6f6',.35);
    // 물결(수면 위 동심원)
    var cx=38,cz=32;
    [4,9,14.5,20.5,27,33.5].forEach(function(rr,i){ var pts=[]; for(var j=0;j<=72;j++){ var t=j/72*Math.PI*2, x=cx+Math.cos(t)*rr, z=cz+Math.sin(t)*rr;
        if(x<0.5||x>X-0.5||z<0.5||z>Z-0.5){ if(pts.length>1) s+='<path d="M'+pts.join('L')+'" fill="none" stroke="#111" stroke-width="'+f(0.55-i*0.05)+'"/>'; pts=[]; continue; }
        pts.push(P(x,Wl,z)); }
      if(pts.length>1) s+='<path d="M'+pts.join('L')+'" fill="none" stroke="#111" stroke-width="'+f(0.55-i*0.05)+'"/>'; });
    // 탁구공
    var b=P(86,Wl+2.6,30); s+='<ellipse cx="'+b[0]+'" cy="'+f(+b[1]+2.5)+'" rx="4" ry="1.1" fill="#9a9a9a" opacity=".6"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r="3.1" fill="#fff" stroke="#111" stroke-width=".4"/><path d="M'+f(+b[0]-2.6)+' '+f(+b[1]+1.4)+'A3.1 3.1 0 0 0 '+f(+b[0]+2.6)+' '+f(+b[1]+1.4)+'A3.6 3.6 0 0 1 '+f(+b[0]-2.6)+' '+f(+b[1]+1.4)+'Z" fill="#cfcfcf"/>';
    // 탁구공의 위아래 움직임
    s+='<line x1="'+f(+b[0]+6)+'" y1="'+f(+b[1]-4)+'" x2="'+f(+b[0]+6)+'" y2="'+f(+b[1]+4)+'" stroke="#111" stroke-width=".35"/>'+arrowHead(+b[0]+6,+b[1],+b[0]+6,+b[1]-4.6,1.5)+arrowHead(+b[0]+6,+b[1],+b[0]+6,+b[1]+4.6,1.5);
    // 막대
    var m0=P(cx,Wl,cz), m1=P(cx-14,Wl+46,cz-10);
    s+='<line x1="'+m0[0]+'" y1="'+m0[1]+'" x2="'+m1[0]+'" y2="'+m1[1]+'" stroke="#111" stroke-width="3.4" stroke-linecap="round"/><line x1="'+m0[0]+'" y1="'+m0[1]+'" x2="'+m1[0]+'" y2="'+m1[1]+'" stroke="#cfcfcf" stroke-width="1.8" stroke-linecap="round"/>';
    // 수조 앞쪽 모서리
    s+=ln(P(0,0,0),P(X,0,0))+ln(P(0,0,0),P(0,Y,0))+ln(P(X,0,0),P(X,Y,0))+ln(P(0,Y,0),P(X,Y,0))+ln(P(X,0,0),P(X,0,Z))+ln(P(X,Y,0),P(X,Y,Z))+ln(P(0,Y,0),P(0,Y,Z),'#111',.3)+ln(P(X,Y,Z),P(0,Y,Z),'#111',.3);
    var t;
    t=m1; s+=lab(+t[0]-2,+t[1]-2,'막대');
    t=P(86,Wl+6,30); s+=lab(+t[0]+8,+t[1]-3,'탁구공','start');
    t=P(cx+12,Wl,4); s+=lab(+t[0],+t[1]+3.6,'물결');
    t=P(X,8,0); s+=lab(+t[0]-3,+t[1]+14,'사각 수조','end');
    return s+'</svg>';
  };
}catch(e){ console.error('그림 함수 오류', e); }
</script>

<!-- ===== 쪽 짜기 ===== -->
<script>
try{
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function top(u){ return '<div class="dv-top"><span><b>중2 과학</b> 학습지</span><span>'+(u.kind==='unit'?'대단원':'Ⅷ. 별과 우주')+'</span></div>'; }
  function fig(u){ var g=FIG[u.fig]?FIG[u.fig]():''; return '<figure class="dv-fig">'+g+'<figcaption>'+esc(u.cap)+'</figcaption></figure>'; }

  function unitPage(key){
    var u=UNITS[key], h='<section class="dv">'+top(u);
    h+='<div class="u-hero"><div class="u-num">'+u.no+'</div><div class="u-name"><div class="k">대단원</div><h1>'+esc(u.title)+'</h1></div></div>';
    h+='<div class="u-q"><span class="k">단원 질문</span><p>'+esc(u.q)+'</p><p class="lead">'+esc(u.lead)+'</p></div>';
    h+=fig(u);
    h+='<div class="toc">';
    u.parts.forEach(function(pk){ var p=UNITS[pk];
      h+='<div><h2><span class="n">'+p.n+'</span>'+esc(p.title)+'</h2><ol>';
      p.lessons.forEach(function(l){ h+='<li><b>'+l.no+'</b><span>'+esc(l.q)+'</span></li>'; });
      h+='</ol></div>'; });
    return h+'</div></section>';
  }
  function partPage(key){
    var p=UNITS[key], u=UNITS[p.unit], h='<section class="dv">';
    h+='<div class="dv-top"><span><b>중2 과학</b> 학습지</span><span>'+u.no+'. '+esc(u.title)+'</span></div>';
    h+='<div class="p-hero"><div class="p-num">'+p.n+'</div><div class="p-name"><div class="k">'+u.no+'. '+esc(u.title)+' · 중단원</div><h1>'+esc(p.title)+'</h1></div></div>';
    h+='<p class="p-lead">'+esc(p.lead)+'</p>';
    h+=fig(p);
    h+='<div class="words"><span class="k">핵심 낱말</span><ul>'+p.words.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul></div>';
    h+='<table class="plan"><thead><tr><th>차시</th><th>질문과 학습 목표</th><th>공부한 날</th><th>스스로 점검</th></tr></thead><tbody>';
    p.lessons.forEach(function(l){
      h+='<tr><td class="no">'+l.no+'</td><td class="q"><b>'+esc(l.q)+'</b><ul>'+l.goals.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'</ul></td>'+
         '<td class="day">월 &nbsp;&nbsp;&nbsp; 일</td><td class="chk">○△✕</td></tr>';
    });
    h+='</tbody></table><div class="plan-note">스스로 점검: 학습 목표를 혼자 설명할 수 있으면 ○, 조금 헷갈리면 △, 아직 어려우면 ✕에 표시한다.</div>';
    return h+'</section>';
  }

  var SCHOOL='<div class="cv-school"><img src="seongan-logo.png" alt="성안중학교 로고">성안중학교</div>';
  function coverPage(key){
    var c=UNITS[key], h='<section class="dv">';
    h+='<div class="dv-top"><span><b>'+esc(c.term)+'</b></span><span>중학교 과학</span></div>';
    h+='<div class="cv-title"><h1>'+esc(c.title)+'</h1></div>';
    h+='<div class="cv-units">'+c.units.map(function(k){ var u=UNITS[k];
      return '<div><span class="no">'+u.no+'</span><b>'+esc(u.title)+'</b><span>'+u.parts.map(function(pk){return UNITS[pk].n+'. '+esc(UNITS[pk].title);}).join(' · ')+'</span></div>'; }).join('')+'</div>';
    h+='<figure class="dv-fig cv-fig">'+(FIG[c.fig]?FIG[c.fig]({H:c.figH||112}):'')+'</figure>';
    h+='<div class="cv-foot"><div class="cv-name">2학년 <i style="width:12mm"></i>반 <i style="width:12mm"></i>번 &nbsp;이름 <i style="width:38mm"></i></div>'+SCHOOL+'</div>';
    return h+'</section>'; }
  function backPage(){ return '<section class="dv bk">'+SCHOOL+'</section>'; }
  function page(k){ var u=UNITS[k]; return u.kind==='unit'?unitPage(k):u.kind==='part'?partPage(k):u.kind==='cover'?coverPage(k):backPage(); }
  var m=/[?&]d=([\w-]+)/.exec(location.search), keys;
  if(m && UNITS[m[1]]) keys=[m[1]];
  else keys=['8'].concat(UNITS['8'].parts);
  document.getElementById('out').innerHTML = keys.map(page).join('');
  /* data-fit 그림은 실제로 그린 범위에 맞춰 viewBox를 줄인다(빈 테두리 없이 크게) */
  document.querySelectorAll('svg[data-fit]').forEach(function(sv){ var b=sv.getBBox(); sv.setAttribute('viewBox',[b.x-1.5,b.y-1.5,b.width+3,b.height+3].map(function(v){return Math.round(v*100)/100;}).join(' ')); });
}catch(e){
  document.body.insertAdjacentHTML('afterbegin','<pre style="color:#b00;font:12px monospace">속지 오류: '+e.message+'</pre>');
}
</script>
