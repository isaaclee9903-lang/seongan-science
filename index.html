<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성안중 과학 수업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#edf3f8; --ink:#14263b; --muted:#5a6b7e; --line:#dde6ee; --card:#ffffff;
    --accent:#0e63b3; --accent-soft:#e3effb;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 24px 64px}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:34px}
  .logo{flex:none;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1f6fbf,#2ba36b);display:grid;place-items:center}
  h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
  .head p{margin:2px 0 0;color:var(--muted);font-weight:600}
  .group{margin:0 0 12px;font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:36px}
  .card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;
    min-height:170px;transition:transform .2s,box-shadow .2s,border-color .2s}
  .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,38,59,.10);border-color:#c4d6e8;outline:none}
  .unit{font-size:13px;font-weight:700;color:var(--accent)}
  .card h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.35}
  .card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .tag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
  footer{color:var(--muted);font-size:13px;font-weight:600;border-top:1px solid var(--line);padding-top:18px}
  @media (max-width:600px){.wrap{padding:32px 16px 48px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>
    </span>
    <div>
      <h1>성안중 과학 수업</h1>
      <p>오늘 수업을 골라 들어가세요</p>
    </div>
  </div>

  <!-- 수업을 추가할 때는 해당 학년 .grid 안에 a.card를 하나 더 넣는다 -->
  <h2 class="group">중학교 2학년</h2>
  <div class="grid">
    <a class="card" href="lessons/ohm/">
      <span class="unit">Ⅶ. 전기와 자기</span>
      <h2>전기는 왜 흐를까?<br>전류·전압·저항과 옴의 법칙</h2>
      <p>수로 모형으로 전류·전압을 보고, 가상 실험실에서 옴의 법칙을 직접 찾아봐요.</p>
      <div class="tags"><span class="tag">읽기·퀴즈</span><span class="tag">수로 모형</span><span class="tag">가상 실험</span><span class="tag">정리·글쓰기</span></div>
    </a>
  </div>

  <footer>제작 · 성안중학교 이삭 T</footer>
</div>
</body>
</html>
