<script>
/* 문제 알림: 코드에 오류가 나면 화면 아래에 빨간 상자로 알려 줘요 (선생님 확인용) */
(function () {
  function box() {
    var b = document.getElementById('rdErr');
    if (!b && document.body) {
      b = document.createElement('div'); b.id = 'rdErr';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fdecea;color:#8a1f17;border:2px solid #d9534f;border-radius:12px;padding:10px 14px;font:600 14px/1.5 sans-serif;white-space:pre-wrap';
      document.body.appendChild(b);
    }
    return b;
  }
  window.RD_err = function (where, err) {
    var msg = '[' + where + '] ' + (err && err.message ? err.message : String(err));
    var show = function () { var b = box(); if (b) b.textContent += (b.textContent ? '\n' : '') + msg; };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  window.addEventListener('error', function (e) { window.RD_err('스크립트', { message: e.message + ' (줄 ' + e.lineno + ')' }); });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var R = window.RD || {}, miss = [];
      if (!R.ok1) miss.push('기본 기능·퀴즈');
      if (!R.ok2 && R.need2 !== false) miss.push('그림 조작 버튼');
      if (miss.length) window.RD_err('실행 안 됨', { message: miss.join(', ') + ' 코드가 실행되지 않았어요. 파일이 끝(</html>)까지 들어 있는지 확인해 주세요.' });
    }, 1500);
    setTimeout(function () {
      if (document.querySelector('.fail3d') && !(window.RD || {}).ok3d) { document.querySelectorAll('.fail3d').forEach(function (f) { f.classList.add('show'); }); window.RD_err('3D 그림', { message: '3D 그림을 불러오지 못했어요. 인터넷 연결(cdn.jsdelivr.net)을 확인하고 새로고침해 주세요.' }); }
    }, 9000);
  });
})();
</script>
