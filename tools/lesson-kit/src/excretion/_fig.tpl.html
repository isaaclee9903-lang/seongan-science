<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오줌이 만들어지는 과정 – 영상 찍기용 그림</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 읽기 페이지의 영상·사진을 찍는 페이지(_bake.py). 학생 탭에는 넣지 않는다. -->
<style>
html,body{margin:0;background:#fff;font-family:Pretendard,sans-serif}
#fig{position:relative;width:760px;height:700px;overflow:hidden;background:#fff}
#fig canvas.gl{display:block;width:100%;height:100%}
.lbls{display:none}
</style>
</head>
<body>
<div id="fig"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/*@@PART:c3.js@@*/
/*@@LOCAL:_ex3.js@@*/
const q = new URLSearchParams(location.search), k = q.get('k') || 'front', host = document.getElementById('fig');
let W;
if (k === 'neph' || k === 'glo') W = EX3.nephron(host, { view: k === 'glo' ? 'glo' : 'all' });
else W = await EX3.body(host, { view: k });
window.__W = W; window.__ready = true;
</script>
</body>
