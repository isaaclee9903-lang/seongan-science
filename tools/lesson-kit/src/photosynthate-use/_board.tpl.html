<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>감자 식물 사진 찍기</title>
<style>html,body{margin:0;background:#fff}#fig{position:relative;width:1200px;height:930px}.lbls{display:none}</style></head>
<body><div class="gl-host" id="fig"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
/* 감자 식물 3D 사진 만들기(모형 만들기 판·읽기 머리 그림·카드): _bake_crops.py 가 ?m=board, ?m=hero, ?m=card 로 열어 찍어요 */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
window.THREE = THREE;
/*@@PART:c3.js@@*/
/*@@LOCAL:_pt3.js@@*/
const m = new URLSearchParams(location.search).get('m') || 'board';
const f = document.getElementById('fig');
if (m === 'hero') { f.style.width = '1000px'; f.style.height = '900px'; }
if (m === 'card') { f.style.width = '800px'; f.style.height = '500px'; }
const P = PT3.plant(f, { labels: [] });
P.showLabs([]); P.setTuber(m === 'board' ? .8 : .95);
if (m === 'board') { P.phloem(true); }

setTimeout(() => { P.view('all', 0); window.__done = true; }, 2500);
</script></body></html>
