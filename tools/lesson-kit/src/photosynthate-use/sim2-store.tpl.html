<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광합성산물을 어떻게 저장하고, 어디에 이용할까 – 양분 창고</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ps.css@@*/
/*@@LOCAL:_css_sim.css@@*/
/*@@LOCAL:_css_pf.css@@*/
/*@@LOCAL:_css_pt.css@@*/
.seg3.w5 button{font-size:13.5px;padding:2px}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl"><span class="eyebrow">시뮬레이션</span><h1>양분 창고 채우기</h1>
    <p class="sub">쓰고 남은 양분은 여러 기관에 다양한 형태로 저장돼요. 작물마다 어디에 무엇으로 저장했는지 맞혀 창고를 채워요.</p></div></header>
  <div class="stage">
    <section class="card viewer">
      <div class="scene grow" id="fig" role="img" aria-label="줄기, 뿌리, 열매, 씨앗 네 칸의 창고. 맞힌 작물이 저장 형태와 함께 알맞은 칸에 놓인다."></div>
      <div class="vctl"><span class="hint">교과서 그림 Ⅴ-5의 작물이에요. 사진은 새로 만든 3D 모형이에요</span><span class="sp"></span><button class="vb" type="button" id="bReset">처음부터</button></div>
    </section>
    <section class="card pad" id="pn">
      <div class="seglbl" id="cnt"></div>
      <div class="ask" id="nm" style="font-size:20px"></div>
      <div class="big-crop" id="one" role="img" aria-label="지금 고를 작물"></div>
      <div class="seglbl">어느 기관에 저장할까요?</div>
      <div class="seg3" id="org"></div>
      <div class="seglbl" style="margin-top:10px">어떤 형태로 저장할까요?</div>
      <div class="seg3 w5" id="frm"></div>
      <button class="btn primary" type="button" id="go" style="width:100%;margin-top:10px" disabled>창고에 넣기</button>
      <div class="fbk" id="res"><b class="t" id="resT">결과</b><span id="resM">먼저 기관과 형태를 골라요.</span></div>
    </section>
  </div>
</div>
<script>
/*@@LOCAL:_ps.js@@*/
</script>
<script>
/*@@LOCAL:_sg.js@@*/
</script>
<script>
(() => {
  'use strict';
  try {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const q = new URLSearchParams(location.search);
    const ORG = ['줄기', '뿌리', '열매', '씨앗'], FRM = ['포도당', '설탕', '녹말', '단백질', '지방'];
    /* 맞혔을 때 설명(교과서 그림 Ⅴ-5), 틀렸을 때 생각할 거리(답을 말하지 않음) */
    const OK = { cane: '사탕수수는 <b>줄기</b>에 <b>설탕</b>으로 저장해요. 줄기를 잘라 씹으면 단맛이 나요.', potato: '감자는 땅속에서 자라지만 뿌리가 아니라 <b>줄기</b>예요. <b>녹말</b>로 저장해요.', beet: '사탕무는 굵은 <b>뿌리</b>에 <b>설탕</b>으로 저장해요.', sweet: '고구마는 <b>뿌리</b>에 <b>녹말</b>로 저장해요. 감자와 저장하는 기관이 달라요.', corn: '옥수수는 <b>열매</b>(알갱이)에 <b>녹말</b>로 저장해요.', grape: '포도는 <b>열매</b>에 <b>포도당</b>으로 저장해요.', sesame: '참깨는 <b>씨앗</b>에 <b>지방</b>으로 저장해요. 그래서 기름을 짤 수 있어요.', pea: '완두는 <b>씨앗</b>에 <b>단백질</b>로 저장해요.' };
    const THINK = { 기관: { cane: '우리가 씹어 먹는 마디 있는 막대는 식물의 어느 부분일까요?', potato: '감자는 땅속에서 자라지만, 교과서 그림 Ⅴ-5에서 어느 칸에 있었는지 떠올려요.', beet: '사탕무는 잎 아래 굵고 하얀 부분을 먹어요.', sweet: '감자와 고구마는 저장하는 기관이 달라요.', corn: '옥수수 알갱이는 꽃이 지고 생긴 부분이에요.', grape: '포도 알은 꽃이 지고 생긴 부분이에요.', sesame: '숟가락 위 작은 알갱이는 심으면 싹이 나요.', pea: '꼬투리 안의 동그란 알은 심으면 싹이 나요.' },
      형태: '맛과 쓰임을 떠올려요. 단맛이 나면 포도당이나 설탕, 단맛이 덜하고 가루가 많으면 녹말, 기름을 짜면 지방이에요.' };
    let S = SG.shelf($('#fig')), i = 0, o = null, f = null;
    const list = SG.CROPS;
    const say = (t, m, c = '') => { $('#res').className = 'fbk ' + c; $('#resT').textContent = t; $('#resM').innerHTML = m; };
    const seg = (id, a, get, set) => { $(id).innerHTML = a.map((t) => `<button type="button" aria-pressed="${get() === t}">${t}</button>`).join(''); $$('button', $(id)).forEach((b) => b.addEventListener('click', () => { set(b.textContent); render(); })); };
    function render() {
      const done = i >= list.length;
      $('#cnt').textContent = done ? '창고를 모두 채웠어요' : `${i + 1}번째 / ${list.length}가지`;
      $('#nm').textContent = done ? '양분을 저장하는 곳은 다양해요' : list[i].n; $('#one').hidden = done;
      if (!done && $('#one').dataset.k !== list[i].k) { $('#one').dataset.k = list[i].k; SG.cropIn($('#one'), list[i].k); }
      seg('#org', ORG, () => o, (v) => { if (!done) o = v; }); seg('#frm', FRM, () => f, (v) => { if (!done) f = v; });
      $('#go').disabled = done || !o || !f;
    }
    $('#go').addEventListener('click', () => {
      const c = list[i];
      if (o !== c.organ) { say('기관을 다시 골라 봐요', THINK.기관[c.k], 'no'); return; }
      if (f !== c.form) { say('형태를 다시 골라 봐요', THINK.형태, 'no'); return; }
      S.reveal(c.k); say(`${c.n}: ${c.organ}에 ${c.form}${SG.josa(c.form)} 저장`, OK[c.k], 'ok');
      i++; o = null; f = null;
      if (i >= list.length) say('창고를 모두 채웠어요', '쓰고 남은 양분은 열매, 줄기, 뿌리, 씨 등에 <b>포도당, 설탕, 녹말, 단백질, 지방</b> 등 다양한 형태로 저장돼요. 우리가 먹는 것이 바로 이 양분이에요.', 'ok');
      render();
    });
    $('#bReset').addEventListener('click', () => { S = SG.shelf($('#fig')); i = 0; o = null; f = null; delete $('#one').dataset.k; say('결과', '먼저 기관과 형태를 골라요.'); render(); });
    render();
    if (q.get('all')) { list.forEach((c) => S.reveal(c.k)); i = list.length; render(); say('창고를 모두 채웠어요', '쓰고 남은 양분은 열매, 줄기, 뿌리, 씨 등에 <b>포도당, 설탕, 녹말, 단백질, 지방</b> 등 다양한 형태로 저장돼요.', 'ok'); }
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('양분 창고', err); }
})();
</script>
</body>
</html>
