<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨을 쉴 때 일어나는 일 – 영상 찍기용 그림</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 읽기 페이지의 영상·사진을 찍는 페이지(_bake.py). 학생 탭에는 넣지 않는다. -->
<style>
html,body{margin:0;background:#fff;font-family:Pretendard,sans-serif}
#fig{position:relative;width:760px;height:700px;overflow:hidden;background:#fff}
#fig canvas.gl{display:block;width:100%;height:100%}
.lbls{display:none}
.cap2{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;font:800 19px/1.3 Pretendard,sans-serif;color:#14263b;background:rgba(255,255,255,.92);border:1px solid #dde6ee;border-radius:10px;padding:6px 12px;white-space:nowrap}
.cap2 b{color:#0e63b3}
</style>
</head>
<body>
<div id="fig"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/*@@PART:c3.js@@*/
/*@@LOCAL:_ch3.js@@*/
/*@@LOCAL:_bm3.js@@*/
/*@@LOCAL:_alv3.js@@*/
const q = new URLSearchParams(location.search), k = q.get('k') || 'hero', host = document.getElementById('fig');
let W;
if (k === 'model') { W = BM3.model(host, { build: 4 }); W.showLabs(['bot', 'yt', 'bal', 'mem', 'clay']); const c = document.createElement('div'); c.className = 'cap2'; host.appendChild(c); W.cap = (t) => { c.innerHTML = t; }; W.cap(''); c.style.display = 'none'; W.capOn = (v) => { c.style.display = v ? '' : 'none'; }; }
else if (k === 'alv') { W = ALV.scene(host, {}); }
else { W = await CH3.chest(host, { head: k === 'system', cut: k === 'system', heart: k !== 'system', view: ({ system: 'system', card: 'card', side: 'side' })[k] || 'chest' }); }
window.__W = W; window.__ready = true;
</script>
</body>
</html>
