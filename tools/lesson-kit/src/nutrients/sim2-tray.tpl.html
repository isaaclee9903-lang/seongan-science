<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음식물에는 어떤 영양소가 들어 있을까 – 골고루 식판</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ps.css@@*/
/*@@LOCAL:_css_sim.css@@*/
/*@@LOCAL:_css_nl.css@@*/
.mn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mn button{min-height:70px;border-radius:12px;border:1px solid #d4dee8;background:#fff;font-weight:800;font-size:13.5px;color:#14263b;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px 5px;line-height:1.15}
.mn button .th{width:70px;height:46px}
.mn button[aria-pressed="true"]{border-color:#0e63b3;background:#e3effb;color:#0b3f73;box-shadow:inset 0 0 0 1px #0e63b3}
.bars{display:grid;grid-template-columns:66px 1fr;gap:6px 10px;align-items:center;font-size:13.5px;font-weight:800;margin-top:12px}
.bars .b{height:12px;border-radius:6px;background:#e6edf3;overflow:hidden}
.bars .b i{display:block;height:100%;background:#0e63b3;border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bars span.lack{color:#b23a30}.bars .b.lack i{background:#c9534a}
.say{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#f5f8fb;font-size:14.5px;line-height:1.7;word-break:keep-all;color:#1d2a40}
.say b{color:#0e63b3}
.acts{display:flex;gap:6px;margin-top:8px}.acts .btn{flex:1;min-height:46px;font-size:14.5px}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl"><span class="eyebrow">해 보기</span><h1>골고루 담은 급식 식판</h1>
    <p class="sub">식판 다섯 칸에 음식을 담고, 어떤 영양소를 얻을 수 있는지 알아봐요.</p></div>
    <div class="ptabs big" role="tablist" id="at">
      <button type="button" role="tab" data-a="make" aria-selected="true">식판 담기</button>
      <button type="button" role="tab" data-a="tell" aria-selected="false">급식 설명하기</button>
    </div></header>
  <div class="stage">
    <section class="card viewer">
      <div class="scene grow" id="fig" role="img" aria-label="다섯 칸으로 나뉜 스테인리스 급식 식판. 고른 음식이 칸에 담긴다."></div>
      <div class="vctl"><span class="hint">막대는 숫자 없이 어림으로 정한 모형이에요</span><span class="sp"></span><button class="vb" type="button" id="bBad">좋아하는 것만 담기</button><button class="vb" type="button" id="bReset">식판 비우기</button></div>
    </section>
    <section class="card pad">
      <div class="pane" data-a="make">
        <div class="seglbl" id="cn"></div>
        <div class="mn" id="mn"></div>
        <div class="bars" id="bars"></div>
        <div class="fbk" id="res"><b class="t" id="resT">결과</b><span id="resM"></span></div>
      </div>
      <div class="pane" data-a="tell" hidden>
        <p class="ptxt">스스로 평가 2. 오늘 점심 시간에 학교에서 먹은 급식에 들어 있는 영양소를 설명해 보자.</p>
        <p class="ptxt">식판에 담은 음식으로 설명 글이 만들어져요. 오늘 실제 급식과 다르면 고쳐서 써요.</p>
        <div class="say" id="say"></div>
        <div class="acts"><button class="btn primary" type="button" id="copy">글 복사하기</button></div>
        <p class="mnote">음식마다 가장 많이 들어 있는 영양소를 골라 쓴 모형이에요. 실제 음식에는 더 여러 가지 영양소가 들어 있어요.</p>
      </div>
    </section>
  </div>
</div>
<script>
/*@@LOCAL:_ps.js@@*/
</script>
<script>
/*@@LOCAL:_nl_food.js@@*/
</script>
<script>
/*@@LOCAL:_nl_lab.js@@*/
</script>
<script>
(() => {
  'use strict';
  try {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const q = new URLSearchParams(location.search);
    const NUTR = ['탄수화물', '단백질', '지방', '무기염류', '바이타민', '물'];
    /* 영양소 양(0~3)은 숫자 없이 어림으로 정한 모형. main은 설명 글에 쓰는 대표 영양소 */
    const MENU = [
      { k: 'rice', n: '밥', v: [3, 1, 0, 0, 0, 1], main: [0] }, { k: 'bread', n: '빵', v: [3, 1, 1, 1, 0, 0], main: [0] },
      { k: 'egg', n: '달걀말이', v: [0, 3, 2, 1, 1, 1], main: [1, 2] }, { k: 'meat', n: '불고기', v: [0, 3, 2, 1, 0, 1], main: [1, 2] },
      { k: 'fish', n: '생선구이', v: [0, 3, 1, 2, 1, 1], main: [1, 3] }, { k: 'gim', n: '김', v: [1, 1, 0, 3, 2, 0], main: [3, 4] },
      { k: 'veg', n: '브로콜리', v: [1, 1, 0, 2, 3, 2], main: [4, 3] }, { k: 'fruit', n: '사과', v: [2, 0, 0, 1, 2, 3], main: [4, 5] },
      { k: 'milk', n: '우유', v: [1, 2, 1, 3, 1, 3], main: [3, 1] },
    ];
    const T = NL.tray($('#fig')); let cur = [];
    const eun = (w) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c % 28 ? '은' : '는'; };
    const iga = (w) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c % 28 ? '이' : '가'; };
    const gwa = (a) => a.map((w, i) => (i < a.length - 1 ? w + ((w.charCodeAt(w.length - 1) - 0xac00) % 28 ? '과' : '와') : w)).join(' ');
    $('#mn').innerHTML = MENU.map((m, i) => `<button type="button" data-i="${i}" aria-pressed="false"><span class="th"></span>${m.n}</button>`).join('');
    $$('#mn button').forEach((b) => { const m = MENU[+b.dataset.i]; NL.thumb($('.th', b), m.k); b.addEventListener('click', () => { const i = cur.indexOf(m); if (i >= 0) cur.splice(i, 1); else if (cur.length < 5) cur.push(m); else return say('식판이 가득 찼어요', '담긴 음식을 다시 눌러 빼고 바꿔요.'); paint(); }); });
    const say = (t, m, c = '') => { $('#res').className = 'fbk ' + c; $('#resT').textContent = t; $('#resM').innerHTML = m; };
    $('#bars').innerHTML = NUTR.map((n, i) => `<span data-n="${i}">${n}</span><div class="b" data-bb="${i}"><i data-b="${i}" style="width:0"></i></div>`).join('');
    /* 밥·빵을 큰 칸에 먼저 */
    const order = () => { const st = cur.filter((m) => m.k === 'rice' || m.k === 'bread'), ot = cur.filter((m) => !st.includes(m)); return st.concat(ot); };
    function text() {
      if (!cur.length) return '식판에 음식을 담으면 설명 글이 여기에 만들어져요.';
      const parts = order().map((m) => `${m.n}에는 <b>${gwa(m.main.map((i) => NUTR[i]))}</b>`);
      const sum = NUTR.map((_, i) => cur.reduce((a, m) => a + m.v[i], 0)), lack = NUTR.filter((_, i) => sum[i] < 3);
      return `오늘 급식의 ${parts.join(', ')}${iga('이')} 많이 들어 있다. ` + (cur.length < 5 ? '' : lack.length ? `${lack.join(', ')}${eun(lack[lack.length - 1])} 적게 들어 있어서 다른 음식으로 보충하면 좋겠다.` : '여섯 가지 영양소를 골고루 얻을 수 있다. 음식물마다 들어 있는 영양소의 종류와 양이 다르므로 골고루 먹어야 한다.');
    }
    function paint() {
      const o = order(); for (let i = 0; i < 5; i++) T.put(i, o[i] || null);
      $$('#mn button').forEach((b) => b.setAttribute('aria-pressed', String(cur.includes(MENU[+b.dataset.i]))));
      $('#cn').textContent = `음식을 눌러 담아요 (${cur.length}/5)`;
      const sum = NUTR.map((_, i) => cur.reduce((a, m) => a + m.v[i], 0));
      sum.forEach((s, i) => { const lack = cur.length === 5 && s < 3; $(`[data-b="${i}"]`).style.width = Math.min(100, s / 9 * 100) + '%'; $(`[data-n="${i}"]`).classList.toggle('lack', lack); $(`[data-bb="${i}"]`).classList.toggle('lack', lack); });
      $('#say').innerHTML = text();
      if (cur.length < 5) return say('결과', cur.length ? `${5 - cur.length}칸이 남았어요.` : '먼저 음식을 다섯 가지 골라 담아요.');
      const lack = NUTR.filter((_, i) => sum[i] < 3);
      if (lack.length) say('적게 들어 있는 영양소가 있어요', `<b>${lack.join(', ')}</b>${iga(lack[lack.length - 1])} 적어요. 음식물마다 들어 있는 영양소의 종류와 양이 달라요. 어떤 음식으로 바꾸면 좋을까요?`, 'no');
      else say('골고루 담았어요', '여섯 가지 영양소를 모두 얻을 수 있어요. 음식물마다 들어 있는 영양소의 종류와 양이 다르므로 음식물을 <b>골고루 섭취</b>해야 해요.', 'ok');
    }
    const set = (names) => { cur = names.map((k) => MENU.find((m) => m.k === k)); paint(); };
    $('#bBad').addEventListener('click', () => set(['rice', 'bread', 'meat', 'egg', 'fish']));
    $('#bReset').addEventListener('click', () => { cur = []; paint(); });
    $('#copy').addEventListener('click', async () => { const t = $('#say').textContent; try { await navigator.clipboard.writeText(t); $('#copy').textContent = '복사했어요'; } catch (e) { $('#copy').textContent = '복사하지 못했어요. 글을 길게 눌러 복사해요'; } setTimeout(() => { $('#copy').textContent = '글 복사하기'; }, 1800); });
    const act = (a) => { $$('#at button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.a === a))); $$('.pane').forEach((e) => { e.hidden = e.dataset.a !== a; }); };
    $$('#at button').forEach((b) => b.addEventListener('click', () => act(b.dataset.a)));
    paint();
    if (q.get('set') === 'good') set(['rice', 'egg', 'gim', 'veg', 'milk']);
    if (q.get('set') === 'bad') set(['rice', 'bread', 'meat', 'egg', 'fish']);
    if (q.get('tab')) act(q.get('tab'));
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('골고루 식판', err); }
})();
</script>
</body>
</html>
