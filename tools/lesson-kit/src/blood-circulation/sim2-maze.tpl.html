<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>혈액의 순환 경로 – 단어 미로</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ps.css@@*/
/*@@LOCAL:_css_sim.css@@*/
/*@@LOCAL:_css_pf.css@@*/
.mz{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:8px;padding:14px;min-height:300px;background:#fff}.mz .cl{border-radius:14px;border:2px solid #d4dee8;background:#f7fafc;font-weight:800;font-size:clamp(14px,1.7vw,19px);cursor:pointer;word-break:keep-all;line-height:1.2;color:#14263b}.mz .cl.on{background:#dcebfa;border-color:#9fbbd8;color:#0b3f73}.mz .cl.cur{background:#0e63b3;color:#fff;border-color:#0e63b3}.mz .cl.bad{background:#fff4f2;border-color:#d9534f}.chain{display:flex;flex-wrap:wrap;gap:4px}.chain span{font-size:13.5px;font-weight:800;padding:6px 9px;border-radius:9px;background:#eef3f8;color:#5a6b7e}.chain span.done{background:#dcebfa;color:#0b3f73}.chain span.on{background:#0e63b3;color:#fff}.viewer{display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl"><span class="eyebrow">해 보기</span><h1>혈액 순환 단어 미로</h1>
    <p class="sub">우심실에서 출발해 혈액이 지나는 곳을 차례대로 눌러 끝까지 가요. 옆 칸으로만 갈 수 있어요.</p></div></header>
  <div class="stage">
    <section class="card viewer"><div class="mz" id="mz" role="grid" aria-label="혈관과 심장 낱말이 적힌 미로 칸"></div><div class="vctl"><span class="hint" id="hint">시작: 우심실</span><span class="sp"></span><button class="vb" type="button" id="bReset">처음부터</button></div></section>
    <section class="card pad"><div class="ptabs" role="tablist" id="pt"><button type="button" role="tab" data-p="lab" aria-selected="true">길 찾기</button><button type="button" role="tab" data-p="why" aria-selected="false">짝과 말하기</button></div>
      <div class="pane" data-p="lab"><div class="seglbl">지금까지 온 길</div><div class="chain" id="pth"></div><div class="fbk" id="res"><b class="t" id="resT">결과</b><span id="resM">우심실 다음은 어디일까요? 옆 칸에서 찾아 눌러요.</span></div><p class="mnote">교과서 부록 332쪽 놀이판으로 직접 미로를 만들고 짝과 바꾸어 풀어 봐요.</p></div>
      <div class="pane" data-p="why" hidden><p class="ptxt">한 명은 허파순환을 우심실부터, 다른 한 명은 온몸순환을 좌심실부터 말해 봐요.</p><ol class="whylist"><li><i>1</i><span>허파순환: 우심실 → 폐동맥 → 폐 → 폐정맥 → 좌심방</span></li><li><i>2</i><span>온몸순환: 좌심실 → 대동맥 → 온몸 → 대정맥 → 우심방</span></li></ol></div></section>
  </div>
</div>
<script>
/*@@LOCAL:_ps.js@@*/
</script>
<script>
/*@@LOCAL:_bc.js@@*/
</script>
<script>
(() => {
  'use strict';
  try {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const q = new URLSearchParams(location.search);
    const say = (t, m, c = '') => { $('#res').className = 'fbk ' + c; $('#resT').textContent = t; $('#resM').innerHTML = m; };
    const ANS = ['우심실', '폐동맥', '폐', '폐정맥', '좌심방', '좌심실', '대동맥', '온몸', '대정맥', '우심방', '우심실'];
    /* 정답 칸 좌표. 나머지는 헷갈리는 낱말 */
    const COL = 5, ROW = 5, PATH = [[0, 0], [1, 0], [2, 0], [2, 1], [1, 1], [0, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2]].map(([c, r]) => [c, r]);
    const FILL = ['대정맥', '대동맥', '폐', '좌심실', '온몸', '우심방', '폐동맥', '좌심방', '폐정맥', '우심실', '온몸', '대동맥', '우심방', '폐'];
    const grid = {}; PATH.forEach(([c, r], i) => { grid[c + ',' + r] = ANS[i]; }); let fi = 0;
    let html = ''; for (let r = 0; r < ROW; r++) for (let c = 0; c < COL; c++) { const k = c + ',' + r, w = grid[k] || FILL[fi++ % FILL.length]; grid[k] = w; html += `<button type="button" data-k="${k}" class="cl">${w}</button>`; }
    $('#mz').innerHTML = html;
    let idx = 0;
    const cell = (k) => $(`[data-k="${k}"]`);
    const paint = () => { $$('#mz .cl').forEach((b) => b.classList.remove('on', 'cur')); PATH.slice(0, idx + 1).forEach(([c, r], i) => { const e = cell(c + ',' + r); e.classList.add(i === idx ? 'cur' : 'on'); }); $('#pth').innerHTML = ANS.slice(0, idx + 1).map((w, i) => `<span class="${i === idx ? 'on' : 'done'}">${w}</span>`).join(''); };
    paint();
    $$('#mz .cl').forEach((b) => b.addEventListener('click', () => {
      if (idx >= PATH.length - 1) return; const [c, r] = b.dataset.k.split(',').map(Number), [c0, r0] = PATH[idx];
      if (Math.abs(c - c0) + Math.abs(r - r0) !== 1) { say('옆 칸을 눌러요', '지금 칸의 위, 아래, 왼쪽, 오른쪽 칸으로만 갈 수 있어요.', 'no'); return; }
      const [c1, r1] = PATH[idx + 1];
      if (c === c1 && r === r1) { idx++; paint(); if (idx === 4) say('허파순환을 지났어요', '우심실 → 폐동맥 → 폐 → 폐정맥 → 좌심방', 'ok'); else if (idx === PATH.length - 2) say('온몸순환도 곧 끝나요', '좌심실 → 대동맥 → 온몸 → 대정맥 → 우심방', 'ok'); else if (idx === PATH.length - 1) say('미로를 풀었어요', '혈액은 허파순환과 온몸순환을 <b>반복</b>해요. 우심실로 돌아왔어요.', 'ok'); else say(ANS[idx], `다음 칸을 찾아요.`); }
      else { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 500); say('여기는 아니에요', `<b>${ANS[idx]}</b> 다음에 혈액이 가는 곳을 떠올려요.`, 'no'); }
    }));
    $('#bReset').addEventListener('click', () => { idx = 0; paint(); say('결과', '우심실 다음은 어디일까요? 옆 칸에서 찾아 눌러요.'); });
    if (q.get('all')) { idx = PATH.length - 1; paint(); say('미로를 풀었어요', '혈액은 허파순환과 온몸순환을 <b>반복</b>해요. 우심실로 돌아왔어요.', 'ok'); }
    const tab = (p) => { $$('#pt button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.p === p))); $$('.pane').forEach((e) => { e.hidden = e.dataset.p !== p; }); };
    $$('#pt button').forEach((b) => b.addEventListener('click', () => tab(b.dataset.p)));
    if (q.get('tab')) tab(q.get('tab'));
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('단어 미로', err); }
})();
</script>
</body>
</html>
