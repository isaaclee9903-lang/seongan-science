<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 허브 카드 사진 원본 (800×448). 찍기: python tools/lesson-kit/src/mineral-use/card_shot.py -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html,body{margin:0}
  #card{position:relative;width:800px;height:448px;overflow:hidden;font-family:Pretendard,sans-serif;
    background:radial-gradient(60% 80% at 50% 0%,#fff7ea 0%,transparent 70%),linear-gradient(180deg,#f4ede0,#e2d5bf)}
  .floor{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,#5b4632,#3a2c1f)}
  .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#b8642a}
  .col{position:absolute;bottom:0;width:250px;height:448px}
  .prod{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:220px;height:200px}
  .prod svg{width:100%;height:100%;filter:drop-shadow(0 10px 12px rgba(60,40,20,.25))}
  .arrow{position:absolute;left:50%;top:222px;transform:translateX(-50%);width:44px;height:86px}
  .rock{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:132px;height:132px}
  .rock img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
  .nm{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:21px;color:#fff3e0;letter-spacing:-.02em}
  .tag{position:absolute;left:50%;top:226px;transform:translateX(-50%);display:none}
</style></head><body>
<div id="card">
  <div class="floor"></div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a46a"/><stop offset="1" stop-color="#b8642a"/></linearGradient>
  </defs></svg>

  <!-- 1 석회암 → 시멘트 → 건물 -->
  <div class="col" style="left:18px">
    <div class="prod"><svg viewBox="0 0 220 200">
      <defs><linearGradient id="bw" x1="0" x2="1"><stop offset="0" stop-color="#d9d6cf"/><stop offset=".5" stop-color="#f1efe9"/><stop offset="1" stop-color="#bfbcb4"/></linearGradient>
        <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#5f9fc8"/></linearGradient>
        <linearGradient id="bag" x1="0" x2="1"><stop offset="0" stop-color="#d8cdb6"/><stop offset=".5" stop-color="#efe6d2"/><stop offset="1" stop-color="#c2b597"/></linearGradient></defs>
      <rect x="62" y="18" width="96" height="176" rx="3" fill="url(#bw)" stroke="#9c988f" stroke-width="2"/>
      <rect x="62" y="18" width="96" height="10" fill="#a9a59c"/>
      <g fill="url(#win)" stroke="#8e9aa3"><rect x="74" y="40" width="20" height="22"/><rect x="100" y="40" width="20" height="22"/><rect x="126" y="40" width="20" height="22"/><rect x="74" y="74" width="20" height="22"/><rect x="100" y="74" width="20" height="22"/><rect x="126" y="74" width="20" height="22"/><rect x="74" y="108" width="20" height="22"/><rect x="100" y="108" width="20" height="22"/><rect x="126" y="108" width="20" height="22"/></g>
      <rect x="98" y="150" width="24" height="44" fill="#7a5a3a"/>
      <!-- 시멘트 포대 -->
      <path d="M8 196 L14 140 Q40 130 66 140 L72 196Z" fill="url(#bag)" stroke="#8f8676" stroke-width="2"/>
      <path d="M14 140 Q40 124 66 140" fill="none" stroke="#8f8676" stroke-width="2"/>
      <text x="40" y="176" text-anchor="middle" font-size="15" font-weight="900" fill="#6b6253">시멘트</text>
    </svg></div>
    <svg class="arrow" viewBox="0 0 44 86"><path d="M22 82 V12" stroke="#c0702e" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 15"/><path d="M8 24 L22 8 L36 24" fill="none" stroke="#c0702e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="rock"><img src="../../../../lessons/mineral-use/media/th-limestone.png"></div>
    <div class="nm">석회암</div>
  </div>

  <!-- 2 황동석 → 구리 → 전선 -->
  <div class="col" style="left:275px">
    <div class="prod"><svg viewBox="0 0 220 200">
      <defs><linearGradient id="plug" x1="0" x2="1"><stop offset="0" stop-color="#2c3035"/><stop offset=".5" stop-color="#4a5057"/><stop offset="1" stop-color="#25292d"/></linearGradient></defs>
      <!-- 피복 전선 -->
      <path d="M20 170 C40 110 120 150 150 80 C162 52 176 40 196 34" stroke="#2f3337" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M20 170 C40 110 120 150 150 80" stroke="#4b5056" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
      <!-- 벗겨진 끝: 구리 심 -->
      <g transform="translate(36 150) rotate(-62)">
        <rect x="-6" y="-11" width="40" height="22" rx="4" fill="#3a3f44"/>
        <path d="M30 -8 L74 -10 M30 -3 L76 -3 M30 3 L74 4 M30 8 L72 10" stroke="url(#cu)" stroke-width="5" stroke-linecap="round"/>
        <path d="M32 -6 L70 -8" stroke="#ffe0c4" stroke-width="1.6" opacity=".8"/>
      </g>
      <!-- 플러그 -->
      <g transform="translate(176 40) rotate(-28)"><rect x="-4" y="-20" width="44" height="40" rx="9" fill="url(#plug)"/><rect x="38" y="-12" width="20" height="6" rx="2" fill="#d6dbe0"/><rect x="38" y="6" width="20" height="6" rx="2" fill="#d6dbe0"/></g>
      <!-- 전기 -->
      <path d="M118 18 l16 0 l-9 15 l12 0 l-22 26 l6 -19 l-11 0z" fill="#ffd34d" stroke="#c99a2e" stroke-width="2"/>
    </svg></div>
    <svg class="arrow" viewBox="0 0 44 86"><path d="M22 82 V12" stroke="#c0702e" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 15"/><path d="M8 24 L22 8 L36 24" fill="none" stroke="#c0702e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="rock"><img src="../../../../lessons/mineral-use/media/th-chalcopyrite.png"></div>
    <div class="nm">황동석</div>
  </div>

  <!-- 3 석영 → 규소 → 유리·반도체(스마트폰) -->
  <div class="col" style="left:532px">
    <div class="prod"><svg viewBox="0 0 220 200">
      <defs><linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd6e0"/><stop offset=".6" stop-color="#2d7fb8"/><stop offset="1" stop-color="#1c3f7a"/></linearGradient>
        <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#cfeaf4"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#a9d3e4"/></linearGradient></defs>
      <!-- 유리컵 -->
      <path d="M14 70 H74 L66 186 Q44 194 22 186Z" fill="url(#gl)" stroke="#6aa7bd" stroke-width="2.5" opacity=".95"/>
      <path d="M24 82 L30 176" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <path d="M18 120 H70" stroke="#8ec7dc" stroke-width="2"/>
      <!-- 스마트폰 -->
      <rect x="96" y="12" width="94" height="180" rx="16" fill="#15191d" stroke="#5c6870" stroke-width="3"/>
      <rect x="104" y="26" width="78" height="152" rx="7" fill="url(#scr)"/>
      <!-- 화면 속 반도체 칩 -->
      <g transform="translate(143 102)">
        <rect x="-26" y="-26" width="52" height="52" rx="5" fill="#2b3036" stroke="#c9a25a" stroke-width="2"/>
        <rect x="-16" y="-16" width="32" height="32" rx="2" fill="#5d6b78"/>
        <path d="M-34 -14h8M-34 -4h8M-34 6h8M-34 16h8M26 -14h8M26 -4h8M26 6h8M26 16h8M-14 -34v8M-4 -34v8M6 -34v8M16 -34v8M-14 26v8M-4 26v8M6 26v8M16 26v8" stroke="#e0c46a" stroke-width="2.5"/>
      </g>
      <path d="M106 30 L130 30 L110 176 L106 176Z" fill="#fff" opacity=".12"/>
    </svg></div>
    <svg class="arrow" viewBox="0 0 44 86"><path d="M22 82 V12" stroke="#c0702e" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 15"/><path d="M8 24 L22 8 L36 24" fill="none" stroke="#c0702e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="rock"><img src="../../../../lessons/mineral-use/media/th-quartz.png"></div>
    <div class="nm">석영</div>
  </div>
</div>
</body></html>
