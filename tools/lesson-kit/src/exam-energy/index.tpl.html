<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에너지 시험 대비 - 중3 과학</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
  :root{--bg:#edf3f8;--ink:#14263b;--muted:#5a6b7e;--line:#dde6ee;--accent:#0e63b3;--accent-soft:#e3effb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .shell{height:100vh;height:100dvh;display:flex;flex-direction:column}
  header{flex:none;display:flex;align-items:center;gap:14px;padding:6px 16px;min-height:56px;background:#fff;border-bottom:1px solid var(--line);z-index:2}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .logo{flex:none;width:34px;height:34px}
  .title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  nav{flex:none;display:flex;gap:6px;align-items:center}
  .tab{flex:none;border:0;background:transparent;cursor:pointer;min-height:44px;padding:0 14px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .tab:focus-visible,.full:focus-visible{outline:3px solid rgba(14,99,179,.35);outline-offset:2px}
  .full{flex:none;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
  .stage iframe.on{visibility:visible}
  :fullscreen header{display:none}
  /* 휴대 전화 세로: 제목을 줄이고 탭을 넓게 */
  @media (max-width:720px){
    header{gap:8px;padding:4px 8px}
    .brand{flex:none}
    .title,.full{display:none}
    nav{flex:1;gap:2px}
    .tab{flex:1;padding:0 4px;font-size:14px}
  }
  /* 휴대 전화 가로: 그림이 가려지지 않게 머리를 낮춤 */
  @media (max-height:480px){
    header{min-height:40px;padding:2px 10px}
    .logo{width:28px;height:28px}
    .title small{display:none}
    .title{font-size:14px}
    .tab{min-height:36px;font-size:14px}
    .full{display:none}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <a class="brand" href="../../" title="수업 목록으로">
      <img class="logo" src="../../favicon.svg" alt="">
      <span class="title">에너지 시험 대비<small>Ⅲ-2 일과 에너지, Ⅵ 에너지 전환과 보존</small></span>
    </a>
    <nav role="tablist" aria-label="학습 화면">
      <button class="tab" role="tab" data-page="cards" aria-selected="false">핵심 넘기기</button>
      <button class="tab" role="tab" data-page="bank" aria-selected="false">문제 모음</button>
      <button class="tab" role="tab" data-page="sheet" aria-selected="false">요약</button>
    </nav>
    <button class="full" id="bFull" type="button" hidden>전체 화면</button>
  </header>
  <main class="stage">
    <iframe data-page="cards" title="핵심 넘기기"></iframe>
    <iframe data-page="bank" title="문제 모음"></iframe>
    <iframe data-page="sheet" title="요약"></iframe>
  </main>
</div>
<script>
  const PAGES = { cards: 'cards.html', bank: 'bank.html', sheet: 'sheet.html' };
  (function () {
    const tabs = {}, frames = {};
    document.querySelectorAll('.tab').forEach((t) => { tabs[t.dataset.page] = t; });
    document.querySelectorAll('iframe[data-page]').forEach((f) => { frames[f.dataset.page] = f; });
    function show(id) {
      if (!frames[id]) return;
      if (!frames[id].getAttribute('src')) frames[id].src = PAGES[id] + location.hash;
      Object.keys(frames).forEach((k) => {
        frames[k].classList.toggle('on', k === id);
        tabs[k].setAttribute('aria-selected', String(k === id));
      });
      try { const q = new URLSearchParams(location.search); q.set('page', id); history.replaceState(null, '', '?' + q + location.hash); } catch (e) {}
      try { frames[id].contentWindow && frames[id].contentWindow.focus(); } catch (e) {}
    }
    Object.keys(tabs).forEach((k) => tabs[k].addEventListener('click', () => show(k)));
    const b = document.getElementById('bFull');
    if (document.documentElement.requestFullscreen) {
      b.hidden = false;
      b.addEventListener('click', () => { document.documentElement.requestFullscreen().catch(() => {}); });
    }
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (d && d.type === 'ras-nav' && frames[d.target]) show(d.target);
    });
    const r = new URLSearchParams(location.search).get('page');
    show(PAGES[r] ? r : 'cards');
  })();
</script>
</body>
</html>
