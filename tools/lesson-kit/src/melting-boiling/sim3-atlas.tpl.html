<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>녹는점과 끓는점 – 신기한 물질 도감</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_mb.css@@*/
/*@@LOCAL:_css_sim.css@@*/
  /* ===== 이 페이지 전용 ===== */
  .eyebrow.out{color:#34495e;background:#e9eef3}
  .ptabs{margin-bottom:10px}
  .presets{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
  .presets button{min-height:46px;padding:2px 10px;border-radius:12px;border:1px solid #d4dee8;background:#fff;font-weight:800;font-size:13px;color:#34495e;cursor:pointer;line-height:1.2;display:grid;justify-items:center;word-break:keep-all}
  .presets button small{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .presets button[aria-pressed="true"]{background:#14263b;color:#fff;border-color:#14263b}
  .presets button[aria-pressed="true"] small{color:#c9d4df}
  .dhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 4px}
  .dhead h2{margin:0;font-size:24px;letter-spacing:-.02em;color:#14263b}
  .dhead .alias{font-size:14px;font-weight:800;color:#5a6b7e}
  .dtag{display:block;font-size:15px;font-weight:800;color:#5a6b7e;margin:0 0 12px;word-break:keep-all}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .tile{padding:2px 2px}
  .tile .k{font-size:12.5px;font-weight:800;color:var(--muted)}
  .tile .v{font-size:21px;font-weight:900;color:#14263b;font-variant-numeric:tabular-nums;line-height:1.3;word-break:keep-all}
  .tile .v.sm{font-size:15px;line-height:1.45}
  .now{border-top:1px solid #e1e8ef;border-bottom:1px solid #e1e8ef;padding:10px 2px;margin-bottom:12px;font-size:16px;font-weight:700;color:#34495e;word-break:keep-all}
  .now b{font-weight:900;color:#14263b}
  .now b.st{color:#0e63b3}
  .story{font-size:15.5px;line-height:1.7;color:var(--ink2);margin:0 0 8px;word-break:keep-all}
  .use{font-size:15px;line-height:1.65;color:#34495e;border-left:3px solid #0e63b3;padding:2px 0 2px 12px;margin:0;word-break:keep-all}
  .use b{display:block;font-size:12.5px;color:#0e63b3;margin-bottom:1px}
  .qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
  .qnav button{min-height:44px;border:0;border-radius:11px;background:#eef3f8;font-weight:900;color:var(--muted);cursor:pointer}
  .qnav button[aria-current="true"]{background:var(--fab);color:#fff}
  .qnav button.ok{background:#e5f5ec;color:#11703f}
  .qnav button.ok[aria-current="true"]{background:#1f9d5c;color:#fff}
  .cq{font-size:16px;font-weight:800;line-height:1.6;color:var(--ink);margin:0 0 8px;word-break:keep-all}
  .copts{display:grid;gap:6px}
  .copts button{min-height:48px;text-align:left;border-radius:12px;border:2px solid #d4dee8;background:#fff;font-weight:700;font-size:15px;cursor:pointer;padding:6px 12px;line-height:1.45;word-break:keep-all}
  .copts button.good{border-color:var(--ok);background:#e8f7ef;color:#11703f}
  .copts button.bad{border-color:#e7a29b;background:#fff4f2;color:#9b3a32}
  .srcs{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0;word-break:keep-all}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="ttl">
      <span class="eyebrow out">교과서 밖 더 알아보기</span><h1>신기한 물질 도감</h1>
      <p class="sub">온도 선을 끌거나 아래 온도를 눌러 봐요. 그 온도에서 물질이 고체·액체·기체 중 무엇인지 보여 줘요. 물질 이름을 누르면 이야기가 나와요.</p>
    </div>
  </header>

  <div class="stage">
    <section class="card viewer">
      <div class="scene grow" id="atlas" role="img" aria-label="물질마다 온도에 따라 고체, 액체, 기체로 있는 구간을 나타낸 막대 그림. 끌 수 있는 세로 온도 선이 있다."></div>
      <div class="vctl"><div class="presets" id="presets"></div></div>
    </section>

    <section class="card pad">
      <div class="ptabs" role="tablist" id="pt">
        <button type="button" role="tab" data-p="info" aria-selected="true">물질 이야기</button>
        <button type="button" role="tab" data-p="quiz" aria-selected="false">도전 문제 <small id="qBadge">0/5</small></button>
      </div>
      <div class="pane" data-p="info">
        <div class="dhead"><h2 id="dName">물</h2><span class="alias" id="dAlias"></span></div>
        <span class="dtag" id="dTag"></span>
        <div class="tiles"><div class="tile"><div class="k" id="dK1">녹는점</div><div class="v" id="dMp">-</div></div><div class="tile"><div class="k" id="dK2">끓는점</div><div class="v" id="dBp">-</div></div></div>
        <div class="now" id="dNow"></div>
        <p class="story" id="dStory"></p>
        <p class="use" id="dUse"></p>
      </div>
      <div class="pane" data-p="quiz" hidden>
        <div class="qnav" id="qnav"></div>
        <p class="cq" id="cq"></p>
        <div class="copts" id="copts"></div>
        <div class="fbk" id="cfb" hidden></div>
      </div>
      <p class="srcs">값은 모두 1 기압일 때예요. 출처: CRC handbook of chemistry and physics, 위키백과. 자료마다 조금씩 다른 값은 '약', '넘어요'로 적었어요. 교과서에 없는 내용이라 시험 범위는 아니에요.</p>
    </section>
  </div>
</div>
<script>
window.SM = { $: (s, r = document) => r.querySelector(s), $$: (s, r = document) => Array.from(r.querySelectorAll(s)),
  reduce: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), Q: new URLSearchParams(location.search) };
</script>
<script>
/*@@LOCAL:_sol.js@@*/
</script>
<script>
/*@@LOCAL:_mb.js@@*/
</script>
<script>
/* ===== 블록 1: 도감 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S, Q = S.Q, f1 = MB.f1;
    // 선생님이 고치기 쉽게 모아 둔 자료 (1 기압, ℃). mp 녹는점, bp 끓는점, sub 승화하는 온도
    const ATLAS = [
      { id: 'he', name: '헬륨', bp: -268.9, tag: '끓는점이 가장 낮은 물질', mpTxt: '1 기압에서는<br>얼지 않아요',
        story: '모든 물질 가운데 끓는점이 가장 낮아요. 더 신기한 것은 1 기압에서는 아무리 차갑게 해도 얼지 않는다는 점이에요. 고체로 만들려면 압력을 크게 높여야 해요.',
        use: '병원의 MRI 장치는 아주 센 자석을 써요. 이 자석을 아주 차갑게 식히는 데 액체 헬륨을 써요.' },
      { id: 'h2', name: '수소', mp: -259.1, bp: -252.9, tag: '로켓을 날리는 액체',
        story: '가장 가벼운 기체예요. −252.9 ℃보다 차갑게 해야 액체가 되고, −259.1 ℃보다 차가우면 고체가 돼요.',
        use: '액체 수소는 액체 산소와 함께 로켓 연료로 써요. 그래서 로켓의 연료 통은 아주 차갑게 유지해야 해요.' },
      { id: 'ch4', name: '메테인', alias: 'LNG의 주성분', mp: -182.5, bp: -161.5, tag: '배로 실어 오는 차가운 액체',
        story: '도시가스로 쓰는 천연가스의 주성분이에요. −161.5 ℃보다 차갑게 하면 액체가 되어 부피가 아주 작아져요.',
        use: '외국에서 천연가스를 들여올 때는 액체로 만들어 LNG(액화 천연가스) 운반선에 실어 와요.' },
      { id: 'co2', name: '이산화 탄소', alias: '드라이아이스', sub: -78.5, tag: '녹지 않고 바로 기체로', mpTxt: '1 기압에서는<br>액체가 안 돼요', k2: '승화하는 온도',
        story: '고체 이산화 탄소가 드라이아이스예요. 1 기압에서는 액체가 되지 않고 −78.5 ℃에서 고체에서 바로 기체가 돼요(승화). 그래서 녹는점·끓는점 대신 승화하는 온도를 써요.',
        use: '아이스크림 포장에 넣으면 녹아도 물이 생기지 않아 상자가 젖지 않아요. 맨손으로 만지면 다칠 수 있어요.' },
      { id: 'butane', name: '부탄', mp: -138.3, bp: -0.5, tag: '겨울에 약해지는 가스 불',
        story: '휴대용 가스통 속에는 부탄이 눌려서 액체로 들어 있어요. 끓는점이 −0.5 ℃라서 날씨가 아주 추우면 통 속 액체가 잘 끓지 못해요.',
        use: '휴대용 가스레인지와 라이터 연료예요. 한겨울 캠핑장에서 불이 약해지는 까닭이에요.' },
      { id: 'acetone', name: '아세톤', mp: -94.7, bp: 56.1, tag: '금방 마르는 액체',
        story: '끓는점이 물보다 훨씬 낮아요. 그래서 실온에서도 빨리 기체가 되어 날아가고, 바른 자리가 금방 말라요.',
        use: '매니큐어를 지우는 액체에 들어 있어요. 불이 붙기 쉬워서 불 가까이에서 쓰면 안 돼요.' },
      { id: 'water', name: '물', mp: 0.0, bp: 100.0, tag: '비교 기준',
        story: '1 기압에서 0 ℃에서 얼고 100 ℃에서 끓어요. 다른 물질의 녹는점·끓는점을 물과 비교해 봐요.',
        use: '교과서 탐구에서 물(증류수)의 끓는점을 재어 보았어요.' },
      { id: 'ga', name: '갈륨', mp: 29.8, bp: 2400, bpTxt: '약 2400 ℃', tag: '손 위에서 녹는 금속',
        story: '녹는점이 29.8 ℃라 손바닥 위에 올려 두면 체온 때문에 녹아요. 그런데 끓는점은 약 2400 ℃예요. 액체로 있는 온도 범위가 아주 넓은 금속이에요.',
        use: '갈륨이 들어간 물질로 LED와 반도체를 만들어요.' },
      { id: 'w', name: '텅스텐', mp: 3422, bp: 5555, bpTxt: '5500 ℃ 넘음', tag: '녹는점이 가장 높은 금속',
        story: '금속 가운데 녹는점이 가장 높아요. 3422 ℃가 되어야 녹고, 끓는점은 5500 ℃가 넘어요.',
        use: '백열전구 속 가는 선(필라멘트)은 아주 뜨겁게 달궈져 빛을 내요. 그래도 녹지 않도록 텅스텐으로 만들어요.' },
    ];
    const PRESETS = [['우주 공간', -270, '약 −270'], ['LNG 탱크', -162, '약 −162'], ['냉동실', -18, '약 −18'], ['교실', 20, '20'], ['체온', 36.5, '약 36.5'], ['끓는 물', 100, '100'], ['철이 녹을 때', 1538, '1538'], ['태양 표면', 6000, '약 6000']];
    const fmt = (T) => (T < 0 ? '−' : '') + (Math.abs(T) % 1 ? f1(Math.abs(T)) : String(Math.abs(Math.round(T))));
    let T = +(Q.get('T') || 20), sel = Math.max(0, ATLAS.findIndex((a) => a.id === (Q.get('sel') || 'water')));
    const AT = MB.atlas($('#atlas'), { items: ATLAS, T, sel, onT: (t) => { T = t; info(); paintPre(); }, onSel: (i) => { sel = i; info(); } });
    window.AT = AT;
    function info() {
      const it = ATLAS[sel];
      $('#dName').textContent = it.name; $('#dAlias').textContent = it.alias || ''; $('#dTag').textContent = it.tag;
      $('#dK2').textContent = it.k2 || '끓는점';
      $('#dMp').innerHTML = it.mpTxt || fmt(it.mp) + ' ℃'; $('#dMp').classList.toggle('sm', !!it.mpTxt);
      $('#dBp').innerHTML = it.sub != null ? fmt(it.sub) + ' ℃' : it.bpTxt || fmt(it.bp) + ' ℃';
      $('#dNow').innerHTML = `지금 <b>${fmt(T)} ℃</b>에서 ${it.name}은(는) <b class="st">${MB.stateOf(it, T)}</b>`;
      $('#dStory').textContent = it.story;
      $('#dUse').innerHTML = `<b>생활 속에서</b>${it.use}`;
    }
    $('#presets').innerHTML = PRESETS.map(([n, t, s]) => `<button type="button" data-t="${t}" aria-pressed="false">${n}<small>${s} ℃</small></button>`).join('');
    function paintPre() { $$('#presets button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.t === T))); }
    $$('#presets button').forEach((b) => b.addEventListener('click', () => AT.setT(+b.dataset.t)));
    window.ATLAS_GO = (t, id) => { if (t != null) AT.setT(t); if (id) { sel = ATLAS.findIndex((a) => a.id === id); AT.setSel(sel); } };
    info(); paintPre();
    window.SM.okUI = true;
  } catch (err) { window.SM_err('도감', err); }
})();
</script>
<script>
/* ===== 블록 2: 도전 문제 · 칸 탭 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S;
    const CHAL = [
      { q: '기온이 −10 ℃인 겨울 캠핑장에서 휴대용 가스레인지 불이 약했어요. 통 속 부탄은 어떤 상태일까요?', T: -10, id: 'butane',
        o: ['끓는점보다 차가워서 액체로 남아 잘 끓지 못한다', '녹는점보다 차가워서 고체로 얼었다', '이미 모두 기체가 되어 빠져나갔다'], a: 0,
        e: '부탄의 끓는점은 −0.5 ℃예요. −10 ℃는 끓는점보다 낮아서 액체 부탄이 잘 끓지 못하고, 나오는 기체가 적어 불이 약해져요. 녹는점(−138.3 ℃)보다는 훨씬 따뜻해서 얼지는 않아요.' },
      { q: '손바닥(약 36.5 ℃) 위에 올려 두면 녹는 금속은 무엇일까요?', T: 36.5, id: 'ga',
        o: ['텅스텐', '갈륨', '철'], a: 1, e: '갈륨의 녹는점은 29.8 ℃로 체온보다 낮아요. 그래서 손 위에서 액체가 돼요.' },
      { q: '20 ℃ 교실에서 액체로 있는 물질끼리 짝지은 것은?', T: 20, id: 'acetone',
        o: ['물, 부탄', '물, 갈륨', '물, 아세톤'], a: 2, e: '20 ℃는 물(0~100 ℃)과 아세톤(−94.7~56.1 ℃)이 액체로 있는 구간 안이에요. 부탄은 기체, 갈륨은 고체예요.' },
      { q: '드라이아이스를 접시에 두었더니 크기는 줄어드는데 접시가 젖지 않았어요. 왜일까요?', T: -78.5, id: 'co2',
        o: ['녹는점이 아주 높아서 녹지 않기 때문', '1 기압에서 액체가 되지 않고 바로 기체가 되기 때문', '녹은 액체가 접시에 스며들었기 때문'], a: 1, e: '이산화 탄소는 1 기압에서 액체가 되지 않고 −78.5 ℃에서 고체에서 바로 기체가 돼요. 그래서 물기가 남지 않아요.' },
      { q: 'MRI 장치의 자석을 아주 차갑게 식히는 데 액체 헬륨을 쓸 수 있는 까닭은?', T: -269, id: 'he',
        o: ['끓는점이 −268.9 ℃로 아주 낮아서 그만큼 차가운 액체로 있을 수 있기 때문', '녹는점이 아주 높아서 잘 녹지 않기 때문', '불이 잘 붙어서 열을 내기 때문'], a: 0, e: '헬륨은 −268.9 ℃까지 액체로 있어요. 이렇게 차가운 액체는 헬륨 말고는 거의 없어요.' },
    ];
    let qi = 0; const okSet = new Set();
    function tab(p) { $$('#pt button').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.p === p))); $$('.pane').forEach((e) => (e.hidden = e.dataset.p !== p)); }
    $$('#pt button').forEach((b) => b.addEventListener('click', () => { tab(b.dataset.p); if (b.dataset.p === 'quiz') show(qi); }));
    function nav() { $('#qnav').innerHTML = CHAL.map((_, i) => `<button type="button" data-i="${i}" aria-current="${i === qi}" class="${okSet.has(i) ? 'ok' : ''}">${i + 1}</button>`).join(''); $$('#qnav button').forEach((b) => b.addEventListener('click', () => show(+b.dataset.i))); $('#qBadge').textContent = okSet.size + '/5'; }
    function show(i) {
      qi = i; const c = CHAL[i]; nav();
      $('#cq').textContent = c.q; $('#cfb').hidden = true;
      $('#copts').innerHTML = c.o.map((t, j) => `<button type="button" data-j="${j}">${t}</button>`).join('');
      $$('#copts button').forEach((b) => b.addEventListener('click', () => {
        const j = +b.dataset.j, ok = j === c.a;
        $$('#copts button').forEach((x) => x.classList.remove('good', 'bad')); b.classList.add(ok ? 'good' : 'bad'); if (!ok) $$('#copts button')[c.a].classList.remove('good');
        const fb = $('#cfb'); fb.hidden = false; fb.className = 'fbk ' + (ok ? 'ok' : 'no');
        fb.innerHTML = ok ? `<b class="t">맞았어요</b>${c.e}${i < CHAL.length - 1 ? ' 위의 다음 번호를 눌러요.' : ''}` : '<b class="t">다시 생각해 봐요</b>왼쪽 그림의 온도 선이 문제 속 온도로 옮겨졌어요. 그 물질의 막대 색을 봐요.';
        if (ok) okSet.add(i); nav();
        window.ATLAS_GO && window.ATLAS_GO(c.T, c.id);
      }));
    }
    nav();
    if (S.Q.get('tab') === 'quiz') { tab('quiz'); show(+(S.Q.get('q') || 0)); }
  } catch (err) { window.SM_err('도전 문제', err); }
})();
</script>
</body>
</html>
