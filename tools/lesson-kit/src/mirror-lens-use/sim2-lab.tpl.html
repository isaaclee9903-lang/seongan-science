<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 주변의 거울과 렌즈 – 첨단기술 실험실</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ml.css@@*/
  .stage{grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr)}
  .seg{grid-template-columns:repeat(3,1fr);padding:10px}
  .seg button{flex-direction:column;gap:0;line-height:1.2;font-size:15px;min-height:54px}
  .seg button small{font-size:12px;font-weight:700;opacity:.8}
  .cvw{position:relative;margin:0 10px;border-radius:16px;overflow:hidden;background:#0b1626}
  .cvw canvas{display:block;width:100%;height:auto;touch-action:none}
  .lay{position:absolute;inset:0;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;font-size:clamp(11.5px,1.25vw,14px);line-height:1.25;color:#e9eef5;background:rgba(14,18,25,.74);padding:3px 8px;border-radius:7px}
  .tag.key{background:#0e63b3;color:#fff}
  .tag.lt{color:#14263b;background:rgba(255,255,255,.9)}
  .tag.soft{background:transparent;padding:0;color:#b7c3d1;font-weight:700}
  .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px}
  .ctl .btn{min-height:48px}
  .ctl label.rng{display:flex;align-items:center;gap:10px;flex:1;min-width:230px;font-weight:800;font-size:14px;color:var(--ink2)}
  .ctl input[type=range]{flex:1;height:44px;accent-color:#0e63b3}
  .meter{display:flex;align-items:center;gap:10px;padding:0 10px 12px;font-weight:800;font-size:14px;color:var(--ink2)}
  .meter .bar{flex:1;height:14px;border-radius:7px;background:#e6edf4;overflow:hidden}
  .meter .bar i{display:block;height:100%;width:0;background:#0e63b3;transition:width .35s var(--ease)}
  .meter b{min-width:110px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .facts{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
  .facts li{font-size:14.5px;line-height:1.6;color:var(--ink2);background:#f6f9fc;border-radius:12px;padding:8px 12px;word-break:keep-all}
  .facts li b{color:var(--ink)}
  .facts .src{display:block;font-size:12px;color:var(--muted)}
  .think{margin-top:12px;border-radius:16px;border:1px solid #dbe4ed;background:#fff;padding:12px 14px}
  .think p{margin:0 0 8px;font-weight:800;font-size:15.5px;line-height:1.55;word-break:keep-all}
  .opts{display:grid;gap:6px}
  .opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:48px;border-radius:12px;border:2px solid #dde6ee;background:#fff;padding:6px 12px;font-size:15px;font-weight:700;color:var(--ink2);cursor:pointer;word-break:keep-all}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#eef3f8;display:grid;place-items:center;font-weight:900;font-size:13px}
  .opt.right{border-color:#0e63b3;background:#e9f3fd;color:#0b3f73}.opt.wrong{border-color:#d9534f;background:#fff4f2}
  .opt:disabled{cursor:default}
  @media (max-width:900px),(orientation:portrait){.stage{grid-template-columns:1fr}.viewer{position:static}}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="eyebrow">우리 주변의 거울과 렌즈 · 시뮬레이션 ②</span>
    <h1>첨단기술 속 거울과 렌즈 실험실</h1>
    <p class="sub">우주 망원경, 반도체 장비, 태양로는 교과서의 오목 거울·볼록 거울·평면거울·렌즈의 특징을 끝까지 밀어붙인 기술이에요. 직접 움직여 봐요.</p>
  </header>
  <div class="stage">
    <section class="card viewer" style="padding:0">
      <div class="seg" id="seg" role="tablist" aria-label="실험 고르기">
        <button type="button" role="tab" data-lab="jwst" aria-selected="true">우주 망원경 거울<small>제임스 웹</small></button>
        <button type="button" role="tab" data-lab="euv" aria-selected="false">렌즈일까, 거울일까<small>반도체 장비</small></button>
        <button type="button" role="tab" data-lab="sun" aria-selected="false">햇빛 모으기<small>태양로</small></button>
      </div>
      <div class="cvw"><canvas id="cv" width="1200" height="740" aria-label="실험 그림"></canvas><div class="lay" id="lay"></div></div>
      <div class="ctl" id="ctl"></div>
      <div class="meter" id="meter"><span id="mName">모인 빛</span><span class="bar"><i id="mBar"></i></span><b id="mVal">0%</b></div>
    </section>
    <section class="card pad" id="panel"></section>
  </div>
  <p class="model">실험실의 빛길과 숫자는 개념 이해를 위한 모형이에요. 실제 기계는 훨씬 복잡하고, 사실 자료는 각 실험 아래 출처에서 확인했어요.</p>
  <p class="credit">우리 주변의 거울과 렌즈 · 첨단기술 실험실</p>
</div>
<script>
window.SM = { $: (s, r = document) => r.querySelector(s), $$: (s, r = document) => Array.from(r.querySelectorAll(s)),
  reduce: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), Q: new URLSearchParams(location.search) };
/* 공통 그리기 도구 */
window.G = (() => {
  const lin = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, k]) => g.addColorStop(o, k)); return g; };
  const rad = (c, x, y, r0, r1, st) => { const g = c.createRadialGradient(x, y, r0, x, y, r1); st.forEach(([o, k]) => g.addColorStop(o, k)); return g; };
  const len = (p) => { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; };
  const at = (p, d) => { for (let i = 1; i < p.length; i++) { const s = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); if (d <= s) { const t = d / s; return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * t, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t, i]; } d -= s; } const e = p[p.length - 1]; return [e[0], e[1], p.length - 1]; };
  const line = (c, p) => { c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); };
  const refl = (d, n) => { const k = 2 * (d[0] * n[0] + d[1] * n[1]); return [d[0] - k * n[0], d[1] - k * n[1]]; };
  const norm = (v) => { const L = Math.hypot(v[0], v[1]) || 1; return [v[0] / L, v[1] / L]; };
  // 빛 알갱이: 길을 따라 움직이며, 구간마다 밝기(w[i])를 바꿈
  function photons(c, p, t, o = {}) {
    const L = p.L || (p.L = len(p)), n = o.n || 4, sp = o.speed || 220, col = o.color || '255,244,200';
    for (let k = 0; k < n; k++) {
      const d = (t * sp + k * L / n) % L, q = at(p, d), a = o.w ? o.w[Math.min(o.w.length - 1, q[2] - 1)] : 1;
      if (a <= .02) continue;
      c.fillStyle = rad(c, q[0], q[1], 0, (o.r || 7), [[0, `rgba(${col},${a})`], [1, `rgba(${col},0)`]]);
      c.beginPath(); c.arc(q[0], q[1], o.r || 7, 0, 7); c.fill();
    }
  }
  return { lin, rad, len, at, line, refl, norm, photons };
})();
/* 그림 위 이름표 (캔버스 좌표 → %) */
window.TAG = (() => {
  const lay = document.getElementById('lay'), map = {};
  return {
    put(id, x, y, txt, cls = '') { let e = map[id]; if (!e) { e = map[id] = document.createElement('span'); lay.appendChild(e); } e.className = 'tag ' + cls; e.style.left = (x / 1200 * 100) + '%'; e.style.top = (y / 740 * 100) + '%'; e.innerHTML = txt; e.hidden = false; },
    hide(id) { if (map[id]) map[id].hidden = true; },
    clear() { for (const k in map) { map[k].remove(); delete map[k]; } },
  };
})();
window.LABS = {};
</script>

<script>
/* ===== 실험 1: 제임스 웹 우주 망원경 거울 펼치기·맞추기 ===== */
(() => {
  try {
    const { lin, rad, line, photons } = G;
    const S = 44, SQ = Math.sqrt(3);
    const AX = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1], [2, 0], [2, -1], [2, -2], [1, -2], [0, -2], [-1, -1], [-2, 0], [-2, 1], [-2, 2], [-1, 2], [0, 2], [1, 1]];
    const SEG = AX.map(([q, r], i) => ({ q, r, x: S * 1.5 * q, y: S * SQ * (r + q / 2), wing: Math.abs(q) === 2 ? Math.sign(q) : 0,
      off: [Math.cos(i * 2.39) * (60 + (i * 37) % 70), Math.sin(i * 2.39) * (60 + (i * 53) % 70)], a: 0, tgt: 0 }));
    const st = { fold: 1, foldT: 1, done: 0, auto: 0, cmp: false };
    const CX = 380, CY = 360, DX = 960, DY = 225, DR = 150;
    function hexPath(c, x, y, s) { c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; c[i ? 'lineTo' : 'moveTo'](x + s * Math.cos(a), y + s * Math.sin(a)); } c.closePath(); }
    function segXY(sg) {
      if (!sg.wing) return [CX + sg.x, CY + sg.y, 1];
      const hinge = S * 1.5 * 1.5 * sg.wing, e = st.fold * st.fold * (3 - 2 * st.fold), ang = e * Math.PI * .5;   // 날개는 가장자리 경첩에서 뒤로 접힘
      const dx = (sg.x - hinge) * Math.cos(ang);
      return [CX + hinge + dx, CY + sg.y, Math.cos(ang)];
    }
    function draw(c, t) {
      // 배경: 우주
      c.fillStyle = lin(c, 0, 0, 0, 740, [[0, '#08111f'], [1, '#101d31']]); c.fillRect(0, 0, 1200, 740);
      for (let i = 0; i < 90; i++) { c.fillStyle = `rgba(255,255,255,${.15 + (i % 6) * .07})`; c.fillRect((i * 131) % 1200, (i * 71) % 740, 1.5, 1.5); }
      // 햇빛 가리개 (거울 아래)
      for (let k = 4; k >= 0; k--) { c.fillStyle = k % 2 ? 'rgba(206,196,224,.5)' : 'rgba(178,164,206,.5)'; c.beginPath(); c.moveTo(CX - 330 + k * 18, CY + 250 - k * 6); c.lineTo(CX, CY + 330 - k * 10); c.lineTo(CX + 330 - k * 18, CY + 250 - k * 6); c.lineTo(CX, CY + 205 + k * 4); c.closePath(); c.fill(); }
      // 거울 뒤 받침 (조각마다 조금 큰 어두운 테)
      SEG.forEach((sg) => { const [x, y, k] = segXY(sg); if (k < .05) return; c.save(); c.translate(x, y); c.scale(Math.max(.05, k), 1); c.fillStyle = '#1b222b'; hexPath(c, 0, 0, S + 3); c.fill(); c.restore(); });
      // 조각
      const order = SEG.slice().sort((a, b) => (a.wing ? 1 : 0) - (b.wing ? 1 : 0));
      order.forEach((sg) => {
        const [x, y, k] = segXY(sg);
        if (k < .05) return;
        c.save(); c.translate(x, y); c.scale(Math.max(.05, k), 1);
        const shade = sg.a >= 1 ? 0 : .25 * Math.sin(SEG.indexOf(sg) * 1.7) ;
        c.fillStyle = lin(c, -S, -S, S, S, [[0, shade > 0 ? '#fff6c8' : '#fff0b0'], [.45, shade > .1 ? '#d9a63a' : '#e9b949'], [1, shade < -.1 ? '#8a5f14' : '#a8761c']]);
        hexPath(c, 0, 0, S - 2.5); c.fill();
        c.strokeStyle = 'rgba(70,45,10,.6)'; c.lineWidth = 1.5; c.stroke();
        if (k < 1) { c.fillStyle = `rgba(10,14,20,${(1 - k) * .55})`; hexPath(c, 0, 0, S - 2.5); c.fill(); }
        // 반짝임
        c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(-S * .3, -S * .35, S * .35, S * .12, -.5, 0, 7); c.fill();
        c.restore();
        if (sg.a > 0 && sg.a < 1) { c.strokeStyle = 'rgba(126,192,255,.9)'; c.lineWidth = 3; hexPath(c, x, y, S - 1); c.stroke(); }
      });
      // 작은 볼록 거울과 지지대 (앞쪽)
      c.strokeStyle = '#8a929c'; c.lineWidth = 4;
      [[-150, 160], [150, 160], [0, -175]].forEach(([dx, dy]) => { c.beginPath(); c.moveTo(CX + dx, CY + dy); c.lineTo(CX, CY - 4); c.stroke(); });
      c.fillStyle = rad(c, CX - 6, CY - 10, 2, 24, [[0, '#fff4c8'], [.6, '#d9a63a'], [1, '#8a5f14']]); c.beginPath(); c.arc(CX, CY - 4, 22, 0, 7); c.fill();
      // 비교: 허블 거울 크기
      if (st.cmp) {
        c.setLineDash([10, 8]); c.strokeStyle = '#7ec0ff'; c.lineWidth = 4; c.beginPath(); c.arc(CX, CY, 182 * 2.4 / 6.5, 0, 7); c.stroke(); c.setLineDash([]);
        c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(CX - 182 * .866, CY + 220); c.lineTo(CX + 182 * .866, CY + 220); c.stroke();
      }
      // 관측 화면 (빛이 모인 곳)
      c.fillStyle = '#05090f'; c.beginPath(); c.roundRect(DX - DR - 20, DY - DR - 20, 2 * DR + 40, 2 * DR + 40, 18); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.15)'; c.lineWidth = 2; c.stroke();
      c.save(); c.beginPath(); c.roundRect(DX - DR - 20, DY - DR - 20, 2 * DR + 40, 2 * DR + 40, 18); c.clip();
      c.globalCompositeOperation = 'lighter';
      SEG.forEach((sg) => {
        const [x, y, k] = segXY(sg); if (k < .5) return;
        const m = 1 - sg.a, px = DX + sg.off[0] * m, py = DY + sg.off[1] * m;
        c.fillStyle = rad(c, px, py, 0, 22, [[0, 'rgba(255,240,200,.85)'], [.25, 'rgba(255,220,150,.35)'], [1, 'rgba(255,210,140,0)']]);
        c.beginPath(); c.arc(px, py, 22, 0, 7); c.fill();
      });
      const ok = SEG.filter((s) => s.a >= 1).length;
      if (ok === 18) { c.fillStyle = rad(c, DX, DY, 0, 60, [[0, 'rgba(255,255,255,1)'], [.15, 'rgba(255,245,220,.8)'], [1, 'rgba(255,230,180,0)']]); c.beginPath(); c.arc(DX, DY, 60, 0, 7); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; c.beginPath(); c.moveTo(DX, DY); c.lineTo(DX + 80 * Math.cos(a), DY + 80 * Math.sin(a)); c.stroke(); } }
      c.restore(); c.globalCompositeOperation = 'source-over';
      // 옆에서 본 빛길 (오목 거울 → 볼록 거울 → 관측 장비)
      const by = 600, bx0 = 760, bx1 = 1150, xv = 1100, p = 190, A = 90, xs = 900;
      c.fillStyle = 'rgba(255,255,255,.04)'; c.beginPath(); c.roundRect(bx0 - 20, by - 125, bx1 - bx0 + 40, 250, 16); c.fill();
      const rays = [];
      for (let k = -3; k <= 3; k++) { if (!k) continue; const y = by + k * A / 3.2, x = xv - (y - by) * (y - by) / (4 * p), fx = xv - p, ty = by + (y - by) * (xs - fx) / (x - fx); rays.push([[bx0 - 10, y], [x, y], [xs, ty], [xv + 40, by]]); }
      rays.forEach((r) => { c.strokeStyle = 'rgba(255,236,170,.3)'; c.lineWidth = 2; line(c, r); c.stroke(); if (!SM.reduce) photons(c, r, t, { n: 3, r: 5, speed: 160 }); });
      c.strokeStyle = lin(c, 0, by - A, 0, by + A, [[0, '#ffe9a0'], [.5, '#d9a43a'], [1, '#a8761c']]); c.lineWidth = 8; c.beginPath();
      for (let y = by - A - 6; y <= by + A + 6; y += 2) { if (Math.abs(y - by) < 10) { c.stroke(); c.beginPath(); continue; } const x = xv - (y - by) * (y - by) / (4 * p); c.lineTo(x, y); } c.stroke();
      c.strokeStyle = '#e9b949'; c.lineWidth = 5; c.beginPath(); c.moveTo(xs + 5, by - 22); c.quadraticCurveTo(xs - 7, by, xs + 5, by + 22); c.stroke();
      c.fillStyle = '#3a4350'; c.fillRect(xv + 30, by - 20, 26, 40);
    }
    function tags() {
      TAG.clear();
      TAG.put('j1', CX, 70, '큰 거울 · 육각형 18개가 모인 <b>오목 거울</b>', 'key');
      TAG.put('j2', CX + 150, CY - 70, '작은 <b>볼록 거울</b>', '');
      TAG.put('j3', DX, 40, '관측 화면 · 별 하나를 볼 때', '');
      TAG.put('j4', 955, 470, '옆에서 본 빛길', 'soft');
      TAG.put('j5', 1100, 712, '오목 거울', 'soft'); TAG.put('j6', 880, 712, '볼록 거울', 'soft'); TAG.put('j7', 790, 560, '별빛', 'soft');
      if (st.cmp) { TAG.put('j8', CX, CY + 245, '제임스 웹 약 6.5 m', 'lt'); TAG.put('j9', CX, CY + 92, '허블 2.4 m', 'key'); }
    }
    function meter() {
      const ok = SEG.filter((s) => s.a >= 1).length, visible = st.fold < .02;
      SM.$('#mName').textContent = '맞춘 조각'; SM.$('#mBar').style.width = (ok / 18 * 100) + '%'; SM.$('#mVal').textContent = ok + ' / 18';
      return visible;
    }
    let lastAuto = 0;
    function tick(t, dt) {
      if (st.foldT !== st.fold) { const d = Math.sign(st.foldT - st.fold) * dt * .33; st.fold = Math.abs(st.foldT - st.fold) < Math.abs(d) ? st.foldT : st.fold + d; if (st.fold === st.foldT) LABS.jwst.ui(); }
      SEG.forEach((s) => { if (s.a < s.tgt) s.a = Math.min(s.tgt, s.a + dt * 1.6); });
      if (st.auto && t - lastAuto > .22) { lastAuto = t; const n = SEG.find((s) => s.tgt < 1); if (n) n.tgt = 1; else st.auto = 0; }
      meter();
    }
    function hit(x, y) {
      if (st.fold > .02) return;
      SEG.forEach((sg) => { const [sx, sy] = segXY(sg); if (Math.hypot(x - sx, y - sy) < S * .9) sg.tgt = 1; });
    }
    LABS.jwst = {
      draw, tick, tags, hit,
      ui() {
        const ctl = SM.$('#ctl'), folded = st.foldT > .5, ok = SEG.filter((s) => s.tgt >= 1).length;
        ctl.innerHTML = '';
        const b = (txt, fn, pri, dis) => { const e = document.createElement('button'); e.type = 'button'; e.className = 'btn ' + (pri ? 'primary' : 'ghost'); e.textContent = txt; e.onclick = fn; e.disabled = !!dis; ctl.appendChild(e); return e; };
        if (folded) b('① 거울 펼치기', () => { st.foldT = 0; LABS.jwst.ui(); }, true);
        else {
          b(ok < 18 ? '② 조각 모두 맞추기' : '② 조각 맞추기 끝', () => { st.auto = 1; }, ok < 18, ok >= 18 || st.fold > .02);
          b('조각 흐트러뜨리기', () => { SEG.forEach((s) => { s.a = 0; s.tgt = 0; }); st.auto = 0; }, false, st.fold > .02);
          const c = b('③ 허블과 크기 비교', () => { st.cmp = !st.cmp; c.setAttribute('aria-pressed', String(st.cmp)); tags(); }, false); c.setAttribute('aria-pressed', String(st.cmp));
          b('다시 접기', () => { st.foldT = 1; SEG.forEach((s) => { s.a = 0; s.tgt = 0; }); st.cmp = false; tags(); LABS.jwst.ui(); }, false);
        }
        SM.$('#ctlHint') && (SM.$('#ctlHint').textContent = '');

      const sp = sunPos();
      c.fillStyle = lin(c, 0, 0, 0, 740, [[0, '#7fb4dc'], [.6, '#cfe5f3'], [1, '#e9f2f7']]); c.fillRect(0, 0, 1200, 740);
      c.fillStyle = rad(c, sp[0], sp[1], 0, 90, [[0, 'rgba(255,253,235,1)'], [.3, 'rgba(255,240,170,.8)'], [1, 'rgba(255,230,150,0)']]); c.beginPath(); c.arc(sp[0], sp[1], 90, 0, 7); c.fill();
      // 먼 산
      c.fillStyle = '#a7bfb0'; c.beginPath(); c.moveTo(0, 520); c.bezierCurveTo(200, 420, 380, 470, 560, 430); c.lineTo(560, 740); c.lineTo(0, 740); c.fill();
      // 비탈
      c.fillStyle = lin(c, 0, 440, 0, 740, [[0, '#9fbf86'], [1, '#7da266']]); c.beginPath(); c.moveTo(0, 520); c.lineTo(80, 470); c.lineTo(560, 470); c.lineTo(640, 620); c.lineTo(1200, 620); c.lineTo(1200, 740); c.lineTo(0, 740); c.fill();
      c.fillStyle = '#c9c1b0'; c.fillRect(560, 620, 640, 120);
      res = HEL.map((h, i) => trace(h, i));
      // 빛줄기
      res.forEach((r) => { c.strokeStyle = r.ok ? 'rgba(255,214,90,.55)' : 'rgba(255,214,90,.28)'; c.lineWidth = 2.4; line(c, r.p); c.stroke(); if (!SM.reduce) photons(c, r.p, t, { n: 7, r: 7, speed: 300, color: '255,238,170' }); });
      // 오목 거울 건물 (옆 모습)
      c.fillStyle = lin(c, XV - 40, 0, 1200, 0, [[0, '#d8dde3'], [1, '#9aa4ae']]); c.fillRect(XV - 6, YC - A - 30, 1200 - XV + 6, A * 2 + 320);
      c.strokeStyle = lin(c, 0, YC - A, 0, YC + A, [[0, '#f4f8fb'], [.5, '#a9b6c3'], [1, '#e3eaf0']]); c.lineWidth = 12; c.beginPath();
      if (st.concave) { for (let y = YC - A; y <= YC + A; y += 3) { const x = XV - (y - YC) * (y - YC) / (4 * P); y === YC - A ? c.moveTo(x, y) : c.lineTo(x, y); } }
      else { c.moveTo(XV - 60, YC - A); c.lineTo(XV - 60, YC + A); }
      c.stroke();
      // 빛이 모이는 곳 (탑)
      c.fillStyle = '#6b7480'; c.fillRect(FX - 14, YC + 22, 28, 620 - YC - 22); c.fillStyle = '#4b535d'; c.beginPath(); c.roundRect(FX - 34, YC - 22, 68, 44, 8); c.fill();
      const k = res.filter((r) => r.ok).length / HEL.length;
      if (k > 0) { const pu = .85 + .15 * Math.sin(t * 6); c.fillStyle = rad(c, FX, YC, 0, 30 + 90 * k * pu, [[0, 'rgba(255,255,255,1)'], [.2, `rgba(255,230,150,${.5 + .5 * k})`], [1, 'rgba(255,190,90,0)']]); c.beginPath(); c.arc(FX, YC, 30 + 90 * k, 0, 7); c.fill(); }
      // 평면거울 (받침대 위)
      res.forEach((r, i) => {
        const h = HEL[i], n = r.n || mirN(h[0], h[1], sunDir()), tx = -n[1], ty = n[0];
        c.strokeStyle = '#5b636d'; c.lineWidth = 5; c.beginPath(); c.moveTo(h[0], h[1]); c.lineTo(h[0], h[1] - 14); c.stroke();
        c.strokeStyle = '#2b3138'; c.lineWidth = 9; c.beginPath(); c.moveTo(h[0] - tx * 26 - n[0] * 3, h[1] - 14 - ty * 26 - n[1] * 3); c.lineTo(h[0] + tx * 26 - n[0] * 3, h[1] - 14 + ty * 26 - n[1] * 3); c.stroke();
        c.strokeStyle = '#e6f1fa'; c.lineWidth = 4; c.beginPath(); c.moveTo(h[0] - tx * 26, h[1] - 14 - ty * 26); c.lineTo(h[0] + tx * 26, h[1] - 14 + ty * 26); c.stroke();
      });
    }
    function tags() {
      TAG.clear();
      TAG.put('s1', 300, 680, '방향을 바꾸는 <b>평면거울</b>(실제 63장)', 'lt');
      TAG.put('s2', XV - 40, YC - A - 52, st.concave ? '건물 벽 전체가 <b>오목 거울</b>' : '평평한 벽 거울', 'key');
      TAG.put('s3', FX, YC + 70, '빛이 모이는 곳', 'lt');
    }
    function tick() {
      const k = res.length ? res.filter((r) => r.ok).length / HEL.length : 0;
      SM.$('#mName').textContent = '모인 햇빛'; SM.$('#mBar').style.width = (k * 100) + '%';
      SM.$('#mVal').textContent = k > .99 ? '약 3,400 °C' : k > .5 ? '아주 뜨거움' : k > 0 ? '조금 따뜻함' : '모이지 않음';
    }
    LABS.sun = {
      draw, tick, tags, hit() {},
      ui() {
        const ctl = SM.$('#ctl'); ctl.innerHTML = '';
        const l = document.createElement('label'); l.className = 'rng'; l.innerHTML = '<span>해의 위치</span><input type="range" min="0" max="1" step="0.01" aria-label="해의 위치">';
        const r = l.querySelector('input'); r.value = st.sun; r.oninput = () => { st.sun = +r.value; }; ctl.appendChild(l);
        const b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'btn ' + (st.auto ? 'primary' : 'ghost'); b1.textContent = st.auto ? '평면거울이 해를 따라 움직임' : '평면거울 고정됨';
        b1.onclick = () => { st.auto = !st.auto; st.fixedAt = st.sun; fixedN.fill(null); LABS.sun.ui(); }; ctl.appendChild(b1);
        const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn ghost'; b2.textContent = st.concave ? '오목 거울 → 평평한 벽 거울' : '평평한 벽 → 오목 거울'; b2.setAttribute('aria-pressed', String(!st.concave));
        b2.onclick = () => { st.concave = !st.concave; tags(); LABS.sun.ui(); }; ctl.appendChild(b2);
      },
      panel: `<div class="stepname"><span class="no">3</span><div><h2>햇빛을 한 점에 모으는 태양로</h2><small>프랑스 오데이요 태양로를 옆에서 본 모형</small></div></div>
        <div class="phase"><div class="ph on"><i>1</i><span><b>해의 위치</b>를 움직여 봐요. 평면거울이 해를 따라 각도를 바꿔, 반사된 빛을 늘 오목 거울 쪽으로 나란하게 보내요.</span></div>
        <div class="ph on"><i>2</i><span><b>평면거울 고정됨</b>을 누르고 해를 움직이면? 반사된 빛의 방향이 바뀌어 빛이 잘 모이지 않아요.</span></div>
        <div class="ph on"><i>3</i><span>오목 거울을 <b>평평한 벽 거울</b>로 바꾸면 빛이 한 점에 모일까요?</span></div></div>
        <ul class="facts">
          <li>산비탈의 거울 <b>63장</b>이 햇빛을 반사해 보내면, 건물 벽 하나 전체가 <b>오목 거울</b>(높이 40 m, 너비 54 m)이 되어 그 빛을 지름 약 80 cm 안에 모아요. 모인 곳의 온도는 약 <b>3,400 °C</b>예요.<span class="src">출처: 프랑스 국립과학연구센터(CNRS)</span></li>
          <li>평면거울은 빛의 <b>방향을 바꾸고</b>, 오목 거울은 빛을 <b>한 점에 모아요</b>. 두 거울이 한 장치에서 서로 다른 일을 해요.</li>
          <li>두바이의 태양열 발전소는 해를 따라 움직이는 거울 약 <b>7만 장</b>으로 높이 약 262 m 탑에 햇빛을 모아요. 우리나라 대구에도 2011년 거울 450장으로 연구용 태양열 탑을 지었어요.<span class="src">출처: Noor Energy 1, 매일신문(2011)</span></li>
        </ul>
        <div class="think" data-q="0"></div>`,
      q: [{ q: '태양로에서 평면거울과 오목 거울은 각각 어떤 일을 할까요?', o: ['평면거울은 빛의 방향을 바꾸고, 오목 거울은 빛을 한 점에 모은다', '평면거울은 빛을 모으고, 오목 거울은 빛을 퍼뜨린다', '둘 다 빛을 흡수해 뜨거워진다'], a: 0, ex: '평면거울은 물체의 모습을 그대로 비추듯 빛을 <b>그대로 반사</b>해 방향만 바꿔요. 나란한 빛을 <b>한 점에 모으는</b> 것은 오목 거울이에요.' }],
      reset() {},
    };
    if (SM.Q.get('sun')) st.sun = +SM.Q.get('sun');
    if (SM.Q.get('fixed') === '1') { st.auto = false; st.fixedAt = .1; }
    if (SM.Q.get('flatwall') === '1') st.concave = false;
  } catch (e) { window.SM_err('태양로 실험', e); }
})();
</script>

<script>
/* ===== 실험실 공통: 탭, 그리기 반복, 생각 문제 ===== */
(() => {
  try {
    const { $, $$, Q } = SM, cv = $('#cv'), c = cv.getContext('2d');
    let cur = Q.get('lab') && LABS[Q.get('lab')] ? Q.get('lab') : 'jwst', last = performance.now(), t = 0;
    function think(lab) {
      $$('.think', $('#panel')).forEach((box) => {
        const q = lab.q[+box.dataset.q];
        box.innerHTML = `<p>생각해 보기 · ${q.q}</p><div class="opts"></div><div class="fbk" hidden></div>`;
        const o = box.querySelector('.opts'), fb = box.querySelector('.fbk');
        q.o.forEach((txt, n) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.innerHTML = `<span class="k">${n + 1}</span><span>${txt}</span>`;
          b.onclick = () => { const ok = n === q.a; b.classList.add(ok ? 'right' : 'wrong'); fb.hidden = false; fb.className = 'fbk ' + (ok ? 'ok' : 'no'); fb.innerHTML = ok ? '<b class="t">맞아요.</b>' + q.ex : '<b class="t">다시 생각해 봐요.</b>그림을 다시 움직여 확인해 봐요.'; if (ok) $$('.opt', o).forEach((x) => { x.disabled = true; }); };
          o.appendChild(b); });
      });
    }
    function go(id) {
      cur = id; const lab = LABS[id];
      $$('#seg button').forEach((b) => { b.setAttribute('aria-selected', String(b.dataset.lab === id)); if (b.dataset.lab === id) b.classList.add('seen'); });
      $('#panel').innerHTML = lab.panel; think(lab); lab.ui(); lab.tags();
    }
    $$('#seg button').forEach((b) => { b.onclick = () => go(b.dataset.lab); });
    cv.addEventListener('pointerdown', (e) => { const r = cv.getBoundingClientRect(); LABS[cur].hit((e.clientX - r.left) / r.width * 1200, (e.clientY - r.top) / r.height * 740); });
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
      try { LABS[cur].tick(t, dt); LABS[cur].draw(c, t); } catch (e) { window.SM_err('그리기', e); return; }
      requestAnimationFrame(frame);
    }
    go(cur); requestAnimationFrame(frame);
    window.SM.okUI = true;
  } catch (e) { window.SM_err('실험실', e); }
})();
</script>
