<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지구 환경에 영향을 미치는 물질</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ps.css@@*/
/*@@LOCAL:_css_sim.css@@*/
/*@@LOCAL:_css_pf.css@@*/
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mm button{min-height:50px;border-radius:12px;border:2px solid #d4dee8;background:#fff;font-weight:800;font-size:14px;cursor:pointer;word-break:keep-all;line-height:1.2;padding:2px}.mm button[aria-pressed="true"]{border-color:#0e63b3;background:#e9f3fd;color:#0b3f73}
.iu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px;font-size:15px;line-height:1.55;word-break:keep-all}.iu>div{border-radius:14px;padding:10px 14px;border:1px solid #dbe4ed;background:#f7fafc}.iu b{display:block;font-size:13.5px;color:#0b3f73}
.vw{display:flex;flex-direction:column}
.ftxt{font-size:34px;font-weight:800;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl"><span class="eyebrow">과학과 나</span><h1>지구 환경에 영향을 미치는 물질</h1>
    <p class="sub">물질을 골라 입자 모형을 보고, 원소인지 화합물인지 구분한 뒤 조사 내용을 정리해요.</p></div></header>
  <div class="stage">
    <section class="card viewer vw">
      <div class="scene grow" id="fig" role="img" aria-label="고른 물질의 분자 모형과 화학식."></div>
      <div class="iu"><div><b>이로운 영향의 예</b><span id="gd"></span></div><div><b>해로운 영향의 예</b><span id="bd"></span></div></div>
    </section>
    <section class="card pad">
      <div class="ptabs" role="tablist" id="pt"><button type="button" role="tab" data-p="lab" aria-selected="true">구분하기</button><button type="button" role="tab" data-p="rec" aria-selected="false">조사 정리</button><button type="button" role="tab" data-p="peer" aria-selected="false">돌아보기</button></div>
      <div class="pane" data-p="lab">
        <div class="seglbl">물질 고르기</div><div class="mm" id="mm"></div>
        <div class="seglbl" style="margin-top:8px">이 물질은?</div><div class="seg3" id="kd"><button type="button" data-v="e" aria-pressed="false">원소</button><button type="button" data-v="c" aria-pressed="false">화합물</button></div>
        <div class="fbk" id="res"><b class="t" id="resT">결과</b><span id="resM"></span></div>
        <p class="mnote">이로운 영향과 해로운 영향은 조사를 돕는 예시예요. 믿을 만한 누리집에서 직접 찾아 봐요.</p>
      </div>
      <div class="pane" data-p="rec" hidden>
        <textarea class="fbtxt" id="f1" rows="1" placeholder="우리 모둠이 고른 물질과 화학식"></textarea>
        <textarea class="fbtxt" id="f2" rows="3" placeholder="이로운 영향"></textarea>
        <textarea class="fbtxt" id="f3" rows="3" placeholder="해로운 영향"></textarea>
        <textarea class="fbtxt" id="f4" rows="2" placeholder="원소인지 화합물인지와 그 까닭"></textarea>
        <button class="btn ghost" id="cp" type="button" style="width:100%;margin-top:6px">정리 복사하기</button>
      </div>
      <div class="pane" data-p="peer" hidden><div class="peer"><label><input type="checkbox"><span>지구 환경에 영향을 주는 물질을 옳게 판단하였는가?</span></label><label><input type="checkbox"><span>물질의 화학식을 옳게 표현하고, 원소와 화합물을 옳게 구분하였는가?</span></label><label><input type="checkbox"><span>물질을 구분하는 토의에 적극적으로 참여하였는가?</span></label></div></div>
    </section>
  </div>
</div>
<script>
/*@@LOCAL:_ps.js@@*/
</script>
<script>
(() => {
  'use strict';
  try {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const { el, grad, stage, f1 } = PS; PS.defs();
    const C = { O: ['#ff9a8a', '#e5533f', '#b5301f', 48], C: ['#7c8590', '#3b424a', '#1f252b', 50], N: ['#8fb7ee', '#3f6fc4', '#274a8f', 48] };
    const G = {}; const g = (k) => (G[k] = G[k] || grad([[0, C[k][0]], [.55, C[k][1]], [1, C[k][2]]], { r: 1, cx: .36, cy: .3, rr: .85 }));
    const M = {
      co2: { n: '이산화 탄소', f: 'CO<sub>2</sub>', a: [['C', 0, 0], ['O', -92, 0], ['O', 92, 0]], k: 'c', gd: '식물이 광합성을 할 때 쓰여요.', bd: '많아지면 지구 온난화에 영향을 줘요.', why: '탄소와 산소, 두 종류의 입자로 이루어져 있어요.' },
      o3: { n: '오존', f: 'O<sub>3</sub>', a: [['O', 0, -40], ['O', -84, 30], ['O', 84, 30]], k: 'e', gd: '높은 하늘에서 해로운 자외선을 막아 줘요.', bd: '지표 가까이에 많으면 호흡기에 해로워요.', why: '산소 한 종류의 입자로만 이루어져 있어요.' },
      n2o: { n: '아산화 질소', f: 'N<sub>2</sub>O', a: [['N', -96, 0], ['N', 0, 0], ['O', 98, 0]], k: 'c', gd: '질소는 작물이 자라는 데 필요한 성분이에요.', bd: '비료를 지나치게 쓰면 나오는 온실 기체예요.', why: '질소와 산소, 두 종류의 입자로 이루어져 있어요.' },
    };
    const ST = stage($('#fig'), [0, 0, 1000, 520]), root = el('g', null, ST.svg); ST.svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    el('rect', { x: -200, width: 1400, height: 520, fill: grad([[0, '#d9eefb'], [1, '#f8fcfe']]) }, root);
    el('path', { d: 'M-200 470Q200 420 520 450T1200 430V520H-200Z', fill: grad([[0, '#9cc97a'], [1, '#6fa24f']]) }, root);
    const lay = el('g', null, root), nm = ST.label(500, 56, '', 'big'), fm = ST.label(500, 372, '');
    fm.e.style.fontSize = 'clamp(26px,4vw,42px)'; fm.e.style.fontWeight = '800';
    let cur = 'co2';
    const say = (t, m, c = '') => { $('#res').className = 'fbk ' + c; $('#resT').textContent = t; $('#resM').innerHTML = m; };
    const draw = () => { const X = M[cur]; lay.innerHTML = ''; X.a.forEach(([k, x, y]) => { const a = el('g', { transform: `translate(${500 + x * 1.35} ${215 + y * 1.35})` }, lay); el('circle', { r: C[k][3] * 1.15, fill: g(k), stroke: C[k][2] }, a); const t = el('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 32, 'font-weight': 800, fill: '#fff', style: 'font-family:Pretendard,sans-serif' }, a); t.textContent = k; }); nm.set(X.n); fm.set(X.f); $('#gd').textContent = X.gd; $('#bd').textContent = X.bd; $$('#mm button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === cur))); $$('#kd button').forEach((b) => b.setAttribute('aria-pressed', 'false')); say('결과', '입자 모형을 보고 원소인지 화합물인지 골라요.'); };
    $('#mm').innerHTML = Object.entries(M).map(([k, x]) => `<button type="button" data-k="${k}">${x.n}</button>`).join('');
    $$('#mm button').forEach((b) => b.addEventListener('click', () => { cur = b.dataset.k; draw(); }));
    $$('#kd button').forEach((b) => b.addEventListener('click', () => { $$('#kd button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); const X = M[cur], ok = b.dataset.v === X.k; say(ok ? (X.k === 'e' ? '원소예요' : '화합물이에요') : '다시 봐요', ok ? X.why : '모형에 몇 종류의 원자가 있는지 세어 봐요.', ok ? 'ok' : 'no'); }));
    draw();
    $('#cp').addEventListener('click', async () => { const b = $('#cp'), t = ['물질과 화학식', '이로운 영향', '해로운 영향', '구분과 까닭'].map((n, i) => `[${n}]\n${$('#f' + (i + 1)).value}`).join('\n\n'); try { await navigator.clipboard.writeText(t); b.textContent = '복사했어요'; } catch (e) { b.textContent = '칸을 길게 눌러 복사해요'; } setTimeout(() => { b.textContent = '정리 복사하기'; }, 2000); });
    const tab = (p) => { $$('#pt button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.p === p))); $$('.pane').forEach((e) => { e.hidden = e.dataset.p !== p; }); };
    $$('#pt button').forEach((b) => b.addEventListener('click', () => tab(b.dataset.p)));
    const q = new URLSearchParams(location.search); if (q.get('tab')) tab(q.get('tab'));
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('지구 환경 물질', err); }
})();
</script>
</body>
</html>
