<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원소 – 사진 찍기용 3D</title>
<style>html,body{margin:0;background:transparent}#fig{width:100vw;height:100vh}#fig canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<div id="fig"></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
window.THREE = THREE;
/*@@LOCAL:_el3.js@@*/
/*@@LOCAL:_el3obj.js@@*/
/* 사진 찍기: ?k=ob-<물체> | sm-<원소> | pm-<입자 모형>  → window.__shot() 이 PNG 주소를 돌려줌 */
(() => {
  const host = document.getElementById('fig'), q = new URLSearchParams(location.search), k = q.get('k') || 'ob-balloon';
  const [kind, id] = [k.slice(0, 2), k.slice(3)];
  const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = kind === 'pm' ? 1.05 : 1.0;
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.setClearColor(0x000000, 0);
  host.appendChild(R.domElement);
  const W = innerWidth, H = innerHeight; R.setSize(W, H, false);
  const scene = new THREE.Scene(); if (kind !== 'pm') scene.background = new THREE.Color('#ffffff');
  const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(new RoomEnvironment(R), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa8b8, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(-3, 8, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); sun.shadow.bias = -0.0005; scene.add(sun);
  const cam = new THREE.PerspectiveCamera(26, W / H, 0.05, 200);
  let obj;
  if (kind === 'pm') { const m = EL3.model(id); obj = m.group; if (m.tick) for (let i = 0; i < 90; i++) m.tick(1 / 60); const w = new THREE.Group(); w.add(obj); w.rotation.set(+(q.get('rx') || 0.25), +(q.get('ry') || 0.5), 0); obj = w; }
  else obj = EL3.obj(id);
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj), ctr = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  if (kind !== 'pm') { const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.22 })); fl.rotation.x = -Math.PI / 2; fl.position.y = box.min.y; fl.receiveShadow = true; scene.add(fl); sun.target.position.copy(ctr); scene.add(sun.target); }
  const el = kind === 'pm' ? 0.18 : +(q.get('el') || 0.42), az = +(q.get('az') || 0.35);
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  // 물체가 칸에 꽉 차도록 거리 찾기
  const pts = []; for (let i = 0; i < 8; i++) pts.push(new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z));
  const lim = 1 / +(q.get('m') || 1.12); let lo = 0.5, hi = 100;
  for (let t = 0; t < 30; t++) { const d = (lo + hi) / 2; cam.position.copy(ctr).addScaledVector(dir, d); cam.lookAt(ctr); cam.updateMatrixWorld(); const ok = pts.every((p) => { const c = p.clone().project(cam); return Math.abs(c.x) <= lim && Math.abs(c.y) <= lim; }); if (ok) hi = d; else lo = d; }
  cam.position.copy(ctr).addScaledVector(dir, hi); cam.lookAt(ctr);
  R.render(scene, cam);
  window.__shot = () => { R.render(scene, cam); return R.domElement.toDataURL('image/png'); };
  window.__ready = true; void sz; void OrbitControls;
})();
</script>
</body>
</html>
