<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자어 4단계 공부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!--@@PART:errbox_sim.html@@-->
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_hanja.css@@*/
  .app{max-width:1080px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .top h1{margin-top:8px}
  .view{display:none}
  body.learning .top h1,body.learning .top .sub{display:none}
  body.learning .top{align-items:center}
  .view.on{display:flex;flex-direction:column;gap:12px}
  .rise{animation:rise .5s var(--ease) both}
  @keyframes rise{from{transform:translateY(14px)}to{transform:none}}

  /* ── 시작 화면 ── */
  .st-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .st-unit{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
  .st-unit .no{display:grid;place-items:center;min-width:40px;height:40px;padding:0 8px;border-radius:12px;background:var(--hz);color:#fff;font-size:16px}
  .st-unit small{display:block;font-size:13px;color:var(--muted);font-weight:700}
  .quick{display:flex;gap:6px}
  .quick button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--ink2);cursor:pointer}
  .lsn-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .lsn-pick button{min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .lsn-pick button[aria-pressed="true"]{border-color:var(--hz);background:var(--hz-soft);color:var(--hz-ink)}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .wc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:104px;padding:14px 8px 12px;border-radius:16px;border:1.5px solid var(--line);background:#f7fafc;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
  .wc:active{transform:scale(.97)}
  .wc b{font-size:20px;letter-spacing:-.01em}
  .wc .han{font-size:17px;color:var(--muted);font-weight:600}
  .wc .ck{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;border:2px solid #c9d5e1;background:#fff;display:grid;place-items:center}
  .wc[aria-pressed="true"]{border-color:var(--hz);background:#fff;box-shadow:0 0 0 3px rgba(75,63,181,.10)}
  .wc[aria-pressed="true"] .ck{background:var(--hz);border-color:var(--hz)}
  .wc[aria-pressed="true"] .han{color:var(--hz-ink)}
  .steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
  .s4{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#f7fafc}
  .s4 i{flex:none;font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--hz);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
  .s4 b{display:block;font-size:15px}
  .s4 span{display:block;font-size:13.5px;color:var(--muted);line-height:1.5;word-break:keep-all}
  .big{min-height:56px;font-size:17px;width:100%;margin-top:12px}

  /* ── 학습 화면 공통 ── */
  .lbar{display:flex;align-items:center;gap:14px;padding:10px 14px;flex-wrap:wrap}
  .lprog{flex:1;min-width:180px}
  .lprog .t{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--ink2)}
  .lprog .t span{color:var(--muted);font-weight:700}
  .lprog .prog{margin-top:6px}
  .lprog .prog i{transition:width .5s var(--ease)}
  .flow4{display:grid;grid-template-columns:repeat(4,minmax(74px,1fr));gap:6px;flex:1.4;min-width:300px}
  .flow4 .fs{cursor:default;min-height:48px}
  .flow4 .fs.skip{opacity:.45;text-decoration:line-through}
  .stagec{padding:20px 22px 22px}
  .s-tag{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--hz-ink);background:var(--hz-soft);border-radius:999px;padding:5px 12px 5px 5px}
  .s-tag i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--hz);color:#fff;display:grid;place-items:center;font-size:12.5px}
  .s-tag small{font-weight:700;color:var(--muted);font-size:13px}
  .ask{font-size:18px;font-weight:800;margin:16px 0 10px;text-align:center;word-break:keep-all}
  .lead{font-size:18px;line-height:1.7;margin:12px 0 4px;word-break:keep-all}

  /* 1단계 */
  .hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 6px}
  .w-big{font-size:clamp(46px,7vw,68px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
  .w-han{display:flex;gap:8px;margin-top:6px}
  .w-han .tile{--ts:54px}
  .chk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .cb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:120px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;transition:border-color .2s,transform .15s}
  .cb:active{transform:scale(.98)}
  .cb .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
  .cb b{font-size:16px;word-break:keep-all}
  .cb small{font-size:13.5px;color:var(--muted);line-height:1.5;word-break:keep-all}
  .cb.c0 .mk{background:#e5f5ec;color:#11703f}.cb.c0:hover{border-color:#8fd0ab}
  .cb.c1 .mk{background:#fff4dc;color:#8a5a00}.cb.c1:hover{border-color:#efcf86}
  .cb.c2 .mk{background:var(--hz-soft);color:var(--hz-ink)}.cb.c2:hover{border-color:#b9b2ee}

  /* 2단계 */
  .split{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,3vw,30px);padding:18px 0 8px;flex-wrap:wrap}
  /* 붙어 있던 글자 칸이 한 글자씩 벌어지고, 뜻이 아래에서 올라온다 */
  .sp{display:flex;flex-direction:column;align-items:center;gap:8px;animation:spread 1.1s cubic-bezier(.3,.9,.25,1) both;animation-delay:.45s}
  @keyframes spread{from{transform:translateX(var(--dx,0)) scale(.92)}to{transform:none}}
  .sp .hun{animation:hunUp .6s var(--ease) both;animation-delay:1.25s}
  @keyframes hunUp{from{transform:translateY(-34px) scale(.8)}to{transform:none}}
  .plus{animation:plusIn .5s var(--ease) both;animation-delay:1.1s}
  @keyframes plusIn{from{transform:scale(0)}to{transform:none}}
  .sp .sy{font-size:30px;font-weight:900}
  .sp .tile{--ts:92px}
  .sp .hun{font-size:15px;font-weight:800;color:var(--hz-ink);text-align:center;word-break:keep-all;max-width:120px}
  .plus{align-self:center;font-size:26px;font-weight:300;color:#a3b1bf;margin-bottom:34px}
  .ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:14px}
  .cc{display:flex;gap:14px;padding:14px;border-radius:16px;background:#f7fafc;border:1px solid var(--line)}
  .cc .tile{--ts:62px}
  .cc .hd{font-size:17px;font-weight:800}
  .cc .hd small{font-weight:700;color:var(--muted);font-size:14px;margin-left:4px}
  .cc .lab{font-size:13px;color:var(--muted);font-weight:700;margin:6px 0 6px}
  .exs{display:flex;flex-wrap:wrap;gap:6px}
  .ex{display:inline-flex;align-items:baseline;gap:5px;padding:6px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:15px;font-weight:700}
  .ex .han{font-size:13.5px;color:var(--muted);font-weight:600}
  .ex .em-sh{font-weight:900}

  /* 3단계·4단계 선택지 */
  .infer-q{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px;font-size:20px;font-weight:800;word-break:keep-all}
  .infer-q .w{font-size:34px;font-weight:900}
  .infer-q .han{font-size:22px;color:var(--hz-ink)}
  .hints{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
  .hints span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:12px;background:var(--hz-soft);font-size:14px;font-weight:800;color:var(--hz-ink)}
  .hints .tile{--ts:30px;border-radius:8px;box-shadow:none}
  .hints em{font-style:normal;color:#a3b1bf;font-weight:400}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16.5px;font-weight:700;line-height:1.5;cursor:pointer;word-break:keep-all;transition:border-color .2s,background .2s}
  .opt i{flex:none;font-style:normal;width:30px;height:30px;border-radius:50%;background:#eef3f8;color:#607285;display:grid;place-items:center;font-weight:900;font-size:14px}
  .opt:not(:disabled):hover{border-color:#b9b2ee}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--ok);background:#ecf8f1}.opt.ok i{background:var(--ok);color:#fff}
  .opt.no{border-color:var(--no);background:#fdf1f0}.opt.no i{background:var(--no);color:#fff}
  .opt.dim{opacity:.55}
  .fb{margin-top:12px;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.7;word-break:keep-all;animation:rise .4s var(--ease) both}
  .fb.ok{background:#ecf8f1;border:1px solid #c6e8d4;color:#0f5a36}
  .fb.no{background:#fff8e6;border:1px solid #f3dc9a;color:#5b4300}
  .fb .r{font-weight:900;font-size:17px;display:block;margin-bottom:2px}
  .ety{margin-top:10px;border-radius:14px;padding:12px 14px;background:#fff;border:1px solid var(--hz-line);color:var(--ink2);font-size:15.5px;line-height:1.75}
  .ety b.t{display:block;font-size:13px;color:var(--hz-ink);margin-bottom:2px}
  .ety em{font-style:normal;font-family:var(--han);font-weight:700;color:var(--hz-ink);background:var(--hz-soft);border-radius:6px;padding:0 4px}
  .next{margin-top:14px;width:100%;min-height:54px;font-size:16.5px}

  /* 4단계 */
  .knew{margin-top:12px;border-radius:14px;padding:10px 14px;background:#ecf8f1;border:1px solid #c6e8d4;color:#0f5a36;font-weight:700;font-size:15px;word-break:keep-all}
  .rv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:16px}
  .rvw{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:18px;background:#f7fafc;border:1px solid var(--line)}
  .rvw.to{background:#fff;border:1.5px solid var(--sh-line);box-shadow:0 8px 22px rgba(138,69,21,.08)}
  .rvw .lb2{font-size:12.5px;font-weight:800;color:var(--muted)}
  .rvw .w{font-size:clamp(28px,4.4vw,40px);font-weight:900;letter-spacing:-.01em}
  .rvw .ts{display:flex;gap:5px}
  .rvw .tile{--ts:44px}
  .rv .arr{color:#c4703a}
  .shb{display:flex;justify-content:center;margin-top:10px}
  .shb span{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--sh-soft);border:1px solid var(--sh-line);color:var(--sh-ink);font-weight:800;font-size:15px}
  .shb .tile{--ts:30px;border-radius:50%;box-shadow:none}

  /* ── 완료 화면 ── */
  .done-top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .ring{position:relative;width:140px;height:140px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .v b{font-size:34px;font-weight:900;line-height:1}
  .ring .v small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
  .done-top h2{margin:0;font-size:24px}
  .done-top p{margin:6px 0 0;color:var(--muted);font-size:15.5px;word-break:keep-all}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .stat{padding:12px 14px;border-radius:14px;background:#f7fafc;border-left:5px solid var(--c)}
  .stat b{display:block;font-size:28px;font-weight:900;color:var(--c)}
  .stat span{font-size:14px;font-weight:700;color:var(--ink2)}
  .sec{font-size:15px;font-weight:800;color:var(--ink2);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .sec small{font-weight:700;color:var(--muted);font-size:13px}
  .wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .wl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:#f7fafc;font-weight:800;font-size:15.5px}
  .wl .han{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:4px}
  .chip{flex:none;font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px}
  .chip.k{background:#e5f5ec;color:#11703f}.chip.r{background:#e3f3f6;color:#1f6672}.chip.l{background:var(--hz-soft);color:var(--hz-ink)}.chip.w{background:#fdecea;color:#a1302a}
  .mg{position:relative;border-radius:16px;background:linear-gradient(#fbfcfe,#eef3f8);border:1px solid var(--line);overflow:hidden}
  .mg svg{display:block;width:100%;height:auto}
  .mg .node{cursor:pointer}
  .mg .hint{position:absolute;left:10px;top:10px}
  .acts2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .acts2 .btn{min-height:54px}

  /* ── 관계망 겹침 화면 ── */
  .gov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .45s var(--ease);visibility:hidden}
  .gov.on{transform:none;visibility:visible}
  .gov-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .gov-bar b{font-size:16px}
  .gov iframe{flex:1;width:100%;border:0}

  @media (max-width:900px){
    .steps4{grid-template-columns:1fr 1fr}
    .chk{grid-template-columns:1fr}
    .cb{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap}
    .cb small{flex-basis:100%}
    .rv{grid-template-columns:1fr}
    .rv .arr{transform:rotate(90deg);justify-self:center}
    .acts2{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr 1fr}
    .sp .tile{--ts:80px}
  }
  @media (max-width:560px){.steps4{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <span class="eyebrow">교과서 한자어 · 4단계 공부</span>
      <h1>글자를 나누면 뜻이 보여요</h1>
      <p class="sub">과학 낱말을 한자 한 글자씩 나눠 보고, 뜻을 스스로 짐작한 뒤 같은 글자가 든 낱말로 넓혀 가요.</p>
    </div>
    <button class="btn ghost" id="openGraph" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="7" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="13" cy="18" r="3"/><path d="M8.6 8.6l2.8 6.8M15.5 7.8l-1.6 7.4M9 7l6-1"/></svg>
      한자 관계망
    </button>
  </div>

  <!-- 시작 -->
  <section class="view on" id="vStart">
    <div class="card pad rise">
      <div class="lsn-pick" id="lsnPick" hidden></div>
      <div class="st-head">
        <div class="st-unit"><span class="no" id="stNo">Ⅱ</span><span><span id="stName">암석의 종류</span><small id="stSub">오늘 공부할 낱말을 골라요</small></span></div>
        <div class="quick"><button type="button" data-q="all">모두 고르기</button><button type="button" data-q="none">모두 빼기</button></div>
      </div>
      <div class="wgrid" id="wgrid"></div>
      <div class="steps4">
        <div class="s4"><i>1</i><div><b>자기점검</b><span>이 낱말을 아는지 솔직하게 골라요</span></div></div>
        <div class="s4"><i>2</i><div><b>한자 풀이</b><span>한 글자씩 나눠 뜻과 소리를 살펴요</span></div></div>
        <div class="s4"><i>3</i><div><b>뜻 추론</b><span>글자 뜻을 합쳐 낱말의 뜻을 짐작해요</span></div></div>
        <div class="s4"><i>4</i><div><b>어휘 넓히기</b><span>같은 글자가 든 낱말의 뜻도 풀어 봐요</span></div></div>
      </div>
      <button class="btn primary big" id="goStart" type="button">공부 시작하기</button>
    </div>
  </section>

  <!-- 학습 -->
  <section class="view" id="vLearn">
    <div class="card lbar">
      <div class="lprog"><div class="t"><b id="lpWord">1 / 10</b><span id="lpStep">자기점검</span></div><div class="prog"><i id="lpFill"></i></div></div>
      <div class="flow4" id="flow4">
        <div class="fs" data-s="0"><b>1</b>자기점검</div>
        <div class="fs" data-s="1"><b>2</b>한자 풀이</div>
        <div class="fs" data-s="2"><b>3</b>뜻 추론</div>
        <div class="fs" data-s="3"><b>4</b>어휘 넓히기</div>
      </div>
    </div>
    <div class="card stagec" id="stageC"></div>
  </section>

  <!-- 완료 -->
  <section class="view" id="vDone">
    <div class="card pad rise" id="doneC"></div>
  </section>
</div>

<div class="gov" id="gov" aria-hidden="true">
  <div class="gov-bar"><b>한자 관계망</b><button class="btn ghost" id="govClose" type="button">닫고 공부로 돌아가기</button></div>
  <iframe id="govFrame" title="한자 관계망" src="about:blank"></iframe>
</div>

<script>
/*@@LOCAL:_words.js@@*/
</script>

<script>
/* ───── 상태와 도구 ───── */
window.SM = window.SM || {};
const DATA = window.HANJA_DATA || { words: [], lessons: {} };
const BY = {}; DATA.words.forEach(w => { BY[w.word] = w; });
const Q = new URLSearchParams(location.search);
const STEP = ['자기점검', '한자 풀이', '뜻 추론', '어휘 넓히기'];
const S = { lesson: null, pool: [], picked: new Set(), words: [], i: 0, step: 0, rv: 0, sc: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// 받침 따라 조사 고르기
const josa = (w, a, b) => { const c = String(w).charCodeAt(String(w).length - 1); return (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28) ? a : b; };
const tiles = (h, sh, ts) => [...h].map(c => `<span class="tile${c === sh ? ' sh' : ''}"${ts ? ` style="--ts:${ts}px"` : ''}>${esc(c)}</span>`).join('');
// 낱말 안에서 공유 한자 자리의 한글 음절 강조
function emWord(word, hanja, sh) {
  const k = [...hanja].indexOf(sh), s = [...word];
  if (k < 0 || k >= s.length || s.length !== [...hanja].length) return esc(word);
  return s.map((c, i) => i === k ? `<span class="em-sh">${esc(c)}</span>` : esc(c)).join('');
}
function mix(choices, ans) { const t = choices[ans], m = shuffle(choices); return { c: m, a: m.indexOf(t) }; }
function charOf(w, ch) { return (w.chars || []).find(c => c.char === ch); }
</script>

<script>
/* ───── 시작 화면: 수업 고르기와 낱말 고르기 ───── */
try {
  const lessonKeys = Object.keys(DATA.lessons);
  function setLesson(k) {
    S.lesson = k;
    const L = DATA.lessons[k];
    const unitNo = (L.unit || '').split(' ')[0] || '';
    $('stNo').textContent = unitNo;
    $('stName').textContent = (L.unit ? L.unit.replace(unitNo, '').trim() + ' · ' : '') + L.title;
    S.pool = L.words.map(w => BY[w]).filter(Boolean);
    S.picked = new Set(S.pool.map((_, i) => i));
    renderGrid();
    document.querySelectorAll('#lsnPick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  }
  function renderGrid() {
    $('wgrid').innerHTML = S.pool.map((w, i) => `
      <button type="button" class="wc" data-i="${i}" aria-pressed="${S.picked.has(i)}">
        <span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
        <b>${esc(w.word)}</b><span class="han">${esc(w.hanja)}</span>
      </button>`).join('');
    syncPick();
  }
  function syncPick() {
    const n = S.picked.size;
    document.querySelectorAll('.wc').forEach(c => c.setAttribute('aria-pressed', S.picked.has(+c.dataset.i)));
    $('stSub').textContent = `오늘 공부할 낱말을 골라요 · ${n}개 골랐어요`;
    $('goStart').disabled = n === 0;
    $('goStart').textContent = n ? `고른 낱말 ${n}개 공부하기` : '낱말을 하나 이상 골라 주세요';
  }
  $('wgrid').addEventListener('click', e => {
    const b = e.target.closest('.wc'); if (!b) return;
    const i = +b.dataset.i; S.picked.has(i) ? S.picked.delete(i) : S.picked.add(i); syncPick();
  });
  document.querySelector('.quick').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.picked = b.dataset.q === 'all' ? new Set(S.pool.map((_, i) => i)) : new Set(); syncPick();
  });
  if (lessonKeys.length > 1 && !Q.get('lesson')) {
    $('lsnPick').hidden = false;
    $('lsnPick').innerHTML = lessonKeys.map(k => `<button type="button" data-k="${k}">${esc(DATA.lessons[k].title)}</button>`).join('');
    $('lsnPick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLesson(b.dataset.k); });
  }
  setLesson(DATA.lessons[Q.get('lesson')] ? Q.get('lesson') : lessonKeys[0]);
  $('goStart').addEventListener('click', () => begin(S.pool.filter((_, i) => S.picked.has(i))));
  SM.okUI = true;
} catch (e) { SM_err('시작 화면', e); }
</script>

<script>
/* ───── 4단계 학습 ───── */
function show(v) { ['vStart', 'vLearn', 'vDone'].forEach(id => $(id).classList.toggle('on', id === v)); document.body.classList.toggle('learning', v !== 'vStart'); window.scrollTo(0, 0); }
function begin(list) {
  S.words = list.map(w => Object.assign({}, w, mix(w.choices, w.answerIdx),
    { rvs: (w.reviewWords || []).map(r => Object.assign({}, r, (m => ({ c: m.c, a: m.a }))(mix(r.choices, r.answerIdx || 0)))) }));
  S.i = 0; S.sc = S.words.map(w => ({ word: w.word, cat: null, infer: null, rv: [] }));
  show('vLearn'); step1();
}
function bar(step, skipped) {
  S.step = step;
  const n = S.words.length;
  $('lpWord').textContent = `${S.i + 1} / ${n}`;
  $('lpStep').textContent = S.words[S.i].word + ' · ' + STEP[step];
  $('lpFill').style.width = ((S.i * 4 + step) / (n * 4) * 100) + '%';
  document.querySelectorAll('#flow4 .fs').forEach((f, k) => {
    f.setAttribute('aria-selected', k === step);
    f.classList.toggle('seen', k < step && !(skipped && (k === 1 || k === 2)));
    f.classList.toggle('skip', !!skipped && (k === 1 || k === 2));
  });
}
function stage(html) {
  const c = $('stageC'); c.innerHTML = html;
  c.classList.remove('rise'); void c.offsetWidth; c.classList.add('rise');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
const ICON = {
  0: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  1: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 14c3-5 5 1 8-3s5-1 8-4"/></svg>',
  2: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.8.3-1 1-1 1.7V15"/><circle cx="12" cy="19" r=".6" fill="currentColor"/></svg>'
};

// 1단계: 자기점검
function step1() {
  try {
    const w = S.words[S.i]; bar(0);
    stage(`
      <div class="s-tag"><i>1</i>자기점검</div>
      <div class="hero"><div class="w-big">${esc(w.word)}</div><div class="w-han">${tiles(w.hanja)}</div></div>
      ${w.example ? `<p class="lead" style="text-align:center">${esc(w.example)}</p>` : ''}
      <p class="ask">이 낱말의 뜻을 알고 있나요?</p>
      <div class="chk">
        <button type="button" class="cb c0" data-c="0"><span class="mk">${ICON[0]}</span><b>알고 있고, 설명할 수 있어요</b><small>친구에게 뜻을 설명해 줄 수 있어요. 바로 어휘 넓히기로 가요.</small></button>
        <button type="button" class="cb c1" data-c="1"><span class="mk">${ICON[1]}</span><b>아는데, 설명은 어려워요</b><small>한자 풀이로 뜻을 정확하게 다져 봐요.</small></button>
        <button type="button" class="cb c2" data-c="2"><span class="mk">${ICON[2]}</span><b>처음 보는 낱말이에요</b><small>한자 풀이로 함께 알아봐요.</small></button>
      </div>`);
    $('stageC').querySelector('.chk').addEventListener('click', e => {
      const b = e.target.closest('.cb'); if (!b) return;
      const c = +b.dataset.c; S.sc[S.i].cat = c;
      if (c === 0) { S.rv = 0; step4(true); } else step2();
    });
  } catch (e) { SM_err('1단계', e); }
}

// 2단계: 한자 풀이
function step2() {
  try {
    const w = S.words[S.i]; bar(1);
    const syl = [...w.word], han = [...w.hanja], n = han.length;
    const parts = han.map((h, k) => {
      const c = charOf(w, h) || { meaning: '', sound: syl[k] || '' };
      const dx = ((n - 1) / 2 - k) * (window.innerWidth < 900 ? 112 : 128);   // 처음에는 가운데에 붙어 있다가 한 글자씩 벌어진다
      return `<div class="sp" style="--dx:${dx}px"><span class="sy">${esc(syl[k] || '')}</span><span class="tile">${esc(h)}</span><span class="hun">${esc(c.meaning)}</span></div>`;
    }).join('<span class="plus">+</span>');
    const cards = (w.chars || []).map(c => `
      <div class="cc"><span class="tile">${esc(c.char)}</span><div>
        <div class="hd">${esc(c.meaning)}<small>소리 ${esc(c.sound)}</small></div>
        <div class="lab">${esc(c.char)}${josa(c.sound, '이', '가')} 들어간 낱말</div>
        <div class="exs">${(c.examples || []).map(ex => { const m = ex.match(/^(.+?)\((.+)\)$/); return m
          ? `<span class="ex"><span>${emWord(m[1], m[2], c.char)}</span><span class="han">${[...m[2]].map(x => x === c.char ? `<span class="em-sh">${esc(x)}</span>` : esc(x)).join('')}</span></span>`
          : `<span class="ex">${esc(ex)}</span>`; }).join('')}</div>
      </div></div>`).join('');
    stage(`
      <div class="s-tag"><i>2</i>한자 풀이</div>
      <p class="lead"><b>${esc(w.word)}</b>${josa(w.word, '을', '를')} 한 글자씩 나눠 봐요. 글자마다 뜻이 있어요.</p>
      <div class="split">${parts}</div>
      <div class="ccards">${cards}</div>
      <div class="box an"><b class="t">힌트</b>글자 뜻을 차례로 이어 읽어 보세요. 아는 낱말 속에서 같은 글자가 어떤 뜻으로 쓰이는지 떠올리면 짐작하기 쉬워요.</div>
      <button type="button" class="btn primary next" id="toInfer">뜻을 짐작해 볼게요</button>`);
    $('toInfer').addEventListener('click', step3);
  } catch (e) { SM_err('2단계', e); }
}

// 3단계: 뜻 추론
function step3() {
  try {
    const w = S.words[S.i]; bar(2);
    const hints = [...w.hanja].map(h => { const c = charOf(w, h); return `<span><span class="tile">${esc(h)}</span>${esc(c ? c.meaning.split(',')[0] : '')}</span>`; }).join('<em>+</em>');
    stage(`
      <div class="s-tag"><i>3</i>뜻 추론</div>
      <div class="infer-q"><span class="w">${esc(w.word)}</span><span class="han">${esc(w.hanja)}</span><span>의 뜻은 무엇일까요?</span></div>
      <div class="hints">${hints}</div>
      <div class="opts" id="opts">${w.c.map((t, k) => `<button type="button" class="opt" data-k="${k}"><i>${k + 1}</i><span>${esc(t)}</span></button>`).join('')}</div>
      <div id="fbHost"></div>`);
    $('opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const k = +b.dataset.k, ok = k === w.a; S.sc[S.i].infer = ok;
      mark('opts', k, w.a);
      $('fbHost').innerHTML = `
        <div class="fb ${ok ? 'ok' : 'no'}"><span class="r">${ok ? '맞았어요' : '아쉬워요. 정답을 확인해 봐요'}</span>
          <b>${esc(w.word)}(${esc(w.hanja)})</b>${josa(w.word, '은', '는')} "${esc(w.definition)}"${josa(w.definition, '을', '를')} 뜻해요.</div>
        ${w.context ? `<div class="ety"><b class="t">왜 이런 뜻이 될까?</b>${w.context}</div>` : ''}
        <button type="button" class="btn primary next" id="toRv">같은 글자가 든 낱말로 넓히기</button>`;
      $('toRv').addEventListener('click', () => { S.rv = 0; step4(false); });
    });
  } catch (e) { SM_err('3단계', e); }
}
function mark(host, k, a) {
  document.querySelectorAll('#' + host + ' .opt').forEach((o, j) => {
    o.disabled = true;
    if (j === a) o.classList.add('ok'); else if (j === k) o.classList.add('no'); else o.classList.add('dim');
  });
}

// 4단계: 어휘 넓히기
function step4(knew) {
  try {
    const w = S.words[S.i], r = w.rvs[S.rv];
    if (!r) { nextWord(); return; }
    bar(3, S.sc[S.i].cat === 0);
    const c = charOf(w, r.shared) || { meaning: '', sound: '' };
    stage(`
      <div class="s-tag"><i>4</i>어휘 넓히기 <small>${S.rv + 1} / ${w.rvs.length}</small></div>
      ${knew && S.rv === 0 ? `<div class="knew"><b>${esc(w.word)}</b>${josa(w.word, '을', '를')} 알고 있었군요. 같은 글자가 든 낱말도 뜻을 풀 수 있는지 확인해 봐요.</div>` : ''}
      <div class="rv">
        <div class="rvw"><span class="lb2">공부한 낱말</span><span class="w">${emWord(w.word, w.hanja, r.shared)}</span><span class="ts">${tiles(w.hanja, r.shared)}</span></div>
        <svg class="arr" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div class="rvw to"><span class="lb2">새 낱말</span><span class="w">${emWord(r.word, r.hanja, r.shared)}</span><span class="ts">${tiles(r.hanja, r.shared)}</span></div>
      </div>
      <div class="shb"><span><span class="tile sh">${esc(r.shared)}</span>${esc(c.meaning.split(',')[0])}(${esc(c.sound)})${josa(c.sound, '이', '가')} 똑같이 들어 있어요</span></div>
      <p class="ask">${esc(r.word)}의 뜻은 무엇일까요?</p>
      <div class="opts" id="opts">${r.c.map((t, k) => `<button type="button" class="opt" data-k="${k}"><i>${k + 1}</i><span>${esc(t)}</span></button>`).join('')}</div>
      <div id="fbHost"></div>`);
    $('opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const k = +b.dataset.k, ok = k === r.a; S.sc[S.i].rv[S.rv] = ok;
      mark('opts', k, r.a);
      const lastRv = S.rv >= w.rvs.length - 1, lastW = S.i >= S.words.length - 1;
      $('fbHost').innerHTML = `
        <div class="fb ${ok ? 'ok' : 'no'}"><span class="r">${ok ? '맞았어요' : '정답을 기억해 두세요'}</span>
          <b>${esc(r.word)}(${esc(r.hanja)})</b>${josa(r.word, '은', '는')} "${esc(r.meaning)}"${josa(r.meaning, '을', '를')} 뜻해요.</div>
        ${knew && lastRv && w.context ? `<div class="ety"><b class="t">${esc(w.word)}${josa(w.word, '은', '는')} 왜 이런 뜻일까?</b>${w.context}</div>` : ''}
        <button type="button" class="btn primary next" id="toNext">${lastRv ? (lastW ? '공부 마치기' : '다음 낱말로') : '다음 넓히기 낱말'}</button>`;
      $('toNext').addEventListener('click', () => { if (lastRv) nextWord(); else { S.rv++; step4(knew); } });
    });
  } catch (e) { SM_err('4단계', e); }
}
function nextWord() { S.i++; if (S.i < S.words.length) step1(); else done(); }
</script>

<script>
/* ───── 완료 화면과 작은 관계망 ───── */
function verdict(s) {
  const wrong = s.infer === false || s.rv.some(v => v === false);
  if (s.cat === 0) return wrong ? ['r', '더 정확히 알게 됐어요'] : ['k', '처음부터 알았어요'];
  return wrong ? ['w', '다시 볼 낱말'] : ['l', '오늘 새로 배웠어요'];
}
function done() {
  try {
    let ok = 0, tot = 0; const cnt = { k: 0, r: 0, l: 0, w: 0 };
    S.sc.forEach(s => {
      if (s.infer !== null) { tot++; if (s.infer) ok++; }
      s.rv.forEach(v => { tot++; if (v) ok++; });
      cnt[verdict(s)[0]]++;
    });
    const pct = tot ? Math.round(ok / tot * 100) : 100, C = 2 * Math.PI * 58;
    const wrongN = S.sc.filter(s => s.infer === false || s.rv.some(v => v === false)).length;
    $('doneC').innerHTML = `
      <div class="done-top">
        <div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="58" fill="none" stroke="#e6edf4" stroke-width="14"/>
          <circle id="ringArc" cx="70" cy="70" r="58" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s var(--ease)"/>
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7ff0"/><stop offset="1" stop-color="#4b3fb5"/></linearGradient></defs></svg>
          <div class="v"><div><b>${pct}%</b><small>맞힌 비율</small></div></div></div>
        <div><h2>낱말 ${S.words.length}개 공부를 마쳤어요</h2>
          <p>${pct >= 80 ? '글자 뜻으로 낱말의 뜻을 잘 짐작했어요.' : pct >= 50 ? '잘했어요. 다시 볼 낱말을 한 번 더 풀어 보면 오래 기억할 수 있어요.' : '괜찮아요. 한자 풀이를 다시 보며 천천히 익혀 봐요.'}
          이 기록은 어디에도 저장되지 않아요.</p></div>
      </div>
      <div class="stats">
        <div class="stat" style="--c:#1f9d5c"><b>${cnt.k}</b><span>처음부터 알았어요</span></div>
        <div class="stat" style="--c:#1f6672"><b>${cnt.r}</b><span>더 정확히 알게 됐어요</span></div>
        <div class="stat" style="--c:#4b3fb5"><b>${cnt.l + cnt.w}</b><span>오늘 새로 배웠어요</span></div>
      </div>
      <div class="sec">오늘 공부한 낱말</div>
      <div class="wlist">${S.words.map((w, i) => { const v = verdict(S.sc[i]); return `<div class="wl"><span>${esc(w.word)}<span class="han">${esc(w.hanja)}</span></span><span class="chip ${v[0]}">${v[1]}</span></div>`; }).join('')}</div>
      <div class="sec">오늘 낱말은 이렇게 이어져요 <small>같은 한자를 함께 쓰는 낱말끼리 이었어요. 낱말이나 한자를 누르면 관계망에서 크게 볼 수 있어요</small></div>
      <div class="mg" id="mg"></div>
      <div class="acts2">
        <button type="button" class="btn primary" id="reWrong" ${wrongN ? '' : 'disabled'}>${wrongN ? `다시 볼 낱말 ${wrongN}개 다시 풀기` : '다시 볼 낱말이 없어요'}</button>
        <button type="button" class="btn ghost" id="toGraph">한자 관계망 전체 보기</button>
        <button type="button" class="btn ghost" id="toHome">처음 화면으로</button>
      </div>`;
    show('vDone');
    requestAnimationFrame(() => requestAnimationFrame(() => { const a = $('ringArc'); if (a) a.style.strokeDashoffset = C * (1 - pct / 100); }));
    miniGraph();
    $('reWrong').addEventListener('click', () => begin(S.words.filter((w, i) => { const s = S.sc[i]; return s.infer === false || s.rv.some(v => v === false); }).map(w => BY[w.word])));
    $('toGraph').addEventListener('click', () => openGraph(''));
    $('toHome').addEventListener('click', () => show('vStart'));
  } catch (e) { SM_err('완료 화면', e); }
}

// 위에는 낱말, 아래에는 한자. 낱말과 그 낱말을 이루는 한자를 잇고, 한자는 이어진 낱말들의 평균 위치에 놓는다
function miniGraph() {
  const ws = S.words, W = 1000, top = 60, bot = 240, H = 310;
  const xs = ws.map((_, i) => ws.length === 1 ? W / 2 : 70 + i * (W - 140) / (ws.length - 1));
  const hz = {};
  ws.forEach((w, i) => [...w.hanja].forEach(h => { (hz[h] = hz[h] || []).push(i); }));
  const multi = Object.keys(hz).filter(h => hz[h].length > 1);
  let hs = (multi.length ? multi : Object.keys(hz)).map(h => ({ h, x: hz[h].reduce((s, i) => s + xs[i], 0) / hz[h].length, n: hz[h].length }));
  hs.sort((a, b) => a.x - b.x);
  const gap = (W - 80) / Math.max(1, hs.length - 1);
  hs.forEach((o, k) => { o.x = hs.length === 1 ? W / 2 : 40 + k * gap; });   // 한자는 고르게 펼쳐 겹치지 않게
  const pos = {}; hs.forEach(o => { pos[o.h] = o; });
  let lines = '', nodes = '';
  ws.forEach((w, i) => [...w.hanja].forEach(h => {
    if (!pos[h]) return;
    const shared = hz[h].length > 1;
    lines += `<path d="M${xs[i]} ${top + 22} C ${xs[i]} ${(top + bot) / 2}, ${pos[h].x} ${(top + bot) / 2}, ${pos[h].x} ${bot - 24}" fill="none" stroke="${shared ? '#c4703a' : '#b9c6d3'}" stroke-width="${shared ? 2.4 : 1.4}" stroke-opacity="${shared ? .75 : .7}"/>`;
  }));
  ws.forEach((w, i) => {
    const v = verdict(S.sc[i])[0], col = { k: '#1f9d5c', r: '#1f6672', l: '#4b3fb5', w: '#d9534f' }[v];
    const bw = Math.max(64, w.word.length * 22 + 20);
    nodes += `<g class="node" data-f="${esc(w.word)}" transform="translate(${xs[i]},${top})">
      <rect x="${-bw / 2}" y="-22" width="${bw}" height="44" rx="14" fill="#fff" stroke="${col}" stroke-width="2.2" filter="url(#mgS)"/>
      <text text-anchor="middle" dy="7" font-size="19" font-weight="800" fill="#14263b" font-family="Pretendard,sans-serif">${esc(w.word)}</text></g>`;
  });
  hs.forEach(o => {
    const r = 30;
    nodes += `<g class="node" data-f="${esc(o.h)}" transform="translate(${o.x},${bot})">
      <circle r="${r}" fill="${o.n > 1 ? 'url(#mgH2)' : 'url(#mgH)'}" filter="url(#mgS)"/>
      <text text-anchor="middle" dy="${r * .36}" font-size="${r * 1.02}" font-weight="700" fill="#fff" font-family="'Noto Serif KR',serif">${esc(o.h)}</text><text text-anchor="middle" dy="${r + 20}" font-size="15" font-weight="800" fill="#5a6b7e">${esc(((charOf(ws.find(w => w.hanja.includes(o.h)), o.h) || {}).meaning || '').split(',')[0])}</text></g>`;
  });
  $('mg').innerHTML = `<span class="hint">아래 한자는 오늘 낱말 여러 개에 함께 들어 있어요</span>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="오늘 낱말과 한자의 연결">
      <defs><radialGradient id="mgH" cx=".35" cy=".3"><stop offset="0" stop-color="#8a7ff0"/><stop offset="1" stop-color="#4b3fb5"/></radialGradient>
        <radialGradient id="mgH2" cx=".35" cy=".3"><stop offset="0" stop-color="#e3a170"/><stop offset="1" stop-color="#b25f2b"/></radialGradient>
        <filter id="mgS" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14263b" flood-opacity=".14"/></filter></defs>
      ${lines}${nodes}</svg>`;
  $('mg').querySelectorAll('.node').forEach(g => g.addEventListener('click', () => openGraph(g.dataset.f)));
}
</script>

<script>
/* ───── 관계망 겹침 화면 ───── */
try {
  window.openGraph = function (focus) {
    $('govFrame').src = 'graph.html?embed=1' + (focus ? '&focus=' + encodeURIComponent(focus) : '');
    $('gov').classList.add('on'); $('gov').setAttribute('aria-hidden', 'false');
  };
  function closeGraph() {
    $('gov').classList.remove('on'); $('gov').setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!$('gov').classList.contains('on')) $('govFrame').src = 'about:blank'; }, 500);
  }
  $('openGraph').addEventListener('click', () => openGraph(''));
  $('govClose').addEventListener('click', closeGraph);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGraph(); });
} catch (e) { SM_err('관계망 열기', e); }
</script>

<script>
/* ───── 화면 검사용 바로가기: ?go=1&at=낱말번호&step=1~4, ?done=1 ───── */
try {
  if (Q.get('go') || Q.get('done')) {
    begin(S.pool.filter((_, i) => S.picked.has(i)));
    if (Q.get('done')) {
      S.sc.forEach((s, i) => { s.cat = i % 3; s.infer = s.cat ? i % 4 !== 1 : null; s.rv = [true, i % 5 !== 2]; });
      done();
    } else {
      S.i = Math.min(+Q.get('at') || 0, S.words.length - 1);
      const st = +Q.get('step') || 1;
      if (st === 1) step1(); else if (st === 2) { S.sc[S.i].cat = 2; step2(); } else if (st === 3) { S.sc[S.i].cat = 2; step3(); } else { S.sc[S.i].cat = 2; S.rv = 0; step4(false); }
    }
  }
} catch (e) { SM_err('검사 바로가기', e); }
</script>
</body>
</html>
