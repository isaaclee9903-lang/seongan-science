<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 관계망</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!--@@PART:errbox_sim.html@@-->
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_hanja.css@@*/
  html,body{height:100%}
  body{overflow:hidden}
  .gw{height:100vh;height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:12px;padding:12px;max-width:1500px;margin:0 auto}
  .side,.detail{overflow:auto;padding:14px}
  .side h2,.detail h2{margin:0 0 4px;font-size:18px}
  .side .sub{font-size:13.5px;margin-bottom:10px}
  .find{display:flex;gap:6px;margin-bottom:12px}
  .find input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:15px;background:#f7fafc}
  .find input:focus{outline:none;border-color:var(--hz);background:#fff}
  .grp{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
  .wbtns{display:flex;flex-wrap:wrap;gap:6px}
  .wb{min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .wb .han{font-size:13px;color:var(--muted);font-weight:600}
  .wb.hz{font-family:var(--han);font-size:19px;padding:0 10px;color:var(--hz-ink);background:var(--hz-soft);border-color:var(--hz-line)}
  .wb[aria-pressed="true"]{border-color:var(--sh);background:var(--sh-soft);color:var(--sh-ink)}
  .canvas{position:relative;overflow:hidden;padding:0;background:radial-gradient(circle at 50% 45%,#ffffff 0%,#f3f6fa 60%,#e8eef5 100%)}
  .canvas svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  .canvas .vt.tl{pointer-events:none}.canvas .vt.tl>*{pointer-events:auto}
  .lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px}
  .lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .node{cursor:pointer}
  .node text{pointer-events:none}
  .link{fill:none}
  .detail .empty{color:var(--muted);font-size:15px;line-height:1.7;word-break:keep-all}
  .d-head{display:flex;align-items:center;gap:12px;margin:6px 0 8px}
  .d-head .tile{--ts:70px}
  .d-w{font-size:30px;font-weight:900;letter-spacing:-.01em}
  .d-h{font-size:18px;color:var(--hz-ink)}
  .tag{display:inline-flex;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--hz-soft);color:var(--hz-ink)}
  .tag.ext{background:#eef3f8;color:var(--muted)}
  .d-def{font-size:16px;line-height:1.7;word-break:keep-all;padding:12px 14px;border-radius:14px;background:#f7fafc;margin:8px 0}
  .d-sec{font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 6px}
  .d-chars{display:grid;gap:6px}
  .d-ch{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:#f7fafc;cursor:pointer;border:0;text-align:left;font:inherit;min-height:52px}
  .d-ch .tile{--ts:40px}
  .d-ch b{font-size:15px}.d-ch small{display:block;font-size:13px;color:var(--muted);font-weight:700}
  .d-def em{font-style:normal;font-family:var(--han);font-weight:700;color:var(--hz-ink);background:var(--hz-soft);border-radius:6px;padding:0 4px}
  .fail{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:16px;font-weight:700;color:#7a2a22;background:#fff4f2;word-break:keep-all}
  .fail.show{display:grid}
  @media (max-width:1100px){.gw{grid-template-columns:230px minmax(0,1fr) 280px}}
  @media (max-width:900px){
    body{overflow:auto}
    .gw{height:auto;grid-template-columns:1fr;grid-template-rows:auto}
    .canvas{height:58vh;min-height:420px;order:1}
    .side{order:2;max-height:none}.detail{order:3;max-height:none}
  }
</style>
</head>
<body>
<div class="gw">
  <aside class="card side">
    <h2>한자 관계망</h2>
    <p class="sub">같은 한자를 나눠 쓰는 낱말끼리 이어져 있어요. 낱말이나 한자를 누르면 이웃만 밝게 보여요.</p>
    <div class="find"><input id="q" type="search" placeholder="낱말이나 한자 찾기" aria-label="낱말이나 한자 찾기" enterkeyhint="search"></div>
    <div id="lists"></div>
  </aside>
  <main class="card canvas" id="canvas">
    <svg id="g" aria-label="낱말과 한자의 연결"></svg>
    <div class="vt tl"><span class="lg"><span><i style="background:#4b3fb5"></i>한자</span><span><i style="background:#fff;border:2px solid #4b3fb5"></i>공부하는 낱말</span><span><i style="background:#fff;border:2px dashed #9aa9b8"></i>같은 글자가 든 다른 낱말</span></span></div>
    <div class="vt tr"><button class="vb" id="fit" type="button">전체 보기</button></div>
    <div class="vt bl"><span class="hint">두 손가락으로 크게·작게, 끌어서 옮겨요</span></div>
    <div class="fail" id="fail">관계망 그림 도구를 불러오지 못했어요.<br>인터넷 연결(cdn.jsdelivr.net)을 확인하고 새로고침해 주세요.</div>
  </main>
  <aside class="card detail" id="detail"><p class="empty">왼쪽 목록이나 그림에서 낱말 또는 한자를 눌러 보세요. 뜻과 이어진 낱말이 여기에 나타나요.</p></aside>
</div>

<script>
/*@@LOCAL:_words.js@@*/
</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>window.d3 || document.write('<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"><\/script>');</script>

<script>
/* ───── 자료 만들기: 낱말·한자·같은 글자가 든 다른 낱말 ───── */
window.SM = window.SM || {};
const DATA = window.HANJA_DATA || { words: [], lessons: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const G = { nodes: [], links: [], byId: {}, adj: {} };
try {
  const add = n => { if (!G.byId[n.id]) { G.byId[n.id] = n; G.nodes.push(n); } return G.byId[n.id]; };
  const link = (a, b, ext) => { const k = a + '|' + b; if (G.adj[k]) return; G.adj[k] = 1; G.links.push({ source: a, target: b, ext }); };
  const charInfo = {};
  DATA.words.forEach(w => (w.chars || []).forEach(c => { if (!charInfo[c.char]) charInfo[c.char] = c; }));
  DATA.words.forEach(w => {
    add({ id: 'w:' + w.word, kind: 'word', label: w.word, hanja: w.hanja, def: w.definition, w });
    [...w.hanja].forEach(h => { const c = charInfo[h] || {}; add({ id: 'h:' + h, kind: 'hanja', label: h, sound: c.sound || '', meaning: c.meaning || '' }); link('w:' + w.word, 'h:' + h); });
  });
  DATA.words.forEach(w => (w.reviewWords || []).forEach(r => {
    if (G.byId['w:' + r.word]) { link('w:' + r.word, 'h:' + r.shared); return; }
    add({ id: 'x:' + r.word, kind: 'ext', label: r.word, hanja: r.hanja, def: r.meaning, from: w.word, shared: r.shared });
    link('x:' + r.word, 'h:' + r.shared, true);
  }));
  // 이웃 목록
  G.nb = {}; G.nodes.forEach(n => { G.nb[n.id] = new Set(); });
  G.links.forEach(l => { G.nb[l.source].add(l.target); G.nb[l.target].add(l.source); });
} catch (e) { SM_err('관계망 자료', e); }
</script>

<script>
/* ───── 왼쪽 목록과 찾기 ───── */
try {
  const lessons = DATA.lessons;
  let html = '';
  Object.keys(lessons).forEach(k => {
    const L = lessons[k];
    html += `<div class="grp">${esc(L.unit)} · ${esc(L.title)}</div><div class="wbtns">` +
      L.words.filter(w => G.byId['w:' + w]).map(w => `<button type="button" class="wb" data-id="w:${esc(w)}">${esc(w)}<span class="han">${esc(G.byId['w:' + w].hanja)}</span></button>`).join('') + '</div>';
  });
  const hz = G.nodes.filter(n => n.kind === 'hanja').sort((a, b) => G.nb[b.id].size - G.nb[a.id].size);
  html += `<div class="grp">한자 (이어진 낱말이 많은 순서)</div><div class="wbtns">` +
    hz.map(n => `<button type="button" class="wb hz" data-id="${esc(n.id)}" title="${esc(n.meaning)} ${esc(n.sound)}">${esc(n.label)}</button>`).join('') + '</div>';
  $('lists').innerHTML = html;
  $('lists').addEventListener('click', e => { const b = e.target.closest('.wb'); if (b) window.focusNode(b.dataset.id, true); });
  $('q').addEventListener('input', e => {
    const v = e.target.value.trim(); if (!v) { window.focusNode(null); return; }
    const hit = G.nodes.find(n => n.label === v) || G.nodes.find(n => n.kind !== 'hanja' && n.label.includes(v)) || G.nodes.find(n => n.kind === 'hanja' && n.sound === v);
    if (hit) window.focusNode(hit.id, true);
  });
} catch (e) { SM_err('목록', e); }
</script>

<script>
/* ───── 관계망 그림 (d3 힘 배치) ───── */
window.focusNode = function () {};
(function () {
  if (!window.d3) { $('fail').classList.add('show'); SM_err('관계망 그림', { message: 'd3를 불러오지 못했어요' }); SM.okUI = true; return; }
  try {
    const svg = d3.select('#g'), host = $('canvas');
    const defs = svg.append('defs');
    defs.html(`
      <radialGradient id="gH" cx=".35" cy=".3"><stop offset="0" stop-color="#8a7ff0"/><stop offset="1" stop-color="#3f34a3"/></radialGradient>
      <radialGradient id="gH2" cx=".35" cy=".3"><stop offset="0" stop-color="#e8a877"/><stop offset="1" stop-color="#a9561f"/></radialGradient>
      <filter id="gS" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#14263b" flood-opacity=".16"/></filter>
      <filter id="gGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>`);
    const root = svg.append('g');
    const linkG = root.append('g'), nodeG = root.append('g');
    const zoom = d3.zoom().scaleExtent([.35, 3]).on('zoom', e => root.attr('transform', e.transform));
    svg.call(zoom).on('dblclick.zoom', null);

    const deg = id => G.nb[id].size;
    const R = n => n.kind === 'hanja' ? (deg(n.id) > 2 ? 30 : deg(n.id) > 1 ? 26 : 22) : 0;
    const bw = n => Math.max(n.kind === 'ext' ? 58 : 66, n.label.length * (n.kind === 'ext' ? 16 : 19) + 26);

    const links = linkG.selectAll('path').data(G.links).join('path').attr('class', 'link')
      .attr('stroke', d => d.ext ? '#b7c3cf' : '#8a7ff0').attr('stroke-width', d => d.ext ? 1.4 : 2)
      .attr('stroke-dasharray', d => d.ext ? '4 4' : null).attr('stroke-opacity', .7);

    const nodes = nodeG.selectAll('g').data(G.nodes, d => d.id).join('g').attr('class', 'node');
    nodes.filter(d => d.kind === 'hanja').each(function (d) {
      const g = d3.select(this), r = R(d), multi = deg(d.id) > 1;
      g.append('circle').attr('class', 'halo').attr('r', r + 10).attr('fill', '#f2b37f').attr('opacity', 0).attr('filter', 'url(#gGlow)');
      g.append('circle').attr('r', r).attr('fill', multi ? 'url(#gH2)' : 'url(#gH)').attr('filter', 'url(#gS)').attr('stroke', '#fff').attr('stroke-width', 2.5);
      g.append('text').text(d.label).attr('text-anchor', 'middle').attr('dy', r * .36).attr('fill', '#fff')
        .attr('font-size', r * 1.02).attr('font-weight', 700).attr('font-family', "'Noto Serif KR',serif");
      g.append('text').text(d.sound).attr('text-anchor', 'middle').attr('dy', r + 16).attr('fill', '#5a6b7e').attr('font-size', 12.5).attr('font-weight', 800);
    });
    nodes.filter(d => d.kind !== 'hanja').each(function (d) {
      const g = d3.select(this), w = bw(d), ext = d.kind === 'ext', h = ext ? 44 : 54;
      g.append('rect').attr('class', 'halo').attr('x', -w / 2 - 8).attr('y', -h / 2 - 8).attr('width', w + 16).attr('height', h + 16).attr('rx', 20).attr('fill', '#f2b37f').attr('opacity', 0).attr('filter', 'url(#gGlow)');
      g.append('rect').attr('x', -w / 2).attr('y', -h / 2).attr('width', w).attr('height', h).attr('rx', ext ? 12 : 15)
        .attr('fill', '#fff').attr('stroke', ext ? '#9aa9b8' : '#4b3fb5').attr('stroke-width', ext ? 1.5 : 2.2)
        .attr('stroke-dasharray', ext ? '5 4' : null).attr('filter', ext ? null : 'url(#gS)');
      g.append('text').text(d.label).attr('text-anchor', 'middle').attr('dy', ext ? -2 : -3).attr('fill', ext ? '#5a6b7e' : '#14263b')
        .attr('font-size', ext ? 15 : 18).attr('font-weight', 800);
      g.append('text').text(d.hanja).attr('text-anchor', 'middle').attr('dy', ext ? 15 : 17).attr('fill', ext ? '#8495a8' : '#2e2675')
        .attr('font-size', ext ? 12 : 13.5).attr('font-weight', 700).attr('font-family', "'Noto Serif KR',serif");
    });

    const sim = d3.forceSimulation(G.nodes)
      .force('link', d3.forceLink(G.links).id(d => d.id).distance(d => d.ext ? 62 : 82).strength(d => d.ext ? .6 : .85))
      .force('charge', d3.forceManyBody().strength(d => d.kind === 'hanja' ? -360 : d.kind === 'ext' ? -150 : -240).distanceMax(420))
      .force('collide', d3.forceCollide().radius(d => d.kind === 'hanja' ? R(d) + 16 : bw(d) / 2 + 8))
      .force('x', d3.forceX(0).strength(.07)).force('y', d3.forceY(0).strength(.1))
      .on('tick', draw);
    // 처음 모양은 미리 계산해 두고 보여 준다(화면에서 오래 출렁이지 않게)
    sim.stop(); for (let i = 0; i < 320; i++) sim.tick(); draw();

    function draw() {
      links.attr('d', d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
      nodes.attr('transform', d => `translate(${d.x},${d.y})`);
    }
    function fit(ids, dur) {
      const list = ids ? G.nodes.filter(n => ids.has(n.id)) : G.nodes;
      if (!list.length) return;
      const W = host.clientWidth, H = host.clientHeight, pad = 70;
      const x0 = d3.min(list, n => n.x - (n.kind === 'hanja' ? 40 : bw(n) / 2)), x1 = d3.max(list, n => n.x + (n.kind === 'hanja' ? 40 : bw(n) / 2));
      const y0 = d3.min(list, n => n.y - 40), y1 = d3.max(list, n => n.y + 44);
      const k = Math.max(.35, Math.min(ids ? 1.5 : 1.2, Math.min((W - pad * 2) / (x1 - x0 || 1), (H - pad * 2) / (y1 - y0 || 1))));
      svg.transition().duration(dur == null ? 700 : dur).ease(d3.easeCubicInOut)
        .call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
    }
    fit(null, 0);

    nodes.call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    nodes.on('click', (e, d) => window.focusNode(d.id, true));
    svg.on('click', e => { if (e.target === svg.node()) window.focusNode(null); });
    $('fit').addEventListener('click', () => { window.focusNode(null); });

    window.focusNode = function (id, zoomIn) {
      document.querySelectorAll('.wb').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
      if (!id || !G.byId[id]) {
        nodes.transition().duration(250).style('opacity', 1); nodes.select('.halo').attr('opacity', 0);
        links.transition().duration(250).attr('stroke-opacity', .7);
        detail(null); fit(null); return;
      }
      // 한자를 고르면 그 한자와 이어진 낱말까지, 낱말을 고르면 그 낱말의 한자와 그 한자를 나눠 쓰는 낱말까지
      const keep = new Set([id]);
      G.nb[id].forEach(n => { keep.add(n); if (G.byId[id].kind !== 'hanja') G.nb[n].forEach(m => keep.add(m)); });
      nodes.transition().duration(250).style('opacity', d => keep.has(d.id) ? 1 : .14);
      nodes.select('.halo').attr('opacity', d => d.id === id ? .7 : 0);
      links.transition().duration(250).attr('stroke-opacity', l => keep.has(l.source.id) && keep.has(l.target.id) ? .95 : .06);
      detail(G.byId[id]);
      if (zoomIn) fit(keep);
    };

    window.addEventListener('resize', () => fit(null, 0));
    const f = new URLSearchParams(location.search).get('focus');
    if (f) { const n = G.byId['w:' + f] || G.byId['h:' + f] || G.byId['x:' + f]; if (n) setTimeout(() => window.focusNode(n.id, true), 200); }
    SM.okUI = true;
  } catch (e) { SM_err('관계망 그림', e); }
})();

/* ───── 오른쪽 자세히 보기 ───── */
function detail(n) {
  const d = $('detail');
  if (!n) { d.innerHTML = '<p class="empty">왼쪽 목록이나 그림에서 낱말 또는 한자를 눌러 보세요. 뜻과 이어진 낱말이 여기에 나타나요.</p>'; return; }
  const nbBtns = ids => [...ids].map(i => G.byId[i]).sort((a, b) => (a.kind === 'ext') - (b.kind === 'ext'))
    .map(m => `<button type="button" class="wb" data-id="${esc(m.id)}">${esc(m.label)}<span class="han">${esc(m.hanja || '')}</span></button>`).join('');
  if (n.kind === 'hanja') {
    d.innerHTML = `<span class="tag">한자</span>
      <div class="d-head"><span class="tile">${esc(n.label)}</span><div><div class="d-w">${esc(n.meaning)}</div><div style="font-weight:800;color:var(--muted)">소리 ${esc(n.sound)}</div></div></div>
      <div class="d-sec">이 한자가 들어간 낱말 ${G.nb[n.id].size}개</div><div class="wbtns">${nbBtns(G.nb[n.id])}</div>`;
  } else {
    const chars = [...n.hanja].map(h => G.byId['h:' + h]).filter(Boolean);
    d.innerHTML = `<span class="tag ${n.kind === 'ext' ? 'ext' : ''}">${n.kind === 'ext' ? `같은 글자가 든 다른 낱말 · ${esc(n.from)}에서 넓히기` : '공부하는 낱말'}</span>
      <div class="d-head"><div><div class="d-w">${esc(n.label)}</div><div class="d-h han">${esc(n.hanja)}</div></div></div>
      <div class="d-def">${esc(n.def)}</div>
      ${n.kind === 'word' && n.w.context ? `<div class="d-sec">왜 이런 뜻이 될까?</div><div class="d-def" style="font-size:15px;background:#fff;border:1px solid var(--hz-line)">${n.w.context}</div>` : ''}
      <div class="d-sec">한 글자씩 보기</div>
      <div class="d-chars">${chars.map(c => `<button type="button" class="d-ch" data-id="${esc(c.id)}"><span class="tile">${esc(c.label)}</span><span><b>${esc(c.meaning)}</b><small>소리 ${esc(c.sound)} · 이어진 낱말 ${G.nb[c.id].size}개</small></span></button>`).join('')}</div>`;
  }
  d.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => window.focusNode(b.dataset.id, true)));
}
</script>
</body>
</html>
