<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>순환계의 구성과 기능 – 혈액 성분</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ps.css@@*/
/*@@LOCAL:_css_sim.css@@*/
/*@@LOCAL:_css_pf.css@@*/

</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl"><span class="eyebrow">해 보기</span><h1>혈액 성분 소개서</h1>
    <p class="sub">혈액을 크게 확대해 보고, 성분을 눌러 하는 일을 봐요. 그다음 소개서를 만들어요.</p></div></header>
  <div class="stage">
    <section class="card viewer"><div class="scene grow" id="fig" role="img" aria-label="혈관 속 혈액 확대 그림. 혈장 속에 적혈구, 백혈구, 혈소판이 떠 있다."></div><div class="vctl"><span class="hint">크기와 수는 구분이 잘 되게 정한 모형이에요</span></div></section>
    <section class="card pad"><div class="ptabs" role="tablist" id="pt">
        <button type="button" role="tab" data-p="lab" aria-selected="true">성분 보기</button>
        <button type="button" role="tab" data-p="rec" aria-selected="false">소개서</button>
        <button type="button" role="tab" data-p="why" aria-selected="false">왜 그럴까?</button>
      </div><div class="pane" data-p="lab"><div class="seg3" id="kk" style="grid-auto-flow:row;grid-template-columns:1fr 1fr"><button type="button" data-v="rbc" aria-pressed="false">적혈구</button><button type="button" data-v="wbc" aria-pressed="false">백혈구</button><button type="button" data-v="plt" aria-pressed="false">혈소판</button><button type="button" data-v="pla" aria-pressed="false">혈장</button></div><div class="fbk" id="res"><b class="t" id="resT">결과</b><span id="resM"></span></div></div>
      <div class="pane" data-p="rec" hidden><p class="ptxt">성분 하나를 골라 캐릭터 소개서를 써요.</p><div class="seg3" id="cc"><button type="button" aria-pressed="true">적혈구</button><button type="button" aria-pressed="false">백혈구</button><button type="button" aria-pressed="false">혈소판</button><button type="button" aria-pressed="false">혈장</button></div>
        <textarea class="fbtxt" id="cN" rows="1" placeholder="캐릭터 별명 (예: 산소 배달부)"></textarea><textarea class="fbtxt" id="cR" rows="2" placeholder="역할"></textarea><textarea class="fbtxt" id="cF" rows="2" placeholder="특징"></textarea><button class="btn ghost" type="button" id="cp" style="width:100%;margin-top:8px">소개서 복사하기</button></div>
      <div class="pane" data-p="why" hidden><ol class="whylist"><li><i>1</i><span>혈액은 액체 성분인 <b>혈장</b>과 세포 성분인 <b>혈구</b>로 구성돼요.</span></li><li><i>2</i><span><b>혈장</b>은 대부분이 물이고 영양소, 이산화 탄소, 노폐물을 운반해요.</span></li><li><i>3</i><span><b>적혈구</b>에는 산소를 운반하는 헤모글로빈이 있어 붉은색으로 보여요.</span></li><li><i>4</i><span><b>백혈구</b>는 세균을 잡아먹는 등 방어작용을 해요. <b>혈소판</b>은 혈액을 응고시켜 출혈을 막아요.</span></li></ol></div></section>
  </div>
</div>
<script>
/*@@LOCAL:_ps.js@@*/
</script>
<script>
/*@@LOCAL:_cr.js@@*/
</script>
<script>
(() => {
  'use strict';
  try {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const q = new URLSearchParams(location.search);
    const say = (t, m, c = '') => { $('#res').className = 'fbk ' + c; $('#resT').textContent = t; $('#resM').innerHTML = m; };
    const B = CR.blood($('#fig'));
    const T = { rbc: ['적혈구', '산소를 운반하는 <b>헤모글로빈</b>이 있어 붉은색으로 보여요. 원반 모양이에요.'], wbc: ['백혈구', '몸 밖에서 들어온 <b>세균을 잡아먹는</b> 등 방어작용을 해요.'], plt: ['혈소판', '상처가 나면 혈액을 <b>응고</b>시켜 딱지를 만들고 출혈을 막아요.'], pla: ['혈장', '대부분이 물이에요. <b>영양소, 이산화 탄소, 노폐물</b>을 운반해요.'] };
    say('결과', '성분을 눌러 하는 일을 봐요.');
    const pick = (k) => { $$('#kk button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === k))); B.show(k); say(T[k][0], T[k][1], 'ok'); };
    $$('#kk button').forEach((b) => b.addEventListener('click', () => pick(b.dataset.v)));
    if (q.get('k')) pick(q.get('k'));
    let cname = '적혈구'; $$('#cc button').forEach((b) => b.addEventListener('click', () => { cname = b.textContent; $$('#cc button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
    $('#cp').addEventListener('click', async () => { const t = `[${cname}를 소개해요]\n별명: ${$('#cN').value}\n역할: ${$('#cR').value}\n특징: ${$('#cF').value}`; const b = $('#cp'); try { await navigator.clipboard.writeText(t); b.textContent = '복사했어요'; } catch (e) { b.textContent = '칸을 길게 눌러 복사해요'; } setTimeout(() => { b.textContent = '소개서 복사하기'; }, 2000); });
    const tab = (p) => { $$('#pt button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.p === p))); $$('.pane').forEach((e) => { e.hidden = e.dataset.p !== p; }); };
    $$('#pt button').forEach((b) => b.addEventListener('click', () => tab(b.dataset.p)));
    if (q.get('tab')) tab(q.get('tab'));
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('혈액 성분', err); }
})();
</script>
</body>
</html>
