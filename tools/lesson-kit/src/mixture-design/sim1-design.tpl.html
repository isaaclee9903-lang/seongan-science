<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>혼합물 분리 실험 설계 – 혼합물 분리 설계실</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_mx.css@@*/
/*@@LOCAL:_css_sim.css@@*/
  /* ===== 이 페이지 전용 ===== */
  #lab{aspect-ratio:1000/560}
  @media (min-width:901px){.stage{grid-template-columns:minmax(0,1fr) 430px}}
  .ol.tx.big.cen{text-align:center;color:#5a6b7e;font-weight:800;line-height:1.5}
  .ol.tx.nm .u{display:block;font-size:.82em;color:#5a6b7e;margin:0}
  /* 선반 */
  .shelf{display:flex;gap:8px;align-items:stretch;padding:8px 10px;background:#f3f6f9;border-top:1px solid var(--line);overflow-x:auto}
  .shelf .cap{flex:none;writing-mode:horizontal-tb;font-size:12.5px;font-weight:800;color:var(--muted);align-self:center;width:30px;line-height:1.3;word-break:keep-all}
  .slot{flex:0 0 120px;min-height:96px;border:1px solid #dbe4ed;border-radius:12px;background:#fff;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .25s var(--ease)}
  .slot canvas{width:100%;height:56px;display:block}
  .slot span{font-size:12px;font-weight:700;line-height:1.3;color:var(--ink2);text-align:center;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .slot.pure span{color:#0b3f73;font-weight:900}
  .slot[aria-pressed="true"]{border:2px solid var(--fab);padding:3px 3px 5px}
  .slot.pop{transform:translateY(-6px) scale(1.04)}
  .shelf .sp{flex:1}
  .shelf .vb{align-self:center;flex:none}
  /* 활동 탭(혼합물 고르기) */
  .tasks{min-width:min(100%,560px)}
  /* 패널 */
  .pane{display:flex;flex-direction:column;gap:8px}
  .goals{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;font-weight:800;color:var(--muted)}
  .goals .g{border:1.5px solid #d4dee8;border-radius:10px;padding:3px 9px;color:var(--ink2);background:#fff}
  .goals .g.on{border-color:var(--fab);color:#0b3f73;background:#e9f3fd}
  .goals .g.on::before{content:'✓ ';font-weight:900}
  .nextp{font-size:14px;line-height:1.55;color:var(--ink2);background:#f6f9fc;border-radius:12px;padding:7px 11px;word-break:keep-all}
  .nextp b{color:#0b3f73}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tools button{min-height:48px;border-radius:12px;border:2px solid #d4dee8;background:#fff;font-weight:800;font-size:14.5px;cursor:pointer;word-break:keep-all;line-height:1.3;padding:3px 8px;color:var(--ink2);text-align:left;display:flex;flex-direction:column;justify-content:center}
  .tools button small{font-size:11.5px;font-weight:700;color:var(--muted)}
  .tools button[aria-pressed="true"]{border-color:var(--fab);background:#e9f3fd;color:#0b3f73}
  .tools button.plan{border-style:dashed}
  .tools button:disabled{opacity:.45;cursor:default}
  .runrow .btn{width:100%}
  .fbk{margin-top:0}
  /* 특성 표 */
  table.prop{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  table.prop th,table.prop td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;word-break:keep-all;line-height:1.35}
  table.prop th{font-size:12.5px;color:var(--muted);font-weight:800;background:#f6f9fc}
  table.prop td:first-child,table.prop th:first-child{text-align:left;font-weight:800;color:var(--ink)}
  table.prop td small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
  table.prop .more{color:#0b3f73}
  .tnote{font-size:12.5px;color:var(--muted);line-height:1.6;word-break:keep-all;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{min-height:44px;padding:0 12px;border-radius:12px;border:2px solid #d4dee8;background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink2);word-break:keep-all}
  .chips button[aria-pressed="true"]{border-color:var(--fab);background:#e9f3fd;color:#0b3f73}
  .seglbl{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 -4px}
  .chips.mth{display:grid;grid-template-columns:repeat(3,1fr)}
  .chips.mth button{padding:2px 6px;font-size:13.5px;line-height:1.25}
  /* 계획 */
  .psteps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
  .psteps button{min-height:48px;border-radius:12px;border:2px solid #d4dee8;background:#fff;cursor:pointer;padding:3px 6px;font-weight:800;font-size:13.5px;color:var(--ink2);line-height:1.25;word-break:keep-all;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .psteps button small{font-size:11.5px;font-weight:700;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .psteps button[aria-selected="true"]{border-color:var(--fab);background:#e9f3fd;color:#0b3f73}
  .psteps button.ok small{color:#0b3f73}
  .psteps button.bad{border-color:#e7a29b}
  .psteps .pm{min-width:44px;flex:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .row2 .btn{width:100%}
  /* 기록 */
  .rec{display:grid;gap:6px}
  .rc{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.55;word-break:keep-all;background:#fff}
  .rc .h{display:flex;gap:8px;align-items:baseline;font-weight:900;color:#0b3f73;font-size:13.5px}
  .rc .h small{font-weight:700;color:var(--muted)}
  .rc dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:4px 0 0}
  .rc dt{color:var(--muted);font-weight:700;font-size:12.5px}
  .rc dd{margin:0;color:var(--ink);font-weight:700}
  .rc .pre{font-size:12.5px;color:var(--muted);margin-top:2px}
  .left{font-size:13.5px;color:var(--ink2);line-height:1.6;word-break:keep-all}
  @media (max-width:900px){
    .tools{grid-template-columns:repeat(4,1fr)}
    .tools button{font-size:13.5px}
    header.top{flex-direction:column;align-items:stretch}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="ttl">
      <span class="eyebrow">탐구</span><h1>혼합물 분리 설계실</h1>
      <p class="sub" id="sub">물, 소금, 콩기름, 플라스틱 구슬이 섞여 버렸어요. 물질의 특성을 보고 분리 계획을 세운 뒤, 기구를 골라 직접 분리해 봐요.</p>
    </div>
    <div class="ptabs big tasks" role="tablist" id="tasks">
      <button type="button" role="tab" data-t="1" aria-selected="true">교과서 탐구</button>
      <button type="button" role="tab" data-t="2" aria-selected="false">도전 ①</button>
      <button type="button" role="tab" data-t="3" aria-selected="false">도전 ②</button>
      <button type="button" role="tab" data-t="4" aria-selected="false">내가 만든 혼합물</button>
    </div>
  </header>

  <div class="stage">
    <section class="card viewer">
      <div class="scene grow" id="lab" role="img" aria-label="실험대. 가운데에 분리할 혼합물이 든 비커가 있고, 오른쪽에 고른 기구(거름 장치, 분별 깔때기, 거름망 국자, 얼음물, 핫플레이트, 물이 든 비커)가 놓인다. 기구를 골라 실행하면 혼합물이 나뉘어 선반으로 옮겨진다."></div>
      <div class="shelf" id="shelf" aria-label="선반: 나뉜 물질이 담긴 그릇"></div>
    </section>

    <section class="card pad">
      <div class="ptabs" role="tablist" id="pt">
        <button type="button" role="tab" data-p="table" aria-selected="true" id="ptTable">1 특성 조사</button>
        <button type="button" role="tab" data-p="plan" aria-selected="false">2 계획</button>
        <button type="button" role="tab" data-p="lab" aria-selected="false">3 실험</button>
        <button type="button" role="tab" data-p="rec" aria-selected="false">기록</button>
      </div>

      <div class="pane" data-p="table">
        <div id="pick" hidden>
          <div class="seglbl">섞을 물질을 두 가지 이상 골라요</div>
          <div class="chips" id="pickChips"></div>
          <button class="btn primary" type="button" id="bMake" disabled>이 물질들로 혼합물 만들기</button>
        </div>
        <div id="tblBox"></div>
        <div class="row2" id="tblBtns"><button class="btn ghost" type="button" id="bMore">물에 녹는 정도도 보기</button><button class="btn primary" type="button" id="bToPlan">계획 세우기</button></div>
        <p class="tnote" id="tnote"></p>
        <p class="mnote">녹는 빠르기, 끓는 빠르기, 식는 빠르기, 거르는 빠르기, 구슬 수는 보기 좋게 정한 모형이에요.</p>
      </div>

      <div class="pane" data-p="plan" hidden>
        <div class="psteps" id="psteps"></div>
        <div class="seglbl">분리할 물질</div><div class="chips" id="cT"></div>
        <div class="seglbl">이용한 물질의 특성</div><div class="chips" id="cP"></div>
        <div class="seglbl">분리 방법</div><div class="chips mth" id="cM"></div>
        <div class="row2"><button class="btn ghost" type="button" id="bCheck">계획 점검하기</button><button class="btn primary" type="button" id="bGo">이 계획으로 실험하기</button></div>
        <div class="fbk" id="pres"><b class="t" id="presT">계획</b><span id="presM">첫번째 칸부터 골라요.</span></div>
      </div>

      <div class="pane" data-p="lab" hidden>
        <div class="goals" id="goals"></div>
        <div class="nextp" id="nextp" hidden></div>
        <div class="tools" id="tools"></div>
        <div class="runrow"><button class="btn primary" type="button" id="bRun">거르기</button></div>
        <div class="fbk" id="res"><b class="t" id="resT">결과</b><span id="resM">기구를 고르고 실행해요.</span></div>
      </div>

      <div class="pane" data-p="rec" hidden>
        <div class="goals" id="goals2"></div>
        <div class="rec" id="rec"></div>
        <p class="left" id="recLeft"></p>
      </div>
    </section>
  </div>
</div>
<script>
window.SM = { $: (s, r = document) => r.querySelector(s), $$: (s, r = document) => Array.from(r.querySelectorAll(s)),
  reduce: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), Q: new URLSearchParams(location.search) };
</script>
<script>
/*@@LOCAL:_mx.js@@*/
</script>
<script>
/* ===== 블록 1: 혼합물(과제) · 특성 표 ===== */
(() => {
  'use strict';
  try {
    const { $, $$ } = window.SM, N = MX.NAME;
    // 과제: 섞인 물질과 얻을 물질
    const TASKS = {
      1: { sub: '물, 소금, 콩기름, 플라스틱 구슬이 섞여 버렸어요. 물질의 특성을 보고 분리 계획을 세운 뒤, 기구를 골라 직접 분리해 봐요.', mix: { w: 100, oil: 40, amt: { salt: 10 }, beads: { pet: 5 } }, goals: ['pet', 'oil', 'salt'], steps: 3,
        first: { target: 'pet', prop: '용해도', method: 'filter' } },
      2: { sub: '쇠구슬, 나무 구슬, 소금이 마른 채로 섞였어요. 세 가지를 모두 따로 얻어 봐요. 물은 얼마든지 써도 돼요.', mix: { amt: { salt: 10 }, beads: { iron: 5, wood: 5 } }, goals: ['wood', 'iron', 'salt'], steps: 3 },
      3: { sub: '붕산 10 g, 황산 구리(Ⅱ) 10 g, 플라스틱 구슬이 섞였어요. 플라스틱 구슬과 순수한 붕산을 얻어 봐요.', mix: { amt: { boric: 10, cuso4: 10 }, beads: { pet: 5 } }, goals: ['pet', 'boric'], steps: 2 },
      4: { sub: '섞을 물질을 직접 골라 혼합물을 만들고, 어디까지 나눌 수 있는지 알아봐요.', mix: null, goals: [], steps: 3 },
    };
    // 특성: 끓는점·녹는점·밀도(교과서 표, 그림 Ⅰ-2·Ⅰ-9), 물 100 g에 녹는 양(그림 Ⅰ-6·Ⅰ-12)
    const PROPS = {
      water: ['100', '0', '1', '—'],
      salt: ['1465', '802', '2.17', '20 ℃ 35.9 g<small>온도가 바뀌어도 거의 같음</small>'],
      oil: ['200 이상', '−16', '0.92', '녹지 않음<small>물과 섞이지 않음</small>'],
      pet: ['350 이상', '250~255', '1.38', '녹지 않음'],
      iron: ['—', '1538.0', '7.87', '녹지 않음'],
      wood: ['—', '—', '물보다 작음', '녹지 않음'],
      boric: ['—', '—', '—', '70 ℃ 18.9 g<small>10 ℃ 3.7 g</small>'],
      cuso4: ['—', '—', '—', '70 ℃ 47.9 g<small>10 ℃ 16.8 g</small>'],
    };
    const ROWN = { water: '물', salt: '소금<small>염화 나트륨</small>', oil: '기름<small>콩기름</small>', pet: '플라스틱 구슬<small>PET</small>', iron: '쇠구슬<small>철</small>', wood: '나무 구슬', boric: '붕산', cuso4: '황산 구리(Ⅱ)' };
    const ORDER = ['water', 'salt', 'oil', 'pet', 'iron', 'wood', 'boric', 'cuso4'];
    const G = window.APP = { TASKS, task: 1, start: null, more: false, picked: new Set() };
    G.subsOf = (c) => ORDER.filter((k) => (k === 'water' ? c.w > 0 : k === 'oil' ? c.oil > 0 : MX.SOLS.includes(k) ? c.amt[k] > 0 : c.beads[k] > 0));
    G.table = function () {
      const subs = G.start ? G.subsOf(G.start) : [];
      const more = G.more || G.task !== 1;
      if (!subs.length) { $('#tblBox').innerHTML = ''; $('#tnote').textContent = ''; return; }
      $('#tblBox').innerHTML = `<table class="prop"><thead><tr><th>물질</th><th>끓는점(℃)</th><th>녹는점(℃)</th><th>밀도(g/mL)</th>${more ? '<th class="more">물 100 g에<br>녹는 양</th>' : ''}</tr></thead><tbody>${subs.map((k) => `<tr><td>${ROWN[k]}</td>${PROPS[k].slice(0, more ? 4 : 3).map((v, i) => `<td${i === 3 ? ' class="more"' : ''}>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      $('#bMore').hidden = G.task !== 1;
      $('#bMore').textContent = G.more ? '교과서 표만 보기' : '물에 녹는 정도도 보기';
      $('#tnote').innerHTML = G.task === 1 ? (G.more ? '교과서 활동하기 1의 "또 다른 물질의 특성"으로 물에 녹는 정도를 더했어요. 플라스틱 구슬은 물에 녹지 않아요.' : '교과서 활동하기 1의 표예요. 혼합물을 분리하려면 또 어떤 특성을 알아야 할까요?') : '—는 교과서에 값이 없는 칸이에요. 밀도·녹는점은 그림 Ⅰ-2·Ⅰ-9, 녹는 양은 그림 Ⅰ-6·Ⅰ-12 값이에요.';
    };
    // 내가 만든 혼합물: 재료 고르기
    const PICK = ['water', 'oil', 'salt', 'boric', 'cuso4', 'pet', 'iron', 'wood'];
    $('#pickChips').innerHTML = PICK.map((k) => `<button type="button" data-k="${k}" aria-pressed="false">${N[k]}</button>`).join('');
    $$('#pickChips button').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.k; if (G.picked.has(k)) G.picked.delete(k); else G.picked.add(k);
      b.setAttribute('aria-pressed', String(G.picked.has(k))); $('#bMake').disabled = G.picked.size < 2;
    }));
    G.makeCustom = function () {
      const p = G.picked, amt = {}, beads = {};
      ['salt', 'boric', 'cuso4'].forEach((k) => p.has(k) && (amt[k] = 10));
      ['pet', 'iron', 'wood'].forEach((k) => p.has(k) && (beads[k] = 5));
      TASKS[4].mix = { w: p.has('water') ? 100 : 0, oil: p.has('oil') ? 40 : 0, amt, beads };
      TASKS[4].goals = PICK.filter((k) => k !== 'water' && p.has(k));
      TASKS[4].steps = Math.max(1, Math.min(5, TASKS[4].goals.length));
    };
    window.SM.okTable = true;
  } catch (err) { window.SM_err('특성 표', err); }
})();
</script>
<script>
/* ===== 블록 2: 실험대 · 선반 · 실험 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S, Q = S.Q, G = window.APP, N = MX.NAME;
    const L = MX.lab($('#lab'));
    window.LAB = L;
    const TOOLS = [
      ['water', '물 붓기', '물 100 g'], ['hot', '뜨거운 물 붓기', '약 70 ℃ 물 100 g'], ['filter', '거름 장치', '녹지 않는 고체 거르기'], ['funnel', '분별 깔때기', '섞이지 않는 액체 나누기'],
      ['skim', '거름망 국자', '뜬 것 건지기'], ['cool', '얼음물', '10 ℃로 식히기'], ['heat', '핫플레이트', '가열하여 물 날려 보내기'],
    ];
    const RUN = { water: '물 붓기', hot: '뜨거운 물 붓기', filter: '거르기', funnel: '분별 깔때기에 넣고 나누기', skim: '뜬 것 건지기', cool: '얼음물에 넣기', heat: '가열하기' };
    G.box = []; G.sel = -1; G.recs = []; G.pre = [];
    function msg(t, m, cls = '') { $('#res').className = 'fbk ' + cls; $('#resT').textContent = t; $('#resM').innerHTML = m; }
    G.msg = msg;
    const got = () => new Set(G.box.map(MX.pureOf).filter(Boolean));
    function goals() {
      const g = got(), goalsL = G.TASKS[G.task].goals;
      const h = goalsL.length ? `<span>얻을 물질</span>${goalsL.map((k) => `<span class="g${g.has(k) ? ' on' : ''}">${N[k]}</span>`).join('')}` : '';
      $('#goals').innerHTML = h; $('#goals2').innerHTML = h;
    }
    // 선반
    function shelf(popId) {
      const sh = $('#shelf');
      sh.innerHTML = `<span class="cap">선반</span>${G.box.map((c, i) => { const p = MX.pureOf(c); return `<button type="button" class="slot${p ? ' pure' : ''}" data-i="${i}" aria-pressed="${i === G.sel}" aria-label="${MX.label(c)}${i === G.sel ? ', 실험대 위' : ''}"><canvas></canvas><span>${MX.label(c)}</span></button>`; }).join('')}<span class="sp"></span><button class="vb" type="button" id="bReset">처음부터</button>`;
      $$('#shelf .slot').forEach((b) => {
        const i = +b.dataset.i; MX.thumb(b.querySelector('canvas'), G.box[i]);
        if (popId != null && G.box[i].id === popId) { b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 350); }
        b.addEventListener('click', () => { if (L.busy) return; G.sel = i; L.setWork(G.box[i]); shelf(); tools(); msg('실험대', `<b>${MX.label(G.box[i])}</b>${MX.jo(MX.label(G.box[i]).slice(-1), '을/를').slice(-1)} 실험대에 올렸어요. 기구를 골라요.`); });
      });
      $('#bReset').addEventListener('click', () => { if (!L.busy) G.load(G.task); });
    }
    G.shelf = shelf;
    function tools() {
      const t = L.tool, nx = G.planNext && G.planNext();
      $('#tools').innerHTML = TOOLS.map(([id, name, sm]) => `<button type="button" data-t="${id}" aria-pressed="${t === id}" class="${nx && nx.tools.includes(id) ? 'plan' : ''}"${L.busy ? ' disabled' : ''}>${name}<small>${sm}</small></button>`).join('');
      $$('#tools button').forEach((b) => b.addEventListener('click', () => { L.setTool(b.dataset.t); tools(); }));
      $('#bRun').textContent = RUN[t];
      $('#bRun').disabled = L.busy || G.sel < 0;
      const np = $('#nextp');
      if (nx) { np.hidden = false; np.innerHTML = `계획 ${nx.ord} · <b>${N[nx.target]}</b> — ${nx.name}`; } else np.hidden = true;
      goals();
    }
    G.tools = tools;
    G.load = function (task, keepMsg) {
      G.task = task;
      const T = G.TASKS[task];
      G.start = T.mix ? MX.mk(T.mix) : null;
      G.box = G.start ? [MX.clone(G.start)] : []; G.sel = G.box.length ? 0 : -1; G.recs = []; G.pre = [];
      L.setWork(G.sel >= 0 ? G.box[0] : null); L.setHint(null);
      $('#sub').textContent = T.sub;
      shelf(); G.table(); G.planReset && G.planReset(); tools(); G.renderRec && G.renderRec();
      if (!keepMsg) msg('결과', G.sel >= 0 ? '혼합물이 실험대에 있어요. 기구를 골라 실행해요.' : '먼저 1 특성 조사 탭에서 섞을 물질을 골라 혼합물을 만들어요.');
    };
    // 실행
    function runIt() {
      if (L.busy || G.sel < 0) return;
      const tool = L.tool, before = G.box[G.sel];
      const res = L.runTool((r) => {
        if (!r.ok) return;
        // 선반 갱신: 원래 그릇 자리에 결과를 넣음
        const outs = r.outs, i0 = G.sel, newGot = outs.map(MX.pureOf).filter((k) => k && !G.box.some((c) => c !== before && MX.pureOf(c) === k));
        G.box.splice(i0, 1, ...outs);
        G.sel = r.main >= 0 ? i0 + r.main : -1;
        if (G.sel < 0) { const j = G.box.findIndex((c) => !MX.pureOf(c)); if (j >= 0) { G.sel = j; L.setWork(G.box[j]); } }
        // 기록
        if (MX.PROP[tool]) G.recs.push({ tool, prop: MX.PROP[tool], got: newGot.filter((k) => k !== 'water'), left: G.box.filter((c) => !MX.pureOf(c)).map(MX.label), pre: G.pre.slice(), lost: r.lost });
        else G.pre.push(tool);
        if (MX.PROP[tool]) G.pre = [];
        G.planAdvance && G.planAdvance(newGot);
        const popId = outs.find((o) => MX.pureOf(o)) ? outs.find((o) => MX.pureOf(o)).id : null;
        L.setHint(G.box.some((c) => !MX.pureOf(c)) ? null : '혼합물을 모두 나눴어요<br>기록 탭에서 내 설계를 확인해요');
        shelf(popId); tools(); G.renderRec && G.renderRec();
        const all = G.TASKS[G.task].goals.length && G.TASKS[G.task].goals.every((k) => got().has(k));
        if (all) msg('결과 · 모두 얻었어요', r.msg + ` <b>얻을 물질을 모두 얻었어요.</b> 분리 ${G.recs.length}번으로 끝냈어요. 기록 탭에서 내 설계를 확인하고, 다른 순서로도 해 봐요.`, 'ok');
        else msg(newGot.length ? `결과 · ${N[newGot[0]]}${newGot.length > 1 ? ' 등' : ''} 분리` : '결과', r.msg + (G.sel < 0 && G.box.length ? ' 선반에서 다음에 나눌 그릇을 골라요.' : ''), newGot.length ? 'ok' : '');
      });
      if (res && !res.ok) { msg('이 기구로는 할 수 없어요', res.msg, 'no'); return; }
      if (res) { msg('실험 중', `${MX.TOOL[tool]} 중이에요…`); tools(); }
    }
    $('#bRun').addEventListener('click', runIt);
    setInterval(() => { if (tools._b !== L.busy) { tools._b = L.busy; tools(); } }, 200);
    // 검사용: ?task=2&do=water,skim&tool=filter
    G.instantDo = (list) => list.forEach((t) => { if (G.sel < 0) return; L.setTool(t); const before = G.box[G.sel], r = L.instant(t); if (r && r.ok) { const newGot = r.outs.map(MX.pureOf).filter((k) => k && k !== 'water'); G.box.splice(G.sel, 1, ...r.outs); G.sel = r.main >= 0 ? G.box.indexOf(r.outs[r.main]) : G.box.findIndex((c) => !MX.pureOf(c)); if (G.sel >= 0) L.setWork(G.box[G.sel]); if (MX.PROP[t]) { G.recs.push({ tool: t, prop: MX.PROP[t], got: newGot, left: G.box.filter((c) => !MX.pureOf(c)).map(MX.label), pre: G.pre.slice(), lost: r.lost }); G.pre = []; } else G.pre.push(t); msg('결과', r.msg, newGot.length ? 'ok' : ''); } else if (r) msg('이 기구로는 할 수 없어요', r.msg, 'no'); });
    window.SM.okUI = true;
  } catch (err) { window.SM_err('실험대', err); }
})();
</script>
<script>
/* ===== 블록 3: 계획 세우기 ===== */
(() => {
  'use strict';
  try {
    const { $, $$ } = window.SM, G = window.APP, N = MX.NAME;
    const ORD = ['첫번째', '두번째', '세번째', '네번째', '다섯번째'];
    const PR = ['밀도', '용해도', '끓는점', '녹는점'];
    const MK = Object.keys(MX.PLAN_M);
    const TOOLS_OF = { filter: ['filter'], wfilter: ['water', 'filter'], hfilter: ['hot', 'filter'], funnel: ['funnel'], skim: ['water', 'skim'], coolf: ['cool', 'filter'], heat: ['heat'] };
    G.plan = []; G.pcur = 0; G.pdone = 0; G.pcheck = null;
    G.planReset = function () {
      const T = G.TASKS[G.task];
      G.plan = Array.from({ length: T.steps }, () => ({ target: null, prop: null, method: null }));
      if (T.first) Object.assign(G.plan[0], T.first);
      G.pcur = T.first ? 1 : 0; G.pdone = 0; G.pcheck = null; render();
      pmsg('계획', T.first ? '교과서처럼 첫번째는 채워 두었어요. 두번째 칸부터 골라요.' : '첫번째 칸부터 골라요. 어떤 것을 처음 분리해 낼까요?');
    };
    function pmsg(t, m, cls = '') { $('#pres').className = 'fbk ' + cls; $('#presT').textContent = t; $('#presM').innerHTML = m; }
    function render() {
      const T = G.TASKS[G.task], s = G.plan[G.pcur] || {};
      const chk = G.pcheck;
      $('#psteps').innerHTML = G.plan.map((p, i) => { const st = chk && chk.steps[i]; return `<button type="button" role="tab" data-i="${i}" aria-selected="${i === G.pcur}" class="${st ? (st.ok && !st.propBad ? 'ok' : 'bad') : ''}">${ORD[i]}<small>${p.target ? N[p.target] : '아직 안 정함'}</small></button>`; }).join('') +
        `<button type="button" class="pm" id="bAdd" aria-label="단계 더하기"${G.plan.length >= 5 ? ' disabled' : ''}>+</button><button type="button" class="pm" id="bDel" aria-label="마지막 단계 빼기"${G.plan.length <= 1 ? ' disabled' : ''}>−</button>`;
      $('#cT').innerHTML = T.goals.map((k) => `<button type="button" data-v="${k}" aria-pressed="${s.target === k}">${N[k]}</button>`).join('') || '<span class="tnote">먼저 혼합물을 만들어요.</span>';
      $('#cP').innerHTML = PR.map((k) => `<button type="button" data-v="${k}" aria-pressed="${s.prop === k}">${k}</button>`).join('');
      $('#cM').innerHTML = MK.map((k) => `<button type="button" data-v="${k}" aria-pressed="${s.method === k}">${MX.PLAN_M[k].name}</button>`).join('');
      $$('#psteps [data-i]').forEach((b) => b.addEventListener('click', () => { G.pcur = +b.dataset.i; render(); }));
      $('#bAdd').addEventListener('click', () => { G.plan.push({ target: null, prop: null, method: null }); G.pcur = G.plan.length - 1; G.pcheck = null; render(); });
      $('#bDel').addEventListener('click', () => { G.plan.pop(); G.pcur = Math.min(G.pcur, G.plan.length - 1); G.pcheck = null; render(); });
      [['#cT', 'target'], ['#cP', 'prop'], ['#cM', 'method']].forEach(([sel, key]) => $$(sel + ' button').forEach((b) => b.addEventListener('click', () => {
        G.plan[G.pcur][key] = b.dataset.v; G.pcheck = null;
        const p = G.plan[G.pcur];
        if (p.target && p.prop && p.method && G.pcur < G.plan.length - 1 && key !== 'target') { const nx = G.plan.findIndex((q) => !q.target || !q.prop || !q.method); if (nx >= 0 && nx !== G.pcur) G.pcur = nx; }
        render();
      })));
      G.tools && G.tools();
    }
    $('#bCheck').addEventListener('click', () => {
      if (!G.start) { pmsg('계획', '먼저 혼합물을 만들어요.', 'no'); return; }
      const r = G.pcheck = MX.dryRun(G.start, G.plan); render();
      const bad = r.steps.filter((s) => !s.ok || s.propBad);
      const goalsL = G.TASKS[G.task].goals, left = goalsL.filter((k) => !r.box.some((c) => MX.pureOf(c) === k));
      if (!bad.length && !left.length) pmsg('계획 점검 · 좋아요', `이 계획대로 하면 <b>${MX.names(goalsL)}</b>${MX.jo(N[goalsL[goalsL.length - 1]], '을/를').slice(-1)} 모두 얻을 수 있어요. <b>이 계획으로 실험하기</b>를 눌러 직접 해 봐요.`, 'ok');
      else {
        const s = bad[0];
        pmsg('계획 점검 · 다시 생각해 봐요', s ? `<b>${ORD[s.i]}</b>: ${s.notes.join(' ')}` : `계획대로 하면 <b>${MX.names(left)}</b>${MX.jo(N[left[left.length - 1]], '이/가').slice(-1)} 아직 따로 나오지 않아요. 단계를 더하거나 순서를 바꿔 봐요.`, 'no');
        if (s) { G.pcur = s.i; render(); }
      }
    });
    $('#bGo').addEventListener('click', () => { G.pdone = 0; G.show('lab'); G.tools(); const nx = G.planNext(); if (nx) { window.LAB.setTool(nx.tools[0] === 'water' && nx.method === 'skim' ? 'water' : nx.tools[0]); G.tools(); } });
    // 실험 중 다음 계획 단계
    G.planNext = function () {
      const p = G.plan[G.pdone];
      if (!p || !p.target || !p.method) return null;
      return { ord: ORD[G.pdone], target: p.target, name: MX.PLAN_M[p.method].name, tools: TOOLS_OF[p.method], method: p.method };
    };
    G.planAdvance = function (newGot) { const p = G.plan[G.pdone]; if (p && newGot.includes(p.target)) G.pdone++; };
    window.SM.okPlan = true;
  } catch (err) { window.SM_err('계획 세우기', err); }
})();
</script>
<script>
/* ===== 블록 4: 기록 · 탭 · 시작 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S, Q = S.Q, G = window.APP, N = MX.NAME;
    const ORD = ['첫번째', '두번째', '세번째', '네번째', '다섯번째', '여섯번째', '일곱번째', '여덟번째'];
    G.renderRec = function () {
      const R = G.recs;
      if (!R.length) { $('#rec').innerHTML = '<div class="rc">아직 분리한 기록이 없어요. 실험 탭에서 기구를 골라 실행하면 교과서 설계 칸처럼 여기에 차례로 적혀요.</div>'; $('#recLeft').textContent = ''; return; }
      $('#rec').innerHTML = R.map((r, i) => `<div class="rc"><div class="h">${ORD[i] || (i + 1) + '번째'}<small>${MX.TOOL[r.tool]}</small></div>
        ${r.pre.length ? `<div class="pre">그 전에: ${r.pre.map((t) => MX.TOOL[t]).join(', ')}</div>` : ''}
        <dl><dt>분리한 물질</dt><dd>${r.got.length ? MX.names(r.got) : '따로 나온 물질 없음'}</dd><dt>이용한 특성</dt><dd>${r.prop}</dd><dt>분리 방법</dt><dd>${MX.TOOL[r.tool]}${r.lost ? ' (물은 날아감)' : ''}</dd><dt>남은 물질</dt><dd>${r.left.length ? r.left.join(' / ') : '없음'}</dd></dl></div>`).join('');
      const goalsL = G.TASKS[G.task].goals, gotS = new Set(G.box.map(MX.pureOf).filter(Boolean)), left = goalsL.filter((k) => !gotS.has(k));
      $('#recLeft').innerHTML = left.length ? `아직 얻지 못한 물질: <b>${MX.names(left)}</b>` : `얻을 물질을 모두 얻었어요. 분리 ${R.length}번. 다른 모둠이라면 어떤 순서로 했을까요? <b>처음부터</b>를 눌러 다른 방법으로도 해 봐요.`;
    };
    G.show = function (p) { $$('#pt button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.p === p))); $$('.pane').forEach((e) => (e.hidden = e.dataset.p !== p)); };
    $$('#pt button').forEach((b) => b.addEventListener('click', () => G.show(b.dataset.p)));
    $('#bMore').addEventListener('click', () => { G.more = !G.more; G.table(); });
    $('#bToPlan').addEventListener('click', () => G.show('plan'));
    $('#bMake').addEventListener('click', () => { G.makeCustom(); G.load(4); $('#pick').hidden = false; G.msg('결과', '혼합물을 만들었어요. 특성 표를 보고 계획을 세워요.'); });
    function task(t) {
      if (window.LAB.busy) return;
      $$('#tasks button').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.t === t)));
      $('#pick').hidden = t !== 4;
      $('#ptTable').textContent = t === 4 ? '1 재료·특성' : '1 특성 조사';
      if (t === 4 && !G.picked.size) { G.TASKS[4].mix = null; G.TASKS[4].goals = []; }
      G.load(t); G.show('table');
    }
    $$('#tasks button').forEach((b) => b.addEventListener('click', () => task(+b.dataset.t)));
    // 시작 (검사용 주소: ?task=1&pane=lab&do=filter&tool=funnel&plan=1&pick=water,oil,salt)
    const t0 = +(Q.get('task') || 1);
    if (Q.get('pick')) { Q.get('pick').split(',').forEach((k) => G.picked.add(k)); $$('#pickChips button').forEach((b) => b.setAttribute('aria-pressed', String(G.picked.has(b.dataset.k)))); $('#bMake').disabled = G.picked.size < 2; G.makeCustom(); }
    task(t0);
    if (Q.get('plan') === '1' && t0 === 1) { G.plan = [{ target: 'pet', prop: '용해도', method: 'filter' }, { target: 'oil', prop: '밀도', method: 'funnel' }, { target: 'salt', prop: '끓는점', method: 'heat' }]; $('#bCheck').click(); }
    if (Q.get('plan') === 'bad' && t0 === 1) { G.plan = [{ target: 'pet', prop: '용해도', method: 'filter' }, { target: 'salt', prop: '끓는점', method: 'heat' }, { target: 'oil', prop: '밀도', method: 'funnel' }]; $('#bCheck').click(); }
    if (Q.get('do')) G.instantDo(Q.get('do').split(','));
    if (Q.get('tool')) window.LAB.setTool(Q.get('tool'));
    if (Q.get('do') || Q.get('tool')) { G.shelf(); G.tools(); G.renderRec(); }
    if (Q.get('pane')) G.show(Q.get('pane'));
    if (Q.get('more') === '1') { G.more = true; G.table(); }
    if (Q.get('run')) setTimeout(() => $('#bRun').click(), 300);
  } catch (err) { window.SM_err('기록·탭', err); }
})();
</script>
