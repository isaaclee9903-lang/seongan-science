<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같은 족 원소의 성질 – 원소 그림 카드</title>
<!--@@PART:errbox_sim.html@@-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/*@@PART:css_sim.css@@*/
/*@@LOCAL:_css_ps.css@@*/
/*@@LOCAL:_css_sim.css@@*/
/*@@LOCAL:_css_pf.css@@*/
.viewer{display:flex;flex-direction:column}.crd{flex:1 1 auto;margin:18px auto;width:min(420px,84%);border-radius:20px;border:2px solid #14263b;background:linear-gradient(#fff,#f7fafc);padding:18px 20px;display:flex;flex-direction:column;word-break:keep-all;min-height:0}.cdz{font-size:28px;font-weight:800;color:#0e63b3}.cn{font-size:36px;font-weight:800;margin-top:4px}.ce{font-size:18px;color:#5a6b7e;font-weight:700;margin-bottom:10px}.ci{flex:1;border:1px dashed #9fb2c3;border-radius:14px;padding:12px;color:#5a6b7e;font-size:15px;line-height:1.5;overflow:auto;min-height:80px}.cf{margin-top:10px;font-size:15px;line-height:1.5;font-weight:600;min-height:44px}.fbtxt{min-height:44px}.slx input{touch-action:pan-y}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="ttl"><span class="eyebrow">과학적 방법으로 문제 해결</span><h1>나만의 원소 그림 카드</h1>
    <p class="sub">원소 하나를 골라 특징을 적고 그림 구상을 정리해요. 완성한 카드는 공유 플랫폼에 올려 발표해요.</p></div></header>
  <div class="stage">
    <section class="card viewer"><div class="crd" id="crd"><div class="cdz"><span id="zn">1</span></div><div class="cn" id="cn">수소</div><div class="ce" id="ce">Hydrogen</div><div class="ci" id="ci"></div><div class="cf" id="cf"></div></div><div class="vctl"><span class="hint">글자로 구상한 뒤 그림은 직접 그려요</span></div></section>
    <section class="card pad"><div class="ptabs" role="tablist" id="pt"><button type="button" role="tab" data-p="lab" aria-selected="true">구상하기</button><button type="button" role="tab" data-p="why" aria-selected="false">돌아보기</button></div>
      <div class="pane" data-p="lab"><div class="slx"><label for="zz">원자 번호</label><input type="range" id="zz" min="1" max="20" value="1"></div><input class="fbtxt" id="nn" value="수소" placeholder="원소 이름"><input class="fbtxt" id="ee" value="H" placeholder="원소 기호"><textarea class="fbtxt" id="ff" rows="3" placeholder="조사한 특징. 예: 가장 작고 가벼운 원소"></textarea><textarea class="fbtxt" id="pp" rows="2" placeholder="어떻게 그릴지 구상"></textarea><button class="btn ghost" id="cp" type="button" style="width:100%;margin-top:6px">카드 복사하기</button></div>
      <div class="pane" data-p="why" hidden><div class="peer"><label><input type="checkbox"><span>원소 그림 카드에 원소의 특징이 잘 반영되었는가?</span></label><label><input type="checkbox"><span>원소 그림 카드를 창의적으로 표현하였는가?</span></label><label><input type="checkbox"><span>원소를 정하는 과정에서 모둠원끼리 서로의 의견을 존중하였는가?</span></label></div></div></section>
  </div>
</div>
<script>
/*@@LOCAL:_ps.js@@*/
</script>
<script>
/*@@LOCAL:_eg.js@@*/
</script>
<script>
(() => {
  'use strict';
  try {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const q = new URLSearchParams(location.search);
    const say = (t, m, c = '') => { $('#res').className = 'fbk ' + c; $('#resT').textContent = t; $('#resM').innerHTML = m; };
    const up = () => { $('#zn').textContent = $('#zz').value; $('#cn').textContent = $('#nn').value; $('#ce').textContent = $('#ee').value; $('#cf').textContent = $('#ff').value; $('#ci').textContent = $('#pp').value; $('#zz').style.setProperty('--v', ($('#zz').value - 1) / 19 * 100 + '%'); };
    ['zz', 'nn', 'ee', 'ff', 'pp'].forEach((i) => $('#' + i).addEventListener('input', up)); up();
    $('#cp').addEventListener('click', async () => { const b = $('#cp'), t = `[나만의 원소 그림 카드]\n원자 번호: ${$('#zz').value}\n원소: ${$('#nn').value} (${$('#ee').value})\n특징: ${$('#ff').value}\n구상: ${$('#pp').value}`; try { await navigator.clipboard.writeText(t); b.textContent = '복사했어요'; } catch (e) { b.textContent = '칸을 길게 눌러 복사해요'; } setTimeout(() => { b.textContent = '카드 복사하기'; }, 2000); });
    const tab = (p) => { $$('#pt button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.p === p))); $$('.pane').forEach((e) => { e.hidden = e.dataset.p !== p; }); };
    $$('#pt button').forEach((b) => b.addEventListener('click', () => tab(b.dataset.p)));
    if (q.get('tab')) tab(q.get('tab'));
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('원소 그림 카드', err); }
})();
</script>
</body>
</html>
