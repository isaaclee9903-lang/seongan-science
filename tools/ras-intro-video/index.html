      @font-face { font-family: "Pretendard"; src: url("assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; }
      :root { --bg: #edf3f8; --paper: #f7fafc; --ink: #14263b; --ink2: #34495e; --muted: #5a6b7e; --hair: #d5dfe9; --accent: #0e63b3; --accent-soft: #e3effb; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: "Pretendard", sans-serif; color: var(--ink); background: var(--bg); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }

      /* ① 하굣길: 선으로 그린 거리 */
      #s1 svg.street { position: absolute; left: 0; top: 0; height: 1080px; }
      #s1-student { position: absolute; left: 250px; top: 120px; width: 720px; height: 960px; }
      #s1-student svg { width: 100%; height: 100%; display: block; }
      .lostword { position: absolute; display: block; white-space: nowrap; font-weight: 600; color: var(--muted); font-size: 40px; letter-spacing: -0.02em; }
      .thought { position: absolute; left: 1080px; top: 560px; font-size: 38px; font-weight: 500; color: var(--ink2); letter-spacing: -0.02em; white-space: nowrap; }

      /* ② 태블릿 */
      #s2-wrap { position: absolute; inset: 0; transform-origin: 960px 500px; opacity: 0; }
      .device { position: absolute; left: 380px; top: 130px; width: 1160px; height: 740px; border-radius: 44px; background: var(--ink); box-shadow: 0 40px 90px rgba(20, 38, 59, 0.18); }
      .desk { position: absolute; left: 140px; right: 140px; top: 930px; height: 2px; background: #c9d6e3; }
      #v-hub { position: absolute; left: 400px; top: 150px; width: 1120px; height: 700px; border-radius: 24px; object-fit: cover; background: #fff; }

      /* ③ ⑧ 옆얼굴 카메라 */
      .pfcam { position: absolute; inset: 0; transform-origin: 960px 540px; }
      .pfcam svg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

      /* 머릿속 */
      .vwrap { position: absolute; inset: 0; opacity: 0; }
      .vwrap .frame { position: absolute; left: 400px; top: 150px; width: 1120px; height: 700px; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(20, 38, 59, 0.08), 0 30px 80px rgba(20, 38, 59, 0.14); }
      .vwrap .frame video { position: absolute; left: 0; top: 0; width: 1120px; height: 700px; object-fit: cover; }
      .vwrap .zoom { position: absolute; inset: 0; transform-origin: 0 0; }
      #rail { position: absolute; left: 0; right: 0; top: 960px; height: 90px; opacity: 0; }
      #rail .line { position: absolute; left: 600px; top: 14px; width: 720px; height: 2px; background: #c9d6e3; }
      #rail .fill { position: absolute; left: 0; top: 0; width: 720px; height: 2px; background: var(--accent); transform-origin: 0 50%; }
      #rail .node { position: absolute; top: 7px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--bg); border: 2px solid #c9d6e3; }
      #rail .lab { position: absolute; top: 38px; width: 220px; margin-left: -110px; text-align: center; font-size: 21px; font-weight: 600; color: #5a6b7e; }
      .frag { position: absolute; display: block; white-space: nowrap; font-size: 28px; line-height: 1; font-weight: 700; color: #4f6175; letter-spacing: -0.02em; transform-origin: 50% 50%; }
      .frag-u { position: absolute; left: 0; right: 0; bottom: -10px; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; }

      /* ⑨ 표어 */
      .lg { position: absolute; width: 74px; height: 74px; border-radius: 17px; }
      #end-brand { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 28px; font-weight: 700; color: var(--muted); }
      #end-brand b { color: var(--accent); font-weight: 900; }
      #end-title { position: absolute; left: 0; right: 0; top: 528px; display: flex; justify-content: center; gap: 20px; }
      #end-title span { display: block; font-size: 68px; font-weight: 800; letter-spacing: -0.035em; color: var(--ink); }
    </style>

    <!-- 1. 그림 만들기 (정해진 수열만 써서 매번 같은 그림) -->
    <script>
      try {
        let seed = 11;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        // 옆얼굴 복제: id 앞머리를 장면마다 바꿈
        const tplEl = document.getElementById("pf-tpl"), tpl = tplEl.firstElementChild.innerHTML; tplEl.remove();
        function profile(svgId, prefix) {
          const svg = document.getElementById(svgId);
          svg.innerHTML = tpl.replace(/pf-/g, prefix + "-");
          // 홍채 결 (확대했을 때만 보임)
          const g = document.getElementById(prefix + "-fibers");
          let s = "";
          for (let i = 0; i < 90; i++) {
            const a = (i / 90) * Math.PI * 2 + rnd() * 0.05, r0 = 3.0 + rnd() * 0.4, r1 = 5.0 + rnd() * 1.0;
            s += `<line x1="${(570 + Math.cos(a) * r0 * 0.82).toFixed(3)}" y1="${(421 + Math.sin(a) * r0).toFixed(3)}" x2="${(570 + Math.cos(a) * r1 * 0.82).toFixed(3)}" y2="${(421 + Math.sin(a) * r1).toFixed(3)}" stroke="${i % 3 ? "#46566a" : "#8392a3"}" stroke-width="1" vector-effect="non-scaling-stroke" opacity="${(0.35 + rnd() * 0.35).toFixed(2)}"/>`;
          }
          g.innerHTML = s;
        }
        profile("s1-svg", "p1");
        profile("s3-svg", "p3");
        profile("s8-svg", "p8");
        document.getElementById("p1-tab").remove();
        // 걷는 장면: 걱정스러운 눈썹과 입
        document.getElementById("p1-brow").setAttribute("d", "M540 394 C552 386 568 386 582 392");
        document.getElementById("p1-mouth").setAttribute("d", "M600 553 C594 555 588 556 583 557");

        // 거리: 가는 선 건물과 가로등
        const st = "#14263b";
        let far = "";
        for (let x = 0; x < 4200;) {
          const w = 150 + Math.floor(rnd() * 200), h = 160 + Math.floor(rnd() * 300);
          far += `<rect x="${x}" y="${900 - h}" width="${w}" height="${h}" fill="#e6edf4" stroke="${st}" stroke-opacity=".16" stroke-width="2"/>`;
          for (let wy = 900 - h + 34; wy < 860; wy += 52)
            for (let wx = x + 24; wx < x + w - 34; wx += 44)
              if (rnd() > 0.55) far += `<rect x="${wx}" y="${wy}" width="16" height="22" fill="none" stroke="${st}" stroke-opacity=".14" stroke-width="2"/>`;
          x += w + 10 + Math.floor(rnd() * 40);
        }
        document.getElementById("s1-far").innerHTML = far;
        let near = `<line x1="0" y1="980" x2="5200" y2="980" stroke="${st}" stroke-opacity=".3" stroke-width="2"/>`;
        for (let lx = 200; lx < 5200; lx += 760) {
          near += `<path d="M${lx} 980 L${lx} 300 Q${lx} 270 ${lx + 40} 270 L${lx + 90} 270" fill="none" stroke="${st}" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
            <path d="M${lx + 64} 270 L${lx + 116} 270 L${lx + 104} 286 L${lx + 76} 286 Z" fill="#fbfdff" stroke="${st}" stroke-opacity=".38" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M${lx + 76} 290 L${lx - 40} 980 L${lx + 220} 980 L${lx + 104} 290 Z" fill="#fbfdff" opacity=".55"/>`;
        }
        for (let k = 0; k < 40; k++) near += `<line x1="${k * 140}" y1="1030" x2="${k * 140 + 60}" y2="1030" stroke="${st}" stroke-opacity=".12" stroke-width="2"/>`;
        document.getElementById("s1-near").innerHTML = near;
      } catch (e) { console.error(e); }
    </script>

    <!-- 2. 타임라인 -->
    <script>
      (async () => {
        try {
          await Promise.all([document.fonts.load('700 28px "Pretendard"'), document.fonts.load('500 38px "Pretendard"'), document.fonts.load('800 68px "Pretendard"')]);
          const tl = gsap.timeline({ paused: true });
          const $ = (id) => document.getElementById(id);
          const cv = document.createElement("canvas").getContext("2d");
          const textW = (txt, font) => { cv.font = font; return cv.measureText(txt).width; };

          // 옆얼굴 카메라: 목표점으로 곧게 확대 (폭은 로그로 보간, 선 굵기는 그대로)
          const AR = 9 / 16;
          function camDriver(svgId, wrapId, start, end, segs) {
            const svg = $(svgId), wrap = $(wrapId), clock = { t: start };
            const ease = segs.map((s) => gsap.parseEase(s.ease || "power2.inOut"));
            const apply = () => {
              const t = clock.t;
              let i = segs.findIndex((s) => t < s.t1);
              if (i < 0) i = segs.length - 1;
              const s = segs[i];
              const p = ease[i](Math.min(1, Math.max(0, (t - s.t0) / (s.t1 - s.t0))));
              const [x0, y0, w0] = s.from, [x1, y1, w1] = s.to;
              const w = Math.exp(Math.log(w0) + (Math.log(w1) - Math.log(w0)) * p);
              const same = Math.abs(w0 - w1) < 1e-9, k = same ? p : (w - w1) / (w0 - w1);
              const cx = same ? x0 + (x1 - x0) * p : x1 + (x0 - x1) * k;
              const cy = same ? y0 + (y1 - y0) * p : y1 + (y0 - y1) * k;
              svg.setAttribute("viewBox", `${(cx - w / 2).toFixed(4)} ${(cy - (w * AR) / 2).toFixed(4)} ${w.toFixed(4)} ${(w * AR).toFixed(4)}`);
              const r = s.rot ? s.rot[0] + (s.rot[1] - s.rot[0]) * p : 0;
              wrap.style.transform = `rotate(${r.toFixed(3)}deg)`;
            };
            apply();
            tl.fromTo(clock, { t: start }, { t: end, duration: end - start, ease: "none", onUpdate: apply }, start);
          }

          // ── ① 하굣길 ──
          tl.fromTo("#s1-far", { x: 0 }, { x: -620, duration: 6.3, ease: "none" }, 0);
          tl.fromTo("#s1-near", { x: 0 }, { x: -1700, duration: 6.3, ease: "none" }, 0);
          tl.fromTo("#s1-student", { y: 0 }, { y: -8, duration: 0.42, ease: "sine.inOut", repeat: 13, yoyo: true }, 0);
          const lw = [[860, 260, 1.0], [990, 200, 1.45], [820, 150, 1.9], [1080, 300, 2.35], [930, 110, 2.8]];
          lw.forEach((w, i) => {
            gsap.set("#lw" + i, { left: w[0], top: w[1] });
            tl.fromTo("#lw" + i, { opacity: 0, y: 24, filter: "blur(0px)" }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, w[2]);
            tl.to("#lw" + i, { y: -120, x: 30 + i * 10, filter: "blur(14px)", opacity: 0, duration: 1.7, ease: "power1.in" }, w[2] + 0.5);
          });
          tl.fromTo("#thought", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.4);
          tl.to("#thought", { opacity: 0, duration: 0.4 }, 5.7);
          tl.to("#s1", { opacity: 0, duration: 0.3, ease: "none" }, 6.0);

          // ── ② 태블릿 ──
          tl.fromTo("#s2-wrap", { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 6.0);
          tl.to("#s2-wrap", { scale: 1.08, duration: 1.0, ease: "power2.in" }, 8.9);
          tl.to("#s2-wrap", { opacity: 0, duration: 0.25, ease: "none" }, 9.8);

          // ── ③ 옆얼굴 → 눈 → 동공에 비친 라스 화면 ──
          const WIDE = [600, 480, 1240], NEAR = [585, 460, 980], EYE = [563, 421, 64], REFL = [571.5, 420.6, 1.45];
          camDriver("s3-svg", "s3-cam", 9.9, 13.3, [
            { t0: 9.9, t1: 10.95, from: WIDE, to: NEAR, ease: "sine.inOut" },
            { t0: 10.95, t1: 11.7, from: NEAR, to: EYE, ease: "power3.inOut" },
            { t0: 11.7, t1: 12.15, from: EYE, to: EYE, ease: "none" },
            { t0: 12.15, t1: 12.95, from: EYE, to: REFL, ease: "power3.in", rot: [0, 8] },
            { t0: 12.95, t1: 13.3, from: REFL, to: REFL, ease: "none", rot: [8, 8] },
          ]);
          tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 9.9);
          // 눈 깜박임
          tl.set("#p3-shut", { opacity: 1 }, 10.4).set("#p3-lid, #p3-low", { opacity: 0 }, 10.4);
          tl.set("#p3-shut", { opacity: 0 }, 10.52).set("#p3-lid", { opacity: 1 }, 10.52).set("#p3-low", { opacity: 0.55 }, 10.52);
          tl.fromTo("#p3-pupil", { attr: { rx: 2.7, ry: 3.5 } }, { attr: { rx: 3.1, ry: 3.9 }, duration: 0.45, ease: "power2.out" }, 11.75);
          // 비친 화면이 화면을 채우면 머릿속 바탕으로 녹아듦
          tl.to("#s3", { opacity: 0, duration: 0.35, ease: "power1.in" }, 12.95);

          // ── 머릿속: 레일, 낱말 조각 ──
          const railX = [600, 840, 1080, 1320], railLab = ["읽기·퀴즈", "모형·시뮬레이션", "가상 실험", "정리·글쓰기"];
          railX.forEach((x, i) => $("rail").insertAdjacentHTML("beforeend", `<div class="node" id="rn${i}" style="left:${x}px"></div><div class="lab" id="rl${i}" style="left:${x}px">${railLab[i]}</div>`));
          gsap.set("#rail-fill", { scaleX: 0 });
          tl.fromTo("#rail", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.2);
          const stepAt = [13.5, 20.2, 27.1, 35.75];
          stepAt.forEach((t, i) => {
            tl.to("#rn" + i, { backgroundColor: "#0e63b3", borderColor: "#0e63b3", duration: 0.3 }, t);
            tl.to("#rl" + i, { color: "#14263b", duration: 0.3 }, t);
            if (i > 0) tl.to("#rail-fill", { scaleX: i / 3, duration: 0.7, ease: "power2.inOut" }, t - 0.5);
          });
          tl.to("#rail-fill", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 41.2);

          const FR = [
            { t: "자기장", fx: 210, fy: 300, fs: 74, at: 15.1 },
            { t: "자기력", fx: 1700, fy: 360, fs: 52, at: 15.45 },
            { t: "나침반", fx: 1720, fy: 700, fs: 78, at: 18.0 },
            { t: "전류의 방향", fx: 200, fy: 620, fs: 56, at: 24.75 },
            { t: "N극", fx: 250, fy: 860, fs: 62, at: 33.6 },
            { t: "막대자석", fx: 1690, fy: 900, fs: 50, at: 33.95 },
          ];
          const font = '700 28px "Pretendard"', gap = 46;
          const ws = FR.map((f) => textW(f.t, font));
          let x0 = 960 - (ws.reduce((a, b) => a + b, 0) + gap * (FR.length - 1)) / 2;
          FR.forEach((f, i) => {
            f.sx = x0; f.sy = 70; f.w = ws[i]; x0 += ws[i] + gap;
            $("frags").insertAdjacentHTML("beforeend", `<span class="frag" id="fr${i}" style="left:${f.sx}px;top:${f.sy}px">${f.t}<i class="frag-u" id="fu${i}"></i></span>`);
            const dx = f.fx - (f.sx + f.w / 2), dy = f.fy - (f.sy + 14), sc = f.fs / 28;
            tl.fromTo("#fr" + i, { x: dx, y: dy + 16, scale: sc, opacity: 0, filter: "blur(16px)" }, { y: dy, opacity: 0.55, filter: "blur(9px)", duration: 0.7, ease: "power2.out" }, 13.0 + i * 0.06);
            const reps = Math.max(0, Math.floor((f.at - 0.45 - 13.8) / 1.7) - 1);
            tl.to("#fr" + i, { y: dy - 14, duration: 1.7, ease: "sine.inOut", repeat: reps, yoyo: true }, 13.8);
            tl.to("#fr" + i, { x: 0, y: 0, scale: 1, opacity: 1, filter: "blur(0px)", color: "#14263b", duration: 0.55, ease: "power3.inOut" }, f.at - 0.45);
            tl.fromTo("#fu" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, f.at + 0.05);
          });
          tl.to(".frag", { color: "#0e63b3", duration: 0.25, yoyo: true, repeat: 1 }, 41.45);

          // 실제 페이지 판: 들어오기 / 레일 마디로 빨려 나가기 / 한 곳 확대
          function cardIn(id, at) { tl.fromTo(id, { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, at); }
          function cardOut(id, at, i) { tl.to(id, { x: railX[i] - 960, y: 975 - 500, scale: 0.03, opacity: 0, duration: 0.45, ease: "power3.in" }, at); }
          // 판 크기는 그대로, 판 안에서 화면만 다가감 (sx, sy: 녹화 화면 좌표)
          function push(id, at, dur, sx, sy, s, back) {
            id = "#z-" + id.slice(1);
            gsap.set(id, { transformOrigin: `${sx * 0.875}px ${sy * 0.875}px` });
            tl.to(id, { scale: s, duration: dur, ease: "power3.inOut" }, at);
            if (back) tl.to(id, { scale: 1, duration: 0.7, ease: "power3.inOut" }, back);
          }

          // ④ 읽기·퀴즈 13.5~20.0
          cardIn("#w4", 13.5);
          cardOut("#w4", 19.55, 0);
          // ⑤ 탐험 20.2~26.9 : 스위치를 닫고 자기장이 보이면 실험 화면으로 다가감
          cardIn("#w5", 20.2);
          push("#w5", 21.6, 0.9, 391, 375, 1.5, 25.2);
          cardOut("#w5", 26.45, 1);
          // ⑥ 가상 실험 27.1~35.55 : 기록지로 다가감
          cardIn("#w6", 27.1);
          push("#w6", 27.9, 0.9, 1010, 470, 1.55, 34.3);
          cardOut("#w6", 35.1, 2);
          // ⑦ 정리·글쓰기 35.75~42.8
          cardIn("#w7", 35.75);
          push("#w7", 38.75, 0.8, 640, 330, 1.3, null);
          // 마지막: 모두 가운데로 모여 동공 속 화면이 됨
          tl.to("#w7, #mind", { scale: 0.18, opacity: 0, duration: 0.45, ease: "power3.in", transformOrigin: "960px 540px" }, 41.85);

          // ── ⑧ 비친 화면 → 동공 → 눈 → 웃는 얼굴 ──
          camDriver("s8-svg", "s8-cam", 42.45, 46.05, [
            { t0: 42.45, t1: 42.7, from: REFL, to: REFL, ease: "none", rot: [8, 8] },
            { t0: 42.7, t1: 43.55, from: REFL, to: EYE, ease: "power3.out", rot: [8, 0] },
            { t0: 43.55, t1: 44.65, from: EYE, to: WIDE, ease: "power3.inOut" },
            { t0: 44.65, t1: 46.05, from: WIDE, to: [610, 490, 1300], ease: "sine.inOut" },
          ]);
          tl.fromTo("#s8", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 42.25);
          tl.to("#p8-mouth", { attr: { d: "M600 551 C594 556 586 556 580 549" }, duration: 0.4, ease: "power2.out" }, 44.45);
          tl.to("#p8-low", { attr: { d: "M542 425 C553 429 566 429 577 425" }, duration: 0.4, ease: "power2.out" }, 44.45);
          tl.to("#s8-cam", { opacity: 0, x: -120, duration: 0.5, ease: "power2.in" }, 45.55);

          // ── ⑨ 표어와 로고 ──
          const LG = [[960 - 80, 320 - 80], [960 + 6, 320 - 80], [960 - 80, 320 + 6], [960 + 6, 320 + 6]];
          LG.forEach((p, i) => {
            gsap.set("#lg" + i, { left: p[0], top: p[1] });
            tl.fromTo("#lg" + i, { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, 46.15 + i * 0.12);
          });
          tl.fromTo("#end-brand", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 46.85);
          tl.fromTo("#end-title span", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.07 }, 47.15);

          window.__timelines["main"] = tl;
        } catch (e) { console.error(e); }
      })();
    </script>
  </body>
</html>
