      <g id="pf-fibers"></g>
      <ellipse cx="570" cy="421" rx="6.2" ry="7.6" fill="none" stroke="#14263b" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <ellipse id="pf-pupil" cx="571" cy="421" rx="2.7" ry="3.5" fill="#14263b" stroke="none"/>
      <g id="pf-refl" transform="translate(571.5 420.6) rotate(-8)">
        <rect x="-0.95" y="-0.66" width="1.9" height="1.32" rx=".16" fill="#e3effb" stroke="none"/>
        <rect x="-0.78" y="-0.51" width=".7" height=".12" rx=".06" fill="#0e63b3" stroke="none"/>
        <rect x="-0.78" y="-0.27" width="1.45" height=".08" rx=".04" fill="#9fbcdc" stroke="none"/>
        <rect x="-0.78" y="-0.09" width="1.15" height=".08" rx=".04" fill="#9fbcdc" stroke="none"/>
        <rect x="-0.78" y=".09" width="1.35" height=".08" rx=".04" fill="#9fbcdc" stroke="none"/>
        <rect x="-0.78" y=".27" width=".9" height=".08" rx=".04" fill="#9fbcdc" stroke="none"/>
      </g>
      <ellipse cx="568.2" cy="418.4" rx=".9" ry=".75" fill="#fff" stroke="none" opacity=".85"/>
      <path d="M538 422 C548 410 566 406 580 414 L580 404 L538 404 Z" fill="#14263b" opacity=".08" stroke="none"/>
    </g>
    <path id="pf-lid" vector-effect="non-scaling-stroke" d="M536 423 C546 410 566 405 581 414 C585 418 585 423 579 428" stroke-width="3.4"/>
    <path vector-effect="non-scaling-stroke" d="M542 427 C553 434 566 434 577 429" opacity=".55"/>
    <path vector-effect="non-scaling-stroke" d="M580 413 L587 409" stroke-width="2.2"/>
