  <path d="M582 336 C590 280 566 210 500 182 C430 152 340 180 306 250 C276 312 282 420 300 520 C310 580 330 612 364 616 C388 618 404 604 410 590 C420 520 430 460 444 410 C456 370 474 336 490 316 C520 312 560 320 582 336 Z" fill="#dfe7ef" stroke="none"/>
