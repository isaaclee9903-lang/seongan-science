    <path vector-effect="non-scaling-stroke" d="M548 222 C520 250 506 286 504 314 M470 186 C420 214 380 270 360 360 M410 190 C360 230 330 300 326 400" opacity=".38"/>
    <!-- 옷 -->
    <path vector-effect="non-scaling-stroke" d="M396 790 C350 806 310 880 300 1000 M512 790 C560 806 620 860 640 1000"/>
    <path vector-effect="non-scaling-stroke" d="M396 790 C430 812 480 812 512 790" opacity=".55"/>
