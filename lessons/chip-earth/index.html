<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반도체와 지구 - 읽기 자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#edf3f8; --ink:#14263b; --muted:#5a6b7e; --line:#dde6ee;
    --accent:#0e63b3; --accent-soft:#e3effb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .shell{height:100vh;height:100dvh;display:flex;flex-direction:column}

  header{
    flex:none;display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:60px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);z-index:2;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .logo{flex:none;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0f6b5c,#2b7fd6);display:grid;place-items:center}
  .title{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  .t-short{display:none}

  nav{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:none;display:flex;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;
    min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted);
    transition:background .25s,color .25s;
  }
  .tab .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:#e6edf4;color:#607285;transition:all .25s}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .tab[aria-selected="true"] .n{background:var(--accent);color:#fff}
  .tab:focus-visible{outline:3px solid rgba(14,99,179,.35);outline-offset:2px}

  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}
  .stage iframe.on{visibility:visible}
  .loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .3s}
  .loading.show{opacity:1}
  .spin{width:40px;height:40px;border-radius:50%;border:4px solid #d3dfeb;border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:900px){
    header{flex-wrap:wrap;gap:6px;padding:8px 12px}
    .brand{flex-basis:100%}
    nav{flex-basis:100%}
    .t-long{display:none}
    .t-short{display:inline}
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <a class="brand" href="../../" title="수업 목록으로">
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c3 1 5 0 6.5 2s1 4 3 5 4 .5 6.5-1M8 4.5c1 2 3 2.5 4.5 2s3 0 4 1.5"/></svg>
      </span>
      <span class="title">
        <span class="t-long">반도체와 지구: 칩이 쓰는 전기와 물</span><span class="t-short">반도체와 지구</span>
        <small>읽기 자료 · 교양과 진로 · 미래 시민</small>
      </span>
    </a>
    <nav role="tablist" aria-label="학습 화면">
      <button class="tab" role="tab" data-page="reading" aria-selected="false"><span class="n">1</span>읽기·퀴즈</button>
      <button class="tab" role="tab" data-page="dc" aria-selected="false"><span class="n">2</span>데이터 센터 에너지 흐름</button>
      <button class="tab" role="tab" data-page="water" aria-selected="false"><span class="n">3</span>공장 물의 여행</button>
      <button class="tab" role="tab" data-page="summary" aria-selected="false"><span class="n">4</span>토론·글쓰기</button>
    </nav>
  </header>

  <main class="stage">
    <iframe data-page="reading" data-embed="1" title="읽기·퀴즈"></iframe>
    <iframe data-page="dc" data-embed="1" title="데이터 센터 에너지 흐름"></iframe>
    <iframe data-page="water" data-embed="1" title="반도체 공장 물의 여행"></iframe>
    <iframe data-page="summary" data-embed="1" title="토론과 글쓰기"></iframe>
    <div class="loading" id="loading"><div class="spin"></div></div>
  </main>
</div>

<script>
  // 탭 이름 → 같은 폴더의 페이지 파일. 특정 탭으로 바로 열기: 주소 뒤에 ?page=탭이름
  const PAGES = {
    reading: 'reading.html',
    dc: 'sim1-datacenter-flow.html',
    water: 'sim2-fab-water.html',
    summary: 'summary-debate.html',
  };

  (function () {
    const tabs = {}, frames = {}, loaded = {};
    document.querySelectorAll('.tab').forEach(function (t) { tabs[t.dataset.page] = t; });
    document.querySelectorAll('iframe[data-page]').forEach(function (f) { frames[f.dataset.page] = f; });
    const loading = document.getElementById('loading');

    function show(id) {
      if (!frames[id]) return;
      const f = frames[id];
      if (!f.getAttribute('src')) {
        loading.classList.add('show');
        f.addEventListener('load', function () {
          loaded[id] = true;
          loading.classList.remove('show');
        }, { once: true });
        f.src = PAGES[id];   // 처음 열 때만 불러오고, 이후에는 상태를 그대로 유지
      } else {
        loading.classList.toggle('show', !loaded[id]);
      }
      Object.keys(frames).forEach(function (k) {
        frames[k].classList.toggle('on', k === id);
        tabs[k].setAttribute('aria-selected', String(k === id));
        tabs[k].tabIndex = k === id ? 0 : -1;
      });
      tabs[id].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      try { history.replaceState(null, '', '?page=' + id); } catch (e) {}
    }

    Object.keys(tabs).forEach(function (k) {
      tabs[k].addEventListener('click', function () { show(k); });
    });

    // 읽기 페이지의 "시뮬레이션 해 보기" 버튼이 보내는 탭 이동 요청
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || d.type !== 'ras-nav' || !frames[d.target]) return;
      const fromOurFrame = Object.keys(frames).some(function (k) { return frames[k].contentWindow === e.source; });
      if (fromOurFrame) show(d.target);
    });

    const requested = new URLSearchParams(location.search).get('page');
    show(PAGES[requested] ? requested : 'reading');
  })();
</script>
</body>
</html>
