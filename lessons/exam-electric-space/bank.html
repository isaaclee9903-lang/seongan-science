<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문제 모음 - 전기·우주 시험 대비</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* 문제 알림: 코드에 오류가 나면 화면 아래에 빨간 상자로 알려 줘요 (선생님 확인용) */
(function () {
  function box() {
    var b = document.getElementById('smErr');
    if (!b && document.body) {
      b = document.createElement('div'); b.id = 'smErr';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fdecea;color:#8a1f17;border:2px solid #d9534f;border-radius:12px;padding:10px 14px;font:600 14px/1.5 sans-serif;white-space:pre-wrap';
      document.body.appendChild(b);
    }
    return b;
  }
  window.SM_err = function (where, err) {
    var msg = '[' + where + '] ' + (err && err.message ? err.message : String(err));
    var show = function () { var b = box(); if (b) b.textContent += (b.textContent ? '\n' : '') + msg; };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  window.addEventListener('error', function (e) { window.SM_err('스크립트', { message: e.message + ' (줄 ' + e.lineno + ')' }); });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var S = window.SM || {};
      if (!S.okUI) window.SM_err('실행 안 됨', { message: '안내·버튼 코드가 실행되지 않았어요. 파일이 끝(</html>)까지 들어 있는지 확인해 주세요.' });
      if (document.getElementById('fail3d') && !S.ok3d) { var f = document.getElementById('fail3d'); if (f) f.classList.add('show'); window.SM_err('3D 그림', { message: '3D 그림을 불러오지 못했어요. 인터넷 연결(cdn.jsdelivr.net)을 확인하고 새로고침해 주세요.' }); }
    }, 9000);
  });
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--paper:#fff;--ink:#14263b;--ink2:#34495e;--muted:#5a6b7e;--line:#dde6ee;--accent:#0e63b3;--soft:#e3effb;--bad:#b3362b;--badsoft:#fbeeec}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  button:focus-visible,input:focus-visible,.bk:focus-visible{outline:3px solid rgba(14,99,179,.35);outline-offset:2px}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:1rem;padding:0 1.6rem;height:clamp(50px,5.4rem,72px);border-top:1px solid var(--line);background:#fff}
  .where{flex:1;min-width:0;font-size:max(13px,1.5rem);color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .where b{color:var(--ink);margin-right:.8em}
  .btn{min-height:44px;padding:0 1.5rem;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:max(14px,1.5rem);font-weight:700;white-space:nowrap}
  .btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn[disabled]{opacity:.35;cursor:default}

  /* 장 */
  .deck{flex:1;position:relative;min-height:0;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;grid-template-columns:56fr 44fr;background:#fff}
  .slide.on{display:grid;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateX(1.2rem)}to{transform:none}}
  .slide.q,.slide.t{grid-template-columns:1fr}
  .slide.t .txt{justify-content:center}
  .fig{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:#fff}
  .figbody{flex:1;position:relative;min-height:0}
  .figbody svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .figbody.scene{position:relative;overflow:hidden;background:#fff;border:0;border-radius:0;aspect-ratio:auto;width:auto;height:auto;max-width:none;box-shadow:none;touch-action:none}
  .figctl{flex:none;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;padding:.8rem 1.4rem 1rem;min-height:44px}
  .figctl:empty{display:none}
  .figctl label{display:flex;align-items:center;gap:.7rem;flex:1 1 14rem;min-width:130px;font-size:max(13px,1.45rem);font-weight:700;color:var(--ink2)}
  .figctl input[type=range]{flex:1;min-width:60px;height:34px;accent-color:var(--accent)}
  .ctl{min-height:44px;padding:0 1.3rem;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:max(13px,1.45rem);font-weight:700;color:var(--ink2)}
  .ctl.go{background:var(--accent);border-color:var(--accent);color:#fff}
  .ctl[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
  .txt{min-width:0;min-height:0;overflow-y:auto;padding:3rem 3.2rem 2rem;display:flex;flex-direction:column;gap:1.5rem;-webkit-overflow-scrolling:touch}
  .grp{font-size:max(12px,1.35rem);font-weight:700;color:var(--muted)}
  h2{margin:0;font-size:3.1rem;line-height:1.28;font-weight:800;letter-spacing:-.02em}
  .pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1rem}
  .pts li{position:relative;padding-left:1.5rem;font-size:2.05rem;line-height:1.55;color:var(--ink2)}
  .pts li::before{content:"";position:absolute;left:0;top:.72em;width:.5rem;height:.5rem;border-radius:50%;background:#9fb0c2}
  .pts b{color:var(--ink)}
  .eq{font-size:2.3rem;font-weight:800;line-height:1.45;padding:.9rem 1.3rem;background:var(--soft);border-radius:8px;color:#0b3f73}
  .trap{margin:0;font-size:1.85rem;line-height:1.55;color:var(--ink2);border-left:.3rem solid var(--accent);padding:.1rem 0 .1rem 1.1rem}
  .trap b{color:var(--accent)}
  .joke{margin:0;font-size:2.1rem;font-weight:800;color:var(--muted)}
  .bk{display:inline-block;min-width:4.6em;margin:0 .1em;padding:0 .4em;border:0;border-bottom:.2rem solid var(--accent);background:var(--soft);color:transparent;font-weight:800;text-align:center;line-height:1.3;border-radius:3px 3px 0 0;cursor:pointer;white-space:nowrap}
  .bk.open{background:transparent;color:var(--accent)}
  .tbl{border-collapse:collapse;width:100%;font-size:1.75rem}
  .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.6rem .7rem;text-align:left}
  .tbl th{color:var(--muted);font-weight:700;font-size:1.5rem}

  /* 표지 */
  .cover{grid-template-columns:44fr 56fr}
  .cover .txt{justify-content:flex-end;padding:4rem 3.6rem}
  .cover h1{margin:0;font-size:4.6rem;line-height:1.24;font-weight:800;letter-spacing:-.03em}
  .cover .tag{font-size:1.8rem;font-weight:700;color:var(--muted)}
  .cover .who{font-size:2rem;font-weight:700;color:var(--ink2)}
  .cover .fig{border-right:0;order:2}
  .how{font-size:1.75rem;line-height:1.6;color:var(--muted);margin:0}

  /* 문제 */
  .qs{min-height:0;overflow-y:auto;padding:2.6rem 3.4rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,42rem),1fr));gap:2.4rem 4rem;align-content:start}
  .slide.q{grid-template-rows:auto 1fr}
  .qhead{padding:2.2rem 3.4rem 0;display:flex;align-items:baseline;gap:1.2rem}
  .qhead h2{font-size:2.5rem}
  .qbox{min-width:0;display:flex;flex-direction:column;gap:1.1rem}
  .qmeta{display:flex;gap:1rem;font-size:max(12px,1.35rem);font-weight:700;color:var(--muted)}
  .qmeta span:first-child{color:var(--accent)}
  .qtext{font-size:2.15rem;line-height:1.55;font-weight:600;color:var(--ink)}
  .qopts{display:grid;gap:.7rem}
  .qopts.short{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qopts.ox{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qopt,.qitem{min-height:44px;padding:.75rem 1.2rem;border:1px solid #cfdae4;border-radius:8px;background:#fff;text-align:left;font-size:max(14px,1.85rem);font-weight:600;line-height:1.4;color:var(--ink)}
  .qopts.ox .qopt{text-align:center;font-size:max(18px,2.6rem);font-weight:800}
  .qopts.short .qopt{text-align:center}
  .qopt.ok,.qitem.ok{background:var(--soft);border-color:var(--accent);color:#0b3f73}
  .qopt.no,.qitem.no{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}
  .qopt[disabled]{cursor:default}
  .qmulti{display:grid;gap:.7rem}
  .qitem[aria-pressed=true]{border-color:var(--accent);background:#f3f8fd}
  .qitem i{font-style:normal;font-weight:800;margin-right:.3em}
  .qgo,.qagain{align-self:flex-start;min-height:44px;padding:0 1.5rem;border-radius:8px;font-size:max(14px,1.7rem);font-weight:700;border:1px solid var(--accent);background:#fff;color:var(--accent)}
  .qagain{border-color:var(--line);color:var(--muted)}
  .qfb{font-size:max(14px,1.8rem);line-height:1.5;padding:.1rem 0 .1rem 1.1rem;border-left:.3rem solid var(--accent);color:var(--ink2)}
  .qfb.no{border-color:var(--bad)}
  .qfb b{color:var(--accent)}
  .qfb.no b{color:var(--bad)}
  .qfb p{margin:.2rem 0 0}
  .qhint{margin:0;font-size:max(13px,1.7rem);color:var(--muted)}
  .qmodel{font-size:max(14px,1.95rem);line-height:1.6;color:var(--ink);background:var(--soft);border-radius:8px;padding:1.1rem 1.4rem}
  .qmodel p{margin:0 0 .6rem}
  .qkeys{font-size:max(13px,1.65rem);color:var(--ink2)}
  .qkeys span{font-weight:700;margin-right:.5em}
  .qkeys b{color:var(--accent)}
  .qself{display:flex;gap:.7rem;flex-wrap:wrap}
  .qself .qopt{font-size:max(14px,1.7rem)}

  /* 전체 화면일 때만 보이는 '원래 화면' 버튼 */
  #bExit{display:none;align-items:center;justify-content:center;gap:.5em}
  .big #bExit{display:inline-flex}
  .float #bExit{display:none!important}
  @media (max-width:340px){.big .btn{padding:0 4px;font-size:13px}.big .bar{padding:0 4px}}
  /* 이 개념 문제 창 */
  .qpop{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:1.6rem;background:rgba(20,38,59,.38)}
  .qpop.on{display:flex}
  .qpanel{width:min(100%,112rem);max-height:100%;overflow-y:auto;background:#fff;border-radius:12px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
  .qphead{flex:none;position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.4rem 2.2rem;background:#fff;border-bottom:1px solid var(--line)}
  .qphead h2{font-size:2.5rem}
  .qpanel .qs{overflow:visible;padding:2.2rem}
  /* 요약에서 띄운 개념 창: 넘기는 버튼을 숨겨요 */
  .float #bToc,.float #bPrev,.float #bNext,.float #bOpen{display:none}
  @media (max-width:560px){
    .where .wt{display:none}
    .ol{font-size:10px!important}
    .bar{gap:.5rem;padding:0 8px}
    .btn{padding:0 9px}
    .big .where{display:none}
    .big .bar{justify-content:space-between;gap:4px}
    .big .btn{padding:0 7px}
    #bExit{width:44px;padding:0;flex:none}
    #bExit span{display:none}
    .qpop{padding:6px}
    .qphead{padding:6px 12px}
    .qpanel .qs{padding:14px}
  }

  /* 목차 */
  .toc{position:absolute;inset:0;background:#fff;z-index:5;display:none;overflow-y:auto;padding:2.4rem 3.2rem}
  .toc.on{display:block}
  .toc h3{margin:1.6rem 0 .6rem;font-size:max(14px,1.7rem);color:var(--muted);font-weight:800}
  .tocg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,27rem),1fr));gap:.5rem}
  .tocg button{min-height:44px;text-align:left;padding:.4rem 1rem;border:0;border-bottom:1px solid var(--line);background:#fff;font-size:max(14px,1.7rem);font-weight:600}
  .tocg button.cur{color:var(--accent);font-weight:800}
  .tocg button i{font-style:normal;color:var(--muted);margin-right:.7em;font-size:.85em}

  /* 가로 화면: 교실 큰 화면에서도 읽히게 글을 키움 */
  @media (min-aspect-ratio:1/1) and (min-height:481px){
    h2{font-size:3.5rem}
    .pts{gap:1.3rem}
    .pts li{font-size:2.45rem}
    .eq{font-size:2.6rem}
    .trap{font-size:2.15rem}
    .slide.t .pts li{font-size:2.5rem}
    .slide.t .tbl{font-size:2.5rem}
    .slide.t .tbl th{font-size:2rem}
    .slide.t .tbl td,.slide.t .tbl th{padding:1rem .8rem}
    .tbl{font-size:2.05rem}
    .tbl th{font-size:1.75rem}
    .txt{padding:3.2rem 3.2rem 2rem}
    .qhead h2{font-size:2.8rem}
    .qtext{font-size:2.55rem}
    .qopt,.qitem{font-size:2.2rem;padding:.9rem 1.3rem}
    .qopts.ox .qopt{font-size:3rem}
    .qfb{font-size:2.05rem}
    .qmodel{font-size:2.15rem}
    .qkeys{font-size:1.85rem}
    .qmeta{font-size:1.55rem}
    .qhint{font-size:1.9rem}
  }
  @media (max-aspect-ratio:1/1) and (min-width:600px){
    h2{font-size:3.5rem}
    .pts li{font-size:2.4rem}
    .eq{font-size:2.55rem}
    .trap{font-size:2.1rem}
    .qtext{font-size:2.5rem}
    .qopt,.qitem{font-size:2.15rem}
  }
  /* 세로 화면: 그림 위, 글 아래 */
  @media (max-aspect-ratio:1/1){
    .slide,.cover{grid-template-columns:1fr;grid-template-rows:minmax(0,44fr) minmax(0,56fr)}
    .slide.q,.slide.t{grid-template-rows:auto minmax(0,1fr)}
    .slide.t{grid-template-rows:minmax(0,1fr)}
    .fig{border-right:0;border-bottom:1px solid var(--line)}
    .cover .fig{order:0}
    .cover .txt{justify-content:flex-start;padding:2.4rem 2.4rem}
    .txt{padding:2rem 2.4rem}
    .qs{padding:2rem 2.4rem}
    .qhead{padding:1.8rem 2.4rem 0}
  }
  /* 휴대 전화 가로: 조작 칸을 낮게 */
  @media (max-height:480px) and (min-aspect-ratio:1/1){
    .figctl{padding:.2rem .8rem;gap:.5rem}
    .figctl label{font-size:12px}
    .ctl{min-height:38px;font-size:12.5px;padding:0 .7rem}
    .txt{padding:1.2rem 1.6rem}
    .bar{height:44px}
    .btn{min-height:36px}
  }
  @media (prefers-reduced-motion:reduce){.slide.on{animation:none}}
  .bankw{flex:1;min-height:0;display:grid;grid-template-columns:30rem minmax(0,1fr)}
  .side{border-right:1px solid var(--line);padding:2rem 2rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.4rem}
  .side h3{margin:0 0 .5rem;font-size:max(13px,1.45rem);font-weight:700;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .chip{min-height:40px;padding:0 1rem;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:max(13px,1.5rem);font-weight:700;color:var(--ink2)}
  .chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
  .tally{font-size:max(14px,1.7rem);line-height:1.6;color:var(--ink2)}
  .tally b{font-size:1.3em;color:var(--ink)}
  .qmain{min-height:0;overflow-y:auto;padding:3rem 4rem;display:flex;flex-direction:column;max-width:100%}
  .qmain .qbox{max-width:92rem}
  .qmain .qtext{font-size:2.7rem}
  .qmain .qopt,.qmain .qitem{font-size:max(15px,2.3rem)}
  .empty{font-size:2rem;color:var(--muted)}
  @media (max-aspect-ratio:1/1){
    .bankw{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .side{border-right:0;border-bottom:1px solid var(--line);padding:1.2rem 1.6rem;gap:.8rem;max-height:38vh}
    .qmain{padding:2rem 2.4rem}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .chip{flex:none}
    .side h3{display:none}
    .tally br{display:none}
  }
  @media (max-height:480px) and (min-aspect-ratio:1/1){
    .bankw{grid-template-columns:200px minmax(0,1fr)}
    .side{padding:8px 10px;gap:8px}
    .chip{min-height:34px;padding:0 7px;font-size:12px}
    .qmain{padding:12px 16px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bankw">
    <aside class="side">
      <div><h3>단원</h3><div class="chips" id="fU"></div></div>
      <div><h3>유형</h3><div class="chips" id="fT"></div></div>
      <div class="tally" id="tally"></div>
      <button class="chip" id="bWrong" type="button">틀린 문제만 다시 풀기</button>
      <button class="chip" id="bAll" type="button" hidden>전체로 돌아가기</button>
    </aside>
    <main class="qmain"><div id="q"></div></main>
  </div>
  <div class="bar">
    <div class="where" id="where"></div>
    <button class="btn" id="bExit" type="button" aria-label="원래 화면으로 돌아가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span>원래 화면</span></button>
    <button class="btn" id="bPrev" type="button">이전</button>
    <button class="btn main" id="bNext" type="button">다음 문제</button>
  </div>
</div>
<script>
/* ===== 문제 풀이 엔진 =====
   QE.render(host, q, {onAnswer})  문제 하나를 그려요. 핵심 넘기기와 문제 모음이 같이 씁니다.
   문제 종류 k: choice(고르기), ox, multi(보기에서 있는 대로), essay(서술형), calc(숫자만 바꿔 다시 내는 계산)
   기록은 남기지 않아요(페이지를 닫으면 사라짐). */
window.QE = (() => {
  const esc = (s) => String(s);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = (x) => { const r = Math.round(x * 100) / 100; return String(r); };
  const KO = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function fb(host, ok, why, extra) {
    const f = host.querySelector('.qfb') || host.appendChild(el('div', 'qfb'));
    f.className = 'qfb ' + (ok ? 'ok' : 'no');
    f.innerHTML = `<b>${ok ? '맞음' : '다시 확인'}</b>${extra ? ' ' + extra : ''}<p>${why || ''}</p>`;
  }

  function choice(host, q, cb) {
    const opts = q.keep ? q.opts.slice() : shuffle(q.opts);
    const answer = q.opts[q.a];
    const wrap = el('div', 'qopts' + (opts.every((o) => String(o).length <= 12) ? ' short' : ''));
    let done = false;
    opts.forEach((o) => {
      const b = el('button', 'qopt', esc(o)); b.type = 'button';
      b.addEventListener('click', () => {
        if (done) return;
        done = true;
        const ok = o === answer;
        wrap.querySelectorAll('.qopt').forEach((x) => { x.disabled = true; if (x.innerHTML === b.innerHTML && !ok) x.classList.add('no'); });
        Array.from(wrap.children).forEach((x, i) => { if (opts[i] === answer) x.classList.add('ok'); });
        fb(host, ok, q.why);
        cb && cb(ok);
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  }

  function ox(host, q, cb) {
    const wrap = el('div', 'qopts ox');
    let done = false;
    [[true, 'O'], [false, 'X']].forEach(([v, t]) => {
      const b = el('button', 'qopt', t); b.type = 'button';
      b.addEventListener('click', () => {
        if (done) return;
        done = true;
        const ok = v === q.a;
        wrap.querySelectorAll('.qopt').forEach((x, i) => { x.disabled = true; if ((i === 0) === q.a) x.classList.add('ok'); else if (x === b) x.classList.add('no'); });
        fb(host, ok, q.why, `정답 ${q.a ? 'O' : 'X'}`);
        cb && cb(ok);
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  }

  function multi(host, q, cb) {
    const list = el('div', 'qmulti');
    const sel = new Set();
    q.items.forEach((it, i) => {
      const b = el('button', 'qitem', `<i>${KO[i]}.</i> ${esc(it)}`); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => { if (b.disabled) return; if (sel.has(i)) sel.delete(i); else sel.add(i); b.setAttribute('aria-pressed', String(sel.has(i))); });
      list.appendChild(b);
    });
    host.appendChild(list);
    const go = el('button', 'qgo', '답 확인하기'); go.type = 'button';
    go.addEventListener('click', () => {
      if (!sel.size) { fb(host, false, '맞는 것을 먼저 하나 이상 골라 주세요.'); return; }
      const ok = sel.size === q.a.length && q.a.every((i) => sel.has(i));
      Array.from(list.children).forEach((x, i) => { x.disabled = true; x.classList.toggle('ok', q.a.includes(i)); x.classList.toggle('no', sel.has(i) && !q.a.includes(i)); });
      go.hidden = true;
      fb(host, ok, q.why, `정답 ${q.a.map((i) => KO[i]).join(', ')}`);
      cb && cb(ok);
    });
    host.appendChild(go);
  }

  function essay(host, q, cb) {
    const go = el('button', 'qgo', '모범 답안 보기'); go.type = 'button';
    const hint = el('p', 'qhint', '공책에 답을 쓴 뒤 모범 답안과 비교해요.');
    host.appendChild(hint); host.appendChild(go);
    go.addEventListener('click', () => {
      go.hidden = true; hint.hidden = true;
      const m = el('div', 'qmodel', `<p>${q.model}</p><div class="qkeys"><span>꼭 들어갈 말</span> ${q.keys.map((k) => `<b>${k}</b>`).join(' · ')}</div>`);
      host.appendChild(m);
      const row = el('div', 'qself');
      [['맞게 썼음', true], ['빠진 말이 있음', false]].forEach(([t, v]) => {
        const b = el('button', 'qopt', t); b.type = 'button';
        b.addEventListener('click', () => { row.querySelectorAll('button').forEach((x) => { x.disabled = true; }); b.classList.add(v ? 'ok' : 'no'); cb && cb(v); });
        row.appendChild(b);
      });
      host.appendChild(row);
    });
  }

  // 계산: gen()이 {q, a, unit, why, d:[오답 숫자]}를 돌려줘요
  function calc(host, q, cb) {
    const g = q.gen();
    const a = fmt(g.a) + ' ' + g.unit;
    const seen = new Set([a]);
    const opts = [a];
    g.d.forEach((v) => { const s = fmt(v) + ' ' + g.unit; if (!seen.has(s) && opts.length < 4 && v >= 0) { seen.add(s); opts.push(s); } });
    let k = 2; while (opts.length < 4) { const s = fmt(g.a * k) + ' ' + g.unit; if (!seen.has(s)) { seen.add(s); opts.push(s); } k++; }
    const stem = host.querySelector('.qtext'); if (stem) stem.innerHTML = g.q;
    const sub = el('div', 'qsub');
    choice(sub, { opts, a: 0, why: g.why }, cb);
    host.appendChild(sub);
    const again = el('button', 'qagain', '숫자 바꿔 다시 풀기'); again.type = 'button';
    again.addEventListener('click', () => { sub.remove(); again.remove(); calc(host, q, null); });
    host.appendChild(again);
  }

  function render(host, q, o = {}) {
    host.innerHTML = '';
    host.classList.add('qbox');
    host.appendChild(el('div', 'qmeta', `<span>${q.t || ''}</span>${q.p ? `<span>교과서 ${q.p}쪽</span>` : ''}`));
    host.appendChild(el('div', 'qtext', q.q || ''));
    const cb = o.onAnswer;
    ({ choice, blank: choice, ox, multi, essay, calc }[q.k] || choice)(host, q, cb);
  }
  return { render, pick, fmt, shuffle };
})();

<script>
(() => {
  'use strict';
  window.SM = window.SM || {};
  try {
    const $ = (s) => document.querySelector(s);
    const U = [['all', '전체'], ['e', 'Ⅶ-1 전기'], ['m', 'Ⅶ-2 자기'], ['s', 'Ⅷ-1 별'], ['g', 'Ⅷ-2 은하와 우주']];
    const T = ['전체', '정의 빈칸', 'O·X', '계산', '자료 해석', '짝짓기', '서술형'];
    const ALL = window.BANK;
    const st = { u: 'all', t: '전체', i: 0, list: [], res: {}, wrongOnly: false };
    window.BANKUI = st;
    function chips(host, items, cur, fn) {
      host.innerHTML = '';
      items.forEach(([v, t]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t; b.setAttribute('aria-pressed', String(v === cur)); b.addEventListener('click', () => fn(v)); host.appendChild(b); });
    }
    function filters() {
      chips($('#fU'), U, st.u, (v) => { st.u = v; st.wrongOnly = false; build(); });
      chips($('#fT'), T.map((x) => [x, x]), st.t, (v) => { st.t = v; st.wrongOnly = false; build(); });
    }
    function build() {
      st.list = ALL.filter((q) => (st.u === 'all' || q.u === st.u) && (st.t === '전체' || q.t === st.t) && (!st.wrongOnly || st.res[q.id] === false));
      if (!st.wrongOnly) st.list = QE.shuffle(st.list);
      st.i = 0; filters(); show();
    }
    function tally() {
      const v = Object.values(st.res), ok = v.filter(Boolean).length, no = v.length - ok;
      $('#tally').innerHTML = `푼 문제 <b>${v.length}</b><br>맞음 <b>${ok}</b> · 다시 확인 <b>${no}</b>`;
      $('#bWrong').hidden = st.wrongOnly || !no; $('#bAll').hidden = !st.wrongOnly;
    }
    function show() {
      const h = $('#q'); h.innerHTML = ''; h.className = '';
      const q = st.list[st.i];
      if (!q) { h.innerHTML = `<p class="empty">${st.wrongOnly ? '틀린 문제를 모두 다시 풀었어요.' : '이 조건의 문제가 없어요. 다른 유형을 골라 보세요.'}</p>`; $('#where').textContent = ''; $('#bPrev').disabled = $('#bNext').disabled = true; tally(); return; }
      QE.render(h, q, { onAnswer: (ok) => { st.res[q.id] = ok; tally(); } });
      $('#where').innerHTML = `<b>${st.i + 1} / ${st.list.length}</b>`;
      $('#bPrev').disabled = st.i === 0; $('#bNext').disabled = st.i >= st.list.length - 1;
      $('.qmain').scrollTop = 0; tally();
    }
    $('#bNext').addEventListener('click', () => { st.i++; show(); });
    $('#bPrev').addEventListener('click', () => { st.i--; show(); });
    $('#bWrong').addEventListener('click', () => { st.wrongOnly = true; build(); });
    $('#bAll').addEventListener('click', () => { st.wrongOnly = false; build(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' && !$('#bNext').disabled) { st.i++; show(); } if (e.key === 'ArrowLeft' && !$('#bPrev').disabled) { st.i--; show(); } });
    function fit() { const w = innerWidth, h = innerHeight, r = w >= h ? Math.min(w / 120, h / 67.5) : w / 72; document.documentElement.style.fontSize = Math.max(7.4, Math.min(20, r)) + 'px'; }
    addEventListener('resize', fit); fit();
    build();
    window.SM.okUI = true;
  } catch (err) { window.SM_err('문제 모음', err); }
})();
</script>
<script>
/* ===== 전체 화면일 때 아래 막대에 '원래 화면' 버튼을 보여 줘요 (탭 껍데기 index.html이 알려 줌) ===== */
(() => {
  const b = document.getElementById('bExit');
  if (!b) return;
  b.addEventListener('click', () => { try { parent.postMessage({ type: 'ex-big-exit' }, '*'); } catch (e) {} });
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'ex-big') document.body.classList.toggle('big', !!e.data.on);
  });
  try { if (parent !== window) parent.postMessage({ type: 'ex-big-ask' }, '*'); } catch (e) {}
})();
</script>
