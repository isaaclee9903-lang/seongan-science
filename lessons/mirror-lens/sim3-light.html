<body>
<div class="app">
  <header>
    <span class="eyebrow">거울과 렌즈에 의한 상 · 시뮬레이션 ③</span>
    <h1>나란한 빛을 거울과 렌즈에 비춰 보기</h1>
    <p class="sub">거울 면의 모양이나 렌즈의 종류에 따라 빛이 이동하는 경로가 달라요. 나란한 빛을 비추고, 빛이 퍼지는지 한 점에 모이는지 살펴봐요.</p>
  </header>
  <div class="stage">
    <section class="card viewer">
      <div class="scene" id="scene"><span class="figcap" id="cap">그림 Ⅲ-7 나란한 빛을 거울에 비출 때</span></div>
      <div class="vctl">
        <button class="vb" type="button" id="bAll" aria-pressed="true">나란한 빛 5개</button>
        <button class="vb" type="button" id="bOne" aria-pressed="false">빛 하나</button>
        <button class="vb" type="button" id="bMark" aria-pressed="false">빛이 닿은 곳 보기</button>
        <label class="hrng" id="hr" hidden><span>빛의 높이</span><input type="range" id="hIn" min="-140" max="140" step="1" value="-100" aria-label="빛의 높이"></label>
      </div>
    </section>
    <section class="card pad">
      <div class="devs" id="devs" role="tablist" aria-label="기구 고르기"></div>
      <div class="q2" id="q"><p id="qT"></p><div class="b2"><button type="button" data-v="meet">한 점에 모여요</button><button type="button" data-v="spread">넓게 퍼져요</button></div></div>
      <div class="fbk" id="fb"><b class="t" id="fbT"></b><span id="fbM"></span></div>
      <table class="tbl" id="tbl"></table>
      <div class="why" id="why"></div>
      <div class="concl lock" id="concl"><span class="kt">관찰대 결과와 이어 보기</span><p>네 가지를 모두 확인하면 정리가 나타나요.</p></div>
    </section>
  </div>
  <p class="model">빛의 경로는 거울 면의 반사 법칙과 렌즈 면의 굴절을 계산해 그렸어요. 빛이 모이는 곳은 알아보기 쉽게 밝게 표시했어요.</p>
  <p class="credit">거울과 렌즈에 의한 상 · 나란한 빛 보내기</p>
</div>

<script>
/* ===== 2D 도식 도구 (SVG) =====
   FLOW.dots(path, 옵션): SVG 길(path)을 따라 알갱이(전기·물·열)가 흐르게 해요.
     옵션 n(개수), r(크기), color, speed(초당 길 몇 바퀴), layer(알갱이를 넣을 g, 생략하면 길의 부모), glow(빛 번짐)
     반환값.set({ rate: 0~1(보이는 양과 빠르기), color }) 로 바꿔요.
   FLOW.onFrame(fn): 화면에 보일 때만 매 프레임 fn(dt, t)를 불러요(탭 껍데기에서 숨은 탭이면 쉬어요).
   FLOW.num(el, 값, 자릿수): 숫자를 부드럽게 바꿔 보여 줘요.

      <linearGradient id="mlTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cfd6"/><stop offset=".08" stop-color="#eceff2"/><stop offset="1" stop-color="#f7f8fa"/></linearGradient>
      <linearGradient id="mlRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".35" stop-color="#9aa3ad"/><stop offset=".6" stop-color="#5b636d"/><stop offset="1" stop-color="#c3cad2"/></linearGradient>
      <linearGradient id="mlRod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d646d"/><stop offset=".3" stop-color="#e3e7eb"/><stop offset=".55" stop-color="#9aa2ac"/><stop offset="1" stop-color="#4b525b"/></linearGradient>

      <linearGradient id="mlSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".28" stop-color="#fff" stop-opacity=".08"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>
      <radialGradient id="mlVigX" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#0a1824" stop-opacity="0"/><stop offset=".92" stop-color="#0a1824" stop-opacity=".22"/><stop offset="1" stop-color="#0a1824" stop-opacity=".45"/></radialGradient>

      <linearGradient id="mlGlassB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3f3fb"/><stop offset=".35" stop-color="#a9d6ec"/><stop offset=".7" stop-color="#6fb2d6"/><stop offset="1" stop-color="#cbe8f5"/></linearGradient>
      <linearGradient id="mlBack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4e5660"/><stop offset=".5" stop-color="#a9b1ba"/><stop offset="1" stop-color="#5b636c"/></linearGradient>
      <linearGradient id="mlF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f8fd8"/><stop offset=".55" stop-color="#1b6fbf"/><stop offset="1" stop-color="#0e5aa0"/></linearGradient>
      <filter id="mlSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="mlSoft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>`;
    document.body.appendChild(s);
  }

  /* ---------- 물체: F 모양 블록 (위아래·좌우가 모두 구별됨) ---------- */
  const FPATH = 'M-46 0V-200H50V-166H-10V-118H34V-86H-10V0Z';
  function toy(parent) {
    const g = el('g', {}, parent);
    for (let i = 10; i >= 1; i--) el('path', { d: FPATH, transform: `translate(${i} ${-i * 0.8})`, fill: i > 8 ? '#0a2a4a' : '#0b3c6c' }, g);   // 옆면(두께)
    el('path', { d: FPATH, fill: 'url(#mlF)' }, g);
    el('path', { d: 'M-46 -200H50', stroke: '#fff', 'stroke-width': 2, opacity: .45 }, g);
    el('path', { d: 'M-40 -6V-194', stroke: '#fff', 'stroke-width': 3, opacity: .25, 'stroke-linecap': 'round' }, g);
    return g;
  }

  /* ---------- 계산 ---------- */
  function calc(dev, d) {
    const f = converge(dev) ? 1 : -1;
    const den = f * L - d * (L - f);
    let s = Math.abs(den) < 1e-3 ? 1e3 : f * L / den;            // 기구 자리에 있는 물체와 비교한 겉보기 크기
    const raw = s;
    const a = Math.abs(s);
    const blur = a > 1.5 ? Math.min(24, 1.5 * (a - 1.5) + Math.max(0, a - 5) * 2.5) : 0;
    s = Math.sign(s) * Math.min(a, 12);
    const m = f / (f - d);                                       // 물체와 비교한 상의 크기 (부호: 바로/거꾸로)
    return { s, raw, blur, up: m > 0, big: Math.abs(m) > 1, m };
  }
  const label = (dev, d) => { const c = calc(dev, d); return `물체보다 ${c.big ? '큰' : '작은'} 크기의 ${c.up ? '바로' : '거꾸로'} 선 상`; };

  /* ---------- 둥근 기구 안에 보이는 모습 ---------- */
  function inner(parent, dev, kind, d, cx, cy, R, o = {}) {
    defs();
    const id = 'mlc' + (++uid);
    const g = el('g', {}, parent);
    el('clipPath', { id }, g).appendChild(el('circle', { cx, cy, r: R }));
    const cl = el('g', { 'clip-path': `url(#${id})` }, g);

    const flt = el('filter', { id: fid, filterUnits: 'userSpaceOnUse', x: cx - R - 40, y: cy - R - 40, width: 2 * R + 80, height: 2 * R + 80 }, g);
    const gb = el('feGaussianBlur', { stdDeviation: 0 }, flt);
    const wrap = el('g', {}, cl);
    const tg = el('g', {}, wrap);
    const H = TOYH[kind];
    const hz = -H * 0.34;
    const mir = isMirror(dev);
    el('rect', { x: -6000, y: -6000, width: 12000, height: 6000 + hz, fill: mir ? '#e3e8ee' : '#eef1f4' }, tg);
    el('rect', { x: -6000, y: hz - 1, width: 12000, height: 5, fill: '#c3cad2' }, tg);
    el('rect', { x: -6000, y: hz + 4, width: 12000, height: 6000, fill: mir ? '#f1f3f5' : '#f6f7f9' }, tg);
    el('ellipse', { cx: 0, cy: 2, rx: 70, ry: 10, fill: 'rgba(30,40,55,.22)', filter: 'url(#mlSoft2)' }, tg);
    toy(tg, kind);
    // 유리 질감
    el('circle', { cx, cy, r: R, fill: mir ? (dev === 'convex-mirror' ? 'url(#mlVigX)' : 'url(#mlVigC)') : 'url(#mlVigL)' }, cl);
    if (mir) el('circle', { cx, cy, r: R, fill: '#7d93a8', opacity: .07 }, cl);
    else el('circle', { cx, cy, r: R, fill: '#9fd3e6', opacity: .1 }, cl);
    el('path', { d: `M${cx - R * .78} ${cy - R * .25}A${R * .82} ${R * .82} 0 0 1 ${cx + R * .2} ${cy - R * .8}`, stroke: '#fff', 'stroke-width': R * .07, fill: 'none', 'stroke-linecap': 'round', opacity: .5 }, cl);
    el('circle', { cx, cy, r: R, fill: 'url(#mlSheen)', opacity: .7 }, cl);
    if (o.rim !== false) {
      el('circle', { cx, cy, r: R + R * .045, fill: 'none', stroke: 'url(#mlRim)', 'stroke-width': R * .09 }, g);
      el('circle', { cx, cy, r: R, fill: 'none', stroke: 'rgba(20,30,40,.45)', 'stroke-width': 1.2 }, g);
    }
    function set(dd, dv) {
      if (dv) dev = dv;
      const c = calc(dev, dd), a0 = Math.abs(c.s), a = a0 <= 1 ? a0 : 1 + (a0 - 1) * 0.3;   // 아주 큰 상은 화면에 다 담기게 조금 줄여 그림
      const t = Math.max(0, Math.min(1, (a - 0.9) / 1.4));
      const ax = FACE[kind][0] * t, ay = -H / 2 + (FACE[kind][1] + H / 2) * t;
      const k = (o.H0 || R * 1.3) / H;
      tg.setAttribute('transform', `translate(${cx} ${cy}) scale(${(Math.sign(c.s) * a * k).toFixed(4)}) translate(${-ax} ${-ay})`);
      gb.setAttribute('stdDeviation', (c.blur * (R / 176)).toFixed(2));
      wrap.setAttribute('filter', c.blur > 0.3 ? `url(#${fid})` : '');
      return c;
    }
    set(d);
    return { g, set };
  }

  /* ---------- 받침대에 끼운 둥근 기구 ---------- */
  function stand(g, cx, cy, R, baseY) {
    el('ellipse', { cx: cx + 18, cy: baseY + 10, rx: 150, ry: 20, fill: 'rgba(20,30,40,.18)', filter: 'url(#mlSoft)' }, g);
    el('path', { d: `M${cx - 120} ${baseY - 6}Q${cx - 124} ${baseY + 18} ${cx - 100} ${baseY + 20}L${cx + 100} ${baseY + 20}Q${cx + 124} ${baseY + 18} ${cx + 120} ${baseY - 6}Z`, fill: '#0c0e11' }, g);
    el('ellipse', { cx, cy: baseY - 6, rx: 120, ry: 20, fill: 'url(#mlBase)' }, g);
    el('ellipse', { cx: cx - 20, cy: baseY - 12, rx: 70, ry: 8, fill: '#fff', opacity: .1 }, g);
    el('rect', { x: cx - 8, y: cy + R + 6, width: 16, height: baseY - cy - R - 8, fill: 'url(#mlRod)' }, g);
    el('rect', { x: cx - 16, y: baseY - 34, width: 32, height: 18, rx: 4, fill: 'url(#mlRod)' }, g);
    el('rect', { x: cx - 13, y: cy + R + 2, width: 26, height: 22, rx: 4, fill: 'url(#mlRod)' }, g);
    // 오른쪽 나사
    el('rect', { x: cx + R + 6, y: cy - 9, width: 22, height: 18, rx: 3, fill: 'url(#mlRod)' }, g);
    el('rect', { x: cx + R + 26, y: cy - 13, width: 10, height: 26, rx: 3, fill: '#2b3036' }, g);
  }

  /* ---------- 관찰자 눈에 보이는 장면 ---------- */
  function view(host, o) {
    defs();
    const W = 1000, H = 640, Y0 = 60, sv0 = el('svg', { viewBox: `0 0 ${W} ${H - Y0}`, role: 'img', 'aria-label': o.aria || '관찰자 자리에서 본 둥근 거울(렌즈)과 F 모양 물체' }, host);
    const sv = el('g', { transform: `translate(0 ${-Y0})` }, sv0);   // 위쪽 빈 벽은 잘라 냄

    const kind = o.toy, TH = TOYH[kind];
    const lens = !isMirror(dev);
    const C = lens ? [560, 356] : [560, 276], R = lens ? 150 : 172, baseY = lens ? 604 : 600, HZ = lens ? 300 : 360;

    el('rect', { y: HZ - 30, width: W, height: 60, fill: '#fff', opacity: .25, filter: 'url(#mlSoft)' }, sv);
    const back = el('g', {}, sv), standG = el('g', {}, sv), mid = el('g', {}, sv), front = el('g', {}, sv);
    stand(standG, C[0], C[1], R, baseY);
    const H0 = lens ? R * 2.6 : R * 1.3;
    const insideL = inner(mid, dev, kind, 1, C[0], C[1], R, { H0 });
    // 실제 물체
    const real = el('g', {}, lens ? back : front), sh = el('ellipse', { rx: 80, ry: 12, fill: 'rgba(20,30,40,.25)', filter: 'url(#mlSoft2)' }, real), rt = el('g', {}, real);
    toy(rt, kind);
    const ov0 = OP.overlay(host, W, H - Y0), ov = { put: (id, x, y, h, c) => ov0.put(id, x, y - Y0, h, c), hide: ov0.hide, hideAll: ov0.hideAll };
    let cur = 1;
    function set(d) {
      cur = d;
      const c = insideL.set(d, dev);
      let k, x, y;
      if (lens) { k = H0 / TH * L / (L + d); y = HZ + (baseY - 34 - HZ) * L / (L + d * 1.6); x = C[0] - 30; }
      else { k = H0 / TH * L / (L - d); y = baseY + 14 + d * 6; x = C[0] - 330 - d * 14; }
      rt.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${k.toFixed(4)})`);
      sh.setAttribute('cx', x + 6); sh.setAttribute('cy', y + 2); sh.setAttribute('rx', 72 * k); sh.setAttribute('ry', 11 * k);
      if (o.labels !== false) {
        ov.put('real', lens ? x - 150 : x, lens ? y - TH * k * 0.55 : y - TH * k - 22, lens ? '렌즈 뒤의 물체' : '거울 앞의 물체', 'ink' + (lens ? ' la' : ''));
        ov.put('dev', C[0] + R + 30, C[1] - R - 6, NAMES[dev], 'inkk ra');
      }
      return c;
    }
    set(1);
    return { sv: sv0, set, ov, get d() { return cur; }, dev(v) { dev = v; set(cur); }, C, R };
  }

  /* ---------- 교과서식 기구 단면 그림 (x, y: 가운데, h: 높이) ---------- */
  function icon(parent, dev, x, y, h, o = {}) {
    defs();
    const g = el('g', { transform: `translate(${x} ${y}) scale(${h / 200})` }, parent);
    const face = o.face || 1;                       // 거울 면이 오른쪽(1) 또는 왼쪽(-1)을 봄
    if (dev === 'plane-mirror' || isMirror(dev)) {
      const k = dev === 'plane-mirror' ? 0 : dev === 'concave-mirror' ? 1 : -1;
      const b = -26 * k;                             // 거울 면 가운데가 들어간(오목) / 나온(볼록) 정도
      const sx = face;
      const fr = `M${-6 * sx} -100Q${(-6 + b) * sx} 0 ${-6 * sx} 100`;
      el('path', { d: `M${-14 * sx} -100L${-6 * sx} -100Q${(-6 + b) * sx} 0 ${-6 * sx} 100L${-14 * sx} 100Q${(-14 + b) * sx} 0 ${-14 * sx} -100Z`, fill: 'url(#mlBack)' }, g);
      el('path', { d: `${fr}L${(10 - (k ? 0 : 0)) * sx} 100Q${(10 + b) * sx} 0 ${10 * sx} -100Z`, fill: 'url(#mlGlassB)', stroke: '#5c9fb8', 'stroke-width': 1.2 }, g);
      el('path', { d: `M${-22 * sx} -104H${-6 * sx}V-96H${-22 * sx}ZM${-22 * sx} 104H${-6 * sx}V96H${-22 * sx}Z`, fill: '#3f464e' }, g);
      el('path', { d: `M${-22 * sx} -104L${-22 * sx} 104`, stroke: '#3f464e', 'stroke-width': 6 }, g);
    } else {
      const cv = dev === 'convex-lens';
      const d = cv ? 'M0 -100C30 -100 40 -40 40 0C40 40 30 100 0 100C-30 100 -40 40 -40 0C-40 -40 -30 -100 0 -100Z'
        : 'M-30 -100L30 -100C16 -50 14 -20 14 0C14 20 16 50 30 100L-30 100C-16 50 -14 20 -14 0C-14 -20 -16 -50 -30 -100Z';
      el('path', { d, fill: 'url(#mlGlassB)', stroke: '#4f93ad', 'stroke-width': 1.6 }, g);
      el('path', { d: cv ? 'M-12 -80C-24 -50 -26 -10 -22 20' : 'M-20 -86C-8 -50 -6 -20 -8 10', stroke: '#fff', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round', opacity: .6 }, g);
    }
    return g;
  }

  /* ---------- 옆에서 본 배치 ---------- */
  function side(host, o) {
    defs();
    const W = 1000, H = 210, Y0 = 34, sv = el('svg', { viewBox: `0 ${Y0} ${W} ${H - Y0}`, role: 'img', 'aria-label': '옆에서 본 배치. 기구, 물체, 관찰자의 눈이 한 줄로 놓여 있다.' }, host);
    let dev = o.dev;
    const lens = !isMirror(dev), TY = 150;
    el('rect', { width: W, height: H, fill: '#f6f8fa' }, sv);
    el('rect', { y: TY, width: W, height: H - TY, fill: '#e3e8ed' }, sv);
    el('rect', { y: TY, width: W, height: 4, fill: '#c7cfd7' }, sv);
    const DX = lens ? 650 : 120, EYE = lens ? 945 : 945, DIR = lens ? -1 : 1, K = lens ? 160 : 210;
    const xOf = (d) => DX + DIR * d * K, dOf = (x) => (x - DX) * DIR / K;
    // 눈금
    const tk = el('g', {}, sv);
    const ov0 = OP.overlay(host, W, H - Y0), ov = { put: (id, x, y, h, c) => ov0.put(id, x, y - Y0, h, c) };
    PRESET.forEach((d, i) => { const x = xOf(d); el('line', { x1: x, x2: x, y1: TY + 6, y2: TY + 20, stroke: '#8fa1b3', 'stroke-width': 2 }, tk); ov.put('z' + i, x, TY + 38, ZONE[i], 'inks'); });
    // 일직선 (관찰자와 기구를 잇는 선)
    el('line', { x1: Math.min(DX, xOf(3.7)), x2: EYE - 30, y1: 96, y2: 96, stroke: '#9fb3c6', 'stroke-width': 1.5, 'stroke-dasharray': '5 6' }, sv);
    // 기구 단면
    const ig = el('g', {}, sv);
    const drawDev = () => { ig.innerHTML = ''; icon(ig, dev, DX, 96, 92, { face: 1 }); el('rect', { x: DX - 4, y: 142, width: 8, height: 10, fill: '#5d646d' }, ig); el('rect', { x: DX - 26, y: 146, width: 52, height: 6, rx: 3, fill: '#2b3036' }, ig); };
    drawDev();
    OP.eye(sv, EYE, 96, 54, { lx: -8 });
    ov.put('eye', EYE, 136, '관찰자', 'inks');
    const tg = el('g', { style: 'cursor:grab' }, sv);
    el('rect', { x: -60, y: -120, width: 120, height: 130, fill: 'transparent' }, tg);
    el('ellipse', { cx: 0, cy: 2, rx: 30, ry: 5, fill: 'rgba(20,30,40,.2)' }, tg);
    const tt = el('g', { transform: `scale(${100 / TOYH[o.toy]})` }, tg); toy(tt, o.toy);
    let d = 1;
    function set(v) { d = Math.max(0.3, Math.min(3.6, v)); tg.setAttribute('transform', `translate(${xOf(d).toFixed(1)} ${TY + 1})`); return d; }
    let drag = false;
    tg.addEventListener('pointerdown', (e) => { drag = true; sv.setPointerCapture(e.pointerId); e.preventDefault(); });
    sv.addEventListener('pointermove', (e) => { if (!drag) return; const [x] = OP.toSvg(sv, e); o.onDrag && o.onDrag(Math.max(0.3, Math.min(3.6, dOf(x)))); });
    const up = () => { if (drag) { drag = false; o.onEnd && o.onEnd(); } };
    sv.addEventListener('pointerup', up); sv.addEventListener('pointercancel', up);
    set(1);
    return { sv, set, dev(v) { dev = v; drawDev(); } };
  }

  return { defs, toy, calc, label, inner, view, side, icon, NAMES, PRESET, ZONE, isMirror, converge, TOYH };
})();
</script>
<script>
/* ===== 나란한 빛 그림 (그림 Ⅲ-7, Ⅲ-8 형식) =====
   ML.rays(host, { theme: 'dark'|'light', dev, n })  → { dev(k), single(높이|null), marks(켜기), light(켜기) }
   거울 면에서는 반사 법칙, 렌즈 면에서는 굴절(유리 1.5)을 실제로 계산해 빛의 경로를 그려요. */
ML.rays = (host, o) => {
  const { el } = OP;
  ML.defs();
  const W = 1000, H = o.H || 560, CY = H / 2, dark = o.theme !== 'light';
  const sv = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.aria || '나란한 빛을 거울이나 렌즈에 비출 때 빛이 나아가는 모습' }, host);
  OP.defs(sv);
  sv.querySelector('defs').insertAdjacentHTML('beforeend', `
    <radialGradient id="rySpot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6ea" stop-opacity="1"/><stop offset=".25" stop-color="#ff9a8a" stop-opacity=".75"/><stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/></radialGradient>
    <linearGradient id="ryBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a414b"/><stop offset=".5" stop-color="#20252c"/><stop offset="1" stop-color="#121519"/></linearGradient>
    <linearGradient id="ryGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6eef8" stop-opacity="${dark ? .5 : .95}"/><stop offset=".45" stop-color="#9fd0e6" stop-opacity="${dark ? .32 : .85}"/><stop offset="1" stop-color="#cfe9f5" stop-opacity="${dark ? .45 : .95}"/></linearGradient>
    <linearGradient id="ryGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131922"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>`);
  const L = {}; ['bg', 'marks', 'beams', 'dev', 'dots', 'spot', 'src'].forEach((k) => (L[k] = el('g', {}, sv)));
  if (dark) {
    el('rect', { width: W, height: H, fill: 'url(#ryGrid)' }, L.bg);
    const gl = []; for (let x = 0; x <= W; x += 40) gl.push(`M${x} 0V${H}`); for (let y = CY % 40; y <= H; y += 40) gl.push(`M0 ${y}H${W}`);
    el('path', { d: gl.join(''), stroke: 'rgba(160,190,220,.06)', 'stroke-width': 1 }, L.bg);
  } else el('rect', { width: W, height: H, fill: '#fff' }, L.bg);
  const ph = dark ? OP.photons(L.dots) : null;
  let dev = o.dev, single = null, showMarks = false, lit = true;
  const N = o.n || 5, GAP = o.gap || 52;
  const MX = 760, LX = 520, n = 1.5;
  const geo = {
    'concave-mirror': { R: 600, half: 170 }, 'convex-mirror': { R: 600, half: 170 },
    'convex-lens': { R: 290, t: 104, half: 160 }, 'concave-lens': { R: 290, t: 16, half: 160 },
  };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], dot = (a, b) => a[0] * b[0] + a[1] * b[1], add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k], nrm = (a) => { const l = Math.hypot(a[0], a[1]); return [a[0] / l, a[1] / l]; };
  function hitCircle(p, d, c, R, vx) {
    const oc = sub(p, c), b = dot(oc, d), cc = dot(oc, oc) - R * R, disc = b * b - cc;
    if (disc < 0) return null;
    const s = Math.sqrt(disc), ts = [-b - s, -b + s].filter((t) => t > 1e-6);
    let best = null; ts.forEach((t) => { const q = add(p, d, t); if (!best || Math.abs(q[0] - vx) < Math.abs(best.q[0] - vx)) best = { t, q }; });
    return best;
  }
  function refract(d, nn, eta) {
    let N2 = nn, ci = -dot(N2, d); if (ci < 0) { N2 = [-nn[0], -nn[1]]; ci = -ci; }
    const k = 1 - eta * eta * (1 - ci * ci); if (k < 0) return null;
    return nrm(add([d[0] * eta, d[1] * eta], N2, eta * ci - Math.sqrt(k)));
  }
  /* 기구 면 */
  function surf(k) {
    const g = geo[k];
    if (k === 'concave-mirror') return [{ c: [MX - g.R, CY], R: g.R, vx: MX }];
    if (k === 'convex-mirror') return [{ c: [MX + g.R, CY], R: g.R, vx: MX }];
    if (k === 'convex-lens') return [{ c: [LX - g.t / 2 + g.R, CY], R: g.R, vx: LX - g.t / 2 }, { c: [LX + g.t / 2 - g.R, CY], R: g.R, vx: LX + g.t / 2 }];
    return [{ c: [LX - g.t / 2 - g.R, CY], R: g.R, vx: LX - g.t / 2 }, { c: [LX + g.t / 2 + g.R, CY], R: g.R, vx: LX + g.t / 2 }];
  }
  function trace(y) {
    const x0 = dark ? 150 : 30;
    let p = [x0, y], d = [1, 0];
    const pts = [p.slice()], hits = [];
    const ss = surf(dev);
    if (ML.isMirror(dev)) {
      const h = hitCircle(p, d, ss[0].c, ss[0].R, ss[0].vx); pts.push(h.q); hits.push({ q: h.q, n: nrm(sub(h.q, ss[0].c)) });
      const nn = nrm(sub(h.q, ss[0].c)); d = nrm(add(d, nn, -2 * dot(d, nn))); p = h.q;
    } else {
      ss.forEach((s, i) => { const h = hitCircle(p, d, s.c, s.R, s.vx); const nn = nrm(sub(h.q, s.c)); pts.push(h.q); hits.push({ q: h.q, n: nn }); d = refract(d, nn, i === 0 ? 1 / n : n) || d; p = h.q; });
    }
    // 화면 끝까지
    let t = 2000; const lim = [[0, W], [0, H]];
    if (d[0] > 0) t = Math.min(t, (lim[0][1] - p[0]) / d[0]); if (d[0] < 0) t = Math.min(t, (lim[0][0] + (dark ? 4 : 10) - p[0]) / d[0]);
    if (d[1] > 0) t = Math.min(t, (lim[1][1] - 4 - p[1]) / d[1]); if (d[1] < 0) t = Math.min(t, (4 - p[1]) / d[1]);
    pts.push(add(p, d, t));
    return { pts, hits, d, p };
  }
  /* 기구 그리기 */
  function drawDev() {
    L.dev.innerHTML = '';
    const g = geo[dev], ss = surf(dev);
    const arcPts = (s, sign, half) => { const a = []; for (let i = 0; i <= 40; i++) { const y = -half + (2 * half * i) / 40; a.push([s.c[0] + sign * Math.sqrt(s.R * s.R - y * y), CY + y]); } return a; };
    if (ML.isMirror(dev)) {
      const sign = dev === 'concave-mirror' ? 1 : -1, s = ss[0];
      const front = arcPts(s, sign, g.half), back = front.map(([x, y]) => [x + 16, y]);
      el('path', { d: OP.dstr(front) + 'L' + OP.dstr(back.reverse()).slice(1) + 'Z', fill: 'url(#mlBack)' }, L.dev);
      el('path', { d: OP.dstr(front) + 'L' + OP.dstr(front.map(([x, y]) => [x + 7, y]).reverse()).slice(1) + 'Z', fill: dark ? '#cfe7f3' : 'url(#mlGlassB)', stroke: dark ? 'rgba(220,240,250,.9)' : '#5c9fb8', 'stroke-width': 1.2 }, L.dev);
      if (dark) el('path', { d: OP.dstr(front), stroke: '#fff', 'stroke-width': 2, fill: 'none', opacity: .9 }, L.dev);
    } else {
      const a = arcPts(ss[0], -1, g.half), b = arcPts(ss[1], 1, g.half);
      let d;
      if (dev === 'convex-lens') d = OP.dstr(a) + 'L' + OP.dstr(b.reverse()).slice(1) + 'Z';
      else { const a2 = arcPts(ss[0], 1, g.half), b2 = arcPts(ss[1], -1, g.half); d = OP.dstr(a2) + 'L' + OP.dstr(b2.reverse()).slice(1) + 'Z'; }
      el('path', { d, fill: 'url(#ryGlass)', stroke: dark ? 'rgba(200,232,246,.85)' : '#4f93ad', 'stroke-width': 1.6 }, L.dev);
      el('path', { d: `M${LX - (dev === 'convex-lens' ? 26 : 22)} ${CY - g.half * .7}Q${LX - (dev === 'convex-lens' ? 38 : 14)} ${CY} ${LX - (dev === 'convex-lens' ? 30 : 16)} ${CY + g.half * .35}`, stroke: '#fff', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round', opacity: dark ? .35 : .6 }, L.dev);
    }
  }
  function drawSrc() {
    L.src.innerHTML = '';
    if (!dark) return;
    const hs = heights(), top = Math.min(...hs) - 34, bot = Math.max(...hs) + 34;
    el('rect', { x: 46, y: top, width: 104, height: bot - top, rx: 12, fill: 'url(#ryBox)', stroke: '#05070a', filter: 'url(#opShadow)' }, L.src);
    el('rect', { x: 52, y: top + 6, width: 92, height: 8, rx: 4, fill: 'rgba(255,255,255,.1)' }, L.src);
    el('rect', { x: 138, y: top + 8, width: 14, height: bot - top - 16, rx: 3, fill: 'url(#opMetal)' }, L.src);
    hs.forEach((y) => el('rect', { x: 146, y: y - 5, width: 6, height: 10, rx: 2, fill: lit ? '#ff6a5a' : '#3a1210' }, L.src));
  }
  const heights = () => (single != null ? [CY + single] : Array.from({ length: N }, (_, i) => CY + (i - (N - 1) / 2) * GAP));
  let beams = [];
  function render(grow) {
    L.beams.innerHTML = ''; L.marks.innerHTML = ''; L.spot.innerHTML = ''; if (ph) ph.clear(); beams = [];
    drawDev(); drawSrc();
    if (!lit) return;
    const rs = heights().map(trace);
    rs.forEach((r) => {
      if (dark) {
        const b = OP.beam(L.beams, { halo: 16, mid: 5, w: 2 }); b.set(r.pts); b.show(true, grow); beams.push(b);
        ph.add(r.pts, { rate: 1.6, speed: 260, r: 3.4, color: '#ffe0d8' });
      } else {
        el('path', { d: OP.dstr(r.pts), stroke: '#ee3a3a', 'stroke-width': 2.4, fill: 'none', 'stroke-linejoin': 'round' }, L.beams);
        for (let i = 1; i < r.pts.length; i++) {
          const a = r.pts[i - 1], b = r.pts[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]); if (len < 80) continue;
          const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
          el('path', { d: 'M-9 -6L5 0L-9 6Z', fill: '#ee3a3a', transform: `translate(${m[0].toFixed(1)} ${m[1].toFixed(1)}) rotate(${ang.toFixed(1)})` }, L.beams);
        }
      }
      if (showMarks) r.hits.forEach((h) => {
        const k = 54, a = add(h.q, h.n, -k), b = add(h.q, h.n, k);
        el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: dark ? 'rgba(220,235,250,.6)' : '#8a9bad', 'stroke-width': 1.4, 'stroke-dasharray': '5 5' }, L.marks);
        el('circle', { cx: h.q[0], cy: h.q[1], r: 5, fill: 'none', stroke: dark ? '#fff' : '#34495e', 'stroke-width': 1.6 }, L.marks);
      });
    });
    // 모이는 곳: 가운데 근처 빛들이 서로 만나는 점
    if (ML.converge(dev) && single == null && rs.length > 2) {
      const a = rs[Math.floor(N / 2) - 1], b = rs[Math.floor(N / 2) + 1];
      const p = a.p, d1 = a.d, q = b.p, d2 = b.d, den = d1[0] * d2[1] - d1[1] * d2[0];
      if (Math.abs(den) > 1e-6) {
        const t = ((q[0] - p[0]) * d2[1] - (q[1] - p[1]) * d2[0]) / den, X = add(p, d1, t);
        if (dark) { el('circle', { cx: X[0], cy: X[1], r: 34, fill: 'url(#rySpot)', class: 'pulse2' }, L.spot); }
        api.meet = X;
      }
    } else api.meet = null;
    api.traces = rs;
  }
  const api = {
    sv, dev(k) { dev = k; render(true); }, single(h) { single = h; render(false); }, marks(v) { showMarks = v; render(false); },
    light(v) { lit = v; render(true); }, get state() { return { dev, single, showMarks, lit }; }, CY, LX, MX, H, W, meet: null, traces: [],
  };
  render(false);
  return api;
};
</script>
<script>
/* ===== 블록 1: 빛 보내기 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S, Q = S.Q;
    const DEVS = ['convex-mirror', 'concave-mirror', 'convex-lens', 'concave-lens'];
    const ANS = { 'convex-mirror': 'spread', 'concave-mirror': 'meet', 'convex-lens': 'meet', 'concave-lens': 'spread' };
    const RES = {
      'convex-mirror': '거울 면에서 반사된 뒤 <b>넓게 퍼져요</b>', 'concave-mirror': '거울 면에서 반사된 뒤 <b>한 점에 모여요</b>',
      'convex-lens': '굴절되어 <b>한 점에 모여요</b>', 'concave-lens': '굴절되어 <b>퍼져요</b>',
    };
    const WHY = {
      mirror: ['거울 면의 곳곳은 기울어진 정도가 달라요. \'빛이 닿은 곳 보기\'를 눌러 각 점에서 반사면과 수직인 선을 보세요.', '빛은 닿은 곳마다 <b>반사 법칙</b>(입사각 = 반사각)에 따라 반사돼요.', '그래서 오목 거울에서는 반사된 빛이 가운데 쪽으로 모이고, 볼록 거울에서는 바깥쪽으로 퍼져요.'],
      lens: ['빛은 렌즈에 들어갈 때와 나올 때, 렌즈 면에서 <b>굴절</b>해요. \'빛이 닿은 곳 보기\'로 꺾이는 곳을 확인해요.', '렌즈의 종류에 따라 빛이 굴절되는 경로가 달라요.', '볼록 렌즈를 지난 빛은 가운데 쪽으로 꺾여 한 점에 모이고, 오목 렌즈를 지난 빛은 바깥쪽으로 꺾여 퍼져요.'],
    };
    let dev = DEVS.includes(Q.get('dev')) ? Q.get('dev') : 'convex-mirror';
    const done = {};
    if (Q.get('done') === 'all') DEVS.forEach((k) => (done[k] = true));
    const R = ML.rays($('#scene'), { theme: 'dark', dev });
    S.R = R;
    $('#devs').innerHTML = DEVS.map((k) => `<button type="button" role="tab" data-dev="${k}"><svg width="22" height="34" viewBox="-30 -110 60 220"></svg>${ML.NAMES[k]}</button>`).join('');
    $$('#devs button').forEach((b) => { ML.icon(b.querySelector('svg'), b.dataset.dev, 0, 0, 200, { face: -1 }); b.addEventListener('click', () => pick(b.dataset.dev)); });
    const fb = (t, m, cls = '') => { $('#fb').className = 'fbk ' + cls; $('#fbT').textContent = t; $('#fbM').innerHTML = m; };
    function pick(k) {
      dev = k; R.dev(k); $$('#q button').forEach((b) => b.classList.remove('bad')); paint();
      fb(ML.NAMES[k], done[k] ? `나란한 빛을 ${ML.NAMES[k]}에 비추면 ${RES[k]}.` : '나란한 빛이 어떻게 나아가는지 보고 아래에서 골라요.', done[k] ? 'ok' : '');
    }
    $$('#q button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.v === ANS[dev]) { done[dev] = true; fb('맞아요', `나란한 빛을 ${ML.NAMES[dev]}에 비추면 ${RES[dev]}.`, 'ok'); paint(); }
      else { b.classList.add('bad'); fb('다시 보세요', '기구를 지난 빛들 사이의 간격이 점점 좁아지나요, 넓어지나요? \'빛 하나\'로 빛을 하나씩 따라가 봐도 좋아요.', 'no'); }
    }));
    function paint() {
      const mir = ML.isMirror(dev);
      $$('#devs button').forEach((b) => { b.setAttribute('aria-selected', String(b.dataset.dev === dev)); b.classList.toggle('seen', !!done[b.dataset.dev]); });
      $('#cap').textContent = mir ? '그림 Ⅲ-7 나란한 빛을 거울에 비출 때 빛이 반사하는 모습' : '그림 Ⅲ-8 나란한 빛을 렌즈에 비출 때 빛이 굴절하는 모습';
      $('#qT').innerHTML = `나란한 빛을 <b>${ML.NAMES[dev]}</b>에 비추면 빛은?`;
      $('#q').hidden = !!done[dev];
      $('#tbl').innerHTML = '<tr><th>기구</th><th>나란한 빛을 비추면</th></tr>' + DEVS.map((k) => `<tr><th>${ML.NAMES[k]}</th>${done[k] ? `<td>${ML.isMirror(k) ? '반사 후 ' : '굴절 후 '}${ANS[k] === 'meet' ? '한 점에 모임' : '퍼짐'}</td>` : '<td class="empty">확인 전</td>'}</tr>`).join('');
      $('#why').innerHTML = `<h3>왜 그럴까?</h3>` + WHY[mir ? 'mirror' : 'lens'].map((t, i) => `<div class="w"><i>${i + 1}</i><span>${t}</span></div>`).join('');
      $('#bMark').textContent = mir ? '빛이 닿은 곳 보기' : '빛이 꺾이는 곳 보기';
      const all = DEVS.every((k) => done[k]), c = $('#concl');
      c.classList.toggle('lock', !all);
      c.querySelector('p').innerHTML = all ? '나란한 빛을 <b>한 점에 모으는</b> 오목 거울과 볼록 렌즈는, 물체가 가까이 있을 때 크고 바로 선 상이 생기다가 멀어지면 상이 뒤집혀 보여요. 나란한 빛을 <b>퍼지게 하는</b> 볼록 거울과 오목 렌즈는 항상 물체보다 작고 바로 선 상이 생겨요.' : '네 가지를 모두 확인하면 정리가 나타나요.';
    }
    $('#bAll').addEventListener('click', () => { $('#bAll').setAttribute('aria-pressed', 'true'); $('#bOne').setAttribute('aria-pressed', 'false'); $('#hr').hidden = true; R.single(null); });
    $('#bOne').addEventListener('click', () => { $('#bAll').setAttribute('aria-pressed', 'false'); $('#bOne').setAttribute('aria-pressed', 'true'); $('#hr').hidden = false; R.single(+$('#hIn').value); });
    $('#hIn').addEventListener('input', () => R.single(+$('#hIn').value));
    $('#bMark').addEventListener('click', () => { const v = $('#bMark').getAttribute('aria-pressed') !== 'true'; $('#bMark').setAttribute('aria-pressed', String(v)); R.marks(v); });
    if (Q.get('one')) { $('#hIn').value = Q.get('one'); $('#bOne').click(); }
    if (Q.get('mark') === '1') $('#bMark').click();
    pick(dev);
    window.SM.okUI = true; window.SM.ok3d = true;
  } catch (err) { window.SM_err('빛 보내기', err); }
})();
</script>
