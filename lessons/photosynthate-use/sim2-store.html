    }

  }

    var msg = '[' + where + '] ' + (err && err.message ? err.message : String(err));

  };

})();

  /* ===== 3D 화면 공통 ===== */

  /* ===== 광합성 수업 공통 ===== */

<script>
/* ===== 광합성 수업 공통 그림 도구 PS =====

      <g id="mH2O"><circle cx="-10" cy="8" r="6" fill="url(#psH)" stroke="#7f92a6" stroke-width=".7"/><circle cx="10" cy="8" r="6" fill="url(#psH)" stroke="#7f92a6" stroke-width=".7"/><circle r="10.5" fill="url(#psO)" stroke="#8a2416" stroke-width=".7"/></g>
      <g id="mO2"><circle cx="-7.5" cy="0" r="9" fill="url(#psO)" stroke="#8a2416" stroke-width=".7"/><circle cx="7.5" cy="0" r="9" fill="url(#psO)" stroke="#8a2416" stroke-width=".7"/></g>
      <g id="mGlu"><path d="M12 0 6 10.4H-6L-12 0-6-10.4H6Z" fill="url(#psGlu)" stroke="#a66d0a" stroke-width="1.2" stroke-linejoin="round"/><path d="M6.5 0 3.2 5.6H-3.2L-6.5 0-3.2-5.6H3.2Z" fill="none" stroke="#fff3c4" stroke-width="1.2" opacity=".75"/></g>

      const done = i >= list.length;
      $('#cnt').textContent = done ? '창고를 모두 채웠어요' : `${i + 1}번째 / ${list.length}가지`;
      $('#nm').textContent = done ? '양분을 저장하는 곳은 다양해요' : list[i].n; $('.big-crop').hidden = done;
      if (!done && $('#one').dataset.k !== list[i].k) { $('#one').dataset.k = list[i].k; SG.cropIn($('#one'), list[i].k); }
      seg('#org', ORG, () => o, (v) => { if (!done) o = v; }); seg('#frm', FRM, () => f, (v) => { if (!done) f = v; });
      $('#go').disabled = done || !o || !f;
    }
    $('#go').addEventListener('click', () => {
      const c = list[i];
      if (o !== c.organ || f !== c.form) { const w = o !== c.organ ? '기관' : '형태'; say('다시 골라 봐요', `<b>${w}</b>이(가) 달라요. ${HINT[c.k]}`, 'no'); return; }
      S.reveal(c.k); say(`${c.n}: ${c.organ}에 ${c.form}로 저장`, HINT[c.k], 'ok');
      i++; o = null; f = null;
      if (i >= list.length) say('창고를 모두 채웠어요', '쓰고 남은 양분은 열매, 줄기, 뿌리, 씨 등에 <b>포도당, 설탕, 녹말, 단백질, 지방</b> 등 다양한 형태로 저장돼요. 우리가 먹는 것이 바로 이 양분이에요.', 'ok');
      render();
    });
    $('#bReset').addEventListener('click', () => { S = SG.shelf($('#fig')); i = 0; o = null; f = null; delete $('#one').dataset.k; say('결과', '먼저 기관과 형태를 골라요.'); render(); });
    render();
    if (q.get('all')) { list.forEach((c) => S.reveal(c.k)); i = list.length; render(); say('창고를 모두 채웠어요', '쓰고 남은 양분은 열매, 줄기, 뿌리, 씨 등에 <b>포도당, 설탕, 녹말, 단백질, 지방</b> 등 다양한 형태로 저장돼요.', 'ok'); }
    window.SM = window.SM || {}; window.SM.okUI = true;
  } catch (err) { window.SM_err && window.SM_err('양분 창고', err); }
})();
</script>
</body>
</html>
