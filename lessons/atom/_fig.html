<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원자의 구조 – 그림 찍기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>

  :root{--bg:#edf3f8;--card:#fff;--ink:#14263b;--ink2:#34495e;--muted:#5a6b7e;--line:#dde6ee;--accent:#0e63b3;--accent-soft:#e3effb;
    --fab:#4b3fb5;--fab-soft:#ecebfb;--ok:#1f9d5c;--no:#d9534f;
    --shadow:0 1px 2px rgba(20,38,59,.06),0 8px 24px rgba(20,38,59,.07);--ease:cubic-bezier(.2,.8,.2,1)}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}
  .app{max-width:1320px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
  .eyebrow{display:inline-flex;font-size:13px;font-weight:700;color:var(--fab);background:var(--fab-soft);padding:4px 10px;border-radius:999px}
  h1{font-size:clamp(21px,2.4vw,28px);margin:6px 0 2px;letter-spacing:-.02em;word-break:keep-all}
  .sub{margin:0;color:var(--muted);font-size:15px;word-break:keep-all}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid rgba(20,38,59,.04)}
  .pad{padding:14px 16px}
  .stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:14px;align-items:start}
  .viewer{position:sticky;top:10px}
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .fs{min-height:54px;border:0;border-radius:12px;background:#eef3f8;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;word-break:keep-all;padding:4px}
  .fs b{font-size:15px}
  .fs[aria-selected="true"]{background:var(--fab);color:#fff}
  .fs.seen:not([aria-selected="true"]){background:#e5f5ec;color:#11703f}
  .stepname{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
  .stepname .no{flex:none;width:40px;height:40px;border-radius:12px;background:var(--fab);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px}
  .stepname h2{margin:0;font-size:21px;letter-spacing:-.01em;word-break:keep-all}
  .stepname small{display:block;font-size:13px;color:var(--muted);font-weight:700}
  .what{font-size:16px;line-height:1.75;color:var(--ink2);margin:0 0 10px;word-break:keep-all}
  .phase{display:grid;gap:6px;margin:8px 0}
  .ph{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 10px;border-radius:12px;background:#f7fafc;font-size:15px;line-height:1.55;color:var(--muted);word-break:keep-all;transition:background .3s,color .3s}
  .ph i{font-style:normal;width:26px;height:26px;border-radius:8px;background:#dfe6ee;display:grid;place-items:center;font-weight:900;font-size:13px;color:#607285}
  .ph.on{background:var(--fab-soft);color:var(--ink)}.ph.on i{background:var(--fab);color:#fff}
  .ph.done{color:var(--ink2)}.ph.done i{background:#b9b2ee;color:#fff}
  .box{border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.65;word-break:keep-all}
  .box b.t{display:block;font-size:13px;margin-bottom:2px}
  .an{background:#fff8e6;border:1px solid #f3dc9a;color:#5b4300}
  .fact{background:#eef6ff;border:1px solid #cfe2f6;color:#1d3f66}
  .lnk{background:#ecf8f1;border:1px solid #c6e8d4;color:#0f5a36}
  .src{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
  .btn{min-height:50px;border:0;border-radius:14px;padding:0 16px;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;word-break:keep-all}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--fab);color:#fff}.btn.ghost{background:#eef3f8;color:var(--ink2)}
  .btn[aria-pressed="true"]{background:#14263b;color:#fff}
  .btn:disabled{opacity:.4;cursor:default;transform:none}
  .prog{height:6px;border-radius:3px;background:#e6edf4;margin-top:10px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7ff0,var(--fab))}
  .credit{text-align:center;font-size:13px;font-weight:700;color:#8495a8;letter-spacing:.02em;margin:6px 0 0}
  /* ===== 3D 화면 공통 ===== */
  :root{--Bc:#14a5d0;--Ic:#2fae4a;--Fc:#f0522a;--N:#d8433b;--S:#2f62c9;--P:#7d5ad6}
  .viewer{position:relative;overflow:hidden;padding:0}
  .gl-host{position:relative;width:100%;height:min(74vh,700px);min-height:380px;background:linear-gradient(#f6f9fc,#d6e3ef);touch-action:none}
  .gl-host canvas.gl{display:block;width:100%;height:100%;outline:none}
  .lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lb{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:14px;padding:3px 9px;border-radius:9px;background:rgba(255,255,255,.88);color:#34495e;box-shadow:0 2px 8px rgba(20,38,59,.14);will-change:transform}
  .lb.small{font-size:12px;font-weight:700;color:#5a6b7e;background:rgba(255,255,255,.72);box-shadow:none}
  .lb.B{background:var(--Bc);color:#fff}.lb.I{background:var(--Ic);color:#fff}.lb.F{background:var(--Fc);color:#fff;font-size:15px}
  .lb.P{background:var(--P);color:#fff}
  .lb.dim{opacity:.35}
  .vt{position:absolute;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
  .vt.tl{left:10px;top:10px;max-width:calc(100% - 20px)}
  .vt.tr{right:10px;top:10px;justify-content:flex-end}
  .vt.bl{left:10px;bottom:10px;align-items:center}
  .vb{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(20,38,59,.12);background:rgba(255,255,255,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:800;font-size:14px;color:#34495e;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(20,38,59,.08)}
  .vb:active{transform:scale(.96)}
  .vb .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .vb[aria-pressed="false"]{opacity:.62}
  .vb[aria-pressed="false"] .dot{background:#c2ccd6!important}
  .vb.sel{background:#14263b;color:#fff;border-color:#14263b}
  .hint{font-size:12.5px;font-weight:700;color:#5a6b7e;background:rgba(255,255,255,.78);border-radius:10px;padding:6px 10px;word-break:keep-all}
  .inset{position:absolute;z-index:2;border-radius:18px;border:2px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(20,38,59,.22),inset 0 0 0 1px rgba(20,38,59,.08);pointer-events:none;display:none}
  .inset.on{display:block}
  .inset .it{position:absolute;left:8px;top:8px;font-size:12.5px;font-weight:900;color:#14263b;background:rgba(255,255,255,.9);border-radius:8px;padding:3px 8px}
  .inset .ic{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  .inset .ic span{font-size:11.5px;font-weight:800;color:#fff;border-radius:7px;padding:2px 7px;white-space:nowrap}
  .fail3d{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:16px;font-weight:700;color:#7a2a22;line-height:1.7;word-break:keep-all;background:#fff4f2}
  .fail3d.show{display:grid}
  .model{font-size:13px;color:var(--muted);text-align:right;margin:0;word-break:keep-all}
  @media (max-width:900px){.gl-host{height:min(56vh,620px)}}
  .zoombadge{position:absolute;right:10px;top:62px;z-index:3;font-size:13px;font-weight:800;color:#fff;background:rgba(75,63,181,.9);border-radius:10px;padding:6px 10px;display:none;word-break:keep-all;max-width:60%}
  .zoombadge.on{display:block}
  @media (max-width:900px){.stage{grid-template-columns:1fr}.viewer{position:relative;top:0}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  /* ===== 원자 3D 그림 이름표 ===== */
  .gl-host{position:relative;overflow:hidden;background:#f4f8fb;touch-action:none;user-select:none;-webkit-user-select:none}
  .gl-host > canvas.gl{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
  .lb.zl{font-size:clamp(13px,1.35vw,15.5px);color:#14263b;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(20,38,59,.12);padding:3px 10px}
  .lb.zl.big{font-size:clamp(15px,1.7vw,19px);font-weight:900;padding:4px 12px}
  .lb.zl.pr,.lb.zl.ne{padding-left:8px}
  .lb.zl.pr::before,.lb.zl.ne::before{content:'';display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:6px;vertical-align:-.04em}
  .lb.zl.pr::before{background:#e2463d}.lb.zl.ne::before{background:#6fb646}
  .lb.zl.pr{transform-origin:0 0;margin:-2.6em 0 0 -1.2em}.lb.zl.ne{margin:2.6em 0 0 1.2em}
  .lb.zl.nucq{background:transparent;box-shadow:none;color:#fff;font-weight:900;font-size:clamp(20px,2.6vw,30px);letter-spacing:-.02em;text-shadow:0 1px 2px rgba(90,15,10,.4);padding:0}
  .lb.zl.nucq.sm{font-size:clamp(15px,1.9vw,22px)}
  .pk{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none}
  .ph b.k{color:#0e63b3}
  .good{border-color:#0e63b3!important;background:#e4f0fb!important;color:#0b3f73!important}
  .bad{border-color:#e7a29b!important;background:#fff4f2!important;color:#9b3a32!important}
  .lb.zl.nucq.xl{font-size:44px}
  html,body{margin:0;background:#fff}
  #fig{position:relative;width:100vw;height:100vh;background:#fff}
  .gl-host>.prep{display:none!important}
</style>
</head>

<script type="importmap">

<script type="module">

  }
  // 나뭇결 책상
  function woodTex() {
    const t = canvasTex(1024, 512, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#c99a6b'); gr.addColorStop(1, '#b8875a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);

  function makeStage(host, opt = {}) {

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9bb0, 0.55));

    // 이름표(HTML)를 3D 위치에 붙이기
    const labels = [];
    function label(html, cls, at) {
      const el = document.createElement('div'); el.className = 'lb ' + (cls || ''); el.innerHTML = html; overlay.appendChild(el);
      const L = { el, at, show: true, set(h) { if (el.innerHTML !== h) el.innerHTML = h; } };

    function placeLabels() {
      labels.forEach((L) => {

    let fly = null;
    controls.addEventListener('start', () => { fly = null; });

       dir: 카메라가 놓일 방향(물체 중심에서), margin: 가장자리 여백(1.1 = 10%), dur: 이동 시간(초)

    }

  // 풍선 속: 헬륨 원자들이 자유롭게 움직여요
  function heGas(n = 26) {

  // 헬륨 원자 하나(그림 Ⅳ-6): 원자핵(양성자 2, 중성자 2)과 전자 2개
  function heAtom() {
    const g = new THREE.Group();
    const cloud = new THREE.Mesh(SPH, cloudMat(1)); cloud.scale.setScalar(2.6); cloud.renderOrder = 3; g.add(cloud);
    const nuc = nucleus(2, 2, .3); g.add(nuc);

  /* ---------- 무대 공통 ---------- */
  function stage(host, o = {}) {
    const st = makeStage(host, Object.assign({ top: '#ffffff', bottom: '#e7eff6', fov: 32, minD: 3, maxD: 40, fitWidth: true, hold: true, exposure: 1.0 }, o));
    st.renderer.toneMapping = THREE.ACESFilmicToneMapping;

  }
  function frameBox(w, h, d = 1) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial()); m.visible = false; return m; }

  /* ===================== 1) 연속 확대 ===================== */
  const CHAIN = {
    gold: [
      { name: '금괴', make: goldBars, labels: [['금 원소 · 금을 이루는 물질', 'big', () => V(0, 1.75, .3)]], K: 9 },
      { name: '금 원자', make: goldLattice, labels: [['금 원자 · 금 원소를 구성하는 입자', 'big', () => V(0, 2.4, 1.0)]] },
    ],
    he: [
      { name: '헬륨 풍선', make: balloons, labels: [['헬륨 풍선', 'big', () => V(0, 2.75, .3)]], K: 7 },
      { name: '풍선 속 헬륨', make: heGas, labels: [['헬륨 원자', 'big', (g) => V().copy(g.userData.pick.position).add(V(0, .75, 0))]], K: 6.5 },
      { name: '헬륨 원자', make: heAtom, labels: [['원자핵', '', () => V(0, -.62, .2)], ['전자', '', (g) => V().copy(g.userData.es[0].position).add(V(0, .45, 0))], ['헬륨 원자', 'big', () => V(-2.7, -2.35, 0)]], K: 5.5 },
      { name: '원자핵', make: null, labels: [] }, // 헬륨 원자를 원자핵 둘레로 확대한 장면
    ],
  };
  function dive(host, which) {
    const st = stage(host, which === 'he' ? { top: '#ffffff', bottom: '#e6eef5' } : { top: '#ffffff', bottom: '#ece8de' });
    const chain = CHAIN[which];
    const levels = chain.map((c, i) => { if (!c.make) return null; const inner = c.make(), g = new THREE.Group(); g.add(inner); g.userData = inner.userData; prepFade(g); st.scene.add(g); return g; });
    const frame = frameBox(7.2, 5.4); st.scene.add(frame);
    st.camera.position.set(0, 1.2, 14); st.controls.target.set(0, 0, 0);
    const home = st.fit(frame, { dir: V(0, .16, 1), margin: 1.02 });
    st.controls.minDistance = 4; st.controls.maxDistance = 30;
    const API = { st, lv: 0, busy: false, simple: false, onEvent: null, NAMES: chain.map((c) => c.name) };
    // 이름표
    const LB = [];
    chain.forEach((c, i) => c.labels.forEach(([t, cls, at]) => { const g = levels[i] || levels[i - 1]; const L = st.label(t, 'zl ' + cls, () => at(g)); L.lv = i; L.show = false; LB.push(L); }));
    let nucLab = [];
    if (which === 'he') {
      const g = levels[2], parts = g.userData.nuc.userData.parts;
      nucLab = [st.label('양성자', 'zl pr', () => parts[0].getWorldPosition(V()).add(V(0, .0, 0))), st.label('중성자', 'zl ne', () => parts[1].getWorldPosition(V()))];
      nucLab.forEach((L) => (L.show = false));

    }
    function labels(lv, on) {

      nucLab.forEach((L) => (L.show = on && lv === 3));
      if (API.simpleLab) API.simpleLab.show = on && lv === 2 && API.simple;
    }
    // 장면 상태 정하기: lv 단계에서 각 그룹의 크기·위치·투명도
    function pose(lv, k = 1, from = lv) {
      levels.forEach((g, i) => { if (!g) return; g.visible = false; });
      const set = (i, s, pos, a) => { const g = levels[i]; if (!g) return; g.scale.setScalar(s); g.position.copy(pos); setFade(g, a); };
      if (which === 'he' && (lv === 3 || from === 3)) {
        // 헬륨 원자 → 원자핵: 원자핵을 가운데 두고 크게
        const t = from === 3 && lv === 2 ? 1 - k : lv === 3 ? k : 1;

      const inward = lv > from, a = inward ? from : lv, b = inward ? lv : from, t = ease(inward ? k : 1 - k);
      const ga = levels[a], gb = levels[b], K = chain[a].K || 6;

    }
    st.onFrame((dt) => {
      levels.forEach((g) => g && g.visible && g.userData.step && g.userData.step(dt));
      if (which === 'he') levels[2].userData.spin = API.lv !== 3 && !(anim && anim.to === 3);
      if (!anim) return;

      if (anim.k >= 1) { const to = anim.to; anim = null; API.lv = to; API.busy = false; st.controls.enabled = true; pose(to); labels(to, true); API.onEvent && API.onEvent('arrive', to); }

  /* ===================== 2) 원자 모형 실험실 (해 보기) ===================== */
  function lab(host) {
    const st = stage(host, { top: '#ffffff', bottom: '#eaf1f7', fov: 30 });
    st.controls.enabled = false;
    const R = 3, g = new THREE.Group(); st.scene.add(g);
    const cloud = new THREE.Mesh(SPH, cloudMat(1)); cloud.scale.setScalar(R); cloud.renderOrder = 3; g.add(cloud);
    const core = new THREE.Mesh(SPH, partMat('p')); core.scale.setScalar(.62); core.castShadow = true; g.add(core);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: C3.blobTex(), transparent: true, opacity: .35, depthWrite: false })); sh.rotation.x = -Math.PI / 2; sh.position.y = -R - .05; sh.scale.set(.75, .32, 1); g.add(sh);
    const frame = frameBox(6.6, 6.7); frame.position.y = -.1; st.scene.add(frame);
    st.camera.position.set(0, 0, 14); st.fit(frame, { dir: V(0, 0, 1), margin: 1.0 });
    const qLab = st.label('', 'zl nucq', () => core.getWorldPosition(V())); qLab.show = false;
    const nameLab = st.label('', 'zl big', () => V(-R * .78, R * .9, 0)); nameLab.show = false;
    const API = { st: { p: 0, es: [] }, onChange: null, onBlock: null, name: '' };
    const es = []; // {g, k, born}
    function add(p, quiet) {
      const e = particle('e', .27); e.position.copy(p); e.userData.k = quiet ? 1 : 0; g.add(e); es.push(e);
      API.st.es = es.map((x) => x.position.clone()); if (!quiet) API.onChange && API.onChange(API.st);
    }
    function remove(e) { g.remove(e); es.splice(es.indexOf(e), 1); API.st.es = es.map((x) => x.position.clone()); API.onChange && API.onChange(API.st); }
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(V(0, 0, 1), 0), hit = V();
    host.addEventListener('pointerup', (ev) => {
      const rc = host.getBoundingClientRect(); ndc.set(((ev.clientX - rc.left) / rc.width) * 2 - 1, -((ev.clientY - rc.top) / rc.height) * 2 + 1);
      ray.setFromCamera(ndc, st.camera);
      const hitE = ray.intersectObjects(es.map((e) => e.userData.body), false)[0];
      if (hitE) { const e = es.find((x) => x.userData.body === hitE.object); if (e) remove(e); return; }

      es.forEach((e, i) => { e.userData.k = Math.min(1, e.userData.k + dt * 4); const k = e.userData.k, s = k < 1 ? easeO(k) * (1 + .25 * Math.sin(k * Math.PI)) : 1; e.scale.setScalar(Math.max(.001, s)); e.position.z = .25 + Math.sin(t * 1.3 + i) * .04; });

    function spots(n) { const out = [], r = mkR(n * 13 + 7); let tries = 0; while (out.length < n && tries++ < 4000) { const a = r() * 6.283, d = 1.25 + r() * 1.35, p = V(Math.cos(a) * d, Math.sin(a) * d, .25); if (out.every((q) => q.distanceTo(p) > .85) && es.every((e) => e.position.distanceTo(p) > .85)) out.push(p); } return out; }
    Object.assign(API, {
      setAtom(name) { API.name = name; nameLab.set(name + ' 원자'); nameLab.show = true; API.clear(true); API.st.p = 0; qLab.show = false; core.material = partMat('p'); },
      setP(n) { API.st.p = n; qLab.set('+' + n); qLab.show = true; },
      clear(quiet) { es.slice().forEach((e) => g.remove(e)); es.length = 0; API.st.es = []; if (!quiet) API.onChange && API.onChange(API.st); },
      fill(k) { const n = (k === undefined ? API.st.p : k) - es.length; spots(n).forEach((p, i) => add(p, i < n - 1)); },

  /* ===================== 3) 양성자수에 따라 바뀌는 원자 ===================== */
  function single(host, o = {}) {
    const st = stage(host, { top: '#ffffff', bottom: '#eaf1f7', fov: 30 });
    st.controls.enabled = !!o.orbit;
    const R = 3, g = new THREE.Group(); st.scene.add(g);
    const cloud = new THREE.Mesh(SPH, cloudMat(1)); cloud.scale.setScalar(R); cloud.renderOrder = 3; g.add(cloud);
    const core = new THREE.Mesh(SPH, partMat('p')); core.scale.setScalar(.62); core.castShadow = true; g.add(core);
    const frame = frameBox(6.4, 6.4); st.scene.add(frame);
    st.camera.position.set(0, 0, 14); st.fit(frame, { dir: V(0, .05, 1), margin: 1.0 });
    let lastWH = '';
    st.onFrame(() => { const { W, H } = st.size(), k = W + 'x' + H; if (k !== lastWH) { lastWH = k; st.fit(frame, { dir: V(0, .05, 1), margin: 1.0 }); } });

        return;
      }
      if (z > old) { // 양성자가 날아와 원자핵에 붙고, 전자가 하나 들어와요
        const p = particle('p', .3); p.position.set(-5.2, 1.6, .5); g.add(p); fly.push({ o: p, a: p.position.clone(), b: V(), k: 0, dur: .9, end: () => { g.remove(p); pulse = 1; } });
        const e = mkE(es.length); g.add(e); es.push(e); e.userData.enter = 0;
      } else { // 양성자가 빠져나가고, 전자도 하나 나가요
        const p = particle('p', .3); g.add(p); fly.push({ o: p, a: V(), b: V(5.2, -1.4, .5), k: 0, dur: .9, end: () => g.remove(p) });
        const e = es.pop(); const a = e.position.clone(); fly.push({ o: e, a, b: a.clone().normalize().multiplyScalar(6.5), k: 0, dur: .8, end: () => g.remove(e) });

    st.onFrame((dt) => {
      t0 += dt;
      es.forEach((e, i) => {
        e.userData.path(t0 * .9 + i * 1.7, tmp);
        if (e.userData.enter !== undefined) { e.userData.enter = Math.min(1, e.userData.enter + dt / .9); const k = ease(e.userData.enter); e.position.lerpVectors(V(5.4, 2.0, .6), tmp, k); if (e.userData.enter >= 1) delete e.userData.enter; }
        else e.position.copy(tmp);
      });
      for (let i = fly.length - 1; i >= 0; i--) { const f = fly[i]; f.k = Math.min(1, f.k + dt / f.dur); const k = ease(f.k); f.o.position.lerpVectors(f.a, f.b, k); if (f.o.userData.kind === 'p') f.o.position.y += Math.sin(k * Math.PI) * .5; if (f.k >= 1) { f.end(); fly.splice(i, 1); } }
      if (pulse) { const s = 1 + .14 * Math.sin((1 - Math.abs(pulse)) * Math.PI); core.scale.setScalar(.62 * s); pulse = Math.sign(pulse) * Math.max(0, Math.abs(pulse) - dt * 2.5); if (Math.abs(pulse) < .01) { pulse = 0; core.scale.setScalar(.62); } }
      g.rotation.y = Math.sin(t0 * .3) * .08;
    });

    prepare(st).then(() => { window.__ready = true; });
    return API;
  }

  /* ===================== 읽기·카드용 사진 장면 ===================== */
  // which: 'he-detail' 그림 Ⅳ-6, 'he-simple' 그림 Ⅳ-7, 'gold-bars', 'gold-atoms', 'struct' 그림 Ⅳ-5, 'card'
  function still(host, which) {
    const st = stage(host, { top: '#ffffff', bottom: '#ffffff', fov: 30 });
    st.scene.background = new THREE.Color('#ffffff');
    st.controls.enabled = false;
    let fr, dir = V(0, .05, 1), margin = 1.02;

      g.userData.step(0.01);
