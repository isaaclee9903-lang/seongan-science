<script>
/* 문제 알림: 코드에 오류가 나면 화면 아래에 빨간 상자로 알려 줘요 (선생님 확인용) */
(function () {
  function box() {
    var b = document.getElementById('smErr');
    if (!b && document.body) {
      b = document.createElement('div'); b.id = 'smErr';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fdecea;color:#8a1f17;border:2px solid #d9534f;border-radius:12px;padding:10px 14px;font:600 14px/1.5 sans-serif;white-space:pre-wrap';
      document.body.appendChild(b);
    }
    return b;
  }
  window.SM_err = function (where, err) {
    var msg = '[' + where + '] ' + (err && err.message ? err.message : String(err));
    var show = function () { var b = box(); if (b) b.textContent += (b.textContent ? '\n' : '') + msg; };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  window.addEventListener('error', function (e) { window.SM_err('스크립트', { message: e.message + ' (줄 ' + e.lineno + ')' }); });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var S = window.SM || {};
      if (!S.okUI) window.SM_err('실행 안 됨', { message: '안내·버튼 코드가 실행되지 않았어요. 파일이 끝(</html>)까지 들어 있는지 확인해 주세요.' });

    }, 9000);
  });
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

  :root{--bg:#edf3f8;--card:#fff;--ink:#14263b;--ink2:#34495e;--muted:#5a6b7e;--line:#dde6ee;--accent:#0e63b3;--accent-soft:#e3effb;
    --fab:#4b3fb5;--fab-soft:#ecebfb;--ok:#1f9d5c;--no:#d9534f;
    --shadow:0 1px 2px rgba(20,38,59,.06),0 8px 24px rgba(20,38,59,.07);--ease:cubic-bezier(.2,.8,.2,1)}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  .fs{min-height:54px;border:0;border-radius:12px;background:#eef3f8;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;word-break:keep-all;padding:4px}

  .acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
  .btn{min-height:50px;border:0;border-radius:14px;padding:0 16px;font-weight:800;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;word-break:keep-all}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--fab);color:#fff}.btn.ghost{background:#eef3f8;color:var(--ink2)}
  .btn[aria-pressed="true"]{background:#14263b;color:#fff}

  .prog{height:6px;border-radius:3px;background:#e6edf4;margin-top:10px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7ff0,var(--fab))}
  .credit{text-align:center;font-size:13px;font-weight:700;color:#8495a8;letter-spacing:.02em;margin:6px 0 0}
  /* ===== 3D 화면 공통 ===== */
  :root{--Bc:#14a5d0;--Ic:#2fae4a;--Fc:#f0522a;--N:#d8433b;--S:#2f62c9;--P:#7d5ad6}
  .viewer{position:relative;overflow:hidden;padding:0}

  .vt{position:absolute;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
  .vt.tl{left:10px;top:10px;max-width:calc(100% - 20px)}
  .vt.tr{right:10px;top:10px;justify-content:flex-end}
  .vt.bl{left:10px;bottom:10px;align-items:center}
  .vb{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(20,38,59,.12);background:rgba(255,255,255,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:800;font-size:14px;color:#34495e;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(20,38,59,.08)}
  .vb:active{transform:scale(.96)}
  .vb .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .vb[aria-pressed="false"]{opacity:.62}

  .vb.sel{background:#14263b;color:#fff;border-color:#14263b}

  .inset{position:absolute;z-index:2;border-radius:18px;border:2px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(20,38,59,.22),inset 0 0 0 1px rgba(20,38,59,.08);pointer-events:none;display:none}

  .inset .it{position:absolute;left:8px;top:8px;font-size:12.5px;font-weight:900;color:#14263b;background:rgba(255,255,255,.9);border-radius:8px;padding:3px 8px}
  .inset .ic{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}

  .fail3d.show{display:grid}
  .model{font-size:13px;color:var(--muted);text-align:right;margin:0;word-break:keep-all}
  @media (max-width:900px){.gl-host{height:min(56vh,620px)}}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  /* ===== 파동 그림 공통 ===== */
  .scene{position:relative;width:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}

  .ol{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;font-size:clamp(11.5px,1.3vw,14.5px);line-height:1.3;letter-spacing:-.01em}
  .ol.tx{color:#34495e;background:rgba(255,255,255,.88);padding:1px 6px;border-radius:6px}

  .ol.la{transform:translate(-100%,-50%)}.ol.ra{transform:translate(0,-50%)}

  /* ===== 파동 수업 공통 ===== */
  :root{--fab:#0e63b3;--fab-soft:#e4f0fb}

  .prog i{background:#0e63b3}
  .ph.done i{background:#8db8e3}
  .fbk{border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.65;word-break:keep-all;background:#f6f9fc;border:1px solid #dbe4ed;color:var(--ink2)}
  .fbk.ok{background:#e9f3fd;border-color:#bcd7f2;color:#0b3f73}

  .vlab{position:absolute;left:12px;top:10px;z-index:3;font-size:13px;font-weight:800;color:#34495e;background:rgba(255,255,255,.88);border-radius:9px;padding:4px 10px}

  /* ===== 한 화면 배치 (2026-10-15: 태블릿 한 화면 안에서 실험과 결과가 끝나도록) ===== */
  .app{padding:10px 16px 12px;gap:10px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
  header.top .ttl{min-width:0}

  .stage{align-items:stretch}

  .ptabs.big button{min-height:48px;font-size:15.5px}
  .pane[hidden]{display:none!important}

  .viewer{background:#fff}
  .vctl{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#f3f6f9;border-top:1px solid var(--line);align-items:center}

  .vctl .vb[aria-pressed="true"]{background:#14263b;color:#fff;border-color:#14263b;opacity:1}

  /* 화면 높이를 꽉 채우기: 그림 칸이 남는 높이를 차지 */

  .app{height:100vh;height:100dvh;max-height:1400px}
  .stage{flex:1 1 auto;min-height:0}
  .stage > .card.pad{overflow:auto}
  @media (max-width:900px){.stage{grid-template-rows:minmax(0,1fr) auto}}

  .scope{position:relative;width:100%;overflow:hidden;background:#fff}

  .scope .scl{position:absolute;right:8px;top:50%;transform:translateY(-130%);font-size:12.5px;font-weight:800;color:#6b7c8f;background:rgba(255,255,255,.9);padding:0 4px;border-radius:5px;pointer-events:none}

<script>
/* ===== SND: 악기 소리 내기 + 소리 분석 화면(파형) =====

   - 파형은 마이크가 아니라 재생 중인 녹음 자료를 그대로 그려요(소리를 꺼 둔 기기에서도 같은 파형이 보여요).

    contrabass: { name: '콘트라베이스', fam: 'str', base: 36, part: '줄', how: '활로 아주 굵고 긴 줄을 문질러 줄이 진동해요', s: ['C2', 'E2', 'Gs2', 'Cs3'] },

    bassoon:    { name: '바순',       fam: 'ww',  base: 48, part: '관 속 공기', how: '입김을 불어 긴 관 속 공기가 진동해요', s: ['C3', 'G3', 'A3', 'C4', 'G4'], g4: 1 },
    recorder:   { name: '리코더',     fam: 'ww',  base: 72, part: '관 속 공기', how: '입김을 불어 관 속 공기가 진동해요', s: ['G4', 'C5', 'E5', 'G5', 'C6'], g4: 1 },

    horn:       { name: '호른',       fam: 'br',  base: 48, part: '관 속 공기', how: '입술을 떨며 불어 둥글게 감긴 관 속 공기가 진동해요', s: ['D3', 'F3', 'A3', 'C4'] },

    tuba: (k) => ({ vb: '0 0 120 160', g: `<defs>${BR(k)}</defs>` + shadow(60, 150, 36) +
      `<path d="M44 140Q30 140 30 120L30 92Q30 78 44 78" fill="none" stroke="#7d5414" stroke-width="13.6" stroke-linecap="round"/><path d="M44 140Q30 140 30 120L30 92Q30 78 44 78" fill="none" stroke="url(#${k}bh)" stroke-width="12" stroke-linecap="round"/>` +
      `<path d="M44 146Q78 148 80 120L84 40L56 40L60 112Q60 128 44 132Z" fill="url(#${k}bh)" stroke="#7d5414" stroke-width=".9"/>` +
      `<path d="M54 40Q50 14 40 10L102 10Q90 14 86 40Z" fill="url(#${k}bh)" stroke="#7d5414" stroke-width=".9"/><ellipse cx="71" cy="10" rx="31" ry="6" fill="url(#${k}bm)" stroke="#7d5414" stroke-width=".9"/>` +
      [[38, 92], [46, 96], [54, 100]].map(([x, y]) => `<rect x="${x - 3.6}" y="${y - 14}" width="7.2" height="26" rx="2.4" fill="url(#${k}bh)" stroke="#7d5414" stroke-width=".8"/><ellipse cx="${x}" cy="${y - 15}" rx="4.4" ry="1.8" fill="#eef0f2" stroke="#8e99a5" stroke-width=".7"/>`).join('') +
      tube('M34 104L14 96', k, 2.4) + air(71, 6, -90, 7) }),
    xylophone: (k) => {
      const bars = []; const n = 10;
      for (let i = 0; i < n; i++) { const x = 12 + i * 10.2, L = 66 - i * 3.6, y = 70 - L / 2 + i * 1.2; bars.push(`<rect x="${x}" y="${y + 3}" width="8.6" height="${L}" rx="1.6" fill="#5e2e14"/><rect x="${x}" y="${y}" width="8.6" height="${L}" rx="1.6" fill="url(#${k}x)"/><circle cx="${x + 4.3}" cy="${y + L * 0.22}" r=".9" fill="#2a160c"/><circle cx="${x + 4.3}" cy="${y + L * 0.78}" r=".9" fill="#2a160c"/>`); }
      return { vb: '0 0 120 160', g: `<defs>${lg(k + 'x', [[0, '#b8693a'], [0.5, '#9b5129'], [1, '#7a3b1b']])}${lg(k + 'f', [[0, '#4a3a30'], [1, '#2a1f19']])}</defs>` + shadow(62, 122, 54) +
        `<path d="M8 44L114 52L114 58L8 50Z" fill="url(#${k}f)"/><path d="M8 92L114 88L114 94L8 98Z" fill="url(#${k}f)"/>` +
        `<g class="vbp">${bars.join('')}</g>` +
        `<line x1="44" y1="136" x2="72" y2="92" stroke="#cfb38a" stroke-width="2" stroke-linecap="round"/><circle cx="73.5" cy="89.6" r="4.6" fill="#3b4c63"/>` +
        `<line x1="86" y1="140" x2="88" y2="96" stroke="#cfb38a" stroke-width="2" stroke-linecap="round"/><circle cx="88.2" cy="92.6" r="4.6" fill="#3b4c63"/>` };
    },
    timpani: (k) => ({ vb: '0 0 120 160', g: `<defs>${lg(k + 'k', [[0, '#e0a072'], [0.4, '#b86a3c'], [1, '#6e3519']])}${rg(k + 'm', [[0, '#fbf7ee'], [1, '#ddd3be']], 0.4, 0.35, 0.8)}</defs>` + shadow(60, 146, 46) +
      `<path d="M14 64Q16 122 60 128Q104 122 106 64Z" fill="url(#${k}k)" stroke="#5e2c12" stroke-width=".9"/>` +
      `<path d="M30 124L22 144M90 124L98 144M60 128L60 146" stroke="#4a515b" stroke-width="2.4" stroke-linecap="round"/>` +
      `<ellipse cx="60" cy="64" rx="47" ry="13" fill="#9aa5b1"/><ellipse class="vbp" cx="60" cy="62.5" rx="44" ry="11.5" fill="url(#${k}m)"/>` +
      [22, 40, 60, 80, 98].map((x) => `<line x1="${x}" y1="${70 + Math.abs(60 - x) * -0.1}" x2="${x}" y2="${84 - Math.abs(60 - x) * 0.25}" stroke="#c9ccd0" stroke-width="1.6"/>`).join('') +
      `<line x1="70" y1="40" x2="104" y2="22" stroke="#cfb38a" stroke-width="2" stroke-linecap="round"/><circle cx="68" cy="41.5" r="4.4" fill="#e9e3d6" stroke="#b7ad98" stroke-width=".8"/>` }),
  };

  let seq = 0;
  function svg(id, key) {
    const k = 'i' + (key || ++seq) + id;
    const d = DRAW[id](k);
    return `<svg class="inst-svg" viewBox="${d.vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${d.g}</svg>`;
  }
  window.ART = { svg, ids: Object.keys(DRAW) };
})();
</script>
<script>
/* ===== 블록 1: 무대 · 건반 · 연주 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S, I = SND.INST;
    // 무대 자리 (가로 1000 × 세로 420 기준)
    const SEAT = [
      ['horn', 300, 92], ['trumpet', 433, 92], ['trombone', 567, 92], ['tuba', 700, 92],
      ['xylophone', 105, 212], ['recorder', 233, 212], ['flute', 367, 212], ['clarinet', 500, 212], ['bassoon', 633, 212], ['timpani', 880, 212],
      ['violin', 300, 338], ['harp', 433, 338], ['cello', 567, 338], ['contrabass', 700, 338],
    ];
    const box = $('#orchIn');
    box.innerHTML = `<svg class="floor" viewBox="0 0 1000 420" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ede7"/><stop offset="1" stop-color="#e7e0d6"/></linearGradient></defs>
      <path d="M20 420A480 400 0 0 1 980 420Z" fill="url(#fl)"/>
      ${[275, 152].map((r) => `<path d="M${500 - r * 1.42} 420A${r * 1.42} ${r} 0 0 1 ${500 + r * 1.42} 420" fill="none" stroke="#ddd3c5" stroke-width="1.4"/>`).join('')}
      <rect x="470" y="396" width="60" height="16" rx="5" fill="#d6ccbe"/><text x="500" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#8a7d6c" font-family="Pretendard,sans-serif">지휘대</text></svg>` +
      SEAT.map(([id, x, y]) => `<button type="button" class="ib" data-id="${id}" style="left:${x / 10}%;top:${(y / 420) * 100}%" aria-label="${I[id].name}"><span class="pic">${ART.svg(id, 's')}</span><span class="nm">${I[id].name}</span></button>`).join('');
    function fit() { const o = $('#orch').getBoundingClientRect(); let w = o.width - 8, h = (w * 420) / 1000; if (h > o.height - 6) { h = o.height - 6; w = (h * 1000) / 420; } box.style.width = w + 'px'; box.style.height = h + 'px'; box.style.marginLeft = -w / 2 + 'px'; box.style.marginTop = -h / 2 + 'px'; }
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('#orch')); fit();

    const WIN = 0.016;
    const sc = SND.scope($('#sc'), { win: WIN, rows: 5 });
    const ampTag = document.createElement('span'); ampTag.className = 'amp'; ampTag.textContent = '진폭'; ampTag.hidden = true; $('#sc').appendChild(ampTag);
    sc.onDraw = (s) => { ampTag.hidden = !s.ampAt; if (s.ampAt) { ampTag.style.left = s.ampAt.x + 'px'; ampTag.style.top = s.ampAt.y + 'px'; } };
    const st = { id: S.Q.get('inst') && I[S.Q.get('inst')] ? S.Q.get('inst') : 'violin', key: +(S.Q.get('key') || 0), vel: S.Q.get('vel') || 'mid', ghost: true, prev: null };
    const VN = { soft: '약하게', mid: '보통', loud: '세게' };
    S.st = st; S.sc = sc;
    function who() {
      const d = I[st.id];
      $('#who').innerHTML = `<span class="pic">${ART.svg(st.id, 'w')}</span><div><h2>${d.name}<span class="fam">${SND.FAM[d.fam]}</span></h2><p>${d.how.replace(d.part, `<b>${d.part}</b>`)}.</p></div>`;
      $$('#orch .ib').forEach((b) => b.classList.toggle('sel', b.dataset.id === st.id));
      $('#keys').innerHTML = SND.SCALE.map(([n, d2], j) => { const m = d.base + d2; return `<button type="button" class="key${j === st.key ? ' sel' : ''}" data-j="${j}">${j === 0 ? '<span class="lh">낮은</span>' : j === 7 ? '<span class="lh">높은</span>' : ''}${n}<small>${Math.round(SND.hz(m))} Hz</small></button>`; }).join('');
      $$('#keys .key').forEach((k) => k.addEventListener('pointerdown', (e) => { e.preventDefault(); st.key = +k.dataset.j; play(); }));
    }
    function setOn(on) { $$('#orch .ib, #who').forEach((b) => b.classList.remove('on')); if (on) { const b = $(`#orch .ib[data-id="${on.id}"]`); if (b) b.classList.add('on'); if (on.id === st.id) $('#who').classList.add('on'); } }
    // 소리가 끝나면 그 소리의 파형을 화면에 남겨 두고, 새 소리가 나면 다시 움직여요
    SND.on((v) => { setOn(v); if (v) sc.clear(); else if (st.last) sc.freeze(SND.shot(st.last.id, st.last.m, SND.VEL[st.last.vel], WIN, SND.N)); });
    let loadMsg = 0;
    async function play(midi) {
      const d = I[st.id], m = midi || d.base + SND.SCALE[st.key][1];
      $$('#keys .key').forEach((k) => k.classList.toggle('sel', +k.dataset.j === st.key && !midi));
      if (!SND.ready(st.id)) {
        $('#note').textContent = `${d.name} 소리를 불러오는 중…`; const my = ++loadMsg;
        try { await SND.load(st.id); } catch (e) { $('#note').textContent = '소리 파일을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
        if (my !== loadMsg) return; $('#note').textContent = '실제 악기를 녹음한 소리예요';
      }
      const v = SND.play(st.id, m, SND.VEL[st.vel]); if (!v) return;
      const k = $$('#keys .key')[st.key]; if (k && !midi) { k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 160); }
      sc.ghost(st.ghost && st.prev ? SND.shot(st.prev.id, st.prev.m, SND.VEL[st.prev.vel], WIN, SND.N) : null);
      const f = Math.round(SND.hz(m)), nn = midi === 67 ? '솔' : (SND.SCALE[st.key][1] === 12 ? '높은 도' : SND.SCALE[st.key][1] === 0 ? '낮은 도' : SND.SCALE[st.key][0]);
      $('#ro').innerHTML = `${d.name} · ${nn} · <em>1초에 약 ${f}번 진동 (${f} Hz)</em> · ${VN[st.vel]}`;
      st.prev = { id: st.id, m, vel: st.vel }; st.last = st.prev;
      window.dispatchEvent(new CustomEvent('played', { detail: { id: st.id, m, vel: st.vel } }));
    }
    S.play = play;
    $$('#orch .ib').forEach((b) => b.addEventListener('click', () => { st.id = b.dataset.id; who(); play(); }));
    $$('#vel button').forEach((b) => b.addEventListener('click', () => { st.vel = b.dataset.v; $$('#vel button').forEach((x) => x.setAttribute('aria-selected', String(x === b))); }));
    $$('#vel button').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.v === st.vel)));
    const press = (b, v) => b.setAttribute('aria-pressed', String(v));
    $('#bGhost').addEventListener('click', () => { st.ghost = !st.ghost; press($('#bGhost'), st.ghost); if (!st.ghost) sc.ghost(null); });
    $('#bAmp').addEventListener('click', () => { const v = $('#bAmp').getAttribute('aria-pressed') !== 'true'; press($('#bAmp'), v); sc.mark(v ? 'amp' : null); });
    who();
    SND.load(st.id).catch(() => {});
    // 검사용: ?play=1 이면 바로 연주, ?freeze=1 이면 파형을 멈춰 찍기
    if (S.Q.get('play') === '1') SND.load(st.id).then(() => { play(); if (S.Q.get('freeze') === '1') setTimeout(() => sc.freeze(SND.shot(st.id, I[st.id].base + SND.SCALE[st.key][1], SND.VEL[st.vel], WIN, SND.N)), 500); });
    if (S.Q.get('amp') === '1') $('#bAmp').click();
    window.SM.okUI = true;
  } catch (err) { window.SM_err('무대와 건반', err); }
})();
</script>
<script>
/* ===== 블록 2: 찾아보기 세 가지 ===== */
(() => {
  'use strict';
  try {
    const S = window.SM, { $, $$ } = S, I = SND.INST;
    const MIS = [
      { k: 'amp', t: '같은 건반을 <b>약하게</b>, 한 번 <b>세게</b>', s: '어떤 악기든 좋아요',
        ok: '세게 연주하니 파동이 위아래로 더 크게 흔들렸어요. <b>진폭</b>이 클수록 큰 소리가 나요. 소리의 세기는 진폭에 따라 달라져요.' },
      { k: 'freq', t: '같은 세기로 <b>낮은 도</b>, 한 번 <b>높은 도</b>', s: '건반 맨 왼쪽과 맨 오른쪽',
        ok: '높은 도는 같은 시간 동안 파동이 더 촘촘하게(더 많이) 반복됐어요. 1초 동안 진동하는 횟수, 곧 <b>진동수</b>가 클수록 높은 소리가 나요.' },
      { k: 'form', t: '두 악기로 <b>같은 높이의 솔</b>을 같은 세기로', s: '392 Hz', btn: true,
        ok: '세기와 높낮이가 같아도 악기마다 파동의 모양이 달랐어요. 이 모양을 <b>파형</b>이라 하고, 파형이 달라 서로 구분되는 특징을 <b>음색</b>이라고 해요.' },
    ];
    const hist = [], done = {};
    function render() {
      $('#mis').innerHTML = MIS.map((m, j) => `<div class="mi${done[m.k] ? ' done' : ''}"><i>${done[m.k] ? '✓' : j + 1}</i><span>${m.t}<small>${m.s}</small></span>${m.btn ? '<button type="button" class="sb" id="bSol">이 악기로 솔(392 Hz)</button>' : '<span></span>'}</div>`).join('');
      $('#bSol').addEventListener('click', () => {
        const d = I[S.st.id];
        if (!d.g4) { fb(false, `${d.name}는 이 높이(392 Hz)의 솔을 내기 어려워요. 바이올린, 플루트, 트럼펫, 실로폰처럼 다른 악기를 골라 보세요.`); return; }
        S.play(67);
      });
    }
    function fb(ok, html, title) { const f = $('#fb'); f.className = 'fbk' + (ok ? ' ok' : ok === false ? ' no' : ''); f.innerHTML = `<b class="t">${title || (ok ? '찾았어요' : '다시 해 볼까요?')}</b>${html}`; }
    function check(p) {
      hist.push(p); const h = hist.slice(-12);
      const hit = (k) => { if (done[k]) return false; done[k] = true; return true; };
      let got = null;
      if (h.some((a) => a.id === p.id && a.m === p.m && a.vel !== p.vel && ((a.vel === 'soft' && p.vel === 'loud') || (a.vel === 'loud' && p.vel === 'soft'))) && hit('amp')) got = 'amp';
      const b = I[p.id].base;
      if (!got && (p.m === b || p.m === b + 12) && h.some((a) => a.id === p.id && a.vel === p.vel && a.m === (p.m === b ? b + 12 : b)) && hit('freq')) got = 'freq';
      if (!got && p.m === 67 && h.some((a) => a.id !== p.id && a.m === 67 && a.vel === p.vel) && hit('form')) got = 'form';
      if (got) { render(); const m = MIS.find((x) => x.k === got); fb(true, m.ok, `찾았어요 · ${Object.keys(done).length}/3`); if (got === 'amp' && $('#bAmp').getAttribute('aria-pressed') !== 'true') $('#bAmp').click(); }
      else if (Object.keys(done).length === 3) fb(true, '세 가지를 모두 찾았어요. 소리의 <b>세기는 진폭</b>, <b>높낮이는 진동수</b>, <b>음색은 파형</b>에 따라 달라져요. 다른 악기로도 자유롭게 연주해 보세요.', '모두 찾았어요');
    }
    window.addEventListener('played', (e) => check(e.detail));
    (S.Q.get('m') || '').split(',').filter(Boolean).forEach((n) => (done[MIS[+n - 1].k] = true));
    render();
    if (S.Q.get('m')) { const last = MIS[+S.Q.get('m').split(',').pop() - 1]; fb(true, last.ok, `찾았어요 · ${Object.keys(done).length}/3`); }
  } catch (err) { window.SM_err('찾아보기', err); }
})();
</script>
