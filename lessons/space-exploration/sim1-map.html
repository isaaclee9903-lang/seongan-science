<body>
<div class="app">
  <header>
    <span class="eyebrow">시뮬레이션 ① · 그림 Ⅷ-11 인류의 우주 탐사 성과</span>
    <h1>탐사 지도: 인류는 태양계 어디까지 가 봤을까?</h1>
    <p class="sub">이름표를 누르면 그곳으로 날아가요. 아래 연도 막대를 움직이면 그해까지 탐사선이 어디까지 갔는지 보여요.</p>
  </header>

  <div class="stage">
    <div class="card map viewer">
      <canvas id="cv" role="img" aria-label="태양계 지도. 가운데 왼쪽에 태양이 있고, 수성부터 해왕성까지 궤도가 비스듬히 그려져 있다. 태양, 달, 화성, 소행성, 혜성, 목성, 토성 둘레에 탐사선 이름표가 있고, 보이저 2호가 목성·토성·천왕성·해왕성을 지나 바깥으로 가는 길이 그려져 있다."></canvas>
      <div class="vt tl"><span class="hint" id="hint">이름표를 눌러 보세요</span></div>
      <div class="vt tr"><button class="vb" id="home" type="button">전체 보기</button></div>
      <div class="ticks" id="ticks" style="background:#0b1226"></div>
      <div class="tline">
        <div class="yr" id="yr">2026<small>년까지</small></div>
        <input type="range" id="yrR" min="1957" max="2026" step="1" value="2026" aria-label="연도">
        <button class="vb" id="play" type="button">1957년부터 재생</button>
      </div>
    </div>
    <div class="card pad" id="panel">
      <div class="groups" id="groups"></div>
      <div id="detail"></div>
    </div>
  </div>
  <p class="model">태양·행성·탐사선의 크기와 거리는 실제 비율과 달라요(개념 이해를 위한 모형). 연도는 탐사선이 그 천체에 도착·착륙·충돌한 해예요.</p>
</div>

<script>
/* ===== 우주 탐사 그림 도구 (별 배경, 태양, 행성, 탐사선, 이름표, 화살표) =====
   - 행성·탐사선 그림은 사진이 아니라 개념 이해를 위한 모형이에요. 크기와 거리는 실제 비율과 달라요.
   - 모든 그림은 캔버스(2D)로 그리고, 화면에 보일 때만 움직여요(SX.add). */

    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c: c, w: w, h: h, dpr: dpr };

  function off(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

  /* 화면에 보이는 그림만 다시 그리는 공용 반복 */
  var anims = [], running = false;

      const vp = vpos(year);
      if (vp) {
        const pts = VP.slice(0, vp.i).map((p) => toS(p[0], p[1])).concat([toS(vp.x, vp.y)]);
        c.save(); c.shadowColor = 'rgba(255,200,90,.7)'; c.shadowBlur = 8; S.path(c, pts, 'rgba(255,205,110,.85)', 2.2, [7, 6]); c.restore();
      }
      /* 행성 */
      const order = PL.slice().sort((a, b) => a.y - b.y);
      order.forEach((p) => {
        const [x, y] = toS(p.x, p.y), r = Math.max(2.4, pr(p.id)), L = Math.hypot(p.x, p.y) || 1;
        S.planet(c, x, y, r, p.id, { lx: -p.x / L, ly: -p.y / L * TILT, t });
        if (p.id === 'earth') { const mo = moonOf(t), [mx, my] = toS(mo.x, mo.y); S.planet(c, mx, my, Math.max(1.6, pr('moon')), 'moon', { lx: -p.x / L, ly: -p.y / L }); }
        if (cam.z < 2.2 || ['earth', 'mars', 'jupiter', 'saturn'].includes(p.id)) S.tag(c, p.n, x, y + r + fs * 0.95, { size: fs - 2, bg: 'none', color: 'rgba(214,224,245,.85)', weight: 700 });
      });
      /* 소행성, 혜성 */
      { const [x, y] = toS(AST.x, AST.y), r = Math.max(2.4, pr('asteroid')); S.planet(c, x, y, r, 'asteroid', { seed: 3 });
        const a = t / 1600, [mx, my] = [x + Math.cos(a) * r * 2.6, y + Math.sin(a) * r * 2.6 * 0.6]; S.planet(c, mx, my, Math.max(1.2, r * 0.38), 'asteroid', { seed: 8 });
        if (cam.z > 3) { S.tag(c, '디디모스', x, y + r + fs, { size: fs - 3, bg: 'none', color: '#d6c8b4' }); S.tag(c, '디모르포스', mx + r * 1.6, my - r * 0.8, { size: fs - 4, bg: 'none', color: '#d6c8b4', align: 'left' }); } }
      { const [x, y] = toS(COM.x, COM.y), r = Math.max(2.4, pr('comet')); S.tail(c, x, y, r, Math.atan2(COM.y * TILT, COM.x), r * 16); S.planet(c, x, y, r, 'comet', { seed: 21 }); }
      /* 탐사선(확대했을 때) */
      if (cam.z > 2) drawProbes(c, t, fs);
      /* 보이저 2호 */
      if (vp) { const [x, y] = toS(vp.x, vp.y); S.glow(c, x, y, 18, [255, 210, 120], 0.8); S.probe(c, x, y, 7, -0.4, 'dish'); }
      /* 그룹 이름표 */
      GROUPS.forEach((g) => {
        const ms = g.ids.map((id) => byId[id]), vis = ms.filter(shown).length;
        let a = anchor(g.id, t); if (g.id === 'voyager') { if (!vp) return; a = vp; }
        if (g.id === 'sun' && cam.z > 2 && selG === 'sun') return;
        const [x, y, s] = toS(a.x, a.y); const sel = selG === g.id;
        if (cam.z > 2) return;
        const off = { sun: [0, -46], moon: [26, -26], mars: [-10, 30], asteroid: [24, 18], comet: [0, -26], jupiter: [0, -30], saturn: [10, 34], voyager: [0, -24] }[g.id];
        const zx = cam.z > 2 ? 1.6 : 1, lx = x + off[0] * zx, ly = y + off[1] * zx;
        c.save(); c.strokeStyle = vis ? 'rgba(255,170,90,.75)' : 'rgba(255,255,255,.18)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x, y); c.lineTo(lx, ly); c.stroke(); c.restore();
        const ph = 0.5 + 0.5 * Math.sin(t / 500 + g.n.length);
        if (vis) { c.save(); c.strokeStyle = `rgba(255,170,90,${0.35 + ph * 0.4})`; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 9 + ph * 4, 0, Math.PI * 2); c.stroke(); c.restore(); }
        const label = vis ? `${g.n} ${vis}` : g.n;
        const tw = S.tag(c, label, lx, ly, { size: fs, bg: vis ? (sel ? '#ff8a3d' : 'rgba(217,98,43,.92)') : 'rgba(40,48,70,.8)', color: vis ? '#fff' : 'rgba(200,210,230,.6)', border: sel ? '#ffd27a' : null });
        hits.push({ g: g.id, x: lx, y: ly, r: Math.max(26, tw / 2) , h: fs * 1.2 });
      });
    }
    function drawProbes(c, t, fs) {
      const lab = (m, x, y) => { const sel = selM === m.id; const tw = S.tag(c, m.name, x, y, { size: fs - 1, bg: sel ? '#ffd27a' : 'rgba(8,14,32,.85)', color: sel ? '#2a1a00' : '#fff', border: sel ? null : 'rgba(255,170,90,.6)' }); hits.push({ m: m.id, x, y, r: tw / 2, h: fs * 1.2 }); };
      const lead = (x1, y1, x2, y2) => { c.save(); c.strokeStyle = 'rgba(255,190,120,.55)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore(); };
      const each = (ids, fn) => ids.forEach((id, i) => { const m = byId[id]; if (shown(m)) fn(m, i); });
      const dash = (col, fn) => { c.save(); c.strokeStyle = col; c.setLineDash([4, 5]); c.lineWidth = 1.3; c.beginPath(); fn(); c.stroke(); c.restore(); };
      if (selG === 'sun') {
        const [x0, y0] = toS(0, 0), rs = pr('sun');
        each(['parker', 'solo'], (m) => {
          if (m.id === 'parker') { const a = t / 2600, A = rs * 1.9, B = A * TILT * 1.3, cx = x0 + rs * 0.55; dash('rgba(255,200,120,.45)', () => c.ellipse(cx, y0, A, B, 0, 0, Math.PI * 2)); const x = cx + Math.cos(a) * A, y = y0 + Math.sin(a) * B; S.probe(c, x, y, 10, Math.atan2(y0 - y, x0 - x) + Math.PI, 'shield'); lab(m, x0 + rs * 1.55, y0 + rs * 1.25); lead(x, y, x0 + rs * 1.55, y0 + rs * 1.25); }
          else { const a = t / 4000, x = x0 + Math.cos(a) * rs * 0.7, y = y0 - rs * 1.45 + Math.sin(a) * rs * 0.12; dash('rgba(160,200,255,.4)', () => c.ellipse(x0, y0 - rs * 0.4, rs * 0.7, rs * 1.05, 0, 0, Math.PI * 2)); S.probe(c, x, y, 9, 0, 'wing'); S.tag(c, '태양의 극지방', x0, y0 - rs * 1.08, { size: fs - 3, bg: 'rgba(60,30,0,.55)', color: '#ffe0a0' }); lab(m, x0 - rs * 1.4, y0 - rs * 1.5); lead(x, y, x0 - rs * 1.4, y0 - rs * 1.5); }
        });
      } else if (selG === 'moon') {
        const mo = moonOf(t), [mx, my] = toS(mo.x, mo.y), r = pr('moon'), [ex, ey] = toS(P.earth.x, P.earth.y);
        each(['apollo', 'artemis', 'danuri'], (m) => {
          if (m.id === 'danuri') { const a = t / 1400; dash('rgba(120,200,255,.6)', () => c.ellipse(mx, my, r * 2, r * 1.1, 0, 0, Math.PI * 2)); const x = mx + Math.cos(a) * r * 2, y = my + Math.sin(a) * r * 1.1; S.probe(c, x, y, 8, 0, 'wing'); lab(m, mx + r * 2.6, my + r * 2.4); lead(x, y, mx + r * 2.6, my + r * 2.4); }
          else if (m.id === 'apollo') { const x = mx - r * 0.35, y = my - r * 0.95; S.probe(c, x, y, 6, 0, 'lander'); lab(m, mx - r * 1.6, my - r * 2.6); lead(x, y, mx - r * 1.6, my - r * 2.6); }
          else { const q = (t / 5000) % 1, k = q < 0.5 ? q * 2 : 2 - q * 2, qx = (ex + mx) / 2, qy = Math.min(ey, my) - r * 3.2; dash('rgba(255,255,255,.35)', () => { c.moveTo(ex, ey); c.quadraticCurveTo(qx, qy, mx + r * 1.6, my - r * 0.4); }); const x = (1 - k) * (1 - k) * ex + 2 * (1 - k) * k * qx + k * k * (mx + r * 1.6), y = (1 - k) * (1 - k) * ey + 2 * (1 - k) * k * qy + k * k * (my - r * 0.4); S.probe(c, x, y, 7, 0, 'wing'); lab(m, qx, qy + 4); }
        });
        S.tag(c, '달', mx, my + r + fs, { size: fs - 2, bg: 'none', color: '#e6e6e0' });
      } else if (selG === 'mars') {
        each(['curiosity'], (m) => { const [x, y] = toS(P.mars.x, P.mars.y), r = pr('mars'); S.probe(c, x + r * 0.2, y - r * 0.95, 6, 0, 'lander'); lab(m, x, y - r * 2.2); lead(x + r * 0.2, y - r, x, y - r * 2.2); });
      } else if (selG === 'asteroid') {
        each(['dart'], (m) => { const [x, y] = toS(AST.x, AST.y), r = pr('asteroid'); const a = (t / 3000) % 1, px = x - r * 9 + a * r * 6.4, py = y - r * 3 + a * r * 2.2; if (a < 0.98) S.probe(c, px, py, 8, 0.35, 'wing'); else S.glow(c, x + r * 2.6, y, 30, [255, 230, 180], 0.9); lab(m, x - r * 6, y - r * 3.6); });
      } else if (selG === 'comet') {
        const [x, y] = toS(COM.x, COM.y), r = pr('comet');
        each(['rosetta', 'deepimpact'], (m) => { if (m.id === 'rosetta') { const a = t / 2200, px = x + Math.cos(a) * r * 3, py = y + Math.sin(a) * r * 1.4; S.probe(c, px, py, 8, 0, 'wing'); S.probe(c, x + r * 0.2, y - r * 0.85, 4, 0, 'lander'); lab(m, x - r * 3.5, y - r * 3.2); } else { const px = x + r * 4, py = y + r * 2.4; S.probe(c, px, py, 8, 0, 'wing'); lab(m, px + r * 1.5, py + r * 2); } });
      } else if (selG === 'jupiter' || selG === 'saturn') {
        const id = selG === 'jupiter' ? 'juno' : 'cassini', p = P[selG];
        each([id], (m) => { const [x, y] = toS(p.x, p.y), r = pr(p.id), a = t / 2500, px = x + Math.cos(a) * r * 1.9, py = y + Math.sin(a) * r * 1.9 * 0.45; S.probe(c, px, py, 9, 0, m.probe); lab(m, x, y - r * 2); });
      }
    }
    S.add(cv, draw, (e) => window.SM_err('탐사 지도', e));

    /* 누르기 */
    cv.addEventListener('pointerdown', (e) => {
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      let best = null, bd = 1e9;
      hits.forEach((h) => { const dx = Math.max(0, Math.abs(x - h.x) - h.r), dy = Math.max(0, Math.abs(y - h.y) - h.h); const d = Math.hypot(dx, dy); if (d < 18 && d < bd) { bd = d; best = h; } });
      if (!best) return;
      if (best.m) pick(best.m); else pickG(best.g);
    });

    /* 오른쪽 패널 */
    const groupsEl = $('#groups'), detail = $('#detail');
    groupsEl.innerHTML = `<button type="button" data-g="" aria-pressed="true">전체</button>` + GROUPS.map((g) => `<button type="button" data-g="${g.id}" aria-pressed="false">${g.n}</button>`).join('');
    groupsEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.g) pickG(b.dataset.g); else home(); });
    function icon(cvs, m) { const { c, w, h } = S.fit(cvs); S.space(c, w, h, 4, { n: 14 }); S.probe(c, w / 2, h / 2, w * 0.2, -0.2, m.probe); }
    function list(ids) {
      detail.innerHTML = `<div class="mlist">${ids.map((id) => { const m = byId[id]; return `<button type="button" class="mb${shown(m) ? '' : ' off'}" data-m="${id}" aria-pressed="${selM === id}"><canvas></canvas><span><b>${m.name}</b><span>${m.year}년 · ${m.hook}</span></span></button>`; }).join('')}</div>`;
      detail.querySelectorAll('.mb').forEach((b) => { icon(b.querySelector('canvas'), byId[b.dataset.m]); b.addEventListener('click', () => pick(b.dataset.m)); });
    }
    function intro() {
      list(M.map((m) => m.id));
      detail.insertAdjacentHTML('afterbegin', `<p class="empty" style="margin:0 0 12px">지도 위의 <b>주황 이름표</b>는 탐사선이 간 곳이에요. 이름표를 누르거나 아래 탐사선을 골라 보세요. 연도 막대를 <b>1957년</b>(첫 인공위성 스푸트니크 1호)으로 옮긴 뒤 재생하면 인류의 탐사가 해마다 넓어지는 모습을 볼 수 있어요.</p>`);
    }
    function card(m) {
      const later = !shown(m);
      detail.innerHTML = `<div class="tt"><h2>${m.name}</h2></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge${m.korea ? ' k' : ''}">${m.who}</span><span class="badge">${m.launch}</span><span class="badge">${m.cat}</span></div>
        ${later ? `<p class="empty" style="margin:10px 0 0">연도 막대를 <b>${m.year}년</b> 이후로 옮기면 지도에 나타나요.</p>` : ''}
        <div class="bookq"><small>교과서</small>${m.book}</div>
        <ul class="facts">${m.facts.map((f, i) => `<li><i>${i + 1}</i><span>${f}</span></li>`).join('')}</ul>
        <div class="nums">${m.nums.map((n) => `<div><small>${n[0]}</small><b>${n[1]}</b></div>`).join('')}</div>
        ${m.lab ? `<button class="btn primary golab" type="button" id="goLab">탐사선 실험실에서 직접 해 보기</button>` : ''}
        <button class="btn ghost golab" type="button" id="back">← ${GROUPS.find((g) => g.ids.includes(m.id)).n} 목록</button>`;
      const gl = $('#goLab'); if (gl) gl.addEventListener('click', () => { const url = 'sim2-lab.html?lab=' + m.lab; try { if (window.parent !== window) { window.parent.postMessage({ type: 'ras-nav', target: 'lab' }, '*'); const f = window.parent.document.querySelector('iframe[data-page="lab"]'); if (f) { if (f.getAttribute('src')) f.contentWindow.postMessage({ type: 'sx-lab', lab: m.lab }, '*'); else f.src = url; } return; } } catch (e) {} location.href = url; });
      $('#back').addEventListener('click', () => pickG(GROUPS.find((g) => g.ids.includes(m.id)).id));
    }
    function syncGroups() { groupsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.g || null) === selG))); }
    function pickG(gid) { selM = null; focus(gid); syncGroups(); const g = GROUPS.find((x) => x.id === gid); if (g.ids.length === 1) return pick(g.ids[0]); list(g.ids); $('#hint').textContent = `${g.n}: 탐사선을 골라 보세요`; }
    function pick(id) { const g = GROUPS.find((x) => x.ids.includes(id)); if (selG !== g.id) focus(g.id); selM = id; syncGroups(); card(byId[id]); $('#hint').textContent = byId[id].name; if (innerWidth < 900) document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    function home() { selG = null; selM = null; camT.x = 0; camT.y = 0; camT.z = 1; syncGroups(); intro(); $('#hint').textContent = '이름표를 눌러 보세요'; }
    $('#home').addEventListener('click', home);

    /* 연도 */
    const yrR = $('#yrR');
    function syncYear() { yrR.value = year; $('#yr').innerHTML = `${year}<small>${year === 1957 ? '스푸트니크 1호' : '년까지'}</small>`; }
    yrR.addEventListener('input', () => { playing = false; $('#play').textContent = '1957년부터 재생'; year = +yrR.value; syncYear(); if (selM) card(byId[selM]); else if (selG) list(GROUPS.find((g) => g.id === selG).ids); else intro(); });
    $('#play').addEventListener('click', () => { playing = !playing; if (playing) { playT0 = performance.now(); year = 1957; home(); $('#play').textContent = '멈춤'; } else $('#play').textContent = '1957년부터 재생'; });
    $('#ticks').innerHTML = `<i class="s" style="left:0%" title="1957 스푸트니크 1호"></i>` + M.map((m) => `<i class="${m.korea ? 'k' : ''}" style="left:${(m.year - 1957) / 69 * 100}%" title="${m.year} ${m.name}"></i>`).join('');

    /* 주소로 바로 열기: ?g=moon 또는 ?m=dart, ?year=1990 */
    const q = new URLSearchParams(location.search);
    if (q.get('year')) { year = Math.max(1957, Math.min(2026, +q.get('year'))); }
    syncYear();
    if (q.get('m') && byId[q.get('m')]) { pick(q.get('m')); cam.x = camT.x; cam.y = camT.y; cam.z = camT.z; }
    else if (q.get('g')) { pickG(q.get('g')); cam.x = camT.x; cam.y = camT.y; cam.z = camT.z; }
    else home();
    window.SM.okUI = true;
  } catch (err) { window.SM_err('탐사 지도', err); }
})();
</script>
</body>
</html>
