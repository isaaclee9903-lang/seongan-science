<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자어 4단계 공부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* 문제 알림: 코드에 오류가 나면 화면 아래에 빨간 상자로 알려 줘요 (선생님 확인용) */
(function () {
  function box() {
    var b = document.getElementById('smErr');
    if (!b && document.body) {
      b = document.createElement('div'); b.id = 'smErr';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fdecea;color:#8a1f17;border:2px solid #d9534f;border-radius:12px;padding:10px 14px;font:600 14px/1.5 sans-serif;white-space:pre-wrap';
      document.body.appendChild(b);
    }
    return b;
  }
  window.SM_err = function (where, err) {
    var msg = '[' + where + '] ' + (err && err.message ? err.message : String(err));
    var show = function () { var b = box(); if (b) b.textContent += (b.textContent ? '\n' : '') + msg; };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  window.addEventListener('error', function (e) { window.SM_err('스크립트', { message: e.message + ' (줄 ' + e.lineno + ')' }); });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var S = window.SM || {};
      if (!S.okUI) window.SM_err('실행 안 됨', { message: '안내·버튼 코드가 실행되지 않았어요. 파일이 끝(</html>)까지 들어 있는지 확인해 주세요.' });
      if (document.getElementById('fail3d') && !S.ok3d) { var f = document.getElementById('fail3d'); if (f) f.classList.add('show'); window.SM_err('3D 그림', { message: '3D 그림을 불러오지 못했어요. 인터넷 연결(cdn.jsdelivr.net)을 확인하고 새로고침해 주세요.' }); }
    }, 9000);
  });
})();
</script>
<style>
  /* 색은 라스 파랑 하나와 무채색만 쓴다. 틀린 답 표시에만 붉은색 */
  :root{--bg:#edf3f8;--paper:#fff;--ink:#14263b;--ink2:#34495e;--muted:#5a6b7e;--faint:#8a99a9;--rule:#dde6ee;
    --blue:#0e63b3;--blue-soft:#e3effb;--red:#b8423a;--red-soft:#fbefee;
    --han:"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif;--out:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;touch-action:manipulation;-webkit-tap-highlight-color:transparent;word-break:keep-all}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid rgba(14,99,179,.35);outline-offset:2px}
  .han{font-family:var(--han);font-weight:700}
  .wrap{max-width:920px;margin:0 auto;padding:20px 20px 40px}
  .sheet{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:28px 32px 30px}
  .view{display:none}.view.on{display:block}
  /* 단계가 바뀔 때만 짧게 밀려 들어온다 */
  .enter{animation:enter .26s var(--out) both}
  @keyframes enter{from{transform:translateX(14px)}to{transform:none}}

  /* ── 시작 ── */
  .s-title{margin:0;font-size:clamp(24px,3vw,30px);letter-spacing:-.02em;line-height:1.35}
  .s-lead{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:36em}
  .lsn-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .lsn-pick button{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--rule);background:#fff;font-weight:700}
  .lsn-pick button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue)}
  .pick-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
  .pick-head h2{margin:0;font-size:17px}
  .pick-head h2 span{color:var(--muted);font-weight:600;margin-left:6px}
  .linkbtn{border:0;background:none;min-height:44px;padding:0 6px;color:var(--blue);font-weight:700;font-size:15px}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .wc{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;padding:8px 14px;border-radius:12px;border:1px solid var(--rule);background:#fff;text-align:left;transition:border-color .15s,background .15s}
  .wc b{font-size:18px;font-weight:700}
  .wc .han{display:block;font-size:14px;color:var(--faint);font-weight:500}
  .wc .ck{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid #c3cfdb;display:grid;place-items:center}
  .wc .ck svg{opacity:0}
  .wc[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
  .wc[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
  .wc[aria-pressed="true"] .ck svg{opacity:1}
  .wc:active{transform:scale(.98)}
  .howto{list-style:none;counter-reset:s;margin:26px 0 0;padding:18px 0 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .howto li{counter-increment:s;font-size:14.5px;color:var(--muted);line-height:1.55}
  .howto li::before{content:counter(s);display:block;font-weight:800;color:var(--blue);font-size:15px;margin-bottom:2px}
  .howto b{display:block;color:var(--ink);font-size:15.5px}
  .primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:24px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;transition:transform .12s,background .15s}
  .primary:active{transform:scale(.985)}
  .primary:disabled{background:#b9c7d6;cursor:default;transform:none}
  .secondary{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:1px solid var(--rule);border-radius:12px;background:#fff;font-size:16px;font-weight:700;color:var(--ink2)}

  /* ── 진행 ── */
  .steps{display:flex;align-items:center;gap:0;margin:0 0 14px;padding:0 4px;overflow-x:auto;scrollbar-width:none}
  .steps .wc-n{font-weight:700;font-size:14px;color:var(--muted);margin-right:auto;white-space:nowrap;padding-right:16px}
  .steps .wc-n b{color:var(--ink);font-size:16px}
  .st{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:14.5px;font-weight:600;color:var(--faint);padding:6px 0}
  .st i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1.5px solid #c3cfdb;display:grid;place-items:center;font-size:12px;font-weight:800}
  .st+.st::before{content:"";width:22px;height:1.5px;background:#c3cfdb;margin:0 10px}
  .st.done{color:var(--ink2)}.st.done i{border-color:var(--ink2);background:var(--ink2);color:#fff}
  .st.now{color:var(--blue);font-weight:800}.st.now i{border-color:var(--blue);background:var(--blue);color:#fff}
  .st.skip{text-decoration:line-through}
  .bar{height:3px;border-radius:2px;background:#d7e1ea;margin:0 4px 16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s var(--out)}

  /* ── 공통 글자 ── */
  .q{margin:26px 0 12px;font-size:19px;font-weight:700;text-align:center}
  .word{font-size:clamp(48px,8vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1.1;text-align:center;margin:18px 0 0}
  .word-han{font-family:var(--han);font-weight:700;font-size:clamp(26px,4vw,34px);color:var(--ink2);text-align:center;letter-spacing:.12em;margin-top:8px}
  /* 같은 글자 강조: 파란 글씨 + 밑줄 (번지는 효과 없이) */
  .sh{color:var(--blue);text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.16em}

  /* 1단계 */
  .chk{display:grid;gap:8px;margin-top:6px}
  .cb{display:block;text-align:left;width:100%;min-height:64px;padding:14px 18px;border-radius:12px;border:1px solid var(--rule);background:#fff;transition:border-color .15s,background .15s}
  .cb b{display:block;font-size:17px}
  .cb span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
  .cb:hover{border-color:#9db9d6}
  .cb:active{transform:scale(.99);background:var(--blue-soft)}

  /* 2단계: 낱말이 한 글자씩 갈라진다 (이 화면의 중심) */
  .split{display:flex;justify-content:center;gap:clamp(18px,5vw,56px);margin:30px 0 8px}
  .ch{display:flex;flex-direction:column;align-items:center;min-width:92px;animation:part .62s var(--out) both;animation-delay:.08s}
  @keyframes part{from{transform:translateX(var(--dx,0))}to{transform:none}}
  .ch .sy{font-size:22px;font-weight:700;color:var(--muted)}
  .ch .big{font-family:var(--han);font-weight:700;font-size:clamp(84px,13vw,120px);line-height:1.12;color:var(--ink)}
  .ch .mean{font-size:16px;font-weight:700;color:var(--blue);margin-top:4px;text-align:center}
  .ex-list{margin:26px 0 0;border-top:1px solid var(--rule)}
  .ex-row{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
  .ex-row .k{font-family:var(--han);font-weight:700;font-size:40px;line-height:1;text-align:center}
  .ex-row .m{font-size:15px;font-weight:700;margin-bottom:6px}
  .ex-row .m span{color:var(--muted);font-weight:600;margin-left:6px}
  .exs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px}
  .exs .sh{text-decoration:none;font-weight:800}
  .exs span .han{font-size:14px;color:var(--faint);font-weight:500;margin-left:3px}
  .tip{margin:18px 0 0;color:var(--muted);font-size:15px}

  /* 3·4단계 선택지 */
  .q-word{text-align:center;margin-top:16px}
  .q-word b{font-size:clamp(36px,5vw,46px);font-weight:800;letter-spacing:-.02em}
  .q-word .han{font-size:22px;color:var(--ink2);margin-left:10px;letter-spacing:.06em}
  .hints{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0;color:var(--muted);font-size:15px}
  .hints .han{color:var(--ink);font-size:18px;margin-right:5px}
  .opts{display:grid;gap:8px}
  .opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;width:100%;min-height:58px;padding:10px 16px;border-radius:12px;border:1px solid var(--rule);background:#fff;font-size:16.5px;line-height:1.5;transition:border-color .15s,background .15s,opacity .2s}
  .opt i{font-style:normal;font-weight:800;color:var(--faint);font-size:15px}
  .opt:not(:disabled):hover{border-color:#9db9d6}
  .opt:not(:disabled):active{transform:scale(.99)}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--blue);background:var(--blue-soft);font-weight:700}.opt.ok i{color:var(--blue)}
  .opt.no{border-color:var(--red);background:var(--red-soft)}.opt.no i{color:var(--red)}
  .opt.dim{opacity:.45}
  .fb{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);font-size:16.5px;line-height:1.75}
  .fb .r{display:block;font-weight:800;font-size:17px;margin-bottom:2px}
  .fb .r.ok{color:var(--blue)}
  .ety{margin-top:12px;padding:14px 16px;border-radius:12px;background:#f4f7fa;color:var(--ink2);font-size:15.5px;line-height:1.8}
  .ety b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
  .ety em{font-style:normal;font-family:var(--han);font-weight:700;color:var(--ink)}

  /* 4단계 */
  .note{margin:14px 0 0;color:var(--muted);font-size:15.5px;text-align:center}
  .pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:22px}
  .pw{text-align:center;padding:18px 8px;border-radius:14px}
  .pw.from{background:#f4f7fa}
  .pw.to{border:1.5px solid var(--blue)}
  .pw small{display:block;font-size:13.5px;font-weight:700;color:var(--muted)}
  .pw b{display:block;font-size:clamp(30px,4.6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.3;margin-top:4px}
  .pw .han{display:block;font-size:24px;color:var(--ink2);letter-spacing:.1em;margin-top:2px}
  .pair .arr{color:var(--faint)}
  .shared{text-align:center;margin:14px 0 0;font-size:16px;color:var(--ink2)}
  .shared .han{color:var(--blue);font-size:21px;margin-right:4px}

  /* 완료 */
  .d-title{margin:0;font-size:clamp(24px,3vw,30px);letter-spacing:-.02em}
  .d-lead{margin:8px 0 0;color:var(--muted);font-size:16px}
  .groups{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)}
  .groups h3{margin:0 0 8px;font-size:15px;color:var(--muted)}
  .groups h3 b{color:var(--ink);font-size:17px;margin-left:6px}
  .groups ul{list-style:none;margin:0;padding:0}
  .groups li{padding:7px 0;border-bottom:1px solid #edf1f5;font-size:16.5px;font-weight:700}
  .groups li .han{font-size:14px;color:var(--faint);font-weight:500;margin-left:6px}
  .groups .none{color:var(--faint);font-weight:500;font-size:15px}
  .groups .again h3 b{color:var(--red)}
  .d-acts{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:26px}
  .d-acts .primary{margin:0}

  @media (max-width:900px){
    .sheet{padding:22px 20px 24px}
    .howto{grid-template-columns:1fr 1fr}
    .steps .wc-n{display:none}
    .pair{grid-template-columns:1fr}.pair .arr{transform:rotate(90deg);justify-self:center}
    .groups{grid-template-columns:1fr}
    .d-acts{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="view on" id="vStart">
    <div class="sheet">
      <h1 class="s-title">글자를 나누면 뜻이 보여요</h1>
      <p class="s-lead">과학 낱말을 한자 한 글자씩 나눠 보고, 글자 뜻으로 낱말의 뜻을 짐작해요. 그다음 같은 글자가 들어간 낱말로 넓혀 가요.</p>
      <div class="lsn-pick" id="lsnPick" hidden></div>
      <div class="pick-head">
        <h2 id="stName">암석의 종류<span id="stCount">10개 골랐어요</span></h2>
        <div><button type="button" class="linkbtn" data-q="all">모두 고르기</button><button type="button" class="linkbtn" data-q="none">모두 빼기</button></div>
      </div>
      <div class="wgrid" id="wgrid"></div>
      <ol class="howto">
        <li><b>자기점검</b>이 낱말을 아는지 솔직하게 골라요</li>
        <li><b>한자 풀이</b>한 글자씩 나눠 뜻과 소리를 봐요</li>
        <li><b>뜻 추론</b>글자 뜻을 합쳐 낱말의 뜻을 짐작해요</li>
        <li><b>어휘 넓히기</b>같은 글자가 든 낱말의 뜻을 풀어요</li>
      </ol>
      <button class="primary" id="goStart" type="button">공부 시작하기</button>
    </div>
  </section>

  <section class="view" id="vLearn">
    <div class="steps" id="steps">
      <span class="wc-n"><b id="lpWord">1</b> / <span id="lpTotal">10</span>번째 낱말</span>
      <span class="st" data-s="0"><i>1</i>자기점검</span>
      <span class="st" data-s="1"><i>2</i>한자 풀이</span>
      <span class="st" data-s="2"><i>3</i>뜻 추론</span>
      <span class="st" data-s="3"><i>4</i>어휘 넓히기</span>
    </div>
    <div class="bar"><i id="lpFill"></i></div>
    <div class="sheet" id="stageC"></div>
  </section>

  <section class="view" id="vDone">
    <div class="sheet" id="doneC"></div>
  </section>
</div>

<script>
/* ───── 상태와 도구 ───── */
window.SM = window.SM || {};
const DATA = window.HANJA_DATA || { words: [], lessons: {} };
const BY = {}; DATA.words.forEach(w => { BY[w.word] = w; });
const Q = new URLSearchParams(location.search);
const S = { lesson: null, pool: [], picked: new Set(), words: [], i: 0, rv: 0, sc: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// 받침 따라 조사 고르기
const josa = (w, a, b) => { const c = String(w).charCodeAt(String(w).length - 1); return (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28) ? a : b; };
// 낱말(한글·한자)에서 공유 한자 자리만 강조
function emAt(text, hanja, sh) {
  const k = [...hanja].indexOf(sh), s = [...text];
  if (k < 0 || s.length !== [...hanja].length) return esc(text);
  return s.map((c, i) => i === k ? `<span class="sh">${esc(c)}</span>` : esc(c)).join('');
}
function mix(choices, ans) { const t = choices[ans], m = shuffle(choices); return { c: m, a: m.indexOf(t) }; }
function charOf(w, ch) { return (w.chars || []).find(c => c.char === ch); }
const first = s => String(s || '').split(',')[0].trim();
</script>

<script>
/* ───── 시작: 수업과 낱말 고르기 ───── */
try {
  const keys = Object.keys(DATA.lessons);
  function setLesson(k) {
    S.lesson = k;
    const L = DATA.lessons[k];
    $('stName').firstChild.textContent = L.title;
    S.pool = L.words.map(w => BY[w]).filter(Boolean);
    S.picked = new Set(S.pool.map((_, i) => i));
    $('wgrid').innerHTML = S.pool.map((w, i) => `
      <button type="button" class="wc" data-i="${i}" aria-pressed="true">
        <span><b>${esc(w.word)}</b><span class="han">${esc(w.hanja)}</span></span>
        <span class="ck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
      </button>`).join('');
    document.querySelectorAll('#lsnPick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
    sync();
  }
  function sync() {
    const n = S.picked.size;
    document.querySelectorAll('.wc').forEach(c => c.setAttribute('aria-pressed', S.picked.has(+c.dataset.i)));
    $('stCount').textContent = `${n}개 골랐어요`;
    $('goStart').disabled = n === 0;
    $('goStart').textContent = n ? `${n}개 낱말 공부 시작하기` : '낱말을 하나 이상 골라 주세요';
  }
  $('wgrid').addEventListener('click', e => {
    const b = e.target.closest('.wc'); if (!b) return;
    const i = +b.dataset.i; S.picked.has(i) ? S.picked.delete(i) : S.picked.add(i); sync();
  });
  document.querySelector('.pick-head').addEventListener('click', e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    S.picked = b.dataset.q === 'all' ? new Set(S.pool.map((_, i) => i)) : new Set(); sync();
  });
  if (keys.length > 1 && !Q.get('lesson')) {
    $('lsnPick').hidden = false;
    $('lsnPick').innerHTML = keys.map(k => `<button type="button" data-k="${k}">${esc(DATA.lessons[k].title)}</button>`).join('');
    $('lsnPick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLesson(b.dataset.k); });
  }
  setLesson(DATA.lessons[Q.get('lesson')] ? Q.get('lesson') : keys[0]);
  $('goStart').addEventListener('click', () => begin(S.pool.filter((_, i) => S.picked.has(i))));
  SM.okUI = true;
} catch (e) { SM_err('시작 화면', e); }
</script>

<script>

function show(v) { ['vStart', 'vLearn', 'vDone'].forEach(id => $(id).classList.toggle('on', id === v)); window.scrollTo(0, 0); }
function begin(list) {
  S.words = list.map(w => Object.assign({}, w, mix(w.choices, w.answerIdx),
    { rvs: (w.reviewWords || []).map(r => Object.assign({}, r, mix(r.choices, r.answerIdx || 0))) }));
  S.i = 0; S.sc = S.words.map(w => ({ word: w.word, cat: null, infer: null, rv: [] }));
  $('lpTotal').textContent = S.words.length;

}
function progress(step) {
  const n = S.words.length, skipped = S.sc[S.i].cat === 0;
  $('lpWord').textContent = S.i + 1;
  $('lpFill').style.width = ((S.i * 4 + step) / (n * 4) * 100) + '%';
  document.querySelectorAll('#steps .st').forEach((el, k) => {
    const sk = skipped && (k === 1 || k === 2);
    el.className = 'st' + (k === step ? ' now' : k < step && !sk ? ' done' : '') + (sk ? ' skip' : '');
  });
}
function stage(html) {

  c.classList.remove('enter'); void c.offsetWidth; c.classList.add('enter');

}

        <button type="button" class="cb" data-c="2"><b>처음 보는 낱말이에요</b><span>한 글자씩 나눠 보며 함께 알아봐요</span></button>
      </div>`);
    $('chk').addEventListener('click', e => {
      const b = e.target.closest('.cb'); if (!b) return;
      const c = +b.dataset.c; S.sc[S.i].cat = c;
      if (c === 0) { S.rv = 0; step4(true); } else step2();
    });
  } catch (e) { SM_err('1단계', e); }
}

// 2단계: 한자 풀이
function step2() {
  try {
    const w = S.words[S.i]; progress(1);
    const syl = [...w.word], han = [...w.hanja], n = han.length;
    const step = window.innerWidth < 700 ? 90 : 130;
    const parts = han.map((h, k) => {
      const c = charOf(w, h) || {};
      // 처음에는 낱말처럼 가운데에 모여 있다가 한 글자씩 벌어진다
      return `<div class="ch" style="--dx:${((n - 1) / 2 - k) * step}px"><span class="sy">${esc(syl[k] || '')}</span><span class="big">${esc(h)}</span><span class="mean">${esc(first(c.meaning))}</span></div>`;
    }).join('');
    const rows = (w.chars || []).map(c => `
      <div class="ex-row"><span class="k">${esc(c.char)}</span><div>
        <div class="m">${esc(c.meaning)}<span>소리 ${esc(c.sound)}</span></div>
        <div class="exs">${(c.examples || []).map(ex => { const m = ex.match(/^(.+?)\((.+)\)$/); return m
          ? `<span>${emAt(m[1], m[2], c.char)}<span class="han">${emAt(m[2], m[2], c.char)}</span></span>`
          : `<span>${esc(ex)}</span>`; }).join('')}</div>
      </div></div>`).join('');
    stage(`
      <div class="split">${parts}</div>
      <div class="ex-list">${rows}</div>
      <p class="tip">글자 뜻을 차례로 이어 읽어 보세요. 아는 낱말에서 같은 글자가 어떤 뜻으로 쓰였는지 떠올리면 짐작하기 쉬워요.</p>
      <button type="button" class="primary" id="toInfer">뜻 짐작하기</button>`);
    $('toInfer').addEventListener('click', step3);
  } catch (e) { SM_err('2단계', e); }
}

// 3단계: 뜻 추론
function step3() {
  try {
    const w = S.words[S.i]; progress(2);
    const hints = [...w.hanja].map(h => `<span><span class="han">${esc(h)}</span>${esc(first((charOf(w, h) || {}).meaning))}</span>`).join('');
    stage(`
      <div class="q-word"><b>${esc(w.word)}</b><span class="han">${esc(w.hanja)}</span></div>
      <div class="hints">${hints}</div>
      <p class="q">이 낱말의 뜻은 무엇일까요?</p>
      ${options(w.c)}`);
    $('opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const k = +b.dataset.k, ok = k === w.a; S.sc[S.i].infer = ok; mark(k, w.a);
      $('fbHost').innerHTML = `
        <div class="fb"><span class="r ${ok ? 'ok' : ''}">${ok ? '맞았어요' : `정답은 ${w.a + 1}번이에요`}</span>
          ${esc(w.word)}${josa(w.word, '은', '는')} ${esc(w.definition)}${josa(w.definition, '을', '를')} 뜻해요.
          ${w.context ? `<div class="ety"><b>왜 이런 뜻이 될까?</b>${w.context}</div>` : ''}</div>
        <button type="button" class="primary" id="toRv">같은 글자가 든 낱말 보기</button>`;
      $('toRv').addEventListener('click', () => { S.rv = 0; step4(false); });
    });
  } catch (e) { SM_err('3단계', e); }
}

// 4단계: 어휘 넓히기
function step4(knew) {
  try {
    const w = S.words[S.i], r = w.rvs[S.rv];
    if (!r) { nextWord(); return; }
    progress(3);
    const c = charOf(w, r.shared) || {};
    stage(`
      ${knew && S.rv === 0 ? `<p class="note">${esc(w.word)}${josa(w.word, '을', '를')} 알고 있었군요. 같은 글자가 든 낱말도 풀 수 있는지 봐요.</p>` : ''}
      <div class="pair">
        <div class="pw from"><small>공부한 낱말</small><b>${emAt(w.word, w.hanja, r.shared)}</b><span class="han">${emAt(w.hanja, w.hanja, r.shared)}</span></div>
        <svg class="arr" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div class="pw to"><small>새 낱말 ${S.rv + 1} / ${w.rvs.length}</small><b>${emAt(r.word, r.hanja, r.shared)}</b><span class="han">${emAt(r.hanja, r.hanja, r.shared)}</span></div>
      </div>
      <p class="shared"><span class="han">${esc(r.shared)}</span>${esc(first(c.meaning))}(${esc(c.sound || '')}) 글자가 똑같이 들어 있어요</p>
      <p class="q">${esc(r.word)}의 뜻은 무엇일까요?</p>
      ${options(r.c)}`);
    $('opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const k = +b.dataset.k, ok = k === r.a; S.sc[S.i].rv[S.rv] = ok; mark(k, r.a);
      const lastRv = S.rv >= w.rvs.length - 1, lastW = S.i >= S.words.length - 1;
      $('fbHost').innerHTML = `
        <div class="fb"><span class="r ${ok ? 'ok' : ''}">${ok ? '맞았어요' : `정답은 ${r.a + 1}번이에요`}</span>
          ${esc(r.word)}${josa(r.word, '은', '는')} ${esc(r.meaning)}${josa(r.meaning, '을', '를')} 뜻해요.
          ${knew && lastRv && w.context ? `<div class="ety"><b>${esc(w.word)}${josa(w.word, '은', '는')} 왜 이런 뜻일까?</b>${w.context}</div>` : ''}</div>
        <button type="button" class="primary" id="toNext">${lastRv ? (lastW ? '공부 마치기' : '다음 낱말') : '다음 넓히기 낱말'}</button>`;
      $('toNext').addEventListener('click', () => { if (lastRv) nextWord(); else { S.rv++; step4(knew); } });
    });
  } catch (e) { SM_err('4단계', e); }
}
function nextWord() { S.i++; if (S.i < S.words.length) step1(); else done(); }
</script>

<script>
/* ───── 마친 화면 ───── */
const wrongOf = s => s.infer === false || s.rv.some(v => v === false);
function done() {
  try {
    let ok = 0, tot = 0;
    const g = { knew: [], learned: [], again: [] };
    S.sc.forEach((s, i) => {
      if (s.infer !== null) { tot++; if (s.infer) ok++; }
      s.rv.forEach(v => { tot++; if (v) ok++; });
      (wrongOf(s) ? g.again : s.cat === 0 ? g.knew : g.learned).push(S.words[i]);
    });
    const li = list => list.length ? `<ul>${list.map(w => `<li>${esc(w.word)}<span class="han">${esc(w.hanja)}</span></li>`).join('')}</ul>` : '<p class="none">없어요</p>';
    $('doneC').innerHTML = `
      <h2 class="d-title">낱말 ${S.words.length}개를 공부했어요</h2>
      <p class="d-lead">문제 ${tot}개 가운데 ${ok}개를 맞혔어요. ${g.again.length ? '틀린 문제가 있던 낱말은 한 번 더 풀어 보면 오래 기억할 수 있어요.' : '모든 낱말을 글자 뜻으로 잘 풀었어요.'} 이 기록은 어디에도 저장되지 않아요.</p>
      <div class="groups">
        <div><h3>처음부터 알았던 낱말<b>${g.knew.length}</b></h3>${li(g.knew)}</div>
        <div><h3>오늘 새로 익힌 낱말<b>${g.learned.length}</b></h3>${li(g.learned)}</div>
        <div class="again"><h3>다시 볼 낱말<b>${g.again.length}</b></h3>${li(g.again)}</div>
      </div>
      <div class="d-acts">
        <button type="button" class="primary" id="reWrong" ${g.again.length ? '' : 'disabled'}>${g.again.length ? `다시 볼 낱말 ${g.again.length}개 풀기` : '다시 볼 낱말이 없어요'}</button>
        <button type="button" class="secondary" id="toHome">처음 화면으로</button>
      </div>`;
    show('vDone');
    $('reWrong').addEventListener('click', () => begin(g.again.map(w => BY[w.word])));
    $('toHome').addEventListener('click', () => show('vStart'));
  } catch (e) { SM_err('마친 화면', e); }
}
</script>

<script>
/* ───── 화면 검사용 바로가기: ?go=1&at=낱말번호&step=1~4, ?done=1 ───── */
try {
  if (Q.get('go') || Q.get('done')) {
    begin(S.pool.filter((_, i) => S.picked.has(i)));
    if (Q.get('done')) {
      S.sc.forEach((s, i) => { s.cat = i % 3; s.infer = s.cat ? i % 4 !== 1 : null; s.rv = [true, i % 5 !== 2]; });
      done();
    } else {
      S.i = Math.min(+Q.get('at') || 0, S.words.length - 1);
      const st = +Q.get('step') || 1;
      if (st > 1) S.sc[S.i].cat = 2;
      if (st === 1) step1(); else if (st === 2) step2(); else if (st === 3) step3(); else { S.rv = 0; step4(false); }
    }
  }
} catch (e) { SM_err('검사 바로가기', e); }
</script>
</body>
</html>
