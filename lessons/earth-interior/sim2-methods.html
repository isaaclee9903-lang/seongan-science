<body>
<div class="app">
  <header>
    <span class="eyebrow">지구 내부 · 시뮬레이션 ②</span>
    <h1>지구 속 알아내기: 땅 뚫기, 화산 분출물, 지진파</h1>
    <p class="sub">직접 볼 수 없는 지구 내부를 알아내는 세 가지 방법을 차례로 해 보고, 무엇을 알 수 있는지 비교해 봐요. (가상 장면이에요)</p>
  </header>
  <div class="stage">
    <section class="card viewer">
      <div class="scene" id="scene">
        <canvas id="cv" role="img" aria-label="지구 내부를 조사하는 방법을 보여 주는 장면"></canvas>
        <div class="toast" id="toast"></div>
        <span class="hint" id="hint"></span>
      </div>
    </section>
    <section class="card pad">
      <div class="flow" id="flow" role="tablist">
        <button class="fs" type="button" role="tab" data-s="1"><b>1</b>땅 뚫기</button>
        <button class="fs" type="button" role="tab" data-s="2"><b>2</b>화산 분출물</button>
        <button class="fs" type="button" role="tab" data-s="3"><b>3</b>지진파</button>
        <button class="fs" type="button" role="tab" data-s="4"><b>4</b>비교하기</button>
      </div>
      <div class="stepname"><span class="no" id="sNo">1</span><div><h2 id="sTitle"></h2><small id="sSub"></small></div></div>
      <p class="what" id="sWhat"></p>
      <div class="ctl">
        <div class="row" id="cDrill"><button class="act" type="button" id="bDrill">더 깊이 뚫기</button><button class="btn ghost" type="button" id="bDrillR">처음부터</button></div>
        <div class="row" id="cLava"><button class="act" type="button" id="bLava">분출물 채취해 조사하기</button></div>
        <div class="row" id="cQuake"><button class="act" type="button" id="bQuake">지진 일으키기</button><button class="btn ghost" type="button" id="bQuakeR">처음부터</button></div>
        <div class="stat" id="stat"></div>
      </div>
      <div id="cmpBox" hidden>
        <table class="cmpT" id="cmpT"></table>
        <button class="btn primary" type="button" id="bCmp" disabled>확인하기</button>
        <div class="fb" id="fbCmp"></div>
      </div>
      <div class="phase" id="sPh"></div>
      <div class="ask"><p id="askQ"></p><div class="three" id="askB"></div><div class="ans" id="askA"></div></div>
      <div class="acts"><button class="btn ghost" type="button" id="bPrev">이전</button><button class="btn primary" type="button" id="bNext">다음 단계</button></div>
      <div class="prog"><i id="prog"></i></div>
      <div class="box an"><b class="t">모형 안내</b>실제 수업 활동이 아니라 개념 이해를 위한 가상 장면이에요. 땅을 뚫는 깊이, 화산의 크기, 지진파의 물결 모양은 실제와 달라요. 지각 두께는 실제보다 두껍게 그렸어요.</div>
    </section>
  </div>
  <p class="credit">지구 내부 · 지구 속 알아내기</p>
</div>
<script>
/* ===== 지구 내부 그림 도구 (층 자료, 단면, 땅속, 지각 확대, 시추기, 화산, 지진계) =====
   - 층의 깊이·상태·물질은 교과서 「지구 내부는 어떻게 생겼을까?」의 값만 써요.
   - 지각 두께는 실제보다 두껍게 그려요(실제로는 지구 크기에 비해 아주 얇아요). 맨틀·외핵·내핵은 깊이에 맞춰요.
   - 층의 색은 교과서 그림 Ⅱ-3을 따른 것이고 온도를 뜻하지 않아요. 밀도 막대 높이는 순서만 보여 주는 모형이에요. */
window.EI = (function () {
  'use strict';

  var LAYERS = [
    { id: 'crust', name: '지각', from: 0, to: 35, range: '지표 ~ 약 35 km (해양 약 5 km)', state: '고체', stuff: '여러 가지 암석', tagBg: '#7cb342', tagFg: '#fff', fill: '#8d6a48', dens: 1,
      facts: ['지권 가장 바깥에 있는 <b>고체 상태의 얇은 층</b>이에요.', '<b>여러 가지 암석</b>으로 이루어져 있어요.', '<b>대륙 지각</b>(평균 약 35 km, 두꺼운 곳 약 70 km)과 <b>해양 지각</b>(평균 약 5 km)으로 구분해요.'] },
    { id: 'mantle', name: '맨틀', from: 35, to: 2900, range: '지각 아래 ~ 약 2900 km', state: '고체', stuff: '지각보다 밀도가 큰 암석', tagBg: '#e85d86', tagFg: '#fff', fill: '#c1401f', dens: 2,

    $('#cmpT').innerHTML = '<tr><th>방법</th><th>물질을 직접 알 수 있다</th><th>내부 전체의 구조를 알 수 있다</th></tr>' + ROWS.map((r, i) => `<tr><td>${r[0]}</td>${[0, 1].map((k) => `<td><span class="ox" data-i="${i}" data-k="${k}"><button type="button" data-v="1" aria-pressed="false">O</button><button type="button" data-v="0" aria-pressed="false">X</button></span></td>`).join('')}</tr>`).join('');
    $$('#cmpT .ox').forEach((g) => { const i = +g.dataset.i, k = +g.dataset.k; $$('button', g).forEach((b) => b.addEventListener('click', () => { pick[i][k] = b.dataset.v === '1'; $$('button', g).forEach((o) => { o.setAttribute('aria-pressed', String(o === b)); o.classList.remove('good', 'bad'); }); $('#bCmp').disabled = pick.some((p) => p.some((v) => v == null)); })); });
    $('#bCmp').addEventListener('click', () => {
      let wrong = 0;
      $$('#cmpT .ox').forEach((g) => { const i = +g.dataset.i, k = +g.dataset.k, ok = pick[i][k] === ROWS[i][k + 1], b = $(`button[data-v="${pick[i][k] ? 1 : 0}"]`, g); b.classList.add(ok ? 'good' : 'bad'); if (!ok) wrong++; });
      const f = $('#fbCmp'); f.className = 'fb show ' + (wrong ? 'no' : 'ok');
      f.innerHTML = wrong ? `빨간 칸 ${wrong}개를 다시 생각해 보세요. 힌트: 지진파는 물질을 손으로 꺼내 볼 수는 없지만, 지구 전체로 퍼져 나가요.` : '모두 맞았어요! 땅 뚫기와 화산 분출물 조사는 <b>물질을 직접</b> 알 수 있지만 전체 모습은 알기 어려워요. 지진파 분석은 <b>지구 내부 전체의 구조와 물질의 상태</b>를 알아낼 수 있어요.';
    });
    $$('#flow .fs').forEach((b) => b.addEventListener('click', () => setStep(+b.dataset.s)));
    $('#bPrev').addEventListener('click', () => setStep(Math.max(1, S.step - 1)));
    $('#bNext').addEventListener('click', () => setStep(S.step === 4 ? 1 : S.step + 1));
    S.setStep = setStep;
    setStep(+new URLSearchParams(location.search).get('step') || 1);
    window.SM.okUI = true;
  } catch (err) { window.SM_err('안내·버튼', err); }
})();
</script>
<script>
/* ===== 블록 2: 장면 그리기 ===== */
(() => {
  'use strict';
  try {
    const { $ } = window.SM, S = window.SM, E = window.EI, L = E.LAYERS, RED = E.REDUCE;
    const cv = $('#cv');
    const fsz = (w) => Math.max(12, Math.min(17, w / 46));
    /* ----- 1. 땅 뚫기 ----- */
    const CORE_COL = ['#a8865c', '#8e6c4c', '#6f5446', '#5a4a48', '#4a3a3a'];
    S.drillGoal = 0;
    S.doDrill = () => {
      if (S.drillGoal >= 1) { S.toast('더 깊이 뚫기 어려워요'); return; }
      S.drillGoal = Math.min(1, S.drillGoal + 0.2); S.drillBusy = true;
    };
    function drawDrill(c, w, h, t) {
      const sz = fsz(w), gy = h * 0.3;
      E.sky(c, w, gy); E.ground(c, 0, gy, w, h - gy, 11);
      c.fillStyle = '#6f9b4a'; c.fillRect(0, gy - 3, w, 5);
      if (S.drill < S.drillGoal) { S.drill = Math.min(S.drillGoal, S.drill + (RED ? 1 : 0.004)); if (S.drill >= S.drillGoal - 1e-6 && S.drillBusy) { S.drillBusy = false; S.cores.push(CORE_COL[Math.min(4, S.cores.length)]); if (S.drill >= 1) S.toast('더 깊이 뚫기 어려워요'); S.paintStat(); } }
      const s = Math.min(h * 0.3, w * 0.16), maxD = (h - gy) * 0.62;
      E.rig(c, w * 0.3, gy, s, S.drillBusy ? t : 0, S.drill * maxD);
      /* 꺼낸 암석(시추 코어) */
      const tx = w * 0.5, ty = gy - s * 0.06;
      c.fillStyle = '#3a3f47'; c.beginPath(); c.roundRect(tx - 6, ty - 4, w * 0.2, 10, 4); c.fill();
      S.cores.forEach((col, i) => { const x = tx + i * (w * 0.036), g = c.createLinearGradient(0, ty - 40, 0, ty); g.addColorStop(0, col); g.addColorStop(1, '#2a2018'); c.fillStyle = g; c.beginPath(); c.roundRect(x, ty - s * 0.4, w * 0.026, s * 0.4, 4); c.fill(); c.strokeStyle = 'rgba(255,255,255,.25)'; c.stroke(); });
      if (S.cores.length) E.tag(c, '꺼낸 암석', tx + w * 0.08, ty - s * 0.4 - sz * 0.9, { size: sz - 2, bg: 'rgba(60,40,20,.85)' });
      /* 지구 전체와 비교 (오른쪽 위) */
      const R = Math.min(w, h) * 0.17, cx = w - R - w * 0.04, cy = R + h * 0.08;
      c.save(); c.fillStyle = 'rgba(8,12,26,.82)'; c.beginPath(); c.roundRect(cx - R - 14, cy - R - 28, R * 2 + 28, R * 2 + 66, 14); c.fill(); c.restore();
      E.section(c, cx, cy, R, { crustK: 0.03 });
      E.tag(c, '지구 전체와 비교', cx, cy + R + 20, { size: sz - 3, bg: 'none', color: '#dfe6f3' });
      /* 구멍 표시: 지구 크기에 비하면 거의 보이지 않아요 */
      const holeLen = Math.max(1.5, S.drill * R * 0.004 * 4);
      c.strokeStyle = '#ff3b3b'; c.lineWidth = 3; c.beginPath(); c.moveTo(cx, cy - R); c.lineTo(cx, cy - R + holeLen); c.stroke();
      c.strokeStyle = '#ff3b3b'; c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy - R, 9, 0, Math.PI * 2); c.stroke();
      E.arrow(c, cx + 34, cy - R - 2, cx + 12, cy - R + 2, '#ff6b6b', 2, 7);
      E.tag(c, '뚫은 곳', cx + 56, cy - R - 4, { size: sz - 4, bg: '#c62828' });
    }
    /* ----- 2. 화산 분출물 ----- */
    let lavaT = -1;
    S.doLava = () => { lavaT = 0; };
    function drawVolcano(c, w, h, t, dt) {
      const sz = fsz(w), gy = h * 0.48;
      E.sky(c, w, gy); E.ground(c, 0, gy, w, h - gy, 13);
      c.fillStyle = '#6f9b4a'; c.fillRect(0, gy - 3, w, 5);
      const s = Math.min(h * 0.42, w * 0.24), vx = w * 0.42;
      const glow = lavaT >= 0 ? 1 + Math.sin(Math.min(1, lavaT) * Math.PI) * 0.6 : 1;
      E.volcano(c, vx, gy, s, t, glow);
      /* 채취하는 사람(간단한 실루엣)과 시료 병 */
      const px = vx + s * 1.25, py = gy;
      c.fillStyle = '#ff7a1a'; c.beginPath(); c.roundRect(px - 9, py - 46, 18, 30, 6); c.fill();
      c.fillStyle = '#2a3442'; c.fillRect(px - 8, py - 18, 7, 18); c.fillRect(px + 1, py - 18, 7, 18);
      c.fillStyle = '#f0c8a0'; c.beginPath(); c.arc(px, py - 54, 8, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#e8e8e8'; c.beginPath(); c.arc(px, py - 57, 9, Math.PI, 0); c.fill();
      c.strokeStyle = '#8a96a8'; c.lineWidth = 3; c.beginPath(); c.moveTo(px - 8, py - 38); c.lineTo(px - 30, py - 10); c.stroke();
      if (lavaT >= 0) {
        lavaT += dt / 2.2;
        const k = Math.min(1, lavaT);
        /* 흘러내린 용암 덩이가 사람 쪽으로 */
        const lx = vx + s * (0.45 + 0.5 * k), ly = gy - s * 0.06 * (1 - k);
        const g = c.createRadialGradient(lx, ly, 0, lx, ly, s * 0.12); g.addColorStop(0, '#fff2a0'); g.addColorStop(0.5, '#ff8a2a'); g.addColorStop(1, 'rgba(160,40,10,.8)'); c.fillStyle = g; c.beginPath(); c.ellipse(lx, ly, s * 0.12, s * 0.05, 0, 0, Math.PI * 2); c.fill();
        if (lavaT >= 1 && !S.lavaDone) { S.lavaDone = true; S.lava++; S.paintStat(); S.toast('채취한 분출물로 땅속 물질을 분석했어요'); }
        if (lavaT > 1.6) { lavaT = -1; S.lavaDone = false; }
      }
      /* 시료 병 */
      const jx = w * 0.86, jy = gy - 4, jw = Math.min(w * 0.08, 60), jh = jw * 1.3;
      c.fillStyle = 'rgba(220,235,245,.7)'; c.strokeStyle = '#8aa0b5'; c.lineWidth = 2; c.beginPath(); c.roundRect(jx - jw / 2, jy - jh, jw, jh, 8); c.fill(); c.stroke();
      const fill = Math.min(1, S.lava * 0.25); if (fill) { const g = c.createLinearGradient(0, jy - jh * fill, 0, jy); g.addColorStop(0, '#5a4a40'); g.addColorStop(1, '#2a2018'); c.fillStyle = g; c.beginPath(); c.roundRect(jx - jw / 2 + 3, jy - jh * fill, jw - 6, jh * fill - 3, 5); c.fill(); }
      E.tag(c, '분출물 시료', jx, jy - jh - sz, { size: sz - 3, bg: 'rgba(30,50,80,.85)' });
      E.tag(c, '땅속에서 올라온 물질', vx, gy + (h - gy) * 0.55, { size: sz - 2, bg: 'rgba(150,50,10,.88)' });
    }
    /* ----- 3. 지진파 ----- */
    const CK = 0.05, vOf = (x, y) => { const r = Math.hypot(x, y); return r > 1 - CK ? 0.55 : r > E.R_OC ? 1 : r > E.R_IC ? 0.72 : 1.2; };
    function rays(fx, fy) {
      const out = [], N = 160;
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a), P = [[fx, fy, 0]]; let x = fx, y = fy, tt = 0;
        for (let k = 0; k < 500; k++) { x += dx * 0.006; y += dy * 0.006; tt += 0.006 / vOf(x, y); if (Math.hypot(x, y) > 1) { P.push([x, y, tt, 1]); break; } P.push([x, y, tt]); }
        out.push(P);
      }
      return out;
    }
    const at = (P, tau) => { for (let k = 1; k < P.length; k++) if (P[k][2] >= tau) { const p = P[k - 1], q = P[k], u = (tau - p[2]) / ((q[2] - p[2]) || 1); return [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]; } return null; };
    const PRESET = [-Math.PI / 2, -Math.PI / 2 + 1.1, Math.PI * 0.85, 0.35];
    let geo = null;
    S.doQuake = (ang) => {
      if (ang == null) ang = PRESET[S.quakes.length % PRESET.length];
      const fx = Math.cos(ang) * 0.965, fy = Math.sin(ang) * 0.965;
      S.quakes.push({ a: ang, R: rays(fx, fy), t0: performance.now(), fx, fy });
      if (S.quakes.length > 3) S.quakes.shift();
      S.qCount = (S.qCount || 0) + 1;
    };
    cv.addEventListener('click', (e) => {
      if (S.step !== 3 || !geo) return;
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left - geo.cx, y = e.clientY - r.top - geo.cy, d = Math.hypot(x, y);
      if (d > geo.R * 0.55 && d < geo.R * 1.25) S.doQuake(Math.atan2(y, x));
    });
    let revealT = [0, 0, 0];
    function drawQuake(c, w, h, t) {
      const sz = fsz(w); c.fillStyle = '#070b18'; c.fillRect(0, 0, w, h);
      for (let i = 0; i < 120; i++) { const x = (i * 97.3) % w, y = (i * 53.7 + 11) % h; c.fillStyle = `rgba(220,230,255,${0.15 + (i % 5) * 0.08})`; c.fillRect(x, y, 1.5, 1.5); }
      const R = Math.min(h * 0.42, w * 0.36), cx = w * 0.5, cy = h * 0.53; geo = { cx, cy, R };
      /* 드러난 정도: 회색 → 경계선 → 색 */
      const full = S.lv >= 3 ? Math.min(1, revealT[2] += 0.02) : 0;
      E.section(c, cx, cy, R, { crustK: CK, gray: true });
      if (full > 0) { c.save(); c.globalAlpha = full; E.section(c, cx, cy, R, { crustK: CK, t }); c.restore(); }
      if (full < 1) { c.save(); c.globalAlpha = 1 - full; c.font = `900 ${R * 0.35}px Pretendard, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(220,230,250,.35)'; c.fillText('?', cx, cy + R * 0.05); c.restore(); }
      const ring = (rr, k, col) => { if (S.lv < k) return; c.save(); c.setLineDash([8, 6]); c.strokeStyle = col; c.lineWidth = 2.5; c.beginPath(); c.arc(cx, cy, rr * R, 0, Math.PI * 2); c.stroke(); c.restore(); };
      ring(1 - CK, 1, '#ffe08a'); ring(E.R_OC, 2, '#ffe08a'); ring(E.R_IC, 3, '#ffe08a');
      /* 지진파 */
      const now = performance.now();
      c.save(); c.globalCompositeOperation = 'lighter';
      S.quakes.forEach((q) => {
        const tau = RED ? 1.4 : (now - q.t0) / 1600;
        if (tau > 4.2) return;
        [0, 0.3, 0.6].forEach((lag, j) => { const tt = tau - lag; if (tt <= 0) return; c.strokeStyle = `rgba(200,235,255,${(0.95 - j * 0.28) * Math.max(0, 1 - tt / 4)})`; c.lineWidth = 2.4 - j * 0.6; c.beginPath(); let pen = false; q.R.forEach((P) => { const p = at(P, tt); if (!p) { pen = false; return; } const X = cx + p[0] * R, Y = cy + p[1] * R; if (pen) c.lineTo(X, Y); else { c.moveTo(X, Y); pen = true; } }); c.stroke(); });
        /* 경계 발견: 지진파가 그 깊이를 지나면 하나씩 드러나요 */
        const need = [0.25, 1.05, 2.0];
        if (!q.found) q.found = 0;
        while (q.found < 3 && tau > need[q.found]) { q.found++; }
      });
      c.restore();
      /* 지진 표시 */
      S.quakes.forEach((q) => { const X = cx + q.fx * R, Y = cy + q.fy * R; E.ripples(c, X, Y, 0, t, 'rgba(0,0,0,', 1); });
      /* 지진계 3곳 (지표) */
      [-Math.PI * 0.15, Math.PI * 0.5, Math.PI * 1.15].forEach((a, i) => {
        const X = cx + Math.cos(a) * R * 1.03, Y = cy + Math.sin(a) * R * 1.03; let hit = 0;
        S.quakes.forEach((q) => { const tau = (now - q.t0) / 1600; let best = 9; q.R.forEach((P) => { const e = P[P.length - 1]; if (e[3] && Math.hypot(e[0] - Math.cos(a), e[1] - Math.sin(a)) < 0.12) best = Math.min(best, e[2]); }); const d = tau - best; if (d > 0 && d < 0.5) hit = Math.max(hit, 1 - d / 0.5); });
        c.fillStyle = hit ? `rgba(255,230,120,${0.5 + hit * 0.5})` : '#8fa3bd'; c.beginPath(); c.arc(X, Y, 6 + hit * 6, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#1b2433'; c.lineWidth = 2; c.stroke();
      });
      E.tag(c, '지진계', cx + Math.cos(-Math.PI * 0.15) * R * 1.03 + sz * 2.2, cy + Math.sin(-Math.PI * 0.15) * R * 1.03, { size: sz - 3, bg: 'rgba(30,50,80,.9)' });
      if (S.lv >= 3) {
        E.tag(c, '지각', cx - R * 0.98, cy - R * 0.2, { size: sz - 1, bg: L[0].tagBg });
        E.tag(c, '맨틀', cx - R * 0.76, cy + R * 0.18, { size: sz - 1, bg: L[1].tagBg });
        E.tag(c, '외핵', cx - R * 0.38, cy + R * 0.12, { size: sz - 1, bg: L[2].tagBg });
        E.tag(c, '내핵', cx, cy, { size: sz - 1, bg: L[3].tagBg, color: L[3].tagFg });
      }
    }
    /* 드러남 단계 올리기 (지진을 일으킬 때마다 경계 하나씩) */
    let lastLv = 0;
    function updateReveal() {
      const now = performance.now(); let lv = 0;
      S.quakes.forEach((q) => { if ((now - q.t0) / 1600 > 1.0) lv = Math.max(lv, 1); });
      lv = Math.min(3, S.qCount ? Math.min(S.qCount, 3) : 0);
      const ready = S.quakes.length && (now - S.quakes[S.quakes.length - 1].t0) / 1600 > [0, 0.35, 1.1, 2.0][lv];
      if (lv > S.lv && ready) { S.lv = lv; S.paintStat(); S.toast(['', '경계 발견! 지진파의 모습이 달라지는 곳이 있어요', '경계를 또 찾았어요! 깊이 약 2900 km', '지구 내부의 층상 구조가 드러났어요'][lv]); }
      if (S.lv === 0) revealT = [0, 0, 0];
      lastLv = S.lv;
    }
    /* ----- 4. 비교하기 ----- */
    function drawCompare(c, w, h, t) {
      c.fillStyle = '#0a0f20'; c.fillRect(0, 0, w, h);
      const port = w < h * 0.9, sz = fsz(w);
      const panes = port ? [[0, 0, w, h / 3], [0, h / 3, w, h / 3], [0, h * 2 / 3, w, h / 3]] : [[0, 0, w / 3, h], [w / 3, 0, w / 3, h], [w * 2 / 3, 0, w / 3, h]];
      const names = ['땅 뚫기', '화산 분출물', '지진파 분석'];
      panes.forEach(([x, y, pw, ph], i) => {
        c.save(); c.beginPath(); c.rect(x + 4, y + 4, pw - 8, ph - 8); c.clip(); c.translate(x, y);
        if (i < 2) {
          const gy = ph * 0.45; E.sky(c, pw, gy); E.ground(c, 0, gy, pw, ph - gy, 20 + i); c.fillStyle = '#6f9b4a'; c.fillRect(0, gy - 2, pw, 4);
          const s = Math.min(ph * 0.34, pw * 0.3);
          if (i === 0) E.rig(c, pw * 0.5, gy, s, t, (ph - gy) * 0.3); else E.volcano(c, pw * 0.5, gy, s * 1.1, t);
          E.tag(c, '물질을 직접 알 수 있어요', pw / 2, ph - sz * 1.4, { size: sz - 3, bg: 'rgba(31,157,92,.92)' });
        } else {
          c.fillStyle = '#070b18'; c.fillRect(0, 0, pw, ph);
          const R = Math.min(pw, ph) * 0.33; E.section(c, pw / 2, ph * 0.52, R, { crustK: 0.06, t });
          E.ripples(c, pw / 2, ph * 0.52 - R * 0.96, R * 1.9, t, 'rgba(200,235,255,', 4);
          E.tag(c, '내부 전체의 구조를 알 수 있어요', pw / 2, ph - sz * 1.4, { size: sz - 3, bg: 'rgba(31,120,200,.92)' });
        }
        c.restore();
        E.tag(c, names[i], x + pw / 2, y + sz * 1.5, { size: sz, bg: 'rgba(20,16,10,.85)' });
      });
    }
    /* 반복 */
    let last = performance.now();
    function loop(t) {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (E.visible(cv)) {
        const { c, w, h } = E.fit(cv);
        try {
          if (S.step === 1) drawDrill(c, w, h, t);
          else if (S.step === 2) drawVolcano(c, w, h, t, dt);
          else if (S.step === 3) { updateReveal(); drawQuake(c, w, h, t); }
          else drawCompare(c, w, h, t);
        } catch (e) { window.SM_err('장면', e); }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    const q = new URLSearchParams(location.search);
    if (q.get('drill')) { for (let i = 0; i < +q.get('drill'); i++) { S.drillGoal = Math.min(1, S.drillGoal + 0.2); S.cores.push(CORE_COL[i]); } S.drill = S.drillGoal; S.paintStat(); }
    if (q.get('quakes')) { const n = +q.get('quakes'); for (let i = 0; i < n; i++) S.doQuake(); S.quakes.forEach((qq, i) => (qq.t0 -= 2600 - i * 300)); }
  } catch (err) { window.SM_err('장면', err); }
})();
</script>
