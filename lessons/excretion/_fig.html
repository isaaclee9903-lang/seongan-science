<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
/* ===== 공통 3D 도구 (three.js) =====
   전자는 파란 알갱이(−), 전자를 잃은 쪽은 빨간 (+) 표시. 크기·개수·빠르기는 개념 이해를 위한 모형이에요(숫자 없음). */
const C3 = (() => {
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

  // 탭 껍데기에서 보이지 않는 탭이면 그리지 않아요(태블릿 배터리 아끼기)

  function canvasTex(w, h, draw) {

    draw(c.getContext('2d'), w, h);

    t.userData.canvas = c; return t;

    return canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  }
  // 나뭇결 책상
  function woodTex() {
    const t = canvasTex(1024, 512, (g, w, h) => {
      const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#c99a6b'); gr.addColorStop(1, '#b8875a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 160; i++) {

        g.lineWidth = 1 + Math.random() * 3; g.beginPath(); g.moveTo(0, y);

  // 바닥에 드리우는 부드러운 그림자

  }

  /* 무대: 렌더러·카메라·조명·손가락 조작 */

    let hold = !!opt.hold; // true면 준비(prepare)가 끝날 때까지 그리지 않아요
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = opt.exposure || 1.05;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.className = 'gl';
    host.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = gradientBg(opt.top || '#f6f9fc', opt.bottom || '#d6e3ef');
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9bb0, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);

    const overlay = document.createElement('div'); overlay.className = 'lbls'; host.appendChild(overlay);

    const labels = [];
    function label(html, cls, at) {

      const L = { el, at, show: true, set(h) { if (el.innerHTML !== h) el.innerHTML = h; } };
      labels.push(L); return L;

    const tmp = V();
    function placeLabels() {

        const p = typeof L.at === 'function' ? L.at() : L.at;
        if (!p) { L.el.style.display = 'none'; return; }

        if (tmp.z > 1 || tmp.z < -1) { L.el.style.display = 'none'; return; }

        L.el.style.display = '';
        L.el.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%)`;
      });
    }

    // 카메라 이동
    let fly = null;
    controls.addEventListener('start', () => { fly = null; });
    function flyTo(pos, target, dur = 1.1) {
      if (REDUCE || dur <= 0) { camera.position.copy(pos); controls.target.copy(target); controls.update(); return; }

    const fns = [];

    function tick(now) {

      renderer.render(scene, camera);
      placeLabels();

    requestAnimationFrame(tick);

    /* 자동 구도: 물체(또는 여러 물체)가 화면에 꼭 들어오도록 카메라 거리를 찾아요.
       dir: 카메라가 놓일 방향(물체 중심에서), margin: 가장자리 여백(1.1 = 10%), dur: 이동 시간(초)

    let lastFit = null, userMoved = false;
    controls.addEventListener('start', () => { userMoved = true; });
    const _box = new THREE.Box3(), _v = V(), _c = V();
    function fitPose(objs, o = {}) {

  // 관 모양 전선(곡선)
  function tube(points, r, mat, seg = 80) {

  // 길을 따라 움직이는 알갱이(전자). 전선에는 전자가 이미 꽉 차 있으므로, 멈춰 있어도 알갱이는 보여요.
  // setPath(점 배열), update(dt, 빠르기) — 빠르기가 음수면 반대로 움직여요
  function makeDots(count, color, size = 1) {
    const geo = new THREE.SphereGeometry(0.06 * size, 14, 10);
    const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.55, roughness: 0.3 });
    const mesh = new THREE.InstancedMesh(geo, mat, count); mesh.frustumCulled = false;
    let pts = [], cum = [], total = 1, off = 0; const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = V(), sc = V(1, 1, 1);
    function setPath(P) {

      total = cum[cum.length - 1] || 1;
    }
    function at(s, out) {
      s = ((s % total) + total) % total;
      let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;

      off += dt * speed;

  // 책상
  function addTable(scene, w, d, y = 0) {
    const tex = woodTex(); tex.repeat.set(w / 10, d / 10);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, metalness: 0 });
    const t = new THREE.Mesh(new RoundedBoxGeometry(w, 0.4, d, 3, 0.12), mat); t.position.y = y - 0.2; t.receiveShadow = true; scene.add(t);
    return t;
  }

  /* ===== 빨리 뜨게 하기 (2026-10-12) =====
     - lazy(host, fn): 그림 자리가 화면에 가까워지면 fn을 한 번 불러요(iframe 안에서도 되도록 위치를 직접 계산해요).
     - prepare(st): 재질(셰이더)을 화면을 멈추지 않고 미리 번역한 뒤 그리기 시작해요. 그동안은 미리 찍은 사진(data-poster)을 보여 줘요.
     - BAKE: 주소에 ?bake=… 이 있으면 영상·사진을 만드는 중이에요(tools/lesson-kit/bake.py). */
  const BAKE = new URLSearchParams(location.search).get('bake') || '';
  (function css() {
    const s = document.createElement('style');
    s.textContent = '.gl-host>.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}' +
      '.gl-host.ready>.poster,.gl-host.ready>.prep{display:none}.gl-host.wait>canvas.gl,.gl-host.wait>.lbls{visibility:hidden}' +
      '.gl-host>.prep{position:absolute;right:10px;bottom:10px;z-index:2;font:800 12.5px Pretendard,sans-serif;color:#33464a;background:rgba(255,255,255,.88);border-radius:9px;padding:5px 10px;pointer-events:none}' +
      '.gl-host>video.figvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}';
    (document.head || document.documentElement).appendChild(s);
  })();
  function posterOn(host) {
    host.classList.add('wait');
    const src = host.dataset.poster;
    if (src && !BAKE && !host.querySelector('.poster')) { const im = document.createElement('img'); im.className = 'poster'; im.alt = ''; im.src = src; host.prepend(im); }
    if (!BAKE && !host.querySelector('.prep')) { const t = document.createElement('span'); t.className = 'prep'; t.textContent = '3D 준비 중…'; host.appendChild(t); }
  }
  function lazy(host, fn, margin = 500) {
    if (!host) return;
    posterOn(host);
    let done = false;
    const near = () => { const r = host.getBoundingClientRect(), h = window.innerHeight || 800; return r.bottom > -margin && r.top < h + margin && r.width > 0; };
    const go = () => { if (done || !near()) return; done = true; removeEventListener('scroll', go); removeEventListener('resize', go); clearInterval(iv); try { fn(); } catch (err) { console.error(err); throw err; } };
    addEventListener('scroll', go, { passive: true }); addEventListener('resize', go);

  async function compileAll(r, scene, camera) {
    if (!r.compileAsync) return;
    await r.compileAsync(scene, camera);
    let tr = false; scene.traverse((o) => { if (o.material && [].concat(o.material).some((m) => m.transmission > 0)) tr = true; });
    if (tr) { const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType }), tm = r.toneMapping; r.toneMapping = THREE.NoToneMapping; r.setRenderTarget(rt); try { await r.compileAsync(scene, camera); } finally { r.setRenderTarget(null); r.toneMapping = tm; rt.dispose(); } }

  /* 보기만 하는 그림: 미리 만든 영상으로 바꿔요 (bake 중에는 3D로 그려요) */
  function video(host, build) {
    if (!host) return;
    if (BAKE === host.id) { build(); return; }
    const v = document.createElement('video');
    v.className = 'figvid'; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');

/* ===== 배설계 3D 도구 EX3 =====
   콩팥·오줌관·방광·요도·혈관·간·심장·뼈: BodyParts3D 4.0(CC BY 4.0), 콩팥 속: HuBMAP CCF 3D Reference Object Library(CC BY 4.0). media/ATTRIBUTION.txt

   알갱이의 크기·수·빠르기, 네프론의 굵기와 감긴 모양은 잘 보이게 정한 모형이다. C3와 같은 모듈 안에 넣는다. */
const EX3 = (() => {
  'use strict';

  let dataP = null;

  /* ===================== 네프론 =====================

    const tubMat = mat(COL.ure, { roughness: .55, transparent: true, opacity: .62, depthWrite: false, side: THREE.DoubleSide });
    const tub = tubeM(tubC, .27, tubMat, 420, 16); const cd = tubeM(CD, .34, tubMat, 120, 16); tub.renderOrder = 10; cd.renderOrder = 10;
    /* 보먼주머니: 앞쪽을 잘라 속의 토리가 보이게 (두 겹) */

    const cupM = mat('#efd99a', { roughness: .62, side: THREE.DoubleSide, transparent: true, opacity: .9 });

    const gM = mat('#d24a3d', { roughness: .5 }); const glo = tubeM(gC, .1, gM, 900, 8);
    /* 들어오는 혈관(콩팥동맥에서), 나가는 혈관(세뇨관을 둘러싸는 모세혈관으로) */

    { const n = capG.attributes.position.count, cc = new Float32Array(n * 3), cA = new THREE.Color(COL.art), cB = new THREE.Color(COL.vein), c = new THREE.Color(); for (let i = 0; i < n; i++) { const u = Math.floor(i / 8) / 1400; c.copy(cA).lerp(cB, sm(.55, .9, u)); cc[i * 3] = c.r; cc[i * 3 + 1] = c.g; cc[i * 3 + 2] = c.b; } capG.setAttribute('color', new THREE.BufferAttribute(cc, 3)); }

      const r = R();

      if (r < .3) { add('rbc', base.concat([seg(PATH.glo, gU, 1, .6), seg(PATH.cap, 0, 1, .35)])); return; }
      if (r < .4) { /* 단백질: 여과되지 않음 (단백뇨면 일부 여과) */ if (sick === 'pro' && R() < .6) { add('pro', [seg(PATH.aff, 0, 1, 1.2)].concat(toCap, [hop(() => PATH.glo.at(gU), () => PATH.tub.at(.005)), seg(PATH.tub, .005, 1, .32), seg(PATH.cd, .2, 1, .6)])); } else add('pro', base.concat([seg(PATH.cap, 0, 1, .35)])); return; }

      const dt = clk.dt;

    const lab = labels(st);
    lab.add('glo', '토리<small>모세혈관이 실처럼 뭉친 부분</small>', () => BC.clone().add(V(-.2, .3, .3)), .3, .12, 'b');
    lab.add('bow', '보먼주머니<small>토리를 둘러싸는 주머니 모양</small>', () => BC.clone().add(V(-1.25, -.4, .2)), .3, .4, 'b');
