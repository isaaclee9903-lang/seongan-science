<script>
/* ===== 같은 족 원소 수업 자료 (교과서 146~148쪽, 161쪽 대단원 문제 5) =====
   EG.D[원소] : 이름·양성자수·족·주기와 원소 카드 네 칸의 바른 답.
   '그 밖의 특징'에서 교과서에 없는 조사 내용(무름·보관·쓰임)은 curriculum 문서 '교과서 밖 조사 내용'에 적어 둠. */
window.EG = window.EG || {};
EG.ORDER = ['Na', 'He', 'Li', 'Ar', 'K', 'Ne']; // 교과서 146쪽 순서
EG.D = {
  Li: { ko: '리튬', en: 'Lithium', z: 3, g: 1, p: 2, kind: 'metal', state: '고체', water: 'hard', stab: 'react',
    more: ['칼로 자를 수 있을 만큼 물러요.', '자른 면은 은백색 광택이 나다가 공기 중에서 곧 흐려져요.', '석유 속에 넣어 보관해요.'] },
  Na: { ko: '나트륨', en: 'Sodium', z: 11, g: 1, p: 3, kind: 'metal', state: '고체', water: 'hard', stab: 'react',
    more: ['칼로 쉽게 잘릴 만큼 물러요.', '자른 면은 은백색 광택이 나다가 공기 중에서 곧 흐려져요.', '석유 속에 넣어 보관해요.'] },
  K: { ko: '칼륨', en: 'Potassium', z: 19, g: 1, p: 4, kind: 'metal', state: '고체', water: 'hard', stab: 'react',
    more: ['칼로 아주 쉽게 잘릴 만큼 물러요.', '자른 면의 은백색 광택이 공기 중에서 금방 흐려져요.', '물과 만나면 불꽃이 일기도 해요.'] },
  He: { ko: '헬륨', en: 'Helium', z: 2, g: 18, p: 1, kind: 'gas', state: '기체', water: 'none', stab: 'stable',
    more: ['색과 냄새가 없는 기체예요.', '공기보다 가벼워 비행선이나 풍선에 넣어요.'] },
  Ne: { ko: '네온', en: 'Neon', z: 10, g: 18, p: 2, kind: 'gas', state: '기체', water: 'none', stab: 'stable',
    more: ['색과 냄새가 없는 기체예요.', '유리관에 넣고 전기를 흘리면 붉은빛을 내요. 그래서 간판에 써요.'] },
  Ar: { ko: '아르곤', en: 'Argon', z: 18, g: 18, p: 3, kind: 'gas', state: '기체', water: 'none', stab: 'stable',
    more: ['색과 냄새가 없는 기체예요.', '공기 속에 조금 들어 있어요.', '전구 속에 넣기도 해요.'] },
};
// 원소 카드 칸(교과서 146쪽 카드 항목과 말풍선 질문)
EG.ROWS = [
  { k: 'state', t: '실온에서 물질의 상태', q: '실온에서 고체, 액체, 기체 중 어떤 상태로 존재할까?', opts: [['고체', '고체'], ['액체', '액체'], ['기체', '기체']] },
  { k: 'water', t: '물과의 반응', q: '물에 넣었을 때 어떤 변화가 나타날까?', opts: [['hard', '격렬히 반응함'], ['none', '거의 반응하지 않음']] },
  { k: 'stab', t: '원소의 안정성', q: '다른 원소와 만났을 때 반응이 잘 일어날까?', opts: [['react', '반응이 잘 일어남'], ['stable', '거의 반응하지 않음']] },
  { k: 'more', t: '그 밖의 특징', q: '단단하고 무른 정도는 어떠할까?' },
];
EG.ANS = (el, k) => { const d = EG.D[el], r = EG.ROWS.find((x) => x.k === k); if (k === 'more') return d.more[0]; const o = r.opts.find((x) => x[0] === d[k]); return o ? o[1] : d[k]; };
// 1~20번 원소(교과서 145쪽 주기율표 범위). [기호, 이름, 영어 이름, 족, 주기]
EG.EL20 = [
  ['H', '수소', 'Hydrogen', 1, 1], ['He', '헬륨', 'Helium', 18, 1], ['Li', '리튬', 'Lithium', 1, 2], ['Be', '베릴륨', 'Beryllium', 2, 2],
  ['B', '붕소', 'Boron', 13, 2], ['C', '탄소', 'Carbon', 14, 2], ['N', '질소', 'Nitrogen', 15, 2], ['O', '산소', 'Oxygen', 16, 2],
  ['F', '플루오린', 'Fluorine', 17, 2], ['Ne', '네온', 'Neon', 18, 2], ['Na', '나트륨', 'Sodium', 1, 3], ['Mg', '마그네슘', 'Magnesium', 2, 3],
  ['Al', '알루미늄', 'Aluminium', 13, 3], ['Si', '규소', 'Silicon', 14, 3], ['P', '인', 'Phosphorus', 15, 3], ['S', '황', 'Sulfur', 16, 3],
  ['Cl', '염소', 'Chlorine', 17, 3], ['Ar', '아르곤', 'Argon', 18, 3], ['K', '칼륨', 'Potassium', 1, 4], ['Ca', '칼슘', 'Calcium', 2, 4],
];
EG.GROUPS = [1, 2, 13, 14, 15, 16, 17, 18]; // 교과서 147쪽 표에 보이는 족(3~12족은 '…')
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
window.THREE = THREE;
/* ===== 같은 족 원소 3D 도구 (three.js, 2026-11-16 전면 수정) =====
   EG3.part(id)       사진 굽기·실험실에 쓰는 물체: 'blk-Li|Na|K'(흰 타일 위 금속 덩어리), 'fl-He|Ne|Ar'(마개 막은 둥근 플라스크),
                      'blimp'(헬륨 비행선), 'sign'(네온 간판), 'bulb'(전구), 'bottle'(석유 속 금속 조각 시약병), 'trough'(물을 담은 유리 수조)
   EG3.lab(host, o)   원소 조사실: .pick(el) .look() .water(done) .more(done) .reset() .jump(o) .stage
   물과의 반응은 그림 Ⅳ-9 사진처럼 '격렬히 반응함'만 보여 주는 모형이다(빠르기·크기는 보기 좋게 정함, 수치 없음).
   1족 금속은 물 위에 떠서 쉭쉭 기체를 내며 이리저리 움직이고 점점 작아진다. 나트륨·칼륨은 녹아 동그래지고, 칼륨은 불꽃이 인다.
   18족 기체는 물속으로 보내도 거품만 올라오고 아무 변화가 없다. 실제로는 매우 위험해 교실에서 직접 하지 않는다. */
const EG3 = (() => {
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  const std = (c, r = 0.6, m = 0, ex = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: r, metalness: m }, ex));
  const phys = (ex) => new THREE.MeshPhysicalMaterial(ex);
  const M = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; };
  const lathe = (pts, mat, seg = 72) => M(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg), mat);
  const glassMat = (o = {}) => phys(Object.assign({ color: 0xffffff, roughness: 0.05, metalness: 0, transmission: 1, thickness: 0.08, ior: 1.5, transparent: true, side: THREE.DoubleSide }, o));
  const sh = (g) => { g.traverse((o) => { if (o.isMesh && !o.userData.noShadow) { o.castShadow = true; o.receiveShadow = true; } }); return g; };
  function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
  const radial = (stops) => tex(128, 128, (g, w, h) => { const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); stops.forEach(([a, c]) => r.addColorStop(a, c)); g.fillStyle = r; g.fillRect(0, 0, w, h); });
  const sprite = (map, add = false) => new THREE.Sprite(new THREE.SpriteMaterial({ map, transparent: true, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending }));

  /* ---------- 금속 색 ----------
     crust: 겉(공기와 만나 흐려진 면), fresh: 막 자른 면의 은백색 */
  const METAL = {
    Li: { crust: '#8f918e', crust2: '#7d807e', fresh: '#d9dde2', fade: 6.5 },
    Na: { crust: '#c3c0b4', crust2: '#b0ada0', fresh: '#e4e7eb', fade: 4.5 },
    K: { crust: '#a6a3b1', crust2: '#918ea0', fresh: '#e2e4ea', fade: 2.2 },
  };
  // 겉면 얼룩(공기와 만나 흐려진 면: 희끗한 막과 어두운 점이 섞임)
  const crustTex = {};
  function crustMap(el) {
    if (crustTex[el]) return crustTex[el];
    const r = rng(el.charCodeAt(0) * 13), c = METAL[el];
    const t = tex(256, 256, (g, w, h) => {
      g.fillStyle = c.crust; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 260; i++) { const x = r() * w, y = r() * h, rr = 4 + r() * 22; const gr = g.createRadialGradient(x, y, 0, x, y, rr); const lite = r() < 0.55; gr.addColorStop(0, lite ? 'rgba(255,255,250,.12)' : 'rgba(60,62,70,.08)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
      for (let i = 0; i < 14; i++) { g.strokeStyle = 'rgba(70,72,78,.07)'; g.lineWidth = 1 + r() * 1.5; g.beginPath(); const x = r() * w, y = r() * h; g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 60, y + (r() - 0.5) * 20); g.stroke(); }
    });
    t.wrapS = t.wrapT = THREE.RepeatWrapping; return (crustTex[el] = t);
  }
  let _lus = null;
  function lusterMap() {
    if (_lus) return _lus;
    return (_lus = tex(128, 128, (g, w, h) => {
      const gr = g.createLinearGradient(0, h, w, 0); gr.addColorStop(0, '#9aa1aa'); gr.addColorStop(0.42, '#d8dde3'); gr.addColorStop(0.55, '#ffffff'); gr.addColorStop(0.68, '#c9cfd6'); gr.addColorStop(1, '#8e959e');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 30; i++) { g.strokeStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.08})`; g.beginPath(); const y = Math.random() * h; g.moveTo(0, y); g.lineTo(w, y - 20 + Math.random() * 10); g.stroke(); }
    }));
  }
  // 울퉁불퉁한 덩어리(무른 금속: 모서리가 둥글고 칼자국이 있는 덩어리)
  function lump(seed, w, h, d, rough = 0.06) {
    const g = new RoundedBoxGeometry(w, h, d, 5, Math.min(w, h, d) * 0.28), r = rng(seed), p = g.attributes.position, v = V();
    const ph = [r() * 6, r() * 6, r() * 6];
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const n = Math.sin(v.x * 9 + ph[0]) * Math.cos(v.z * 8 + ph[1]) + Math.sin(v.y * 11 + v.x * 5 + ph[2]) * 0.6;
      const k = 1 + n * rough; v.x *= k; v.z *= 1 + n * rough * 0.7; if (v.y > 0) v.y *= 1 + n * rough * 0.8;
      p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals(); return g;
  }
  // 흰 타일 위 금속 덩어리. 자르기용으로 왼쪽 덩어리 + 자른 면 + 오른쪽 조각으로 나눠 둔다.
  function metalBlock(el) {
    const c = METAL[el], g = new THREE.Group();
    const tile = M(new RoundedBoxGeometry(1.25, 0.06, 0.9, 3, 0.02), std('#f6f7f8', 0.4), 0, 0.03, 0); g.add(tile);
    const W = el === 'Li' ? 0.46 : 0.54, H = el === 'Li' ? 0.22 : 0.26, D = el === 'Li' ? 0.32 : 0.36;
    const crustM = std('#ffffff', 0.72, 0.4, { map: crustMap(el) }), crustM2 = std('#f2f2f2', 0.75, 0.38, { map: crustMap(el) });
    const left = M(lump(el.charCodeAt(0) * 7, W, H, D), crustM, -0.06, 0.06 + H / 2, 0); g.add(left);
    const slice = M(lump(el.charCodeAt(0) * 7 + 3, 0.13, H * 0.96, D * 0.95), crustM2, -0.06 + W / 2 + 0.02, 0.06 + H * 0.48, 0); g.add(slice);
    // 자른 면(처음엔 숨김)
    const freshM = std('#ffffff', 0.3, 0.75, { map: lusterMap(), emissive: '#ffffff', emissiveMap: lusterMap(), emissiveIntensity: 0.55 });
    // 자른 면 모양: 덩어리 단면처럼 둥근 네모
    const rr = (w, h, r) => { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return new THREE.ShapeGeometry(s, 10); };
    const fg = rr(D * 0.9, H * 0.88, Math.min(D, H) * 0.24);
    const cx = -0.06 + W / 2 - 0.012;
    const face = M(fg, freshM, cx, 0.06 + H * 0.49, 0); face.rotation.y = Math.PI / 2; face.visible = false; face.castShadow = false; g.add(face);
    const face2 = M(fg, freshM, 0, 0, 0); face2.rotation.y = -Math.PI / 2; face2.position.set(-0.066, 0, 0); face2.visible = false; face2.castShadow = false; slice.add(face2);
    g.userData = { left, slice, face, face2, freshM, c, W, H, D, cutX: -0.06 + W / 2, top: 0.06 + H };
    return sh(g);
  }
  function knife() {
    const g = new THREE.Group();
    const blade = new THREE.Shape(); blade.moveTo(0, 0); blade.lineTo(0.55, 0); blade.quadraticCurveTo(0.68, 0.02, 0.72, 0.1); blade.lineTo(0, 0.1); blade.lineTo(0, 0);
    const bg = new THREE.ExtrudeGeometry(blade, { depth: 0.008, bevelEnabled: false }); bg.translate(0, 0, -0.004);
    g.add(M(bg, std('#c9ced4', 0.22, 1)));
    const hd = M(new RoundedBoxGeometry(0.42, 0.085, 0.05, 3, 0.02), std('#28323d', 0.55), -0.2, 0.05, 0); g.add(hd);
    return sh(g);
  }
  // 석유 속에 넣어 둔 금속 조각 시약병(갈색 유리)
  function bottle(el = 'Na') {
    const g = new THREE.Group();
    g.add(lathe([[0, 0], [0.27, 0], [0.3, 0.03], [0.3, 0.62], [0.24, 0.74], [0.13, 0.8], [0.13, 0.92], [0, 0.92]], glassMat({ color: '#c99a68', thickness: 0.03, attenuationColor: '#a8763e', attenuationDistance: 1.4, roughness: 0.08 })));
    const oil = lathe([[0, 0.03], [0.275, 0.03], [0.275, 0.5], [0, 0.5]], phys({ color: '#f0d9a2', roughness: 0.1, transmission: 0.7, transparent: true, opacity: 0.7, thickness: 0.4 }), 48); oil.userData.noShadow = true; g.add(oil);
    const r = rng(9);
    for (let i = 0; i < 5; i++) { const m = M(lump(40 + i, 0.12 + r() * 0.05, 0.07, 0.1), std(METAL[el].crust, 0.8, 0.3), (r() - 0.5) * 0.3, 0.07, (r() - 0.5) * 0.3); m.rotation.y = r() * 3; g.add(m); }
    g.add(M(new THREE.CylinderGeometry(0.15, 0.15, 0.13, 32), std('#2c3138', 0.55), 0, 0.98, 0));
    return sh(g);
  }
  // 물을 담은 유리 수조(낮고 넓은 원통)
  const TR = 0.92, TW = 0.34; // 반지름, 물 높이
  function trough() {
    const g = new THREE.Group();
    g.add(lathe([[0, 0], [TR, 0], [TR + 0.02, 0.02], [TR + 0.02, 0.5], [TR + 0.035, 0.52], [TR - 0.005, 0.52], [TR - 0.015, 0.5], [TR - 0.015, 0.03], [0, 0.03]], glassMat({ color: '#eef6fa', thickness: 0.04 }), 96));
    const wat = lathe([[0, 0.03], [TR - 0.016, 0.03], [TR - 0.016, TW], [0, TW]], phys({ color: '#7cc0ea', roughness: 0.04, transmission: 0.82, thickness: 0.6, ior: 1.33, attenuationColor: '#58a9de', attenuationDistance: 1.2, transparent: true, opacity: 0.92 }), 96);
    wat.userData.noShadow = true; g.add(wat);
    const surf = M(new THREE.CircleGeometry(TR - 0.016, 96), phys({ color: '#d6ecf8', roughness: 0.03, metalness: 0, transparent: true, opacity: 0.35, depthWrite: false }), 0, TW + 0.001, 0);
    surf.rotation.x = -Math.PI / 2; surf.castShadow = false; g.add(surf);
    g.userData = { waterY: TW };
    return sh(g);
  }
  // 마개 막은 둥근 플라스크(그림 Ⅳ-9 '실온에서 기체' 사진처럼). 옆 관은 물에 보낼 때 쓴다.
  function flask() {
    const g = new THREE.Group(), pts = [];
    const R = 0.42, cy = 0.44;
    for (let i = 0; i <= 26; i++) { const a = -Math.PI / 2 + (i / 26) * (Math.PI - 0.42); pts.push([Math.cos(a) * R, cy + Math.sin(a) * R]); }
    pts.push([0.1, 0.98], [0.1, 1.3], [0.118, 1.32], [0.118, 1.34], [0.085, 1.34]);
    const glass = lathe([[0, cy - R]].concat(pts), glassMat({ color: '#f4f8fb', thickness: 0.03 }), 72); g.add(glass);
    const stop = M(new THREE.CylinderGeometry(0.1, 0.085, 0.16, 32), std('#2f7fd0', 0.6), 0, 1.36, 0); g.add(stop);
    // 받침 고리(코르크)
    const ring = M(new THREE.TorusGeometry(0.2, 0.05, 14, 40), std('#b98a5a', 0.85), 0, 0.045, 0); ring.rotation.x = Math.PI / 2; g.add(ring);
    g.position.y = 0.03; const w = new THREE.Group(); w.add(g); w.userData = { stop, top: V(0, 1.47, 0) };
    return sh(w);
  }
  /* ---------- 쓰임 물체 ---------- */
  function blimp() {
    const g = new THREE.Group(), pts = [];
    for (let i = 0; i <= 40; i++) { const t = i / 40, x = -1 + 2 * t, r = 0.34 * Math.pow(Math.sin(Math.PI * t), 0.75) * (1 - 0.18 * t); pts.push(new THREE.Vector2(r, x)); }
